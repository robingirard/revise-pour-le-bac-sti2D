<!doctype html><meta charset="utf-8"><title>banc animations</title>
<link rel="stylesheet" href="css/app.css">
<style>body{margin:12px;background:#fff} .fig{margin:0 0 16px} svg{max-width:100%;height:auto}</style>
<script src="content.js"></script>
<script type="module">
import * as figs from './js/figures.js'; import * as mech from './js/mech-anim.js';
figs.configure({ index: CONTENT.figureIndex, base: 'figures/' }); mech.configure({ animations: CONTENT.animations });
const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
for (const id of ids) { const d = document.createElement('div'); d.innerHTML = figs.placeholderHtml(id, { block: true }) || `<p>figure inconnue : ${id}</p>`; document.body.append(d); }
await figs.hydrate(document.body);
window.playAll = () => [...document.querySelectorAll('svg[data-mech]')].map((s) => mech.play(s))
  .concat([...document.querySelectorAll('svg[data-anim]')].map((s) => (s.classList.add('playing'), s.dataset.fig)));
window.ready = true;
</script>
