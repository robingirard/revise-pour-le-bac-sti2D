# Mécanisme : le système bielle-manivelle (manuel p. 31, « le mouvement plan »).
id: bielle-manivelle
nom: Bielle-manivelle
titre: Le système bielle-manivelle
description: 'Mécanisme de transformation de mouvement : la rotation continue de la manivelle (vilebrequin) est transformée en translation alternative du piston, ou inversement (moteur thermique, pompe).

  '
repere: 'x : axe du cylindre (horizontal) ; y : vertical ; z : axe des pivots, vers l''observateur'
figures:
  dessin: mecanisme-bielle-manivelle-dessin
  classes: mecanisme-bielle-manivelle-dessin
  graphe: mecanisme-bielle-manivelle-graphe
  schema: mecanisme-bielle-manivelle-schema
pieces:
- num: 0
  nom: bâti (carter + cylindre)
- num: 1
  nom: manivelle (vilebrequin)
- num: 2
  nom: bielle
- num: 3
  nom: piston
classes:
- id: E0
  nom: bâti
  pieces:
  - 0
  couleur: black
  bati: true
  pourquoi: 'Le carter et le cylindre sont fixes : c''est le solide de référence.'
- id: E1
  nom: manivelle
  pieces:
  - 1
  couleur: solideE
  pourquoi: La manivelle tourne autour de l'axe (O, z) fixe du bâti.
- id: E2
  nom: bielle
  pieces:
  - 2
  couleur: solideA
  pourquoi: 'La bielle relie la manivelle au piston : elle a un mouvement plan (rotation + translation).'
- id: E3
  nom: piston
  pieces:
  - 3
  couleur: solideB
  pourquoi: 'Le piston est guidé dans le cylindre : il translate selon x.'
liaisons:
- entre:
  - E0
  - E1
  contact: cylindre-cylindre avec arrêt en translation (palier)
  surfaces: le tourillon du vilebrequin tourne dans le palier du carter
  liaison: pivot
  point: O
  axe: z
  explication: 'La manivelle ne peut que tourner autour de l''axe (O, z) du bâti : pivot d''axe (O, z).'
- entre:
  - E1
  - E2
  contact: cylindre-cylindre avec arrêt en translation (maneton)
  surfaces: la tête de bielle tourne autour du maneton de la manivelle
  liaison: pivot
  point: A
  axe: z
  explication: 'Articulation manivelle/bielle : pivot d''axe (A, z).'
- entre:
  - E2
  - E3
  contact: cylindre-cylindre avec arrêt en translation (axe de piston)
  surfaces: le pied de bielle tourne autour de l'axe du piston
  liaison: pivot
  point: B
  axe: z
  explication: 'Articulation bielle/piston : pivot d''axe (B, z).'
- entre:
  - E3
  - E0
  contact: cylindre-cylindre long (piston dans le cylindre), rotation bloquée par la bielle
  surfaces: le piston coulisse dans le cylindre
  liaison: glissiere
  point: B
  axe: x
  explication: 'Dans le plan du schéma, le piston ne fait que translater selon x : on le modélise par une glissière d''axe (B, x). (Vu en 3D, le contact cylindre-cylindre seul serait un pivot glissant ; c''est la bielle qui empêche la rotation.)'
questions:
- level: 2
  type: mcq
  prompt: 'Sur le schéma cinématique du bielle-manivelle, combien de liaisons **pivot** voit-on ?

    {{fig:mecanisme-bielle-manivelle-schema}}'
  choices:
  - '3'
  - '2'
  - '4'
  - '1'
  answer: 0
  explanation: 'Trois pivots d''axe z : en O (bâti/manivelle), en A (manivelle/bielle) et en B (bielle/piston).'
  feedback:
  - null
  - 'Non : il y a un pivot en O, un en A et un en B : trois cercles sur le schéma.'
  - 'Non : la quatrième liaison (piston/bâti) est une glissière (rectangle), pas un pivot.'
  - 'Non : compte les cercles : O, A et B.'
- level: 2
  type: mcq
  prompt: 'Quel est le mouvement du **piston (3)** par rapport au **bâti (0)** ?

    {{fig:mecanisme-bielle-manivelle-schema}}'
  choices:
  - Translation rectiligne alternative selon x
  - Rotation autour de (O, z)
  - Mouvement plan (translation + rotation)
  - Translation circulaire
  answer: 0
  explanation: La glissière d'axe (B, x) n'autorise qu'une translation selon x ; le piston fait des allers-retours.
  feedback:
  - null
  - 'Non : c''est la manivelle qui tourne autour de (O, z) ; le piston est guidé par une glissière.'
  - 'Non : c''est la bielle qui a un mouvement plan ; le piston ne peut que translater dans son cylindre.'
  - 'Non : les points du piston décrivent des segments de droite, pas des arcs de cercle.'
- level: 3
  type: mcq
  prompt: Quel solide du bielle-manivelle a un **mouvement plan** (ni translation pure, ni rotation pure) par rapport au bâti ?
  choices:
  - La bielle (2)
  - La manivelle (1)
  - Le piston (3)
  - Le bâti (0)
  answer: 0
  explanation: 'La bielle tourne ET se déplace : son mouvement est la somme d''une translation et d''une rotation.'
  feedback:
  - null
  - 'Non : la manivelle est en rotation pure autour de (O, z).'
  - 'Non : le piston est en translation rectiligne pure.'
  - 'Non : le bâti est le solide de référence, il ne bouge pas.'
- level: 3
  type: mcq
  prompt: La manivelle tourne à vitesse constante. Quelle est la trajectoire du point **A** (articulation manivelle/bielle) dans le repère du bâti ?
  choices:
  - Un cercle de centre O
  - Un segment de droite
  - Une ellipse
  - Un point fixe
  answer: 0
  explanation: 'A appartient à la manivelle, en liaison pivot d''axe (O, z) avec le bâti : il décrit un cercle de centre O.'
  feedback:
  - null
  - 'Non : ce serait la trajectoire du point B (le piston) ; A appartient à la manivelle qui tourne.'
  - 'Non : la manivelle a une longueur fixe, A reste à distance constante de O : c''est un cercle.'
  - 'Non : A tourne avec la manivelle ; seul O est fixe.'
animation:
  bbox:
  - -1.3
  - -1.6
  - 8.7
  - 2.3
  border: 4
  duration: 4
  classes:
    E0:
      motion: fixed
    E1:
      motion: rotate
      center:
      - 0
      - 0
      turns: 1
    E2:
      motion: coupler
      crank: E1
      a:
      - 0.6
      - 1.0
      slider: E3
      b:
      - 5
      - 0
    E3:
      motion: slider
      dir:
      - 1
      - 0
      coupler: E2
  legende: La manivelle (E1) tourne, la bielle (E2) a un mouvement plan, le piston (E3) translate.
