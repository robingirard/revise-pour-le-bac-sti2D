# Base de connaissances : les 10 liaisons normalisées (NF EN ISO 3952)
# Source : manuel I2D 1re STI2D, chapitre 2 « Mécanismes », tableau p. 32.
#
# Conventions :
#   ddl      : mobilités autorisées parmi Tx Ty Tz Rx Ry Rz (translation / rotation selon l'axe)
#   ddl_lies : couples de mobilités liées (une seule est indépendante) — hélicoïdale
#   efforts  : composantes transmissibles de la force (X Y Z) et du moment (L M N)
#   efforts_lies : couples de composantes liées — hélicoïdale
#   difficulte : 1 (à connaître d'abord) … 3 (liaisons plus rares)
#   confusables : liaisons souvent confondues (servent de distracteurs dans les QCM)
#   contact_court : le contact en trois mots ; reconnaitre : comment reconnaître le symbole (par vue) ;
#   mobilites : pour chaque mobilité, pourquoi elle est autorisée ou bloquée (feedback des grilles) ;
#   exemples : objets du quotidien (texte + pictogramme)
#   symboles : les vues planes du tableau ; « pic » est le nom du symbole dans figures/tikz/liaisons.sty,
#              « plan » les deux axes du plan de la vue (le 1er horizontal, le 2e vertical),
#              « sens » = -1 si le 1er axe pointe vers la gauche (vue (z,y) : x vers l'observateur).

liaisons:
- id: encastrement
  nom: Encastrement
  designation: Encastrement de centre A
  autres_noms:
  - liaison complète
  - liaison fixe
  parametre: centre A
  difficulte: 1
  ddl: []
  efforts:
  - X
  - Y
  - Z
  - L
  - M
  - N
  contact: 'Aucun mouvement possible : les deux pièces sont solidaires (vissées, soudées, collées, rivetées, emmanchées).'
  surfaces: Contact quelconque + dispositif de maintien (vis, soudure, colle, rivet, goupille).
  exemples:
  - texte: deux tubes soudés d'un cadre de vélo
    emoji: 🚲
  - texte: une roue boulonnée sur son moyeu
    emoji: 🛞
  - texte: un manche emmanché dans une tête de marteau
    emoji: 🔨
  confusables:
  - appui-plan
  - pivot
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: encastrement
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: encastrement
  contact_court: assemblage fixe (vis, soudure, colle, rivet)
  reconnaitre:
    bout: un trait avec un petit triangle plein à la jonction des deux pièces
    face: un trait avec un petit triangle plein à la jonction des deux pièces
  mobilites:
    Tx: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
    Ty: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
    Tz: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
    Rx: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
    Ry: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
    Rz: 'bloquée : les deux pièces sont solidaires (vissées, soudées, collées…)'
- id: pivot
  nom: Pivot
  designation: Pivot d'axe (A, x)
  autres_noms:
  - articulation
  - liaison rotoïde
  parametre: axe (A, x)
  difficulte: 1
  ddl:
  - Rx
  efforts:
  - X
  - Y
  - Z
  - M
  - N
  contact: Une seule rotation possible, autour de l'axe.
  surfaces: Cylindre-cylindre long (arbre dans un alésage) + arrêt en translation (épaulement, circlips).
  exemples:
  - texte: la charnière d'une porte
    emoji: 🚪
  - texte: la roue d'un vélo sur son axe
    emoji: 🚲
  - texte: une pédale de vélo sur sa manivelle
    emoji: 🚴
  - texte: un roulement à billes
    emoji: ⚙️
  confusables:
  - pivot-glissant
  - helicoidale
  - rotule
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: pivot bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: pivot face
  contact_court: cylindre long + épaulement
  reconnaitre:
    bout: un cercle simple (l'axe pointe vers vous)
    face: un rectangle traversé par l'arbre, avec deux petits traits (épaulements) qui bloquent la translation
  mobilites:
    Tx: bloquée par les épaulements (arrêt en translation)
    Ty: 'bloquée : l''arbre ne peut pas se décaler dans son alésage'
    Tz: 'bloquée : l''arbre ne peut pas se décaler dans son alésage'
    Rx: 'autorisée : l''arbre tourne librement dans l''alésage'
    Ry: 'bloquée : l''alésage est long, l''arbre ne peut pas basculer'
    Rz: 'bloquée : l''alésage est long, l''arbre ne peut pas basculer'
- id: glissiere
  nom: Glissière
  designation: Glissière d'axe (A, x)
  autres_noms:
  - liaison prismatique
  parametre: axe (A, x)
  difficulte: 1
  ddl:
  - Tx
  efforts:
  - Y
  - Z
  - L
  - M
  - N
  contact: Une seule translation possible, le long de l'axe.
  surfaces: Deux contacts plan-plan (section rectangulaire ou prismatique) ; ou cylindre-cylindre + clavette/anti-rotation.
  exemples:
  - texte: un tiroir dans son meuble
    emoji: 🗄️
  - texte: le rail d'un siège de voiture
    emoji: 🚗
  - texte: le coulisseau d'un serre-joint sur son rail
    emoji: 🗜️
  - texte: la coulisse d'une règle à dessin
    emoji: 📏
  confusables:
  - pivot-glissant
  - appui-plan
  - helicoidale
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: glissiere bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: glissiere face
  contact_court: deux plans (section rectangulaire)
  reconnaitre:
    bout: un carré avec une croix
    face: un rectangle avec l'arbre visible seulement à l'extérieur du rectangle
  mobilites:
    Tx: 'autorisée : la barre glisse le long de la rainure'
    Ty: bloquée par les plans de contact
    Tz: bloquée par les plans de contact
    Rx: 'bloquée : une section rectangulaire ne peut pas tourner dans sa rainure'
    Ry: 'bloquée : la rainure est longue, la barre ne peut pas basculer'
    Rz: 'bloquée : la rainure est longue, la barre ne peut pas basculer'
- id: helicoidale
  nom: Hélicoïdale
  designation: Hélicoïdale d'axe (A, x)
  autres_noms:
  - liaison vis-écrou
  parametre: axe (A, x)
  difficulte: 1
  ddl:
  - Tx
  - Rx
  ddl_lies:
  - - Tx
    - Rx
  efforts:
  - X
  - Y
  - Z
  - L
  - M
  - N
  efforts_lies:
  - - X
    - L
  contact: 'Translation et rotation autour de l''axe, mais liées : un tour de vis = une avance d''un pas.'
  surfaces: Filetage dans un taraudage (vis dans un écrou).
  exemples:
  - texte: une vis dans un écrou
    emoji: 🔩
  - texte: la vis d'un serre-joint dans son coulisseau
    emoji: 🗜️
  - texte: la vis d'un cric à vis
    emoji: 🚙
  - texte: la vis d'un étau dans son écrou
    emoji: 🔧
  confusables:
  - pivot-glissant
  - pivot
  - glissiere
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: helicoidale bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: helicoidale face
  contact_court: filetage dans taraudage
  reconnaitre:
    bout: un cercle avec une petite spirale à l'intérieur
    face: un rectangle traversé par une ligne ondulée (le filetage)
  mobilites:
    Tx: 'autorisée mais liée à Rx : la vis avance quand elle tourne'
    Ty: 'bloquée : la vis reste centrée dans l''écrou'
    Tz: 'bloquée : la vis reste centrée dans l''écrou'
    Rx: 'autorisée mais liée à Tx : un tour = une avance d''un pas'
    Ry: 'bloquée : l''écrou est long, la vis ne peut pas basculer'
    Rz: 'bloquée : l''écrou est long, la vis ne peut pas basculer'
- id: pivot-glissant
  nom: Pivot glissant
  designation: Pivot glissant d'axe (A, x)
  autres_noms:
  - liaison cylindrique
  parametre: axe (A, x)
  difficulte: 2
  ddl:
  - Tx
  - Rx
  efforts:
  - Y
  - Z
  - M
  - N
  contact: Translation le long de l'axe et rotation autour de l'axe, indépendantes.
  surfaces: Cylindre-cylindre long, sans arrêt en translation ni en rotation.
  exemples:
  - texte: la tige d'un vérin dans son corps
    emoji: 🛠️
  - texte: le piston d'une pompe à vélo
    emoji: 🚲
  - texte: un axe lisse dans un alésage long
    emoji: ⚙️
  confusables:
  - pivot
  - glissiere
  - helicoidale
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: pivot glissant bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: pivot glissant face
  contact_court: cylindre long, sans épaulement
  reconnaitre:
    bout: un cercle avec un point au centre
    face: un rectangle traversé par l'arbre, sans épaulement
  mobilites:
    Tx: 'autorisée : l''arbre coulisse, rien ne l''arrête'
    Ty: 'bloquée : l''arbre ne peut pas se décaler dans son alésage'
    Tz: 'bloquée : l''arbre ne peut pas se décaler dans son alésage'
    Rx: 'autorisée : l''arbre tourne dans l''alésage'
    Ry: 'bloquée : l''alésage est long, l''arbre ne peut pas basculer'
    Rz: 'bloquée : l''alésage est long, l''arbre ne peut pas basculer'
- id: rotule
  nom: Rotule
  designation: Rotule de centre A
  autres_noms:
  - liaison sphérique
  parametre: centre A
  difficulte: 1
  ddl:
  - Rx
  - Ry
  - Rz
  efforts:
  - X
  - Y
  - Z
  contact: Les trois rotations possibles autour du centre, aucune translation.
  surfaces: Sphère dans une sphère creuse (surfacique sphérique).
  exemples:
  - texte: l'articulation de la hanche ou de l'épaule
    emoji: 🦴
  - texte: la rotule d'attelage d'une remorque
    emoji: 🚙
  - texte: le patin au bout de la vis d'un serre-joint
    emoji: 🗜️
  - texte: un joystick sur son socle
    emoji: 🕹️
  confusables:
  - lineaire-annulaire
  - ponctuelle
  - pivot
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: rotule
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: rotule
  contact_court: sphère dans une sphère creuse
  reconnaitre:
    bout: une sphère (cercle) dans une coupelle
    face: une sphère (cercle) dans une coupelle
  mobilites:
    Tx: 'bloquée : la sphère reste centrée dans sa cavité'
    Ty: 'bloquée : la sphère reste centrée dans sa cavité'
    Tz: 'bloquée : la sphère reste centrée dans sa cavité'
    Rx: 'autorisée : la sphère tourne dans sa cavité'
    Ry: 'autorisée : la sphère tourne dans sa cavité'
    Rz: 'autorisée : la sphère tourne dans sa cavité'
- id: appui-plan
  nom: Appui plan
  designation: Appui plan de normale (A, y)
  autres_noms:
  - liaison plane
  parametre: normale (A, y)
  difficulte: 2
  ddl:
  - Tx
  - Tz
  - Ry
  efforts:
  - Y
  - L
  - N
  contact: Deux translations dans le plan et une rotation autour de la normale.
  surfaces: Plan sur plan (surfacique plane).
  exemples:
  - texte: un livre posé sur une table
    emoji: 📚
  - texte: une boîte qui glisse sur le sol
    emoji: 📦
  - texte: un palet sur la glace
    emoji: 🏒
  confusables:
  - lineaire-rectiligne
  - glissiere
  - ponctuelle
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: appui plan
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: appui plan
  contact_court: plan sur plan
  reconnaitre:
    bout: deux traits parallèles collés (les deux plans en contact)
    face: deux traits parallèles collés (les deux plans en contact)
  mobilites:
    Tx: 'autorisée : le bloc glisse sur le plan'
    Ty: 'bloquée : le bloc ne peut ni s''enfoncer dans le plan ni s''en écarter'
    Tz: 'autorisée : le bloc glisse sur le plan'
    Rx: 'bloquée : le bloc ne peut pas basculer, il reposerait sur une arête'
    Ry: 'autorisée : le bloc pivote sur le plan autour de la normale'
    Rz: 'bloquée : le bloc ne peut pas basculer, il reposerait sur une arête'
- id: lineaire-rectiligne
  nom: Linéaire rectiligne
  designation: Linéaire rectiligne de normale (A, y) et d'axe (A, x)
  autres_noms:
  - cylindre-plan
  parametre: normale (A, y), axe (A, x)
  difficulte: 3
  ddl:
  - Tx
  - Tz
  - Rx
  - Ry
  efforts:
  - Y
  - N
  contact: 'Contact suivant une ligne (droite) : deux translations dans le plan, rotation autour de la ligne et
    autour de la normale.'
  surfaces: Cylindre sur plan (contact linéique rectiligne).
  exemples:
  - texte: un crayon posé sur une table
    emoji: ✏️
  - texte: un tronc d'arbre posé au sol
    emoji: 🪵
  - texte: une bouteille couchée sur le sol
    emoji: 🍾
  confusables:
  - appui-plan
  - ponctuelle
  - lineaire-annulaire
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: lineaire rectiligne bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: lineaire rectiligne face
  contact_court: cylindre sur plan (ligne)
  reconnaitre:
    bout: un coin (triangle) posé sur un plan
    face: un trapèze posé sur un plan
  mobilites:
    Tx: 'autorisée : le cylindre glisse le long de sa ligne de contact'
    Ty: bloquée par le plan
    Tz: 'autorisée : le cylindre roule ou glisse en travers'
    Rx: 'autorisée : le cylindre roule autour de son axe'
    Ry: 'autorisée : le cylindre pivote sur le plan autour de la normale'
    Rz: 'bloquée : le cylindre ne peut pas basculer, il reposerait sur un bout'
- id: lineaire-annulaire
  nom: Linéaire annulaire
  designation: Linéaire annulaire d'axe (A, z)
  autres_noms:
  - sphère-cylindre
  parametre: axe (A, z)
  difficulte: 3
  ddl:
  - Tz
  - Rx
  - Ry
  - Rz
  efforts:
  - X
  - Y
  contact: 'Contact suivant un cercle : une translation le long de l''axe et les trois rotations.'
  surfaces: Sphère dans un cylindre (contact linéique circulaire).
  exemples:
  - texte: une bille dans un tube
    emoji: 🧪
  - texte: une tige à bout sphérique dans une bague
    emoji: 🔗
  - texte: un axe court dans un alésage long
    emoji: ⚙️
  confusables:
  - rotule
  - pivot-glissant
  - ponctuelle
  symboles:
  - vue: face
    plan:
    - z
    - y
    sens: -1
    pic: lineaire annulaire face
  - vue: bout
    plan:
    - x
    - y
    sens: 1
    pic: lineaire annulaire bout
  contact_court: sphère dans un cylindre (cercle)
  reconnaitre:
    face: une sphère (cercle) dans un rectangle (le cylindre)
    bout: une sphère (cercle) dans une coupelle posée sur un trait
  mobilites:
    Tx: 'bloquée : la sphère reste centrée dans le cylindre'
    Ty: 'bloquée : la sphère reste centrée dans le cylindre'
    Tz: 'autorisée : la sphère glisse le long du cylindre'
    Rx: 'autorisée : la sphère tourne dans le cylindre'
    Ry: 'autorisée : la sphère tourne dans le cylindre'
    Rz: 'autorisée : la sphère tourne autour de l''axe du cylindre'
- id: ponctuelle
  nom: Ponctuelle
  designation: Ponctuelle de normale (A, x)
  autres_noms:
  - sphère-plan
  parametre: normale (A, x)
  difficulte: 3
  ddl:
  - Ty
  - Tz
  - Rx
  - Ry
  - Rz
  efforts:
  - X
  contact: 'Contact en un seul point : tout est possible sauf la translation selon la normale.'
  surfaces: Sphère sur plan (contact ponctuel).
  exemples:
  - texte: une bille posée sur une table
    emoji: 🎱
  - texte: la pointe d'un compas sur la feuille
    emoji: 📐
  - texte: un pied de chaise sur le sol
    emoji: 🪑
  confusables:
  - lineaire-rectiligne
  - appui-plan
  - rotule
  symboles:
  - vue: bout
    plan:
    - z
    - y
    sens: -1
    pic: ponctuelle bout
  - vue: face
    plan:
    - x
    - y
    sens: 1
    pic: ponctuelle face
    rotate: -90
  contact_court: sphère sur plan (point)
  reconnaitre:
    bout: deux cercles concentriques avec une croix (la sphère vue du dessus)
    face: une sphère (cercle) tangente à un trait (le plan)
  mobilites:
    Tx: 'bloquée : la sphère ne peut pas s''enfoncer dans le plan'
    Ty: 'autorisée : la sphère glisse ou roule sur le plan'
    Tz: 'autorisée : la sphère glisse ou roule sur le plan'
    Rx: 'autorisée : la sphère tourne sur son point de contact'
    Ry: 'autorisée : la sphère tourne sur son point de contact'
    Rz: 'autorisée : la sphère tourne sur son point de contact'
