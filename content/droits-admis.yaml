# Formulations admises — reprises littérales jugées non protégeables.
#
# `tools/check_droits.py` compare le contenu publié aux transcriptions du manuel et signale deux
# sortes de reprises mot pour mot : celles qui tombent dans un passage que le transcripteur a mis
# entre guillemets (donc du livre littéralement), et celles de seize mots ou plus, où la coïncidence
# cesse d'être fortuite.
#
# Toutes ne posent pas problème. Le droit d'auteur protège une **expression originale**, pas une
# définition scolaire, pas l'énoncé d'une loi physique, pas un tableau de valeurs, pas une tournure
# que la discipline impose. « Le vecteur vitesse est toujours tangent à la trajectoire » ne se dit
# pas de dix façons ; la phrase n'appartient à personne. Les valeurs de conductivité de l'ardoise ou
# du plâtre non plus.
#
# Ce fichier liste les reprises examinées et jugées de cette nature (décision de Robin, 5 sept.
# 2026). Ce qui en est absent fait échouer « make check » : le contrôle continue donc d'attraper
# toute NOUVELLE reprise, en particulier celles qui seraient propres à ces manuels — une étude de
# cas, un énoncé d'exercice, une remarque didactique, un exemple rédigé. Treize passages de cette
# sorte ont été réécrits le 5 septembre plutôt qu'admis ici : phrase du château d'eau, remarque sur
# la conversion en kelvin, consignes de prévention et de détection, exigence du pont transbordeur,
# exercice de la caméra, frottement entre solides, conclusion sur l'isolation, capteur de pluie,
# pergola bioclimatique, apport en vitamine C.
#
# Les extraits sont normalisés (minuscules, sans accents ni ponctuation) : c'est la forme comparée.
# Une reprise est admise si elle est **contenue** dans l'un d'eux — raccourcir un passage reste
# admis, l'allonger est signalé. Le commentaire donne où la reprise apparaît et pourquoi elle a été
# relevée.
#
# Engendré une fois par tools/check_droits.py ; se relit et s'édite à la main.

