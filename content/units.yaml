    - type: guided
      level: 3
      title: 'Machine à nettoyer les lunettes (2) : la translation du chariot'
      intro: 'Sur le même prototype de nettoyage de lunettes, le rouleau est porté par un **chariot 1** qui balaie le verre. Le chariot porte un **pignon 5** (rayon primitif R = 10 mm) qui roule sans glisser sur une **crémaillère 6 fixée au bâti 10** : c''est ce qui fait avancer le chariot. Le pignon 5 est monté sur le même arbre que la roue réceptrice 4, laquelle tourne à 125 tr/min par rapport au chariot.

        La mesure de la vitesse du chariot donne la courbe ci-dessous, que l''on modélise par un trapèze : accélération constante de t = 0,25 s à t = 0,50 s, palier à V = 0,125 m/s jusqu''à t = 1,25 s, puis freinage jusqu''à l''arrêt à t = 1,50 s.

        {{fig:guide-boboptic-vitesse}}'
