        - 'Non : un plus grand pignon parcourt plus de crémaillère par tour, donc va plus vite.'
        - 'Non : V est proportionnelle à R, pas à R².'
        explanation: 'V = ω × R : à ω constante, doubler R double V. En contrepartie, l''effort disponible sur la crémaillère est divisé par deux.'
