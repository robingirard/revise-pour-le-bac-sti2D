        answer: '13.09'
        numeric: true
        tolerance: 0.1
        unit: rad/s
        explanation: ω = 2π × N ÷ 60 = 2π × 125 ÷ 60 = 13,09 rad/s.
      - kind: input
        prompt: '**Étape 7.** Calculer la puissance mécanique P s appliquée au rouleau, avec C = 0,28 N·m (1 décimale).'
        answer: '3.7'
        numeric: true
        tolerance: 0.1
        unit: W
        explanation: P s = C × ω = 0,28 × 13,09 = 3,67 W ≈ 3,7 W.
      - kind: mcq
        prompt: '**Étape 8.** Rendement global η = η₁ × η₂ × η₃, puis puissance d''entrée P e = P s ÷ η. Que peut-on conclure sur le moteur de 20 W ?'
