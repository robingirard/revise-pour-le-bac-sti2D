    - type: guided
      level: 3
      title: 'Machine à nettoyer les lunettes (1) : la rotation du rouleau'
      intro: 'Un prototype nettoie la face avant des verres de lunettes avec un **rouleau 9** humidifié, porté par un chariot. Depuis l''arbre du moteur, le mouvement passe par un **engrenage** (pignon moteur 3, Z3 = 12 dents → roue réceptrice 4, Z4 = 72 dents), puis par un **renvoi d''angle conique** (pignon 7, Z7 = 20 dents → roue 8, Z8 = 20 dents) qui porte le rouleau.

        **Données** : N moteur/chariot = 750 tr/min ; le cahier des charges impose N rouleau/chariot = 135 tr/min ; à vitesse nominale on mesure un couple C = 0,28 N·m sur le rouleau. Rendements de la chaîne : convertir η₁ = 0,89 ; adapter la vitesse η₂ = 0,85 ; transformer le mouvement η₃ = 0,70. Le moteur est donné pour 20 W.

