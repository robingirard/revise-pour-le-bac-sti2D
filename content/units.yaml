title: Revise STI2D
units:
- id: liaisons
  matiere: ingenierie
  title: Les liaisons mécaniques
  description: Les 10 liaisons normalisées — symboles, mobilités, contacts, efforts.
  skills:
  - id: mobilites
    title: Les 6 mobilités
    icon: 🧭
    description: Translations, rotations et degrés de liberté.
    prerequisites: []
    levels: 2   # 14 exercices : trois niveaux feraient revoir chacun six fois
    lesson: lessons/mobilites.md
    items:
    - type: mcq
      level: 1
      prompt: 'Un solide libre dans l''espace peut se déplacer suivant :

        {{fig:mobilites}}'
      choices:
      - 3 translations et 3 rotations
      - 3 translations seulement
      - 2 translations et 1 rotation
      - 6 translations
      answer: 0
      feedback:
      - null
      - 'Non : il peut aussi tourner autour de chacun des 3 axes (les flèches courbes R).'
      - 'Non : ce serait le cas dans un plan ; dans l''espace il y a 3 axes, donc 3 T et 3 R.'
      - 'Non : il n''y a que 3 directions de translation (x, y, z) ; les 3 autres mobilités sont des rotations.'
      explanation: 'Une translation (T) et une rotation (R) pour chacun des 3 axes : 6 mobilités.'
    - type: mcq
      level: 1
      prompt: 'Que signifie **Tx** ?

        {{fig:mobilite-Tx}}'
      choices:
      - Une translation suivant l'axe x
      - Une rotation autour de l'axe x
      - Une translation suivant l'axe y
      - Une force selon x
      answer: 0
      feedback:
      - null
      - 'Non : une rotation se note **R** (flèche courbe) ; **T** est une translation (flèche droite).'
      - 'Non : la lettre après T indique l''axe : ici **x**.'
      - 'Non : les mobilités décrivent des **mouvements**, pas des efforts.'
      explanation: T = translation (déplacement en ligne droite), x = le long de l'axe x.
    - type: mcq
      level: 1
      prompt: 'Un tiroir coulisse dans un meuble le long de l''axe x. Quel est son degré de liberté ?

        {{emoji:🗄️}}'
      choices:
      - Tx
      - Rx
      - Ty
      - Tz
      answer: 0
      feedback:
      - null
      - 'Non : le tiroir ne tourne pas, il se déplace en ligne droite : c''est une translation (T).'
      - 'Non : le tiroir se déplace le long de l''axe x, pas de l''axe y.'
      - 'Non : le tiroir se déplace le long de l''axe x, pas de l''axe z.'
      explanation: 'Le tiroir se déplace en ligne droite le long de x : translation Tx.'
    - type: mcq
      level: 1
      prompt: Qu'appelle-t-on les **degrés de liberté** (ddl) d'une liaison ?
      choices:
      - Les mouvements relatifs indépendants encore possibles entre les deux pièces
      - Les efforts que la liaison peut transmettre
      - Le nombre de pièces en contact
      - Les surfaces de contact entre les pièces
      answer: 0
      feedback:
      - null
      - 'Non : les efforts transmissibles sont le **complément** des degrés de liberté (ce qui est bloqué).'
      - 'Non : une liaison concerne toujours deux pièces ; les ddl comptent des **mouvements**.'
      - 'Non : les surfaces de contact **déterminent** la liaison, mais les ddl sont les mouvements qu''elle laisse.'
      explanation: Les ddl sont les mobilités (parmi Tx, Ty, Tz, Rx, Ry, Rz) qui restent possibles malgré le contact.
    - type: mcq
      level: 2
      prompt: À quoi sert une **liaison mécanique** entre deux pièces ?
      choices:
      - À limiter les mobilités grâce aux surfaces de contact
      - À augmenter le nombre de mouvements possibles
      - À souder définitivement les pièces
      - À transmettre du courant électrique
      answer: 0
      feedback:
      - null
      - 'Non : sans contact il y a déjà 6 mobilités ; un contact ne peut qu''en **supprimer**.'
      - 'Non : souder est un cas particulier (encastrement) ; la plupart des liaisons laissent des mouvements.'
      - 'Non : on parle de mécanique, donc de mouvements et d''efforts.'
      explanation: 'Chaque contact supprime des degrés de liberté : la liaison définit les mouvements qui restent possibles.'
    - type: grid
      level: 2
      prompt: 'Une **porte** sur ses gonds (axe vertical z) : cochez ses mobilités par rapport au mur.

        {{emoji:🚪}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Rz
      cellFeedback:
        Tx: 'la porte ne peut pas se déplacer en ligne droite : les gonds la retiennent'
        Ty: 'la porte ne peut pas se déplacer en ligne droite : les gonds la retiennent'
        Tz: 'la porte ne monte pas : les gonds la portent'
        Rx: la porte ne bascule pas autour d'un axe horizontal
        Ry: la porte ne bascule pas autour d'un axe horizontal
        Rz: 'la porte tourne autour de l''axe vertical des gonds : c''est sa seule mobilité'
      explanation: Seule la rotation autour de l'axe des gonds (z) est possible.
    - type: grid
      level: 2
      prompt: 'Un **tiroir** dans son meuble (axe x) : cochez ses mobilités.

        {{emoji:🗄️}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Tx
      cellFeedback:
        Tx: 'le tiroir coulisse le long de x : c''est sa seule mobilité'
        Ty: les glissières empêchent tout déplacement latéral
        Tz: 'le tiroir ne monte pas : il repose sur ses glissières'
        Rx: le tiroir ne peut pas tourner dans son logement
        Ry: le tiroir ne peut pas basculer
        Rz: le tiroir ne peut pas pivoter dans son logement
      explanation: 'Le tiroir ne fait que coulisser : translation Tx.'
    - type: input
      level: 3
      prompt: Une liaison bloque 4 mobilités. Combien lui reste-t-il de degrés de liberté ?
      answer: '2'
      accept:
      - deux
      numeric: true
      explanation: 6 mobilités au total − 4 bloquées = 2 ddl.
    - type: mcq
      level: 1
      prompt: 'La roue avant d''un vélo tourne sur son axe, horizontal et dirigé suivant y. Quelle est sa mobilité par rapport à la fourche ?

        {{emoji:🚲}}'
      choices:
      - Ry
      - Ty
      - Rz
      - Rx
      answer: 0
      feedback:
      - null
      - 'Non : la roue ne se déplace pas le long de son axe, elle tourne autour. Une translation se note T, une rotation R.'
      - 'Non : z est l''axe vertical ; tourner autour de z ferait pivoter la roue comme un guidon.'
      - 'Non : x est l''axe d''avancement ; tourner autour de x ferait basculer la roue sur le côté.'
      explanation: 'La roue tourne autour de son axe y : rotation Ry. C''est le seul mouvement que le roulement lui laisse.'
    - type: mcq
      level: 1
      prompt: 'Une cabine d''ascenseur monte et descend dans sa cage, suivant l''axe vertical z. Quelle est sa mobilité ?

        {{emoji:🛗}}'
      choices:
      - Tz
      - Rz
      - Tx
      - Ty
      answer: 0
      feedback:
      - null
      - 'Non : la cabine ne pivote pas sur elle-même, elle monte en ligne droite : c''est une translation (T).'
      - 'Non : x est horizontal ; la cabine ne se déplace pas latéralement, ses guides l''en empêchent.'
      - 'Non : y est horizontal ; la cabine ne se déplace pas latéralement, ses guides l''en empêchent.'
      explanation: 'La cabine se déplace en ligne droite le long de la verticale z : translation Tz.'
    - type: mcq
      level: 1
      prompt: 'Un portail coulissant se déplace le long de son rail, dirigé suivant y. Quelle est sa mobilité par rapport au mur ?'
      choices:
      - Ty
      - Ry
      - Tx
      - Tz
      answer: 0
      feedback:
      - null
      - 'Non : le portail ne tourne pas autour du rail, il glisse le long : c''est une translation.'
      - 'Non : x est perpendiculaire au rail ; le portail ne s''écarte pas du mur.'
      - 'Non : z est la verticale ; le portail ne monte pas, il repose sur son rail.'
      explanation: 'Le portail glisse en ligne droite le long de son rail y : translation Ty. Comparez avec un portail battant, qui lui tourne (Rz).'
    - type: mcq
      level: 1
      prompt: 'On abaisse la poignée d''une porte. Elle tourne autour d''un axe horizontal x, perpendiculaire au plan de la porte. Quelle est sa mobilité ?

        {{emoji:🚪}}'
      choices:
      - Rx
      - Rz
      - Tx
      - Ry
      answer: 0
      feedback:
      - null
      - 'Non : z est l''axe vertical des gonds, autour duquel tourne la **porte**, pas la poignée.'
      - 'Non : la poignée ne s''enfonce pas dans la porte, elle pivote : c''est une rotation (R).'
      - 'Non : y est dans le plan de la porte ; tourner autour de y arracherait la poignée.'
      explanation: 'La poignée pivote autour de son axe de montage x : rotation Rx. La porte, elle, tourne autour de la verticale z de ses gonds.'
    - type: mcq
      level: 1
      prompt: 'Le plateau d''un four à micro-ondes tourne sur son entraîneur, autour de la verticale z. Quelle est sa mobilité par rapport au four ?'
      choices:
      - Rz
      - Tz
      - Rx
      - Ry
      answer: 0
      feedback:
      - null
      - 'Non : le plateau ne monte pas, il tourne : une translation se note T, une rotation R.'
      - 'Non : x est horizontal ; tourner autour de x renverserait le plateau.'
      - 'Non : y est horizontal ; tourner autour de y renverserait le plateau.'
      explanation: 'Le plateau tourne autour de l''axe vertical z de son entraîneur : rotation Rz.'
    - type: mcq
      level: 2
      prompt: 'Le siège d''une balançoire pend au bout de ses deux cordes et oscille d''avant en arrière. Les cordes sont accrochées à une barre horizontale dirigée suivant y. Quelle mobilité le siège a-t-il par rapport au portique ?'
      choices:
      - Ry
      - Tx
      - Rz
      - Tz
      answer: 0
      feedback:
      - null
      - 'Non : le siège avance et recule, mais il le fait en décrivant un arc de cercle : c''est bien une rotation autour de la barre.'
      - 'Non : z est la verticale ; le siège ne tourne pas sur lui-même comme un tourniquet.'
      - 'Non : le siège monte un peu en s''écartant, mais ce n''est pas un mouvement libre suivant z : il suit l''arc imposé par les cordes.'
      explanation: 'Le siège tourne autour de la barre horizontale y : rotation Ry. Le va-et-vient d''avant en arrière est l''arc de cercle décrit par cette rotation.'
    - type: grid
      level: 2
      prompt: 'Une **souris d''ordinateur** posée sur un tapis horizontal (plan x-y, verticale z) : cochez ses mobilités par rapport au tapis.

        {{emoji:🖱️}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Tx
      - Ty
      - Rz
      cellFeedback:
        Tx: 'la souris glisse sur le tapis suivant x'
        Ty: 'la souris glisse sur le tapis suivant y'
        Tz: le tapis l'empêche de s'enfoncer, et on ne la soulève pas
        Rx: la souris ne bascule pas sur le côté, elle reste à plat
        Ry: la souris ne bascule pas d'avant en arrière, elle reste à plat
        Rz: 'on peut la faire pivoter à plat sur le tapis'
      explanation: 'Un objet posé à plat sur un plan garde trois mobilités : les deux translations du plan (Tx, Ty) et la rotation autour de la normale (Rz). C''est exactement ce que laisse un appui plan.'
    - type: grid
      level: 2
      prompt: 'Un **tabouret de bar** dont l''assise monte en tournant sur sa vis centrale, d''axe vertical z : cochez les mobilités de l''assise par rapport au pied.

        {{emoji:🪑}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Tz
      - Rz
      cellFeedback:
        Tx: l'assise ne se déplace pas latéralement, la vis la retient
        Ty: l'assise ne se déplace pas latéralement, la vis la retient
        Tz: 'l''assise monte et descend le long de la vis'
        Rx: l'assise ne bascule pas, elle reste horizontale
        Ry: l'assise ne bascule pas, elle reste horizontale
        Rz: 'on fait tourner l''assise autour de la vis'
      explanation: 'L''assise monte (Tz) en tournant (Rz) : deux mobilités visibles. Attention, elles ne sont pas indépendantes — un tour de vis correspond toujours à la même montée.'
    - type: mcq
      level: 3
      prompt: 'Une vis se visse dans son écrou, d''axe z : elle tourne (Rz) **et** avance (Tz). Combien de degrés de liberté indépendants cela fait-il ?'
      choices:
      - 'Un seul : les deux mouvements sont liés'
      - 'Deux : une translation et une rotation'
      - 'Zéro : la vis est bloquée'
      - 'Trois : Tz, Rz et le serrage'
      answer: 0
      feedback:
      - null
      - 'Non : ce serait vrai si l''on pouvait tourner sans avancer, comme un pivot glissant. Ici le filetage impose l''un par l''autre.'
      - 'Non : la vis bouge — simplement, ses deux mouvements n''en font qu''un.'
      - 'Non : le serrage est un effort, pas une mobilité ; et Tz et Rz ne comptent que pour un.'
      explanation: 'Le filetage **lie** la rotation et la translation : un tour correspond à une avance égale au pas. On observe deux mouvements, mais on ne peut en choisir qu''un — c''est un seul degré de liberté. C''est ce qui distingue l''hélicoïdale du pivot glissant, où les deux sont libres.'
    - type: input
      level: 3
      prompt: 'Un fauteuil de bureau à roulettes roule sur le sol dans les deux directions du plan, pivote sur son axe vertical, et son assise monte ou descend sur son vérin. Combien de degrés de liberté a-t-il par rapport au sol ?'
      answer: '4'
      accept:
      - quatre
      numeric: true
      explanation: 'Deux translations dans le plan du sol, la rotation autour de la verticale, et la montée de l''assise : 2 + 1 + 1 = 4 degrés de liberté. Il en reste donc 2 bloqués — les deux basculements, que le fauteuil ne fait pas (heureusement).'
    generators:
    - gen: mobilite_figure_vers_nom
    - gen: mobilite_nom_vers_figure
  - id: symboles
    title: Reconnaître les symboles
    icon: 🔩
    description: Associer chaque symbole normalisé à sa liaison, dans les deux vues.
    prerequisites:
    - mobilites
    lesson: lessons/symboles.md
    generators:
    - gen: symbole_vers_nom
    - gen: nom_vers_symbole
    - gen: match_symboles
    - gen: symbole3d_vers_nom
    - gen: nom_vers_symbole3d
    - gen: match_symboles3d
  - id: ddl
    title: Degrés de liberté
    icon: 🎚️
    description: Les mobilités de chaque liaison.
    prerequisites:
    - symboles
    lesson: lessons/ddl.md
    generators:
    - gen: nb_ddl_mcq
    - gen: ddl_grid
    - gen: ddl_vers_nom
  - id: contacts
    title: Surfaces de contact
    icon: 🤝
    description: Reconnaître une liaison à partir des surfaces en contact et d'objets réels.
    prerequisites:
    - symboles
    lesson: lessons/contacts.md
    generators:
    - gen: contact_figure_vers_nom
    - gen: nom_vers_contact_figure
    - gen: contact_vers_nom
    - gen: exemple_vers_nom
    - gen: nom_vers_contact
  - id: efforts
    title: Efforts transmissibles
    icon: 💪
    description: Ce qu'une liaison transmet (forces et moments) — le complément des mobilités.
    prerequisites:
    - ddl
    lesson: lessons/efforts.md
    generators:
    - gen: efforts_grid
    - gen: nb_efforts_mcq
    items:
    - type: mcq
      level: 1
      prompt: Une liaison **autorise** la translation Tx. Peut-elle transmettre une force X selon x ?
      choices:
      - 'Non : si le mouvement est libre, aucun effort n''est transmis dans cette direction'
      - Oui, toujours
      - Oui, mais seulement la moitié
      - Cela dépend de la couleur des pièces
      answer: 0
      explanation: 'Mobilité et effort transmissible sont **complémentaires** : là où le mouvement est libre (sans frottement), l''effort est nul.'
      feedback:
      - null
      - 'Non : si la translation est libre, rien ne s''oppose au mouvement, donc aucune force n''est transmise dans cette direction.'
      - 'Non : la transmission d''effort est tout ou rien pour une liaison parfaite (sans frottement).'
      - 'Non : la couleur n''a rien à voir ; c''est la géométrie du contact qui compte.'
    - type: input
      level: 2
      prompt: Une liaison possède 2 degrés de liberté. Combien de composantes d'effort indépendantes transmet-elle ?
      answer: '4'
      accept:
      - quatre
      numeric: true
      explanation: ddl + composantes transmissibles = 6, donc 6 − 2 = 4.
    - type: guided
      level: 3
      title: 'Diffuseur de parfum : lire les liaisons et les efforts transmissibles'
      intro: 'Un diffuseur automatique de parfum enfonce la tête d''un aérosol pour libérer une dose. Un moteur entraîne le **pignon 1**, qui attaque un réducteur formé des **pignons doubles 2 et 3** ; en sortie, la **came 4** pousse la **tête d''aérosol 5**.

        Les arbres des pignons 1, 2, 3 et de la came 4 sont guidés en rotation dans le **bâti 0**, tous d''axe parallèle à z. La tête 5 ne peut que **coulisser suivant y** dans le bâti. La came 4 pousse la tête 5 par un simple contact en un point E, de normale y.

        {{fig:guide-diffuseur-schema}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Quelle liaison modélise le guidage de l''arbre du pignon 2 (centre B) dans le bâti 0 ?'
        choices:
        - Une liaison pivot d'axe (B, z)
        - Une liaison glissière d'axe (B, z)
        - Une liaison pivot glissant d'axe (B, z)
        - Un encastrement de centre B
        answer:
        - 0
        feedback:
        - null
        - 'Non : une glissière n''autorise qu''une translation, or l''arbre du pignon tourne.'
        - 'Non : l''arbre est retenu en translation le long de son axe par ses portées ; il ne lui reste que la rotation.'
        - 'Non : un encastrement bloquerait tout, le pignon ne pourrait pas tourner.'
        explanation: Guidage en rotation seul = liaison pivot, 1 degré de liberté (Rz). On la note L2/0.
      - kind: grid
        prompt: '**Étape 2.** La tête d''aérosol 5 ne peut que coulisser suivant y dans le bâti 0. Cochez ses mobilités par rapport au bâti.'
        rows:
        - id: x
          label: x
        - id: y
          label: y
        - id: z
          label: z
        cols:
        - id: T
          label: Translation
        - id: R
          label: Rotation
        answer:
        - Ty
        cellFeedback:
          Tx: le coulissement se fait suivant y, pas suivant x
          Ty: 'c''est la seule mobilité : la tête s''enfonce suivant y'
          Tz: le coulissement se fait suivant y, pas suivant z
          Rx: la tête d'aérosol ne tourne pas dans son logement
          Ry: la tête d'aérosol ne tourne pas sur elle-même
          Rz: la tête d'aérosol ne tourne pas dans son logement
        explanation: 'Une seule translation possible : la liaison L5/0 est une glissière de direction y, 1 degré de liberté.'
      - kind: input
        prompt: '**Étape 3.** Combien de composantes d''effort (forces + moments) cette glissière transmet-elle ?'
        answer: '5'
        accept:
        - cinq
        numeric: true
        explanation: 6 − 1 = 5. La glissière transmet les deux forces X et Z et les trois moments L, M, N ; seule la force Y suivant la direction libre est nulle.
      - kind: mcq
        prompt: '**Étape 4.** La came 4 pousse la tête 5 par un contact en un seul point E, de normale y. Quelle est cette liaison ?'
        choices:
        - Une liaison ponctuelle de normale (E, y)
        - Un appui plan de normale (E, y)
        - Une liaison linéaire rectiligne de normale (E, y)
        - Une liaison pivot d'axe (E, z)
        answer:
        - 0
        feedback:
        - null
        - 'Non : un appui plan suppose un contact sur toute une surface plane, pas en un point.'
        - 'Non : la linéaire rectiligne correspond à un contact sur une **ligne** droite (cylindre sur plan).'
        - 'Non : il n''y a ici aucun arbre guidé en rotation, seulement un contact ponctuel.'
        explanation: 'Contact en un point (sphère-plan) : liaison ponctuelle de normale (E, y), 5 degrés de liberté.'
      - kind: mcq
        prompt: '**Étape 5.** Que transmet cette liaison ponctuelle (contact parfait, sans frottement) ?'
        choices:
        - Une seule force, portée par la normale y
        - Une force quelconque et un moment
        - Trois composantes de force
        - Rien du tout, puisqu'elle a 5 degrés de liberté
        answer:
        - 0
        feedback:
        - null
        - 'Non : avec 5 mobilités il ne reste qu''une seule composante bloquée, donc aucun moment.'
        - 'Non : les deux composantes tangentielles au plan de contact sont libres (pas de frottement).'
        - 'Non : la mobilité bloquée (la translation suivant la normale) correspond justement à un effort transmis.'
        explanation: 5 ddl + 1 composante transmissible = 6. La came ne peut que **pousser** la tête suivant y.
      - kind: input
        prompt: '**Étape 6.** Vérification : on additionne les degrés de liberté et les composantes d''effort transmissibles d''une même liaison. Que doit-on toujours trouver ?'
        answer: '6'
        accept:
        - six
        numeric: true
        explanation: 'Mobilités et efforts transmissibles sont complémentaires : ddl + composantes = 6 pour toute liaison parfaite.'
      - kind: mcq
        prompt: '**Étape 7.** Sur un graphique du dossier technique, la liaison entre la tête 5 et le bâti 0 est nommée « pivot glissant L5/0 ». Que faut-il en penser ?'
        choices:
        - C'est une erreur du document, car la tête ne tourne pas sur elle-même
        - C'est exact, un pivot glissant permet bien de coulisser
        - C'est exact, car la tête coulisse et le pignon tourne
        - Impossible de trancher sans connaître la forme du contact
        answer:
        - 0
        feedback:
        - null
        - 'Non : le pivot glissant permet aussi de **tourner** autour de l''axe (2 ddl) ; ici la rotation est empêchée.'
        - 'Non : ce sont deux pièces différentes ; on décrit ici la seule liaison entre 5 et 0.'
        - 'Non : l''énoncé précise que la tête ne fait que s''enfoncer suivant y, cela suffit à conclure.'
        explanation: 'Une glissière a 1 ddl (Ty), un pivot glissant en a 2 (Ty et Ry). La tête d''aérosol ne tournant pas, la liaison correcte est la **glissière**. Vérifier le vocabulaire d''un document technique fait partie du travail de l''ingénieur.'
- id: schema
  matiere: ingenierie
  title: Le schéma cinématique
  description: Du mécanisme réel au schéma — classes d'équivalence, graphe des liaisons, tracé.
  skills:
  - id: classes
    title: Classes d'équivalence
    icon: 🎨
    description: Regrouper les pièces qui bougent ensemble.
    prerequisites:
    - contacts
    lesson: lessons/classes.md
    generators:
    - gen: classes_mecanisme
    items:
    - type: mcq
      level: 1
      prompt: 'Qu''est-ce qu''une **classe d''équivalence cinématique** ?

        {{fig:mecanisme-serre-joint-classes}}'
      choices:
      - Un groupe de pièces sans mouvement relatif entre elles
      - Un groupe de pièces qui se touchent
      - Un groupe de pièces du même matériau
      - Une seule pièce du mécanisme
      answer: 0
      feedback:
      - null
      - 'Non : deux pièces peuvent se toucher et bouger l''une par rapport à l''autre (une vis dans son écrou, par exemple).'
      - 'Non : le matériau ne compte pas ; seule l''absence de mouvement relatif compte.'
