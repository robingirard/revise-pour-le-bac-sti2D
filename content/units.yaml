title: Révise STI2D
units:
- id: liaisons
  matiere: ingenierie
  title: Les liaisons mécaniques
  description: Les 10 liaisons normalisées — symboles, mobilités, contacts, efforts.
  skills:
  - id: mobilites
    title: Les 6 mobilités
    icon: 🧭
    description: Translations, rotations et degrés de liberté.
    prerequisites: []
    lesson: lessons/mobilites.md
    items:
    - type: mcq
      level: 1
      prompt: 'Un solide libre dans l''espace peut se déplacer suivant :

        {{fig:mobilites}}'
      choices:
      - 3 translations et 3 rotations
      - 3 translations seulement
      - 2 translations et 1 rotation
      - 6 translations
      answer: 0
      feedback:
      - null
      - 'Non : il peut aussi tourner autour de chacun des 3 axes (les flèches courbes R).'
      - 'Non : ce serait le cas dans un plan ; dans l''espace il y a 3 axes, donc 3 T et 3 R.'
      - 'Non : il n''y a que 3 directions de translation (x, y, z) ; les 3 autres mobilités sont des rotations.'
      explanation: 'Une translation (T) et une rotation (R) pour chacun des 3 axes : 6 mobilités.'
    - type: mcq
      level: 1
      prompt: 'Que signifie **Tx** ?

        {{fig:mobilite-Tx}}'
      choices:
      - Une translation suivant l'axe x
      - Une rotation autour de l'axe x
      - Une translation suivant l'axe y
      - Une force selon x
      answer: 0
      feedback:
      - null
      - 'Non : une rotation se note **R** (flèche courbe) ; **T** est une translation (flèche droite).'
      - 'Non : la lettre après T indique l''axe : ici **x**.'
      - 'Non : les mobilités décrivent des **mouvements**, pas des efforts.'
      explanation: T = translation (déplacement en ligne droite), x = le long de l'axe x.
    - type: mcq
      level: 1
      prompt: 'Un tiroir coulisse dans un meuble le long de l''axe x. Quel est son degré de liberté ?

        {{emoji:🗄️}}'
      choices:
      - Tx
      - Rx
      - Ty
      - Tz
      answer: 0
      feedback:
      - null
      - 'Non : le tiroir ne tourne pas, il se déplace en ligne droite : c''est une translation (T).'
      - 'Non : le tiroir se déplace le long de l''axe x, pas de l''axe y.'
      - 'Non : le tiroir se déplace le long de l''axe x, pas de l''axe z.'
      explanation: 'Le tiroir se déplace en ligne droite le long de x : translation Tx.'
    - type: mcq
      level: 1
      prompt: Qu'appelle-t-on les **degrés de liberté** (ddl) d'une liaison ?
      choices:
      - Les mouvements relatifs indépendants encore possibles entre les deux pièces
      - Les efforts que la liaison peut transmettre
      - Le nombre de pièces en contact
      - Les surfaces de contact entre les pièces
      answer: 0
      feedback:
      - null
      - 'Non : les efforts transmissibles sont le **complément** des degrés de liberté (ce qui est bloqué).'
      - 'Non : une liaison concerne toujours deux pièces ; les ddl comptent des **mouvements**.'
      - 'Non : les surfaces de contact **déterminent** la liaison, mais les ddl sont les mouvements qu''elle laisse.'
      explanation: Les ddl sont les mobilités (parmi Tx, Ty, Tz, Rx, Ry, Rz) qui restent possibles malgré le contact.
    - type: mcq
      level: 2
      prompt: À quoi sert une **liaison mécanique** entre deux pièces ?
      choices:
      - À limiter les mobilités grâce aux surfaces de contact
      - À augmenter le nombre de mouvements possibles
      - À souder définitivement les pièces
      - À transmettre du courant électrique
      answer: 0
      feedback:
      - null
      - 'Non : sans contact il y a déjà 6 mobilités ; un contact ne peut qu''en **supprimer**.'
      - 'Non : souder est un cas particulier (encastrement) ; la plupart des liaisons laissent des mouvements.'
      - 'Non : on parle de mécanique, donc de mouvements et d''efforts.'
      explanation: 'Chaque contact supprime des degrés de liberté : la liaison définit les mouvements qui restent possibles.'
    - type: grid
      level: 2
      prompt: 'Une **porte** sur ses gonds (axe vertical z) : cochez ses mobilités par rapport au mur.

        {{emoji:🚪}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Rz
      cellFeedback:
        Tx: 'la porte ne peut pas se déplacer en ligne droite : les gonds la retiennent'
        Ty: 'la porte ne peut pas se déplacer en ligne droite : les gonds la retiennent'
        Tz: 'la porte ne monte pas : les gonds la portent'
        Rx: la porte ne bascule pas autour d'un axe horizontal
        Ry: la porte ne bascule pas autour d'un axe horizontal
        Rz: 'la porte tourne autour de l''axe vertical des gonds : c''est sa seule mobilité'
      explanation: Seule la rotation autour de l'axe des gonds (z) est possible.
    - type: grid
      level: 2
      prompt: 'Un **tiroir** dans son meuble (axe x) : cochez ses mobilités.

        {{emoji:🗄️}}'
      rows:
      - x
      - y
      - z
      cols:
      - T
      - R
      answer:
      - Tx
      cellFeedback:
        Tx: 'le tiroir coulisse le long de x : c''est sa seule mobilité'
        Ty: les glissières empêchent tout déplacement latéral
        Tz: 'le tiroir ne monte pas : il repose sur ses glissières'
        Rx: le tiroir ne peut pas tourner dans son logement
        Ry: le tiroir ne peut pas basculer
        Rz: le tiroir ne peut pas pivoter dans son logement
      explanation: 'Le tiroir ne fait que coulisser : translation Tx.'
    - type: input
      level: 3
      prompt: Une liaison bloque 4 mobilités. Combien lui reste-t-il de degrés de liberté ?
      answer: '2'
      accept:
      - deux
      numeric: true
      explanation: 6 mobilités au total − 4 bloquées = 2 ddl.
    generators:
    - gen: mobilite_figure_vers_nom
    - gen: mobilite_nom_vers_figure
  - id: symboles
    title: Reconnaître les symboles
    icon: 🔩
    description: Associer chaque symbole normalisé à sa liaison, dans les deux vues.
    prerequisites:
    - mobilites
    lesson: lessons/symboles.md
    generators:
    - gen: symbole_vers_nom
    - gen: nom_vers_symbole
    - gen: match_symboles
  - id: ddl
    title: Degrés de liberté
    icon: 🎚️
    description: Les mobilités de chaque liaison.
    prerequisites:
    - symboles
    lesson: lessons/ddl.md
    generators:
    - gen: nb_ddl_mcq
    - gen: ddl_grid
    - gen: ddl_vers_nom
  - id: contacts
    title: Surfaces de contact
    icon: 🤝
    description: Reconnaître une liaison à partir des surfaces en contact et d'objets réels.
    prerequisites:
    - symboles
    lesson: lessons/contacts.md
    generators:
    - gen: contact_figure_vers_nom
    - gen: nom_vers_contact_figure
    - gen: contact_vers_nom
    - gen: exemple_vers_nom
    - gen: nom_vers_contact
  - id: efforts
    title: Efforts transmissibles
    icon: 💪
    description: Ce qu'une liaison transmet (forces et moments) — le complément des mobilités.
    prerequisites:
    - ddl
    lesson: lessons/efforts.md
    generators:
    - gen: efforts_grid
    - gen: nb_efforts_mcq
    items:
    - type: mcq
      level: 1
      prompt: Une liaison **autorise** la translation Tx. Peut-elle transmettre une force X selon x ?
      choices:
      - 'Non : si le mouvement est libre, aucun effort n''est transmis dans cette direction'
      - Oui, toujours
      - Oui, mais seulement la moitié
      - Cela dépend de la couleur des pièces
      answer: 0
      explanation: 'Mobilité et effort transmissible sont **complémentaires** : là où le mouvement est libre (sans frottement), l''effort est nul.'
      feedback:
      - null
      - 'Non : si la translation est libre, rien ne s''oppose au mouvement, donc aucune force n''est transmise dans cette direction.'
      - 'Non : la transmission d''effort est tout ou rien pour une liaison parfaite (sans frottement).'
      - 'Non : la couleur n''a rien à voir ; c''est la géométrie du contact qui compte.'
    - type: input
      level: 2
      prompt: Une liaison possède 2 degrés de liberté. Combien de composantes d'effort indépendantes transmet-elle ?
      answer: '4'
      accept:
      - quatre
      numeric: true
      explanation: ddl + composantes transmissibles = 6, donc 6 − 2 = 4.
- id: schema
  matiere: ingenierie
  title: Le schéma cinématique
  description: Du mécanisme réel au schéma — classes d'équivalence, graphe des liaisons, tracé.
  skills:
  - id: classes
    title: Classes d'équivalence
    icon: 🎨
    description: Regrouper les pièces qui bougent ensemble.
    prerequisites:
    - contacts
    lesson: lessons/classes.md
    generators:
    - gen: classes_mecanisme
    items:
    - type: mcq
      level: 1
      prompt: 'Qu''est-ce qu''une **classe d''équivalence cinématique** ?

        {{fig:mecanisme-serre-joint-classes}}'
      choices:
      - Un groupe de pièces sans mouvement relatif entre elles
      - Un groupe de pièces qui se touchent
      - Un groupe de pièces du même matériau
      - Une seule pièce du mécanisme
      answer: 0
      feedback:
      - null
      - 'Non : deux pièces peuvent se toucher et bouger l''une par rapport à l''autre (une vis dans son écrou, par exemple).'
      - 'Non : le matériau ne compte pas ; seule l''absence de mouvement relatif compte.'
      - 'Non : une classe regroupe souvent plusieurs pièces (rail + mâchoire fixe + rivet, par exemple).'
      explanation: 'Les pièces d''une classe bougent comme un seul solide : on leur donne une même couleur.'
    - type: mcq
      level: 1
      prompt: Quelles pièces sont **exclues** des classes d'équivalence ?
      choices:
      - Les pièces déformables (ressorts, joints, courroies)
      - Les pièces en métal
      - Les pièces fixes
      - Les pièces les plus petites
      answer: 0
      feedback:
      - null
      - 'Non : le métal se déforme très peu, ces pièces sont des solides ; ce sont les pièces **déformables** qu''on exclut.'
      - 'Non : le bâti (fixe) est une classe comme les autres.'
      - 'Non : la taille ne compte pas ; une petite goupille fait partie d''une classe.'
      explanation: 'Une pièce déformable n''a pas un mouvement de solide : on l''exclut (manuel p. 33, étape 2).'
    - type: mcq
      level: 1
      prompt: 'Deux pièces **vissées l''une sur l''autre** (encastrement) appartiennent :

        {{fig:contact-encastrement}}'
      choices:
      - À la même classe d'équivalence
      - À deux classes différentes
      - À aucune classe
      - Cela dépend de leur taille
      answer: 0
      feedback:
      - null
      - 'Non : elles n''ont aucun mouvement relatif, elles forment donc un seul solide.'
      - 'Non : toute pièce non déformable appartient à une classe.'
      - 'Non : seule l''absence de mouvement relatif compte.'
      explanation: 'Un encastrement n''autorise aucun mouvement relatif : les deux pièces forment un seul solide.'
  - id: graphe
    title: Graphe des liaisons
    icon: 🕸️
    description: Identifier la liaison entre deux classes et tracer le graphe.
    prerequisites:
    - classes
    - ddl
    lesson: lessons/graphe.md
    generators:
    - gen: liaison_entre_classes
    - gen: lecture_graphe
    items:
    - type: order
      level: 1
      prompt: Remettez dans l'ordre les **5 étapes** de la démarche pour réaliser un schéma cinématique (manuel p. 33).
      steps:
      - Étudier le dessin d'ensemble pour comprendre le fonctionnement
      - Identifier les classes d'équivalence (une couleur par classe)
      - Identifier la nature des contacts et en déduire les liaisons
      - Tracer le graphe des liaisons
      - Tracer le schéma cinématique (2D ou 3D)
    - type: mcq
      level: 1
      prompt: Dans un graphe des liaisons, que représentent les **cercles** et les **traits** ?
      choices:
      - Cercles = classes d'équivalence, traits = liaisons
      - Cercles = liaisons, traits = classes
      - Cercles = pièces, traits = contacts
      - Cercles = points, traits = axes
      answer: 0
      explanation: Chaque sommet est une classe d'équivalence ; chaque arête est une liaison, avec son nom, son centre et son axe.
      feedback:
      - null
      - 'Non : c''est l''inverse.'
      - 'Non : le graphe regroupe d''abord les pièces en classes ; un trait est une liaison, pas un simple contact.'
      - 'Non : les points et axes sont écrits **sur** les traits, ils ne sont pas les sommets.'
  - id: schema-2d
    title: Tracer le schéma
    icon: ✏️
    description: Choisir le bon symbole selon la vue et lire un schéma cinématique.
    prerequisites:
    - graphe
    lesson: lessons/schema.md
    generators:
    - gen: choix_symbole_vue
    - gen: lecture_schema
    - gen: exercice_complet
    items:
    - type: mcq
      level: 1
      prompt: Sur un schéma cinématique, comment distingue-t-on les classes d'équivalence ?
      choices:
      - Par des couleurs différentes, les mêmes qu'à l'étape des classes
      - Par des épaisseurs de trait
      - Par des numéros de pièces
      - On ne les distingue pas
      answer: 0
      explanation: On respecte les couleurs choisies pour les classes d'équivalence (manuel p. 33, étape 5).
      feedback:
      - null
      - 'Non : l''épaisseur du trait ne code rien ; ce sont les couleurs des classes.'
      - 'Non : les numéros de pièces sont sur le dessin d''ensemble ; le schéma montre des classes.'
      - 'Non : les couleurs sont justement là pour distinguer les classes.'
    - type: mcq
      level: 2
      prompt: Où place-t-on le symbole d'une liaison sur le schéma ?
      choices:
      - À la position réelle du centre de la liaison (point caractéristique)
      - N'importe où, l'important est le symbole
      - Toujours au centre de la feuille
      - Au milieu de la pièce la plus grande
      answer: 0
      explanation: 'Le schéma respecte la position des centres des liaisons : c''est ce qui permet ensuite d''étudier les mouvements (manuel p. 33, étape 5).'
      feedback:
      - null
      - 'Non : le schéma doit permettre d''étudier les mouvements, il respecte les positions réelles.'
      - 'Non : les symboles se placent aux centres réels des liaisons.'
      - 'Non : la taille des pièces ne compte pas, la position des liaisons si.'
- id: transmission-mvt
  matiere: ingenierie
  title: Transmettre et transformer le mouvement
  description: Engrenages, poulies, roue et vis sans fin, pignon-crémaillère, vis-écrou, bielle-manivelle ; couple et rendement.
  skills:
  - id: transmission
    title: Transmettre la rotation
    icon: ⚙️
    description: 'Engrenages, trains, roue et vis sans fin, poulies-courroie : rapport, sens, réversibilité.'
    prerequisites:
    - mobilites
    lesson: lessons/transmission.md
    generators:
    - gen: engrenage_rapport
    - gen: train_rapport
    - gen: roue_vis_rapport
    - gen: poulies_rapport
    items:
    - type: mcq
      level: 1
      prompt: 'Quel mécanisme de transmission est représenté ?

        {{fig:transmission-engrenage}}'
      choices:
      - Un engrenage (deux roues dentées)
      - Un système poulies-courroie
      - Une roue et vis sans fin
      - Un pignon-crémaillère
      answer: 0
      feedback:
      - null
      - 'Non : des poulies seraient reliées par une courroie (deux segments tangents), pas en contact direct.'
      - 'Non : la vis sans fin est un cylindre fileté dont l''axe est perpendiculaire à celui de la roue.'
      - 'Non : une crémaillère est une tige droite dentée, ici les deux pièces sont des roues.'
      explanation: 'Deux roues dentées en contact direct : un engrenage. Elles tournent en sens opposés.'
    - type: mcq
      level: 1
      prompt: 'Quel mécanisme est représenté ?

        {{fig:transmission-poulies}}'
      choices:
      - Un système poulies-courroie
      - Un engrenage
      - Un train d'engrenages
      - Une roue et vis sans fin
      answer: 0
      feedback:
      - null
      - 'Non : les deux roues ne se touchent pas, elles sont reliées par une courroie.'
      - 'Non : il n''y a que deux roues et pas de dents en contact.'
      - 'Non : les deux axes sont parallèles, il n''y a pas de vis.'
      explanation: 'Deux poulies reliées par une courroie : elles tournent dans le même sens.'
    - type: mcq
      level: 1
      prompt: 'Quel mécanisme est représenté ?

        {{fig:transmission-roue-vis}}'
      choices:
      - Une roue et vis sans fin
      - Un engrenage
      - Un système vis-écrou
      - Un système poulies-courroie
      answer: 0
      feedback:
      - null
      - 'Non : les axes sont perpendiculaires et l''une des pièces est une vis, pas une roue dentée.'
      - 'Non : le vis-écrou transforme la rotation en translation ; ici la roue tourne.'
      - 'Non : il n''y a ni courroie ni poulies.'
      explanation: 'Une vis sans fin entraîne une roue dentée dont l''axe est perpendiculaire : roue et vis sans fin.'
    - type: mcq
      level: 1
      prompt: 'Dans un engrenage à deux roues, les deux roues tournent :'
      choices:
      - En sens opposés
      - Dans le même sens
      - Cela dépend du nombre de dents
      - À la même vitesse
      answer: 0
      feedback:
      - null
      - 'Non : au point de contact, les dents de la roue menante poussent celles de la roue menée dans l''autre sens.'
      - 'Non : le nombre de dents change la vitesse, pas le sens.'
      - 'Non : elles n''ont la même vitesse que si elles ont le même nombre de dents.'
      explanation: Deux roues dentées en contact tournent en sens contraires (pour tourner dans le même sens, il faut une roue intermédiaire).
    - type: mcq
      level: 1
      prompt: 'Dans un système poulies-courroie (courroie droite), les deux poulies tournent :'
      choices:
      - Dans le même sens
      - En sens opposés
      - Cela dépend du diamètre
      - L'une tourne, l'autre translate
      answer: 0
      feedback:
      - null
      - 'Non : la courroie entraîne les deux poulies dans le même sens (sauf si elle est croisée).'
      - 'Non : le diamètre change la vitesse, pas le sens.'
      - 'Non : les deux poulies sont en rotation.'
      explanation: La courroie transmet le mouvement sans inverser le sens de rotation.
    - type: mcq
      level: 1
      prompt: Quel mécanisme est, en général, **irréversible** (la sortie ne peut pas entraîner l'entrée) ?
      choices:
      - La roue et vis sans fin
      - L'engrenage
      - Le système poulies-courroie
      - Le train d'engrenages
      answer: 0
      feedback:
      - null
      - 'Non : un engrenage est réversible, chaque roue peut entraîner l''autre.'
      - 'Non : les poulies sont réversibles.'
      - 'Non : un train d''engrenages est réversible.'
      explanation: 'Avec une vis sans fin, la roue ne peut pas entraîner la vis : le mécanisme se bloque (utile pour un treuil ou un portail).'
    - type: mcq
      level: 2
      prompt: Quel mécanisme permet d'obtenir un **très grand rapport de réduction** dans un faible encombrement, avec des axes perpendiculaires ?
      choices:
      - La roue et vis sans fin
      - Le système poulies-courroie
      - L'engrenage à deux roues
      - Le pignon-crémaillère
      answer: 0
      feedback:
      - null
      - 'Non : les poulies gardent des axes parallèles et un rapport modéré.'
      - 'Non : un engrenage simple donne un rapport limité par les diamètres.'
      - 'Non : le pignon-crémaillère transforme la rotation en translation.'
      explanation: 'Un filet de vis = une dent avancée par tour : R = Z₁ ÷ Z₂ est très petit (1/40, 1/60…).'
    - type: mcq
      level: 2
      prompt: 'Une courroie **crantée** (dentée) par rapport à une courroie lisse :'
      choices:
      - Transmet le mouvement sans glissement
      - Permet un glissement de sécurité
      - Inverse le sens de rotation
      - Augmente le rapport de transmission
      answer: 0
      feedback:
      - null
      - 'Non : c''est la courroie lisse (plate ou trapézoïdale) qui peut glisser, ce qui sert de sécurité.'
      - 'Non : le sens ne dépend pas du type de courroie.'
      - 'Non : le rapport ne dépend que des diamètres des poulies.'
      explanation: 'Les crans empêchent le glissement : la vitesse de la courroie et des deux poulies sont liées exactement.'
    - type: mcq
      level: 2
      prompt: 'Un rapport de transmission R = 0,2 signifie que :'
      choices:
      - La sortie tourne 5 fois moins vite que l'entrée
      - La sortie tourne 5 fois plus vite que l'entrée
      - La sortie tourne 0,2 fois moins vite
      - Le couple de sortie est 5 fois plus petit
      answer: 0
      feedback:
      - null
      - 'Non : R = ω sortie ÷ ω entrée = 0,2 < 1 : la sortie est plus lente.'
      - 'Non : « 5 fois moins vite » est la bonne formulation (1 ÷ 0,2 = 5).'
      - 'Non : un réducteur augmente le couple (5 fois, aux pertes près).'
      explanation: 'R < 1 : réducteur. ω sortie = 0,2 × ω entrée, et le couple est multiplié par 1 ÷ R = 5 (× η).'
  - id: couple
    title: Couple, puissance, rendement
    icon: 🔋
    description: P = C × ω, conversion tr/min → rad/s, couple de sortie d'un réducteur, rendement global.
    prerequisites:
    - transmission
    lesson: lessons/couple.md
    generators:
    - gen: conversion_trmin
    - gen: puissance_rotation
    - gen: couple_sortie
    - gen: rendement_global
    items:
    - type: mcq
      level: 1
      prompt: 'La puissance mécanique d''un moteur en rotation vaut :'
      choices:
      - P = C × ω (couple × vitesse angulaire)
      - P = C ÷ ω
      - P = C × N avec N en tr/min
      - P = F × d
      answer: 0
      feedback:
      - null
      - 'Non : la puissance est un produit couple × vitesse.'
      - 'Non : la vitesse doit être en rad/s pour obtenir des watts.'
      - 'Non : F × d est un travail (ou un moment), pas une puissance.'
      explanation: P (W) = C (N·m) × ω (rad/s).
    - type: mcq
      level: 1
      prompt: Un élève écrit C s = η × C e × R pour un réducteur (R = 0,05). Où est l'erreur ?
      choices:
      - 'Il faut diviser par R : un réducteur augmente le couple'
      - Il faut enlever η
      - Il faut mettre R au carré
      - Il n'y a pas d'erreur
      answer: 0
      feedback:
      - null
      - 'Non : le rendement est bien un facteur multiplicatif < 1.'
      - 'Non : R intervient à la puissance 1.'
      - 'Non : avec R = 0,05 sa formule donnerait un couple 20 fois trop petit au lieu de 20 fois plus grand.'
      explanation: 'C s = η × C e ÷ R : la puissance se conserve (aux pertes près) et ω s = R × ω e, donc le couple est multiplié par 1 ÷ R.'
    - type: mcq
      level: 2
      prompt: 'Un réducteur reçoit 100 W et en restitue 80 W. Son rendement vaut :'
      choices:
      - 0,8 (80 %)
      - 1,25
      - 20 W
      - 0,2
      answer: 0
      feedback:
      - null
      - 'Non : η = P sortie ÷ P entrée, toujours ≤ 1.'
      - 'Non : 20 W sont les pertes, pas le rendement (sans unité).'
