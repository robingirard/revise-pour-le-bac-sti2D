        - 'L''exigence est respectée, avec une marge d''environ 7 %'
        - L'exigence est exactement respectée
        - On ne peut pas conclure sans connaître le couple
        answer:
        - 0
        feedback:
        - null
        - 'Non : 125 tr/min est **inférieur** aux 135 tr/min demandés, il n''y a aucune marge.'
        - 'Non : 125 et 135 tr/min ne sont pas égaux, l''écart est de 10 tr/min.'
        - 'Non : comparer deux vitesses de rotation ne demande pas de connaître le couple.'
        explanation: (135 − 125) ÷ 135 = 7,4 %. Le nettoyage sera un peu moins efficace que prévu ; il faut revoir le moteur ou le rapport de transmission.
      - kind: input
        prompt: '**Étape 5.** À rapport de transmission inchangé, quelle vitesse le moteur devrait-il avoir pour atteindre les 135 tr/min exigés ? (en tr/min)'
        answer: '810'
        numeric: true
        tolerance: 5
        unit: tr/min
        explanation: N moteur = 135 ÷ r₁ = 135 × 6 = 810 tr/min.
      - kind: input
