        - 'Non : le rapport vaut Z7 ÷ Z8 = 20 ÷ 20 = 1 : la vitesse est inchangée.'
        - 'Non : les deux pièces tournent ; il s''agit d''une transmission, pas d''une transformation.'
        - 'Non : c''est la roue et vis sans fin qui est irréversible, pas un engrenage conique.'
        explanation: 'Un renvoi d''angle change la **direction** de l''axe de rotation ; avec des dentures égales, il ne change ni la vitesse ni le couple (aux pertes près).'
      - kind: mcq
        prompt: '**Étape 2.** Calculer le rapport de transmission r₁ = (Z3 ÷ Z4) × (Z7 ÷ Z8) entre l''arbre moteur et le rouleau.'
        choices:
        - 1 ÷ 6 ≈ 0,167
        - '6'
        - 1 ÷ 12
        - 1 ÷ 3
        answer:
        - 0
        feedback:
        - null
        - 'Non : c''est l''inverse. Le pignon menant a moins de dents que la roue menée : c''est un réducteur, r₁ < 1.'
        - 'Non : le renvoi d''angle a un rapport de 1, il ne divise pas encore par 2.'
        - 'Non : 12 ÷ 72 = 1/6, pas 1/3.'
        explanation: r₁ = (12 ÷ 72) × (20 ÷ 20) = 1/6 × 1 = 1/6 ≈ 0,167.
      - kind: input
        prompt: '**Étape 3.** En déduire la vitesse de rotation du rouleau par rapport au chariot (en tr/min).'
        answer: '125'
        numeric: true
        tolerance: 1
        unit: tr/min
        explanation: N rouleau = r₁ × N moteur = 750 ÷ 6 = 125 tr/min.
