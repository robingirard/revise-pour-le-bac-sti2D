        - Une rotation autour de l'axe du pignon 5
        - Une translation circulaire
        - Un mouvement plan
        answer:
        - 0
        feedback:
        - null
        - 'Non : c''est le pignon 5 qui tourne ; le chariot, lui, avance en ligne droite.'
        - 'Non : les points du chariot décrivent des segments de droite, pas des arcs de cercle.'
        - 'Non : le chariot ne change pas d''orientation, il n''y a donc pas de rotation associée.'
        explanation: 'Tous les points du chariot ont la même trajectoire rectiligne et la même vitesse : translation rectiligne.'
      - kind: mcq
        prompt: '**Étape 2.** Pourquoi le pignon 5 tourne-t-il lui aussi à 125 tr/min par rapport au chariot ?'
        choices:
        - 'Parce qu''il est monté sur le même arbre que la roue 4 : ils forment une même classe d''équivalence'
        - Parce que tous les pignons d'un mécanisme tournent à la même vitesse
        - Parce qu'il a le même nombre de dents que la roue 4
        - Parce que la crémaillère est fixe
        answer:
        - 0
        feedback:
        - null
        - 'Non : chaque étage d''engrenage change la vitesse ; c''est le montage sur un arbre commun qui l''impose ici.'
        - 'Non : le pignon 5 a 25 dents et la roue 4 en a 72 ; ils tournent pourtant à la même vitesse car ils sont solidaires.'
        - 'Non : la crémaillère fixe explique l''avance du chariot, pas la vitesse de rotation du pignon.'
        explanation: 'Deux pièces solidaires du même arbre n''ont aucun mouvement relatif : même classe d''équivalence, donc même vitesse de rotation.'
      - kind: input
        prompt: '**Étape 3.** Convertir 125 tr/min en rad/s (2 décimales).'
        answer: '13.09'
        numeric: true
        tolerance: 0.1
        unit: rad/s
        explanation: ω = 2π × 125 ÷ 60 = 13,09 rad/s.
      - kind: input
        prompt: '**Étape 4.** Le pignon roule sans glisser sur la crémaillère fixe : la vitesse du chariot vaut V = ω × R, avec R = 10 mm = 0,010 m. Calculer V (en m/s, 3 décimales).'
        answer: '0.131'
        numeric: true
        tolerance: 0.002
        unit: m/s
        explanation: V = 13,09 × 0,010 = 0,131 m/s. Attention à convertir le rayon en mètres et la vitesse angulaire en rad/s.
      - kind: mcq
        prompt: '**Étape 5.** La mesure donne un palier à 0,125 m/s. Quel est l''écart avec la valeur calculée, et que conclure ?'
        choices:
        - 'Environ 4,7 % : l''écart est faible, le modèle est validé'
        - 'Environ 0,6 % : l''écart est négligeable'
        - 'Environ 47 % : le modèle est à revoir entièrement'
        - 'Environ 4,7 %, mais un modèle n''est acceptable que s''il donne exactement la mesure'
        answer:
        - 0
        feedback:
        - null
        - '0,006 m/s est l''écart **absolu** ; rapporté à la mesure de 0,125 m/s, il vaut 4,7 %.'
        - 'Non : erreur d''un facteur 10 ; (0,131 − 0,125) ÷ 0,125 = 0,047.'
        - 'Non : un modèle cinématique parfait ignore frottements, glissements et jeux ; moins de 5 % d''écart est un très bon accord.'
        explanation: (0,131 − 0,125) ÷ 0,125 = 4,7 %. L'écart s'explique par les frottements, un léger glissement et l'incertitude de lecture de la courbe.
      - kind: input
        prompt: '**Étape 6.** Pendant la phase d''accélération (de 0,25 s à 0,50 s), la vitesse passe de 0 à 0,125 m/s. Calculer l''accélération (en m/s², 2 décimales).'
        answer: '0.5'
        numeric: true
        tolerance: 0.02
        unit: m/s²
        explanation: a = Δv ÷ Δt = 0,125 ÷ 0,25 = 0,50 m/s².
      - kind: input
        prompt: '**Étape 7.** La course du chariot est l''aire sous la courbe de vitesse, ici un trapèze de grande base 1,25 s (de 0,25 s à 1,50 s), de petite base 0,75 s (de 0,50 s à 1,25 s) et de hauteur 0,125 m/s. Calculer cette course (en m, 3 décimales).'
        answer: '0.125'
        numeric: true
        tolerance: 0.005
        unit: m
        explanation: x = ½ × (1,25 + 0,75) × 0,125 = 0,125 m, soit 125 mm de balayage — l'ordre de grandeur d'un verre de lunettes et de son support.
      - kind: mcq
        prompt: '**Étape 8.** On remplace le pignon 5 par un pignon de rayon primitif 20 mm, à vitesse de rotation inchangée. Que devient la vitesse du chariot ?'
        choices:
