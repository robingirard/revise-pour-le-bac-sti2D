        - 'Non : les rendements se multiplient (0,89 × 0,85 × 0,70), ils ne s''additionnent pas ; un rendement est toujours inférieur à 1.'
        - 'Non : 6,9 W est bien inférieur aux 20 W disponibles.'
        explanation: η = 0,89 × 0,85 × 0,70 = 0,53 ; P e = 3,67 ÷ 0,53 = 6,9 W, soit environ un tiers de la puissance du moteur.
  - id: couple
    title: Couple, puissance, rendement
    icon: 🔋
    description: P = C × ω, conversion tr/min → rad/s, couple de sortie d'un réducteur, rendement global.
    prerequisites:
    - transmission
    lesson: lessons/couple.md
