      - 'Non : la puissance est un produit couple × vitesse.'
      - 'Non : la vitesse doit être en rad/s pour obtenir des watts.'
      - 'Non : F × d est un travail (ou un moment), pas une puissance.'
      explanation: P (W) = C (N·m) × ω (rad/s).
    - type: mcq
      level: 1
      prompt: Un élève écrit C s = η × C e × R pour un réducteur (R = 0,05). Où est l'erreur ?
      choices:
      - 'Il faut diviser par R : un réducteur augmente le couple'
      - Il faut enlever η
      - Il faut mettre R au carré
      - Il n'y a pas d'erreur
      answer: 0
      feedback:
      - null
      - 'Non : le rendement est bien un facteur multiplicatif < 1.'
      - 'Non : R intervient à la puissance 1.'
      - 'Non : avec R = 0,05 sa formule donnerait un couple 20 fois trop petit au lieu de 20 fois plus grand.'
      explanation: 'C s = η × C e ÷ R : la puissance se conserve (aux pertes près) et ω s = R × ω e, donc le couple est multiplié par 1 ÷ R.'
    - type: mcq
      level: 2
      prompt: 'Un réducteur reçoit 100 W et en restitue 80 W. Son rendement vaut :'
      choices:
      - 0,8 (80 %)
      - 1,25
      - 20 W
      - 0,2
      answer: 0
      feedback:
      - null
      - 'Non : η = P sortie ÷ P entrée, toujours ≤ 1.'
      - 'Non : 20 W sont les pertes, pas le rendement (sans unité).'
      - 'Non : 0,2 est la part perdue ; le rendement est la part restituée.'
      explanation: η = 80 ÷ 100 = 0,8.
    - type: mcq
      level: 2
      prompt: 'À couple constant, si la vitesse de rotation double, la puissance :'
      choices:
      - Double
      - Est divisée par deux
      - Ne change pas
      - Est multipliée par quatre
      answer: 0
      feedback:
      - null
      - 'Non : P = C × ω est proportionnelle à ω.'
      - 'Non : la puissance dépend de la vitesse.'
      - 'Non : P est proportionnelle à ω, pas à ω².'
      explanation: 'P = C × ω : doubler ω double P.'
    - type: guided
      level: 3
      title: 'Distributeur de savon sans contact : réduction, cadence et rendement'
      intro: 'Un distributeur de savon détecte la main de l''utilisateur et délivre une dose. Le moteur électrique (N moteur = 3 517 tr/min) entraîne une **vis sans fin 1** (Z1 = 1 filet) qui attaque la **roue 2** (Z21 = 32 dents). Sur le même arbre que cette roue, un **pignon** (Z22 = 8 dents) entraîne la **roue excentrique 3** (Z3 = 48 dents). À chaque tour de la roue excentrique, le **piston 4** fait un aller-retour et pousse une dose de savon.

        **Données** : puissance nécessaire au piston P piston = 0,13 W ; rendements : roue et vis sans fin η₁ = 0,8 ; engrenage η₂ = 0,9 ; liaison excentrique/piston η₃ = 0,7 ; liaison piston/corps η₄ = 0,9.

        {{fig:guide-savon-cinematique}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Calculer le rapport de transmission global r = (Z1 ÷ Z21) × (Z22 ÷ Z3) entre le moteur et la roue excentrique.'
        choices:
        - 1 ÷ 192
        - 1 ÷ 40
        - 1 ÷ 6
        - 1 ÷ 1 536
        answer:
        - 0
        feedback:
        - null
        - 'Non : 1/40 reviendrait à écrire Z1 ÷ (Z21 + Z22). Les deux étages ne s''additionnent pas, leurs rapports se **multiplient**.'
        - 'Non : 1/6 n''est que le second étage (8 ÷ 48) ; il faut y ajouter la réduction de la roue et vis sans fin.'
        - 'Non : le second étage vaut 8 ÷ 48 = 1/6, et non 1/48.'
        explanation: r = (1 ÷ 32) × (8 ÷ 48) = (1 ÷ 32) × (1 ÷ 6) = 1 ÷ 192. Une vis à 1 filet donne à elle seule une très forte réduction.
      - kind: input
        prompt: '**Étape 2.** En déduire la vitesse de rotation de la roue excentrique (en tr/min, 1 décimale).'
        answer: '18.3'
        numeric: true
        tolerance: 0.3
        unit: tr/min
        explanation: N₃ = 3 517 ÷ 192 = 18,3 tr/min.
      - kind: input
        prompt: '**Étape 3.** Un tour de la roue excentrique = une dose. Quelle durée sépare deux doses si le moteur tourne en continu ? (en s, 1 décimale)'
        answer: '3.3'
        numeric: true
        tolerance: 0.15
        unit: s
        explanation: T = 60 ÷ 18,3 = 3,3 s par tour.
      - kind: input
        prompt: '**Étape 4.** Calculer le rendement global de la chaîne η = η₁ × η₂ × η₃ × η₄ (2 décimales).'
        answer: '0.45'
        numeric: true
        tolerance: 0.01
        explanation: η = 0,8 × 0,9 × 0,7 × 0,9 = 0,4536 ≈ 0,45. Un rendement est sans unité.
      - kind: input
        prompt: '**Étape 5.** Quelle puissance le moteur doit-il fournir pour distribuer une dose ? (en W, 2 décimales)'
        answer: '0.29'
        numeric: true
        tolerance: 0.01
        unit: W
        explanation: P moteur = P piston ÷ η = 0,13 ÷ 0,4536 = 0,287 W ≈ 0,29 W.
      - kind: mcq
        prompt: '**Étape 6.** Pourquoi le moteur doit-il fournir plus que les 0,13 W utiles au piston ?'
        choices:
        - Parce que chaque constituant dissipe une partie de la puissance (frottements), d'où un rendement inférieur à 1
        - Parce que le moteur doit aussi recharger les piles
        - Parce que la puissance se conserve, donc 0,13 W suffiraient
        - Parce que la vitesse de rotation du moteur est élevée
        answer:
        - 0
        feedback:
        - null
        - 'Non : les piles alimentent le moteur, l''inverse n''existe pas ici.'
        - 'Non : la puissance **utile** est bien 0,13 W, mais il faut compenser les pertes en amont.'
        - 'Non : la vitesse seule ne consomme rien ; ce sont les pertes des liaisons et des engrenages qui coûtent.'
        explanation: 'P entrée = P sortie + pertes. Ici les pertes valent 0,287 − 0,13 = 0,157 W, soit plus de la moitié de la puissance absorbée : la liaison excentrique/piston (η₃ = 0,7) est le maillon le plus dissipatif.'
      - kind: input
        prompt: '**Étape 7.** Convertir la vitesse du moteur, 3 517 tr/min, en rad/s (arrondir à l''unité).'
        answer: '368'
        numeric: true
        tolerance: 3
        unit: rad/s
        explanation: ω = 2π × 3 517 ÷ 60 = 368 rad/s.
      - kind: input
        prompt: '**Étape 8.** En déduire le couple que doit fournir le moteur, C = P ÷ ω, exprimé en **milli**newton-mètre (1 mN·m = 0,001 N·m ; 2 décimales).'
        answer: '0.78'
        numeric: true
        tolerance: 0.05
        unit: mN·m
        explanation: C = 0,287 ÷ 368 = 7,8 × 10⁻⁴ N·m = 0,78 mN·m. Un très petit couple à très grande vitesse, converti par le réducteur en un couple 192 fois plus grand à basse vitesse.
