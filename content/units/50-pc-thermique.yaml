# Physique-chimie — énergie thermique (1re : ch. 5 et 6 ; Tle : ch. 5)
# Sources : docs/notes/pc-1re-cours-a.md (p. 23-27), docs/notes/pc-1re-cours-b.md (p. 28),
#           docs/notes/pc-tle-cours-a.md (p. 139-141).
units:
- id: pc-thermique
  matiere: physique
  title: 'Physique : énergie thermique'
  description: Température et agitation, chaleur massique, changements d'état, flux thermique et isolation des bâtiments.
  skills:
  - id: pc-temperature-chaleur
    title: Température et chaleur massique
    icon: 🌡️
    description: États de la matière, température et agitation, °C et K, énergie interne, Q = m × c × Δθ, conduction, convection, rayonnement.
    prerequisites: []
    lesson: lessons/pc-temperature-chaleur.md
    items:
    - type: mcq
      level: 1
      prompt: 'Que se passe-t-il quand l''**agitation des constituants microscopiques** (atomes, ions, molécules) d''un corps augmente ?


        {{fig:pc-agitation-thermique}}'
      choices:
      - Sa température augmente
      - Sa température diminue
      - Sa masse augmente
      - Son volume reste rigoureusement constant
      answer: 0
      feedback:
      - null
      - 'Non, c''est l''inverse : plus les constituants s''agitent, plus la température est élevée. Refroidir un corps, c''est ralentir cette agitation.'
      - 'Non : chauffer un corps ne change pas le nombre d''atomes qu''il contient, donc pas sa masse.'
      - 'Non : la question porte sur la **température**, seule grandeur reliée directement à l''agitation microscopique.'
      explanation: Lorsque l'agitation des constituants microscopiques augmente au sein d'un corps, alors sa température augmente.
      tags:
      - temperature
    - type: mcq
      level: 1
      prompt: Quelle est l'unité de température du **système international**, celle qu'il faut employer dans tout calcul thermodynamique ?
      choices:
      - Le kelvin (K)
      - Le degré Celsius (°C)
      - Le degré Fahrenheit (°F)
      - Le joule (J)
      answer: 0
      feedback:
      - null
      - 'Non : le degré Celsius est l''unité d''usage courant, mais l''unité du système international est le kelvin.'
      - 'Non : le degré Fahrenheit n''est utilisé que dans quelques pays, dont les États-Unis.'
      - 'Non : le joule est l''unité d''**énergie**, pas de température.'
      explanation: En sciences, tout calcul thermodynamique s'effectue en prenant comme unité du système international de température le kelvin (K).
      tags:
      - temperature
    - type: input
      level: 1
      prompt: 'Convertir une température de 25 °C en kelvin.


        {{fig:pc-echelle-temperature}}'
      answer: '298.15'
      numeric: true
      tolerance: 0.2
      unit: K
      explanation: '$T\,(\text{K}) = \theta\,(^\circ\text{C}) + 273{,}15 = 25 + 273{,}15 = 298{,}15$ K. Erreur classique : **soustraire** 273,15, ce qui donnerait −248,15 K, impossible puisque le zéro absolu (0 K) ne peut pas être franchi.'
      tags:
      - temperature
    - type: mcq
      level: 1
      prompt: 'Un transfert thermique s''effectue toujours :'
      choices:
      - du corps le plus chaud vers le corps le plus froid, jusqu'à l'équilibre thermique
      - du corps le plus froid vers le corps le plus chaud
      - du corps le plus lourd vers le corps le plus léger
      - dans les deux sens en même temps, de façon équilibrée
      answer: 0
      feedback:
      - null
      - 'Non : spontanément, l''énergie ne remonte jamais du froid vers le chaud.'
      - 'Non : la masse intervient dans la **quantité** d''énergie échangée (Q = m × c × Δθ), pas dans le **sens** du transfert.'
      - 'Non : le transfert a un sens unique tant que les températures diffèrent ; il s''arrête quand les deux corps sont à la même température.'
      explanation: Tout transfert thermique s'effectue du corps le plus chaud vers le corps le plus froid jusqu'à ce que l'équilibre thermique soit atteint.
      tags:
      - transfert
    - type: mcq
      level: 1
      prompt: 'La paroi d''une casserole transfère de l''énergie à sa poignée. De quel mode de transfert thermique s''agit-il ?


        {{fig:pc-modes-transfert}}'
      choices:
      - 'La conduction : l''énergie est transportée de proche en proche, sans déplacement de matière'
      - 'La convection : l''énergie est transportée par un mouvement de matière'
      - 'Le rayonnement : l''énergie est transportée par des ondes électromagnétiques'
      - 'Aucun : le métal ne transmet pas la chaleur'
      answer: 0
      feedback:
      - null
      - 'Non : le métal de la poignée ne se déplace pas ! La convection concerne les **gaz** et les **liquides**.'
      - 'Non : le rayonnement n''a pas besoin de milieu matériel ; ici l''énergie chemine dans la matière solide de la casserole.'
      - 'Non : au contraire, les métaux sont d''excellents conducteurs thermiques.'
      explanation: 'Conduction : l''énergie est transportée de proche en proche, sans déplacement de matière dans un milieu matériel, par agitation des particules.'
      tags:
      - transfert
    - type: mcq
      level: 1
      prompt: 'Dans une casserole d''eau chauffée par le dessous, l''eau chaude du fond monte et l''eau froide de la surface descend. De quel mode de transfert s''agit-il ?


        {{fig:pc-modes-transfert}}'
      choices:
      - La convection
      - La conduction
      - Le rayonnement
      - La sublimation
      answer: 0
      feedback:
      - null
      - 'Non : la conduction se fait **sans** déplacement de matière ; ici c''est l''eau elle-même qui circule.'
      - 'Non : le rayonnement se propage sans milieu matériel (infrarouges) ; il n''explique pas ce courant d''eau.'
      - 'Non : la sublimation est un **changement d''état** (solide → gaz), pas un mode de transfert.'
      explanation: 'Convection : l''énergie est transportée par des mouvements de la matière au sein d''un gaz ou d''un liquide. L''eau chaude, moins dense, monte.'
      tags:
      - transfert
    - type: mcq
      level: 1
      prompt: Quel mode de transfert thermique **ne nécessite pas** de milieu matériel pour se propager ?
      choices:
      - Le rayonnement thermique
      - La conduction thermique
      - La convection thermique
      - 'Aucun : un transfert thermique exige toujours de la matière'
      answer: 0
      feedback:
      - null
      - 'Non : la conduction se fait « dans un milieu matériel », par agitation des particules de proche en proche.'
      - 'Non : la convection suppose un gaz ou un liquide qui se déplace, donc de la matière.'
      - 'Non : c''est précisément par rayonnement que le Soleil chauffe la Terre à travers le vide.'
      explanation: 'Rayonnement : l''énergie est transportée par des ondes électromagnétiques, le plus souvent invisibles (infrarouges). Cela ne nécessite pas de milieu matériel.'
      tags:
      - transfert
    - type: grid
      level: 2
      prompt: 'Pour chaque mode de transfert thermique, cochez les propriétés qui le caractérisent.


        {{fig:pc-modes-transfert}}'
      rows:
      - id: cond
        label: Conduction
      - id: conv
        label: Convection
      - id: ray
        label: Rayonnement
      cols:
      - id: MAT
        label: Nécessite un milieu matériel
      - id: DEP
        label: S'accompagne d'un déplacement de matière
      answer:
      - MATcond
      - MATconv
      - DEPconv
      cellFeedback:
        MATcond: la conduction se fait bien dans un milieu matériel (mais sans déplacement de matière)
        DEPcond: la conduction se fait de proche en proche, **sans** déplacement de matière
        MATconv: 'la convection a lieu dans un gaz ou un liquide : il faut de la matière'
        DEPconv: la convection transporte l'énergie **par** le mouvement de la matière
        MATray: 'le rayonnement traverse le vide : aucun milieu matériel n''est nécessaire'
        DEPray: le rayonnement transporte des ondes électromagnétiques, pas de la matière
      explanation: 'Conduction : milieu matériel, sans déplacement de matière. Convection : milieu matériel (gaz ou liquide), avec déplacement de matière. Rayonnement : ni l''un ni l''autre.'
      tags:
      - transfert
    - type: mcq
      level: 1
      prompt: Dans quelle unité s'exprime la **capacité thermique massique** $c$ d'un corps ?
      choices:
      - J·kg⁻¹·K⁻¹
      - J·kg⁻¹
      - J
      - W
      answer: 0
      feedback:
      - null
      - 'Non : J·kg⁻¹ est l''unité de l''énergie massique de changement d''état $L$ (et du pouvoir calorifique) : il y manque le « par kelvin ».'
      - 'Non : le joule seul est une énergie ; $c$ est une énergie **par kilogramme et par kelvin**.'
      - 'Non : le watt est une puissance.'
      explanation: Dans $Q = m \times c \times \Delta\theta$, avec $Q$ en J, $m$ en kg et $\Delta\theta$ en K (ou en °C), $c$ s'exprime en J·kg⁻¹·K⁻¹.
      tags:
      - chaleur-massique
    - type: mcq
      level: 2
      prompt: Quelle relation donne l'énergie échangée par un corps qui change de température **sans changer d'état** ?
      choices:
      - $Q = m \times c \times \Delta\theta$
      - $Q = c \times \Delta\theta$
      - $Q = m \times c \times \theta_{\text{finale}}$
      - $Q = m \times L$
      answer: 0
      feedback:
      - null
      - 'Non : tu as oublié la **masse**. Chauffer 10 kg d''eau demande dix fois plus d''énergie que chauffer 1 kg.'
      - 'Non : c''est l''**écart** $\Delta\theta = \theta_{\text{finale}} - \theta_{\text{initiale}}$ qui intervient, pas la température finale seule.'
      - 'Non : $Q = m \times L$ s''utilise **pendant** un changement d''état, à température constante.'
      explanation: Tant que l'état physique d'un corps pur n'est pas modifié, il faut appliquer la relation $Q = m \times c \times \Delta\theta$.
      tags:
      - chaleur-massique
    - type: mcq
      level: 2
      prompt: Faut-il convertir les températures en kelvin pour appliquer $Q = m \times c \times \Delta\theta$ ?
      choices:
      - 'Non : un écart de température a la même valeur en °C et en K'
      - Oui, toujours, sinon le résultat est faux de 273,15
      - Oui, il faut ajouter 273,15 au résultat final
      - Cela dépend de la masse du corps
      answer: 0
      feedback:
      - null
      - 'Non : c''est une **différence** de températures. 50 °C − 20 °C = 30 °C et 323,15 K − 293,15 K = 30 K : le même nombre.'
      - 'Non : $Q$ est une énergie en joules, on n''y ajoute pas une température.'
      - 'Non : la masse n''a rien à voir avec le choix de l''échelle de température.'
      explanation: L'écart de température, qu'il soit exprimé en degrés Celsius ou en kelvin, a exactement la même valeur. En revanche, une température **absolue** (et non un écart) doit être en K.
      tags:
      - temperature
    - type: input
      level: 2
      prompt: Quel est, en kelvins, l'écart de température entre une pièce à 19 °C et l'extérieur à 4 °C ?
      answer: '15'
      numeric: true
      tolerance: 0.5
      unit: K
      explanation: '19 − 4 = 15 °C, soit **15 K** : un écart de température a la même valeur dans les deux échelles. Erreur classique : convertir chaque température (292,15 K et 277,15 K) puis se tromper dans la soustraction — le résultat est identique.'
      tags:
      - temperature
    - type: input
      level: 2
      prompt: 'Quelle énergie faut-il fournir pour chauffer $m = 2{,}0$ kg d''eau liquide de 20 °C à 50 °C ?

        Donnée : $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹.'
      answer: '252000'
      numeric: true
      tolerance: 1000
      unit: J
      explanation: '$Q = m \times c \times \Delta\theta = 2{,}0 \times 4\,200 \times (50 - 20) = 252\,000$ J, soit 252 kJ. Erreurs classiques : oublier de convertir $c$ en J·kg⁻¹·°C⁻¹, ou utiliser 50 au lieu de l''écart 30 (on trouverait 420 kJ).'
      tags:
      - chaleur-massique
    - type: input
      level: 2
      prompt: 'Un ballon reçoit $Q = 84$ kJ, ce qui élève la température de l''eau qu''il contient de 10 °C. Quelle masse d''eau contient-il ?

        Donnée : $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹.'
      answer: '2'
      numeric: true
      tolerance: 0.1
      unit: kg
      explanation: '$m = \dfrac{Q}{c \times \Delta\theta} = \dfrac{84\,000}{4\,200 \times 10} = 2{,}0$ kg. Erreur classique : multiplier au lieu de diviser.'
      tags:
      - chaleur-massique
    - type: mcq
      level: 2
      prompt: Une casserole d'eau chaude refroidit en cédant de l'énergie à la pièce. Que peut-on dire de $Q$ pour l'eau ?
      choices:
      - '$Q < 0$ : l''eau cède de l''énergie, sa température finale est inférieure à sa température initiale'
      - '$Q > 0$ : l''eau reçoit de l''énergie'
      - '$Q = 0$ : il n''y a pas d''échange puisque rien ne bouge'
      - Le signe de $Q$ n'a aucune signification physique
      answer: 0
      feedback:
      - null
      - 'Non : c''est la **pièce** qui reçoit de l''énergie ; pour l''eau, l''énergie échangée est négative.'
      - 'Non : le transfert a bien lieu, du corps chaud (l''eau) vers le corps froid (l''air de la pièce).'
      - 'Non : le signe indique le **sens** du transfert, c''est une information essentielle.'
      explanation: 'Si $\theta_{\text{finale}} < \theta_{\text{initiale}}$, alors $\Delta\theta < 0$ donc $Q = m\,c\,\Delta\theta < 0$ : le corps **cède** de l''énergie.'
      tags:
      - chaleur-massique
    - type: input
      level: 3
      prompt: 'On fournit $Q = 63$ kJ à $m = 0{,}50$ kg d''eau liquide. De combien sa température s''élève-t-elle ?

        Donnée : $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹.'
      answer: '30'
      numeric: true
      tolerance: 0.5
      unit: °C
      explanation: '$\Delta\theta = \dfrac{Q}{m \times c} = \dfrac{63\,000}{0{,}50 \times 4\,200} = \dfrac{63\,000}{2\,100} = 30$ °C. C''est une **élévation** de température : si l''eau partait de 15 °C, elle atteindrait 45 °C.'
      tags:
      - chaleur-massique
    - type: mcq
      level: 3
      prompt: On fournit la **même** énergie à 1,0 kg de glace ($c = 2{,}1$ kJ·kg⁻¹·K⁻¹) et à 1,0 kg d'eau liquide ($c = 4{,}2$ kJ·kg⁻¹·°C⁻¹), sans changement d'état. Que peut-on dire ?
      choices:
      - La glace s'échauffe deux fois plus que l'eau liquide
      - L'eau liquide s'échauffe deux fois plus que la glace
      - Les deux s'échauffent autant
      - On ne peut pas comparer, les unités sont différentes
      answer: 0
      feedback:
      - null
      - 'Non : à énergie et masse égales, $\Delta\theta = Q / (m\,c)$ est d''autant plus **grand** que $c$ est **petit**. Or $c$ est plus petit pour la glace.'
      - 'Non : les capacités thermiques massiques valent 2,1 et 4,2, elles diffèrent d''un facteur 2.'
      - 'Non : kJ·kg⁻¹·K⁻¹ et kJ·kg⁻¹·°C⁻¹ ont la **même valeur numérique**, puisqu''un écart de 1 K vaut un écart de 1 °C.'
      explanation: '$\Delta\theta = \dfrac{Q}{m \times c}$ : $c$ deux fois plus petit ⇒ élévation de température deux fois plus grande. L''eau liquide est un excellent « réservoir » de chaleur, ce qui explique son emploi dans les circuits de chauffage.'
      tags:
      - chaleur-massique
    - type: input
      level: 3
      prompt: 'Un chauffe-eau porte $m = 150$ kg d''eau liquide de 15 °C à 65 °C. Quelle énergie thermique l''eau reçoit-elle, en mégajoules ?

        Donnée : $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹.'
      answer: '31.5'
      numeric: true
      tolerance: 0.3
      unit: MJ
      explanation: '$Q = 150 \times 4\,200 \times (65 - 15) = 150 \times 4\,200 \times 50 = 3{,}15 \times 10^{7}$ J $= 31{,}5$ MJ ($1$ MJ $= 10^{6}$ J). $Q > 0$ : l''eau reçoit de l''énergie.'
      tags:
      - chaleur-massique
    - type: order
      level: 3
      prompt: Classez ces températures de la **plus froide** à la **plus chaude**.
      steps:
      - 0 K (zéro absolu)
      - −39 °C (fusion du mercure)
      - 250 K
      - 0 °C (fusion de l'eau)
      - 100 °C (ébullition de l'eau)
      explanation: 'Conversion en kelvins : 0 K ; −39 °C = 234,15 K ; 250 K ; 0 °C = 273,15 K ; 100 °C = 373,15 K. Le piège : comparer un nombre en °C à un nombre en K sans convertir.'
      tags:
      - temperature
    - type: guided
      level: 3
      title: 'La bouilloire électrique : mesurer la capacité thermique de l''eau'
      intro: 'On verse $m = 1{,}00$ kg d''eau dans une bouilloire **très bien isolée thermiquement**. Sa résistance chauffante, de résistance $R = 40\ \Omega$, est alimentée par le réseau ($U_{\text{eff}} = 230$ V). On enregistre la température $\theta$ de l''eau au cours du temps.


        Le relevé est une **droite** partant de $\theta_i = 20$ °C à $t = 0$ s et atteignant 100 °C à $t = 250$ s, suivie d''un **palier** à 100 °C.


        Objectif : retrouver expérimentalement la capacité thermique massique de l''eau, dont la valeur tabulée est $c = 4\,200$ J·kg⁻¹·K⁻¹.


        {{fig:guide-bouilloire-courbe}}'
      steps:
      - kind: input
        prompt: '**Étape 1.** Calculer la puissance électrique dissipée par la résistance chauffante (1 décimale).'
        answer: '1322.5'
        numeric: true
        tolerance: 10
        unit: W
        explanation: $P = \dfrac{U_{\text{eff}}^{2}}{R} = \dfrac{230^{2}}{40} = \dfrac{52\,900}{40} = 1\,322{,}5$ W, soit environ 1,3 kW.
      - kind: mcq
        prompt: '**Étape 2.** Quelle égalité traduit l''hypothèse « bouilloire très bien isolée thermiquement » ?'
        choices:
        - '$P \times t = m \times c \times (\theta - \theta_i)$ : toute l''énergie électrique est transférée à l''eau'
        - $P \times t = m \times c \times \theta$
        - $P = m \times c \times (\theta - \theta_i)$
        - $P \times t = \dfrac{m \times c}{\theta - \theta_i}$
        answer:
        - 0
        feedback:
        - null
        - 'Non : c''est l''**écart** de température $\theta - \theta_i$ qui intervient, pas la température atteinte.'
        - 'Non : les deux membres n''ont pas la même unité — une puissance (W) à gauche, une énergie (J) à droite.'
        - 'Non : $Q = m\,c\,\Delta\theta$ est un **produit**. En divisant, l''énergie diminuerait quand l''échauffement augmente.'
        explanation: Sans pertes, l'énergie électrique reçue $E = P \times t$ est intégralement convertie en énergie thermique reçue par l'eau, $Q = m\,c\,(\theta - \theta_i)$.
      - kind: input
        prompt: '**Étape 3.** Déterminer le coefficient directeur $a$ de la partie linéaire du relevé, en °C·s⁻¹ (2 décimales).'
        answer: '0.32'
        numeric: true
        tolerance: 0.02
        unit: °C·s⁻¹
        explanation: '$a = \dfrac{100 - 20}{250 - 0} = \dfrac{80}{250} = 0{,}32$ °C·s⁻¹ : l''eau gagne environ un tiers de degré par seconde.'
      - kind: mcq
        prompt: '**Étape 4.** En écrivant l''égalité de l''étape 2 sous la forme $\theta = a \times t + b$, que valent $a$ et $b$ ?'
        choices:
        - $a = \dfrac{U^{2}}{R\,m\,c}$ et $b = \theta_i$
        - $a = \theta_i$ et $b = \dfrac{U^{2}}{R\,m\,c}$
        - $a = \dfrac{R\,m\,c}{U^{2}}$ et $b = 0$
        - $a = m\,c$ et $b = \theta_i$
        answer:
        - 0
        feedback:
        - null
        - 'Non : $b$ est l''ordonnée à l''origine, c''est-à-dire la température à $t = 0$, donc $\theta_i$.'
        - 'Non : c''est l''inverse. En isolant $\theta$, le facteur de $t$ est $\dfrac{U^{2}}{R\,m\,c}$, et la droite ne passe pas par l''origine.'
        - 'Non : $a$ doit s''exprimer en °C·s⁻¹ ; $m\,c$ s''exprime en J·K⁻¹.'
        explanation: 'De $\dfrac{U^{2}}{R}\,t = m\,c\,(\theta - \theta_i)$ on tire $\theta = \dfrac{U^{2}}{R\,m\,c}\,t + \theta_i$ : le coefficient directeur contient $c$, l''ordonnée à l''origine vaut $\theta_i = 20$ °C, ce que confirme le relevé.'
      - kind: input
        prompt: '**Étape 5.** En déduire la valeur expérimentale de la capacité thermique massique de l''eau (3 chiffres significatifs).'
        answer: '4130'
        numeric: true
        tolerance: 100
        unit: J·kg⁻¹·K⁻¹
        explanation: '$c = \dfrac{U^{2}}{R\,m\,a} = \dfrac{P}{m\,a} = \dfrac{1\,322{,}5}{1{,}00 \times 0{,}32} = 4{,}13 \times 10^{3}$ J·kg⁻¹·K⁻¹.'
      - kind: mcq
        prompt: '**Étape 6.** Comparer cette valeur à la valeur tabulée $c = 4\,200$ J·kg⁻¹·K⁻¹. Que conclure ?'
        choices:
        - L'écart relatif vaut environ 1,6 % ; la méthode est validée
        - L'écart relatif vaut environ 16 % ; la méthode n'est pas valable
        - La mesure est exacte, l'écart est nul
        - L'écart est trop grand pour conclure, il faudrait connaître la masse d'eau
        answer:
        - 0
        feedback:
        - null
        - 'Non, erreur de puissance de dix : $\dfrac{4\,200 - 4\,130}{4\,200} = 0{,}016$, soit 1,6 %.'
        - 'Non : la valeur trouvée, $4{,}13 \times 10^{3}$, diffère de $4\,200$ — mais de très peu.'
        - 'Non : la masse d''eau est donnée ($1{,}00$ kg) et intervient déjà dans le calcul.'
        explanation: '$\dfrac{4\,200 - 4\,130}{4\,200} \approx 1{,}6$ %. Un tel écart s''explique par la précision de la lecture graphique et par les pertes résiduelles de la bouilloire.'
      - kind: input
        prompt: '**Étape 7.** Quelle énergie électrique la bouilloire a-t-elle consommée pour amener l''eau de 20 °C à 100 °C ? Répondre en kilojoules (arrondir à l''unité).'
        answer: '331'
        numeric: true
        tolerance: 5
        unit: kJ
        explanation: '$E = P \times \Delta t = 1\,322{,}5 \times 250 = 3{,}31 \times 10^{5}$ J $= 331$ kJ. Vérification par l''eau : $Q = 1{,}00 \times 4\,130 \times 80 = 3{,}30 \times 10^{5}$ J. Les deux voies concordent.'
      - kind: mcq
        prompt: '**Étape 8.** Si la bouilloire n''était pas parfaitement isolée, la valeur trouvée pour $c$ serait :'
        choices:
        - surestimée, car le chauffage serait plus lent ($a$ plus petit) pour la même puissance
        - sous-estimée, car une partie de l'énergie n'atteindrait pas l'eau
        - inchangée, car les pertes concernent la bouilloire et non l'eau
        - impossible à calculer
        answer:
        - 0
        feedback:
        - null
        - 'Attention au sens : le calcul attribue à l''eau **toute** l''énergie $P\,t$. En surestimant l''énergie reçue par l''eau, on surestime $c$.'
        - 'Non : des pertes ralentissent l''échauffement de l''eau, donc modifient $a$ et le résultat.'
        - 'Non : la relation $c = \dfrac{P}{m\,a}$ reste utilisable, elle donne simplement un résultat biaisé.'
        explanation: Avec des pertes, l'eau reçoit moins que $P \times t$, elle s'échauffe plus lentement, donc $a$ diminue ; comme $c = \dfrac{P}{m\,a}$, la valeur calculée augmente. C'est bien pour cela que l'énoncé précise « très bien isolée ».
  - id: pc-changements-etat
    title: Changements d'état et bilans
    icon: 🧊
    description: Fusion, vaporisation, sublimation, chaleur latente Q = m × L, paliers de température et bilan énergétique d'un chauffage.
