        - 'Non : les conductivités ne s''additionnent pas ; ici, ce sont déjà des résistances thermiques qui sont fournies.'
        - 'Non : même faibles, les autres couches ajoutent 0,506 m²·K·W⁻¹ au total, soit 8,6 % de la résistance.'
        - 'Non : les couches sont traversées par le **même** flux (association en série) : leurs résistances s''ajoutent, elles ne se moyennent pas.'
        explanation: '$R_{\text{th, paroi}} = \sum \dfrac{e}{\lambda}$ : les couches accolées sont en série.'
      - kind: input
        prompt: '**Étape 2.** Calculer la résistance thermique $R_{\text{th}}$ de 1 m² de toiture.'
        answer: '5.906'
        numeric: true
        tolerance: 0.01
        unit: m²·K·W⁻¹
        explanation: $R_{\text{th}} = 0{,}003 + 0{,}333 + 0{,}130 + 5{,}400 + 0{,}040 = 5{,}906$ m²·K·W⁻¹.
      - kind: input
        prompt: '**Étape 3.** Calculer le flux thermique $\Phi$ traversant la toiture (arrondir à l''unité).'
        answer: '152'
        numeric: true
        tolerance: 2
        unit: W
        explanation: '$\Phi = \dfrac{S \times (T_{\text{chaud}} - T_{\text{froid}})}{R_{\text{th}}} = \dfrac{60 \times (19 - 4)}{5{,}906} = \dfrac{900}{5{,}906} \approx 152$ W. Inutile de convertir en kelvins : l''écart de 15 °C vaut 15 K.'
      - kind: mcq
        prompt: '**Étape 4.** Exigences d''isolation du toit : RT 2005 → 5,0 ; « basse énergie » → 6,7 ; « très basse énergie » → 10 (en m²·K·W⁻¹). Cette toiture est-elle conforme ?'
        choices:
        - Elle respecte la RT 2005, mais ni le niveau « basse énergie » ni le « très basse énergie »
        - Elle respecte les trois niveaux
        - Elle ne respecte aucun niveau
        - Elle respecte les niveaux « basse énergie » et « très basse énergie », mais pas la RT 2005
        answer:
        - 0
        feedback:
        - null
        - 'Non : 5,906 < 6,7, le niveau « basse énergie » n''est pas atteint.'
