    - type: guided
      level: 3
      title: Le super-congélateur à vaccins
      intro: 'Certains vaccins doivent être conservés à **−80 °C**, alors que la température ambiante du local vaut **20 °C**. On utilise pour cela un super-congélateur.


        Son **cycle frigorifique** fait circuler du propane : le fluide se vaporise dans l''évaporateur, placé à l''intérieur de l''enceinte ; il est ensuite comprimé à l''état gazeux ; il se liquéfie dans le condenseur, au contact de l''air extérieur ; enfin un détendeur ramène sa pression à la pression atmosphérique avant son retour à l''évaporateur.


        Données : $L_{\text{vaporisation}}$(propane) $= 426$ kJ·kg⁻¹ ; masse de propane vaporisée en un cycle : 100 g ; air intérieur : 750 g, $c_{\text{air}} = 1{,}0$ kJ·kg⁻¹·K⁻¹, initialement à 20 °C ; parois : surface $S = 10$ m², épaisseur $e = 10$ cm, conductivité thermique globale $\lambda = 0{,}0050$ W·m⁻¹·K⁻¹.


        {{fig:guide-cycle-frigorifique}}'
      steps:
      - kind: order
        prompt: '**Étape 1.** Remettez dans l''ordre les quatre organes traversés par le fluide frigorigène, en partant de l''intérieur de l''enceinte.'
        steps:
        - L'évaporateur — le fluide passe de l'état liquide à l'état gazeux
        - Le compresseur — la pression du gaz augmente
        - Le condenseur — le fluide redevient liquide au contact de l'air extérieur
        - Le détendeur — la pression redescend à la pression atmosphérique
        explanation: Le fluide décrit une boucle fermée. Il prélève de l'énergie **à l'intérieur** (évaporateur) et la rejette **à l'extérieur** (condenseur) ; le compresseur et le détendeur pilotent la pression, donc les températures de changement d'état.
      - kind: mcq
        prompt: '**Étape 2.** Dans l''évaporateur, le fluide passe de l''état liquide à l''état gazeux. Quel est l''effet sur l''air intérieur du congélateur ?'
        choices:
        - La vaporisation est endothermique, le fluide prélève de l'énergie à l'air intérieur, qui se refroidit
        - La vaporisation est exothermique, le fluide cède de l'énergie à l'air intérieur, qui se réchauffe
        - Aucun échange, puisque la température du fluide reste constante
        - Le fluide prélève de l'énergie, mais à l'air extérieur
        answer:
        - 0
        feedback:
        - null
        - 'Non : c''est la **liquéfaction** qui est exothermique. Elle a lieu dans le condenseur, à l''extérieur.'
        - 'Non : un changement d''état se fait à température constante, mais met en jeu une énergie $Q_p = m \times L$.'
        - 'Non : l''évaporateur est placé à l''intérieur de l''enceinte ; c''est bien l''air intérieur qui est refroidi.'
        explanation: 'Vaporiser un corps demande de l''énergie ($Q_p > 0$) : cette énergie est prélevée à l''air de l''enceinte, dont la température baisse. C''est le principe de tout réfrigérateur.'
      - kind: input
        prompt: '**Étape 3.** Calculer l''énergie absorbée par la vaporisation de 100 g de propane. Répondre en kilojoules (1 décimale).'
        answer: '42.6'
        numeric: true
        tolerance: 0.5
        unit: kJ
        explanation: $Q_p = m \times L_{\text{vaporisation}} = 0{,}100 \times 426 = 42{,}6$ kJ, soit $4{,}26 \times 10^{4}$ J.
      - kind: input
        prompt: '**Étape 4.** Cette énergie est prélevée aux 750 g d''air de l''enceinte. Quelle baisse de température peut-elle provoquer (1 décimale) ?'
        answer: '56.8'
