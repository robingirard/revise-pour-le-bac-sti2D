      - 'Non : la solidification est le passage **liquide → solide**, le sens inverse.'
      - 'Non : la vaporisation est le passage **liquide → gaz**.'
      - 'Non : la sublimation est le passage direct **solide → gaz**.'
      explanation: Sur le diagramme, la flèche bleue solide → liquide porte le nom **fusion**. Pour l'eau, elle a lieu à 0 °C sous pression atmosphérique normale.
      tags:
