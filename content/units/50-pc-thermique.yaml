    - type: mcq
      level: 1
      prompt: Dans quelle unité s'exprime l'**énergie massique de changement d'état** $L$ ?
      choices:
      - J·kg⁻¹
      - J·kg⁻¹·K⁻¹
      - J
      - K
      answer: 0
      feedback:
      - null
      - 'Non : J·kg⁻¹·K⁻¹ est l''unité de la **capacité thermique massique** $c$. Il n''y a pas de « par kelvin » dans $L$, puisque la température ne varie pas !'
      - 'Non : le joule seul est une énergie ; $L$ est une énergie **par kilogramme**.'
      - 'Non : le kelvin est une température.'
      explanation: Dans $Q_p = m \times L$, avec $Q_p$ en J et $m$ en kg, $L$ est en J·kg⁻¹. Les valeurs de l'eau sont tabulées en kJ·kg⁻¹.
      tags:
      - chaleur-latente
    - type: order
      level: 1
      prompt: 'Remettez dans l''ordre les **cinq étapes** du chauffage d''une masse $m$ d''un corps pur initialement solide.


        {{fig:pc-courbe-chauffage-eau}}'
      steps:
      - '❶ Échauffement du solide : $Q_1 = m\,c_{\text{solide}}\,(\theta_{\text{Fusion}} - \theta_1)$'
      - '❷ Palier de fusion : $Q_2 = m\,L_{\text{Fusion}}$'
      - '❸ Échauffement du liquide : $Q_3 = m\,c_{\text{liquide}}\,(\theta_{\text{Ébullition}} - \theta_{\text{Fusion}})$'
      - '❹ Palier d''ébullition : $Q_4 = m\,L_{\text{Vaporisation}}$'
      - '❺ Échauffement du gaz : $Q_5 = m\,c_{\text{gaz}}\,(\theta_2 - \theta_{\text{Ébullition}})$'
      explanation: L'ordre est solide → fusion → liquide → ébullition → gaz. L'énergie totale vaut $Q = Q_1 + Q_2 + Q_3 + Q_4 + Q_5$.
      tags:
      - bilan
    - type: grid
      level: 2
      prompt: 'On chauffe de la glace de −20 °C jusqu''à la vapeur d''eau. Pour chaque étape, cochez la relation à utiliser.


        {{fig:pc-courbe-chauffage-eau}}'
      rows:
      - id: s
        label: Échauffement de la glace de −20 °C à 0 °C
      - id: f
        label: Fusion de la glace à 0 °C
      - id: l
        label: Échauffement de l'eau liquide de 0 °C à 100 °C
      - id: v
        label: Vaporisation de l'eau à 100 °C
      cols:
      - id: C
        label: Q = m × c × Δθ
      - id: L
        label: Q = m × L
      answer:
      - Cs
      - Lf
      - Cl
      - Lv
      cellFeedback:
        Cs: l'échauffement de la glace de −20 °C à 0 °C se calcule avec m × c_glace × Δθ
        Ls: 'la glace s''échauffe sans changer d''état : c''est bien m × c × Δθ qu''il faut employer'
        Cf: 'pendant la fusion, Δθ = 0 : la relation m × c × Δθ donnerait 0, ce qui est faux'
        Lf: 'la fusion se produit à température constante : Q = m × L_fusion'
        Cl: l'échauffement de l'eau liquide de 0 °C à 100 °C se calcule avec m × c_eau × Δθ
        Ll: 'l''eau liquide s''échauffe sans changer d''état : c''est m × c × Δθ qu''il faut employer'
        Cv: 'pendant la vaporisation, la température reste à 100 °C : il faut m × L'
        Lv: 'la vaporisation se produit à température constante : Q = m × L_vaporisation'
      explanation: 'Règle à retenir : tant que l''état physique n''est pas modifié, $Q = m\,c\,\Delta\theta$ ; **pendant** un changement d''état, $Q_p = m\,L$.'
      tags:
      - bilan
    - type: mcq
      level: 2
      prompt: Un élève calcule l'énergie nécessaire pour faire fondre de la glace **déjà à 0 °C** avec $Q = m \times c \times \Delta\theta$. Que trouve-t-il, et pourquoi est-ce faux ?
      choices:
      - Il trouve 0 J, car $\Delta\theta = 0$ ; pendant un changement d'état il faut utiliser $Q_p = m \times L$
      - Il trouve la bonne valeur, les deux relations sont équivalentes
      - Il trouve une valeur trop grande, il faut diviser par $L$
      - 'Il trouve 0 J, ce qui est correct : la fusion ne coûte pas d''énergie'
      answer: 0
      feedback:
      - null
      - 'Non : elles ne sont pas équivalentes. $c$ et $L$ n''ont même pas la même unité (J·kg⁻¹·K⁻¹ contre J·kg⁻¹).'
      - 'Non : le calcul donne exactement zéro, puisque la température de départ et d''arrivée sont toutes deux 0 °C.'
      - 'Non : faire fondre 1 kg de glace coûte 334 kJ, ce qui est loin d''être négligeable.'
      explanation: 'Pendant un palier, $\Delta\theta = 0$ : la relation $m\,c\,\Delta\theta$ donne 0 et il faut lui substituer $Q_p = m \times L$.'
      tags:
      - chaleur-latente
    - type: input
      level: 2
      prompt: 'Quelle énergie faut-il fournir pour faire fondre $m = 0{,}50$ kg de glace **déjà à 0 °C** ?

        Donnée : $L_{\text{fusion}} = 334$ kJ·kg⁻¹.'
      answer: '167'
      numeric: true
      tolerance: 1
      unit: kJ
      explanation: '$Q_p = m \times L_{\text{fusion}} = 0{,}50 \times 334 = 167$ kJ. $Q_p > 0$ : la fusion est **endothermique**, la glace reçoit de l''énergie et l''état final est plus désordonné.'
      tags:
      - chaleur-latente
    - type: input
      level: 2
      prompt: 'Quelle énergie faut-il fournir pour vaporiser $m = 1{,}0$ kg d''eau **déjà à 100 °C** ?

        Donnée : $L_{\text{vaporisation}} = 2{,}26 \times 10^{3}$ kJ·kg⁻¹.'
      answer: '2260'
      numeric: true
      tolerance: 10
      unit: kJ
      explanation: '$Q_p = m \times L_{\text{vaporisation}} = 1{,}0 \times 2\,260 = 2\,260$ kJ, soit 2,26 MJ. C''est près de sept fois l''énergie de fusion (334 kJ·kg⁻¹) : les changements d''état, et la vaporisation en particulier, sont très « coûteux » en énergie.'
      tags:
      - chaleur-latente
    - type: input
      level: 2
      prompt: 'On dispose de 66,8 kJ pour faire fondre de la glace à 0 °C. Quelle masse de glace peut-on fondre ?

        Donnée : $L_{\text{fusion}} = 334$ kJ·kg⁻¹.'
      answer: '0.2'
      numeric: true
      tolerance: 0.01
      unit: kg
      explanation: '$m = \dfrac{Q_p}{L_{\text{fusion}}} = \dfrac{66{,}8}{334} = 0{,}20$ kg, soit 200 g. Erreur classique : multiplier (66,8 × 334 = 22 311) au lieu de diviser.'
      tags:
      - chaleur-latente
    - type: mcq
      level: 2
      prompt: Sachant que $L_{\text{fusion}} = 334$ kJ·kg⁻¹ pour l'eau, que vaut $L_{\text{solidification}}$ ?
      choices:
      - −334 kJ·kg⁻¹
      - +334 kJ·kg⁻¹
      - 0 kJ·kg⁻¹
      - $1/334$ kJ·kg⁻¹
      answer: 0
      feedback:
      - null
      - 'Non : la solidification est le changement d''état **inverse** de la fusion ; l''eau **cède** de l''énergie, donc $Q_p < 0$.'
      - 'Non : il faut bel et bien retirer de l''énergie à l''eau pour la geler.'
      - 'Non : on change le signe, on ne prend pas l''inverse.'
      explanation: 'On en déduit les autres très facilement (exemple : $L_{\text{solidification}} = -L_{\text{fusion}}$). La solidification est **exothermique** : état final plus ordonné.'
      tags:
      - chaleur-latente
    - type: mcq
      level: 2
      prompt: Parmi ces changements d'état, lequel est **exothermique** (le corps pur cède de l'énergie, $Q_p < 0$) ?
      choices:
      - La condensation (liquéfaction) de la vapeur d'eau
      - La fusion de la glace
      - La vaporisation de l'eau
      - La sublimation de la glace
      answer: 0
      feedback:
      - null
      - 'Non : pour fondre, la glace **reçoit** de l''énergie ; l''état final (liquide) est plus désordonné : transformation endothermique.'
      - 'Non : la vaporisation demande 2 260 kJ par kilogramme : c''est endothermique.'
      - 'Non : la sublimation mène à l''état le plus désordonné (gaz) : elle est endothermique.'
      explanation: '$Q_p$ est négative lorsque le corps pur cède de l''énergie (transformation exothermique, avec un état final plus ordonné). Gaz → liquide : l''état final est plus ordonné.'
      tags:
      - changement-etat
    - type: mcq
      level: 2
      prompt: Le mercure a une température de fusion de −39 °C et une température d'ébullition de 357 °C. Dans quel état est-il à 20 °C, sous pression atmosphérique normale ?
      choices:
      - Liquide
      - Solide
      - Gazeux
      - Moitié solide, moitié liquide
      answer: 0
      feedback:
      - null
      - 'Non : à 20 °C on est **au-dessus** de la température de fusion (−39 °C), le mercure a déjà fondu.'
      - 'Non : il faudrait dépasser 357 °C pour le vaporiser.'
      - 'Non : la coexistence de deux états n''a lieu que **pendant** un palier, donc à −39 °C exactement pour la fusion.'
      explanation: 'Entre la température de fusion (−39 °C) et celle d''ébullition (357 °C), le corps pur est **liquide** : c''est le cas du mercure à 20 °C.'
      tags:
      - changement-etat
    - type: input
      level: 3
      prompt: 'Quelle énergie faut-il pour porter $m = 0{,}50$ kg de glace de −20 °C à de l''eau liquide à 20 °C ?

        Données : $c_{\text{glace}} = 2{,}1$ kJ·kg⁻¹·K⁻¹ ; $L_{\text{fusion}} = 334$ kJ·kg⁻¹ ; $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹.'
      answer: '230'
      numeric: true
      tolerance: 3
      unit: kJ
      explanation: 'Trois étapes : $Q_1 = 0{,}50 \times 2{,}1 \times 20 = 21$ kJ ; $Q_2 = 0{,}50 \times 334 = 167$ kJ ; $Q_3 = 0{,}50 \times 4{,}2 \times 20 = 42$ kJ. Total $Q = 21 + 167 + 42 = 230$ kJ. Erreur classique : oublier $Q_2$ (on trouverait 63 kJ), alors que la fusion représente à elle seule 73 % du total.'
      tags:
      - bilan
    - type: input
      level: 3
      prompt: 'Quelle énergie totale faut-il pour porter $m = 1{,}0$ kg de glace de −20 °C à de la vapeur d''eau à 120 °C ?

        Données : $c_{\text{glace}} = 2{,}1$ kJ·kg⁻¹·K⁻¹ ; $L_{\text{fusion}} = 334$ kJ·kg⁻¹ ; $c_{\text{eau liquide}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹ ; $L_{\text{vaporisation}} = 2{,}26$ MJ·kg⁻¹ ; $c_{\text{vapeur}} = 2{,}0$ kJ·kg⁻¹·°C⁻¹.


        {{fig:pc-courbe-chauffage-eau}}'
      answer: '3096'
      numeric: true
      tolerance: 20
      unit: kJ
      explanation: $Q_1 = 1{,}0 \times 2{,}1 \times 20 = 42$ ; $Q_2 = 1{,}0 \times 334 = 334$ ; $Q_3 = 1{,}0 \times 4{,}2 \times 100 = 420$ ; $Q_4 = 1{,}0 \times 2\,260 = 2\,260$ ; $Q_5 = 1{,}0 \times 2{,}0 \times 20 = 40$ (en kJ). Total $Q = 3\,096$ kJ, soit environ 3,10 MJ.
      tags:
      - bilan
    - type: mcq
      level: 3
      prompt: Dans le bilan précédent ($Q = 3\,096$ kJ pour aller de la glace à −20 °C à la vapeur à 120 °C), quelle part représentent les **deux changements d'état** ($Q_2 = 334$ kJ et $Q_4 = 2\,260$ kJ) ?
      choices:
      - Environ 84 % du total
      - Environ 16 % du total
      - Environ 50 % du total
      - Moins de 10 % du total
      answer: 0
      feedback:
      - null
      - 'Non : 16 % est la part des trois **échauffements** ($42 + 420 + 40 = 502$ kJ).'
      - 'Non : les changements d''état pèsent bien plus que la moitié du bilan.'
      - 'Non : à eux seuls, $Q_2 + Q_4 = 2\,594$ kJ, à comparer aux 3 096 kJ du total.'
      explanation: $\dfrac{334 + 2\,260}{3\,096} = \dfrac{2\,594}{3\,096} = 0{,}838$, soit **84 %**. Oublier les termes de changement d'état est l'erreur qui coûte le plus cher dans un bilan énergétique.
      tags:
      - bilan
    - type: mcq
      level: 3
      prompt: Un tableau donne, pour l'eau, $L_{\text{fusion}} = 334$ kJ·kg⁻¹, $L_{\text{vaporisation}} = 2{,}26 \times 10^{3}$ kJ·kg⁻¹ et $L_{\text{sublimation}} = 2{,}83 \times 10^{3}$ kJ·kg⁻¹. Or $334 + 2\,260 = 2\,594$ kJ·kg⁻¹, et non 2 830. Qu'en conclure ?
      choices:
      - 'Les trois valeurs ne sont pas données à la même température : elles ne sont pas mutuellement cohérentes'
      - 'Le tableau est juste : la sublimation coûte forcément plus que la somme des deux autres'
      - $L_{\text{fusion}}$ est fausse, elle devrait valoir 570 kJ·kg⁻¹
      - La différence vient de l'arrondi des valeurs
      answer: 0
      feedback:
      - null
      - 'Non : passer du solide au gaz directement ou en passant par le liquide met en jeu la même énergie, à température égale.'
      - 'Non : $L_{\text{fusion}} = 334$ kJ·kg⁻¹ est la valeur usuelle pour l''eau à 0 °C.'
      - 'Non : l''écart vaut 236 kJ·kg⁻¹, soit 9 % — bien trop pour un arrondi.'
      explanation: 'L''énergie de vaporisation dépend de la température (environ 2 500 kJ·kg⁻¹ à 0 °C contre 2 260 kJ·kg⁻¹ à 100 °C). En prenant les valeurs à 0 °C, $334 + 2\,500 \approx 2\,830$ kJ·kg⁻¹ : le tableau devient cohérent. Toujours vérifier à quelle température une donnée est tabulée.'
      tags:
      - chaleur-latente
    - type: guided
      level: 3
      title: 'L''eau des pâtes : chauffer, puis faire bouillir'
      intro: 'Avant de cuire des pâtes, il faut porter **2,0 L d''eau** de 16 °C à 100 °C. On utilise une plaque à induction de puissance $P = 3{,}0$ kW.


        Données : masse volumique de l''eau $\rho = 1{,}0$ kg·L⁻¹ ; $c_{\text{eau}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹ ; $L_{\text{vaporisation}} = 2{,}26 \times 10^{3}$ kJ·kg⁻¹.


        {{fig:pc-courbe-chauffage-eau}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Quelle masse d''eau la casserole contient-elle ?'
        choices:
        - 2,0 kg
        - 2,0 g
        - 0,50 kg
        - On ne peut pas le savoir sans connaître la température
        answer:
        - 0
        feedback:
        - null
        - 'Non : $m = \rho \times V = 1{,}0 \times 2{,}0 = 2{,}0$ kg, soit 2 000 g.'
        - 'Non : $0{,}50$ kg correspondrait à $V/4$. Ici $m = \rho V$, avec $\rho = 1{,}0$ kg·L⁻¹.'
        - 'Non : la masse volumique de l''eau liquide varie très peu avec la température ; on la prend égale à 1,0 kg·L⁻¹.'
        explanation: '$m = \rho \times V = 1{,}0 \times 2{,}0 = 2{,}0$ kg. Retenir le repère : 1 L d''eau ↔ 1 kg.'
      - kind: input
        prompt: '**Étape 2.** Calculer l''énergie thermique nécessaire pour porter cette eau de 16 °C à 100 °C. Répondre en kilojoules (arrondir à l''unité).'
        answer: '706'
        numeric: true
        tolerance: 8
        unit: kJ
        explanation: '$Q = m \times c \times \Delta\theta = 2{,}0 \times 4\,200 \times (100 - 16) = 2{,}0 \times 4\,200 \times 84 = 7{,}06 \times 10^{5}$ J $= 706$ kJ. Erreur classique : utiliser 100 au lieu de l''écart 84 (on trouverait 840 kJ).'
      - kind: input
        prompt: '**Étape 3.** En supposant que toute la puissance de la plaque est transmise à l''eau, calculer la durée nécessaire pour atteindre l''ébullition (arrondir à l''unité).'
        answer: '235'
        numeric: true
        tolerance: 5
        unit: s
        explanation: $\Delta t = \dfrac{Q}{P} = \dfrac{7{,}06 \times 10^{5}}{3{,}0 \times 10^{3}} = 235$ s, soit 3 min 55 s.
      - kind: mcq
        prompt: '**Étape 4.** En cuisine, l''eau met en réalité plus longtemps à bouillir. Pourquoi ?'
        choices:
        - Parce qu'une partie de l'énergie chauffe la casserole et se perd vers l'air ambiant
        - Parce que la capacité thermique massique de l'eau augmente avec la température
        - Parce que la plaque fournit moins de 3,0 kW quand elle est chaude
        - Parce que l'eau se dilate en chauffant
        answer:
        - 0
        feedback:
        - null
        - 'Non : $c_{\text{eau}}$ varie très peu entre 16 °C et 100 °C, l''effet serait négligeable.'
        - 'Non : la plaque délivre sa puissance nominale ; ce sont les transferts vers l''extérieur qui allongent la durée.'
        - 'Non : la dilatation de l''eau ne consomme pas une énergie significative devant les 706 kJ du chauffage.'
        explanation: 'Le rendement du chauffage est inférieur à 100 % : la casserole, la plaque et l''air ambiant reçoivent aussi de l''énergie (conduction, convection, rayonnement).'
      - kind: input
        prompt: '**Étape 5.** On mesure un rendement $\eta = 80$ % pour l''ensemble plaque + casserole. Calculer la durée réelle d''ébullition (arrondir à l''unité).'
        answer: '294'
        numeric: true
        tolerance: 8
        unit: s
        explanation: 'La puissance réellement transmise à l''eau vaut $0{,}80 \times 3\,000 = 2\,400$ W, d''où $\Delta t = \dfrac{7{,}06 \times 10^{5}}{2\,400} = 294$ s, soit 4 min 54 s — une minute de plus. Erreur classique : multiplier la durée par 0,80 au lieu de diviser.'
      - kind: mcq
        prompt: '**Étape 6.** L''eau bout depuis plusieurs minutes et la plaque fonctionne toujours, pourtant le thermomètre reste bloqué à 100 °C. Pourquoi ?'
        choices:
        - Parce que l'énergie fournie sert entièrement au **changement d'état** (vaporisation), qui se fait à température constante
        - Parce que la plaque s'arrête automatiquement à 100 °C
        - Parce que l'eau ne peut pas dépasser 100 °C, quelles que soient les conditions
        - Parce que le thermomètre est saturé
        answer:
        - 0
        feedback:
        - null
        - 'Non : la plaque continue de fournir 3,0 kW ; c''est l''eau qui change d''état.'
        - 'Non : sous pression plus élevée (cocotte-minute), l''eau bout à une température supérieure à 100 °C.'
        - 'Non : le palier est un phénomène physique, pas un défaut de mesure. Il apparaît aussi avec la fusion de la glace, à 0 °C.'
        explanation: Pendant un changement d'état d'un corps pur, la température reste constante ; l'énergie reçue, $Q_p = m \times L$, sert à séparer les molécules et non à les agiter davantage.
      - kind: input
        prompt: '**Étape 7.** Le cuisinier oublie sa casserole : 200 g d''eau s''évaporent. Quelle énergie ce changement d''état a-t-il consommé ? Répondre en kilojoules (arrondir à l''unité).'
        answer: '452'
        numeric: true
        tolerance: 6
        unit: kJ
        explanation: '$Q_p = m \times L_{\text{vaporisation}} = 0{,}200 \times 2\,260 = 452$ kJ. Erreur classique : oublier de convertir les 200 g en 0,200 kg.'
      - kind: mcq
        prompt: '**Étape 8.** Comparer ces 452 kJ aux 706 kJ du chauffage initial. Que faut-il en retenir ?'
        choices:
        - Vaporiser seulement 10 % de l'eau coûte déjà 64 % de l'énergie du chauffage complet
        - Vaporiser 10 % de l'eau coûte 10 % de l'énergie du chauffage
        - La vaporisation coûte moins cher que le chauffage, il vaut mieux laisser bouillir à feu vif
        - Les deux énergies ne sont pas comparables, elles n'ont pas la même unité
        answer:
        - 0
        feedback:
        - null
        - 'Non : le rapport n''est pas proportionnel, justement parce que la vaporisation demande une énergie massique $L$ très élevée.'
        - 'Non : $452 < 706$, mais pour seulement 200 g d''eau contre 2,0 kg chauffés de 84 °C.'
        - 'Non : les deux valeurs sont des énergies exprimées en kilojoules.'
        explanation: '$\dfrac{452}{706} = 0{,}64$. C''est pourquoi on couvre la casserole et on baisse le feu dès l''ébullition : maintenir un bouillonnement violent consomme énormément d''énergie pour rien.'
  - id: pc-flux-isolation
    title: Flux thermique et isolation
    icon: 🏠
    description: Flux thermique Φ, conductivité λ, résistance thermique R_th = e / λ, parois composites, isolation d'un bâtiment et réglementation.
    prerequisites:
    - pc-temperature-chaleur
    lesson: lessons/pc-flux-isolation.md
    items:
    - type: mcq
      level: 1
      prompt: 'Le **flux thermique** $\Phi$ à travers une paroi est un débit d''énergie. Dans quelle unité s''exprime-t-il ?


        {{fig:pc-mur-flux-thermique}}'
      choices:
      - Le watt (W)
      - Le joule (J)
      - Le kilowattheure (kWh)
      - Le m²·K·W⁻¹
      answer: 0
      feedback:
      - null
      - 'Non : le joule est une **énergie**. Le flux est une énergie **par seconde**, donc une puissance.'
      - 'Non : le kWh est aussi une énergie (1 kWh = 3,6 × 10⁶ J), pas une puissance.'
      - 'Non : m²·K·W⁻¹ est l''unité de la **résistance thermique** $R_{\text{th}}$.'
      explanation: '$\Phi = \dfrac{E}{\Delta t}$ : un débit d''énergie, donc il s''agit d''une puissance exprimée en watt (W).'
      tags:
      - flux
    - type: mcq
      level: 1
      prompt: Dans quelle unité s'exprime la **résistance thermique** $R_{\text{th}}$ d'un mètre carré de paroi ?
      choices:
      - m²·K·W⁻¹
      - W·m⁻¹·K⁻¹
      - W·m⁻²
      - Ω (ohm)
      answer: 0
      feedback:
      - null
      - 'Non : W·m⁻¹·K⁻¹ est l''unité de la **conductivité thermique** $\lambda$, la grandeur du matériau, pas de la paroi.'
      - 'Non : W·m⁻² est une densité surfacique de flux.'
      - 'Non : l''ohm est l''unité de la résistance **électrique**. La résistance thermique lui ressemble par ses lois (association en série) mais pas par son unité.'
      explanation: '$R_{\text{th}} = \dfrac{e}{\lambda}$ avec $e$ en m et $\lambda$ en W·m⁻¹·K⁻¹ : $R_{\text{th}}$ est en **m²·K·W⁻¹**.'
      tags:
      - resistance-thermique
    - type: mcq
      level: 1
      prompt: Dans quelle unité s'exprime la **conductivité thermique** $\lambda$ d'un matériau ?
      choices:
      - W·m⁻¹·K⁻¹
      - m²·K·W⁻¹
      - J·kg⁻¹·K⁻¹
      - W
      answer: 0
      feedback:
      - null
      - 'Non : m²·K·W⁻¹ est l''unité de la **résistance** thermique $R_{\text{th}}$, qui dépend en plus de l''épaisseur.'
      - 'Non : J·kg⁻¹·K⁻¹ est l''unité de la capacité thermique massique $c$.'
      - 'Non : le watt est l''unité du flux thermique $\Phi$.'
      explanation: '$\lambda$ s''exprime en **W·m⁻¹·K⁻¹**. On l''écrit tantôt W·K⁻¹·m⁻¹, tantôt W·m⁻¹·K⁻¹ : les deux écritures sont équivalentes.'
      tags:
      - resistance-thermique
    - type: mcq
      level: 1
      prompt: Plus un matériau est **isolant**, …
      choices:
      - plus sa résistance thermique $R_{\text{th}}$ est grande et plus le flux thermique est faible
      - plus sa résistance thermique $R_{\text{th}}$ est petite
      - plus sa conductivité thermique $\lambda$ est grande
      - plus le flux thermique qui le traverse est grand
      answer: 0
      feedback:
      - null
      - 'Non : une petite $R_{\text{th}}$ laisse passer beaucoup d''énergie, c''est le comportement d''un **conducteur**.'
      - 'Non : un bon isolant a une **faible** conductivité (laine de verre, moquette), un conducteur une conductivité élevée (carrelage, verre).'
      - 'Non : isoler sert précisément à **réduire** le flux thermique.'
      explanation: $R_{\text{th}}$ quantifie l'opposition du matériau au passage du flux thermique. Plus la paroi est isolante, plus sa résistance thermique est élevée.
      tags:
      - isolation
    - type: mcq
      level: 1
      prompt: 'Quelle relation donne le flux thermique traversant une paroi ?


        {{fig:pc-mur-flux-thermique}}'
      choices:
      - $\Phi = \dfrac{S \times (T_{\text{chaud}} - T_{\text{froid}})}{R_{\text{th}}}$
      - $\Phi = S \times (T_{\text{chaud}} - T_{\text{froid}}) \times R_{\text{th}}$
      - $\Phi = \dfrac{R_{\text{th}}}{S \times (T_{\text{chaud}} - T_{\text{froid}})}$
      - $\Phi = \dfrac{S \times R_{\text{th}}}{T_{\text{chaud}} - T_{\text{froid}}}$
      answer: 0
      feedback:
      - null
      - 'Non : la résistance est **au dénominateur**. Avec ta formule, mieux on isole (plus $R_{\text{th}}$ est grande), plus on perdrait d''énergie : absurde.'
      - 'Non : la formule est **inversée**. Un grand écart de température doit **augmenter** le flux, pas le diminuer.'
      - 'Non : $R_{\text{th}}$ ne peut pas être au numérateur ; c''est elle qui **freine** le flux.'
      explanation: '$\Phi$ augmente avec la surface $S$ et avec l''écart de température, et diminue quand $R_{\text{th}}$ augmente. Analogie : $\Phi$ ↔ intensité, écart de température ↔ tension, $R_{\text{th}}$ ↔ résistance.'
      tags:
      - flux
    - type: mcq
      level: 2
      prompt: Faut-il convertir les températures en kelvin pour calculer $\Phi = \dfrac{S \times (T_{\text{chaud}} - T_{\text{froid}})}{R_{\text{th}}}$ ?
      choices:
      - 'Non, à condition d''employer la même unité pour les deux températures : leur différence est identique'
      - Oui, obligatoirement, sinon le flux est faux de 273,15 W
      - Oui, il faut ajouter 273,15 au flux obtenu
      - Non, mais il faut alors diviser le résultat par 273,15
      answer: 0
      feedback:
      - null
      - 'Non : c''est une **différence** de températures ; l''écart de 19 °C à 4 °C vaut 15 °C, soit exactement 15 K.'
      - 'Non : $\Phi$ est une puissance en watts, on n''y ajoute pas une température.'
      - 'Non : aucun facteur correctif n''est nécessaire.'
      explanation: 'Inutile : un écart de température garde la même valeur en °C et en K. La seule règle est d''exprimer les deux températures dans la même unité.'
      tags:
      - flux
    - type: input
      level: 2
      prompt: Une cloison de placoplâtre a une épaisseur $e = 13$ mm et une conductivité thermique $\lambda = 0{,}25$ W·m⁻¹·K⁻¹. Calculer sa résistance thermique $R_{\text{th}}$.
      answer: '0.052'
      numeric: true
      tolerance: 0.002
      unit: m²·K·W⁻¹
      explanation: '$R_{\text{th}} = \dfrac{e}{\lambda} = \dfrac{0{,}013}{0{,}25} = 5{,}2 \times 10^{-2}$ m²·K·W⁻¹. **L''épaisseur doit être convertie en mètres** : avec 13 mm laissés tels quels, on trouverait 52, soit mille fois trop.'
      tags:
      - resistance-thermique
    - type: input
      level: 2
      prompt: Un mur de parpaing a une épaisseur $e = 200$ mm et une conductivité thermique $\lambda = 0{,}95$ W·m⁻¹·K⁻¹. Calculer sa résistance thermique $R_{\text{th}}$.
      answer: '0.21'
      numeric: true
      tolerance: 0.01
      unit: m²·K·W⁻¹
      explanation: '$R_{\text{th}} = \dfrac{0{,}200}{0{,}95} = 0{,}21$ m²·K·W⁻¹. Un mur de 20 cm de parpaing isole donc quatre fois moins bien qu''un simple parquet stratifié de 12 mm ($R_{\text{th}} = 7{,}5 \times 10^{-2}$) : le parpaing est un matériau **porteur**, pas un isolant.'
      tags:
      - resistance-thermique
    - type: mcq
      level: 2
      prompt: 'À épaisseur égale, lequel de ces deux revêtements de sol limite le mieux les transferts thermiques : la moquette ($\lambda = 0{,}09$ W·m⁻¹·K⁻¹) ou le carrelage en grès ($\lambda = 1{,}3$ W·m⁻¹·K⁻¹) ?'
      choices:
      - La moquette, car sa conductivité thermique est plus faible
      - Le carrelage, car sa conductivité thermique est plus grande
      - Les deux se valent, seule l'épaisseur compte
      - La moquette, car elle est plus épaisse
      answer: 0
      feedback:
      - null
      - 'Non : une **grande** conductivité signifie que le matériau conduit bien l''énergie, donc qu''il isole mal.'
      - 'Non : à épaisseur égale, $R_{\text{th}} = e/\lambda$ ne dépend plus que de $\lambda$.'
      - 'Non : l''énoncé impose la même épaisseur ; c''est bien $\lambda$ qui départage.'
      explanation: '$R_{\text{th}} = e/\lambda$ : à épaisseur égale, le plus petit $\lambda$ donne la plus grande résistance thermique. Avec les épaisseurs usuelles, moquette 4,0 mm → $4{,}4 \times 10^{-2}$ et carrelage 10 mm → $7{,}7 \times 10^{-3}$ m²·K·W⁻¹.'
      tags:
      - isolation
    - type: input
      level: 2
      prompt: 'Un mur de parpaing de surface $S = 10$ m² et de résistance thermique $R_{\text{th}} = 0{,}21$ m²·K·W⁻¹ sépare un intérieur à 20 °C d''un extérieur à 5 °C. Calculer le flux thermique $\Phi$.


        {{fig:pc-mur-flux-thermique}}'
      answer: '714'
      numeric: true
      tolerance: 6
      unit: W
      explanation: $\Phi = \dfrac{S \times (T_{\text{chaud}} - T_{\text{froid}})}{R_{\text{th}}} = \dfrac{10 \times (20 - 5)}{0{,}21} = \dfrac{150}{0{,}21} \approx 714$ W. Ce mur non isolé perd à lui seul autant qu'un radiateur de 700 W allumé en permanence.
      tags:
      - flux
    - type: mcq
      level: 2
      prompt: 'Une paroi **composite** est faite de plusieurs couches accolées. Comment obtient-on sa résistance thermique globale ?


        {{fig:pc-resistances-serie}}'
      choices:
      - On additionne les résistances thermiques des couches
      - On additionne les conductivités thermiques des couches
      - On prend la plus grande des résistances thermiques
      - On additionne l'inverse de chaque résistance thermique
      answer: 0
      feedback:
      - null
      - 'Non : les conductivités ne s''additionnent pas ; il faut d''abord convertir chaque couche en résistance $e/\lambda$.'
      - 'Non : chaque couche ajoute son obstacle, même les plus minces ; on les somme toutes.'
      - 'Non : c''est la règle des résistances électriques en **parallèle** ; ici les couches sont en **série**, traversées par le même flux.'
      explanation: '$R_{\text{th, paroi}} = \sum \dfrac{e_{\text{matériau}}}{\lambda_{\text{matériau}}}$ : les résistances thermiques de couches accolées s''ajoutent, comme des résistances électriques en série.'
      tags:
      - isolation
    - type: order
      level: 2
      prompt: 'Ordonnez les cinq couches du toit de combles aménagés, de l''**extérieur** vers l''**intérieur** (résistances thermiques en m²·K·W⁻¹).


        {{fig:pc-resistances-serie}}'
      steps:
      - Ardoise (0,003)
      - Bois de charpente (0,333)
      - Air peu ventilé (0,130)
      - Laine de verre (5,400)
      - Plaque de plâtre (0,040)
      explanation: 'La somme vaut $0{,}003 + 0{,}333 + 0{,}130 + 5{,}400 + 0{,}040 = 5{,}906$ m²·K·W⁻¹ : la laine de verre apporte à elle seule plus de 91 % de la résistance thermique.'
      tags:
      - isolation
    - type: input
      level: 2
      prompt: 'Calculer la résistance thermique totale d''un mètre carré de ce toit de combles aménagés : ardoise 0,003 ; bois de charpente 0,333 ; air peu ventilé 0,130 ; laine de verre 5,400 ; plaque de plâtre 0,040 (en m²·K·W⁻¹).


        {{fig:pc-resistances-serie}}'
      answer: '5.906'
      numeric: true
      tolerance: 0.01
      unit: m²·K·W⁻¹
      explanation: $R_{\text{th}} = 0{,}003 + 0{,}333 + 0{,}130 + 5{,}400 + 0{,}040 = 5{,}906$ m²·K·W⁻¹.
      tags:
      - isolation
    - type: mcq
      level: 2
      prompt: Si l'on **double** la résistance thermique d'une paroi sans rien changer d'autre, que devient le flux thermique ?
      choices:
      - Il est divisé par deux
      - Il est multiplié par deux
      - Il ne change pas
      - Il est divisé par quatre
      answer: 0
      feedback:
      - null
      - 'Non : $R_{\text{th}}$ est au **dénominateur** ; l''augmenter réduit le flux.'
      - 'Non : isoler deux fois mieux change bien quelque chose — c''est tout l''intérêt des travaux d''isolation.'
      - 'Non : $\Phi$ est inversement proportionnel à $R_{\text{th}}$ (puissance 1), pas à son carré.'
      explanation: '$\Phi = \dfrac{S \times \Delta T}{R_{\text{th}}}$ : $\Phi$ est **inversement proportionnel** à $R_{\text{th}}$. Doubler $R_{\text{th}}$ divise le flux par 2.'
      tags:
      - flux
    - type: input
      level: 3
      prompt: Ce toit ($R_{\text{th}} = 5{,}906$ m²·K·W⁻¹) a une surface $S = 60$ m². L'intérieur est à 19 °C, l'extérieur à 4 °C. Calculer le flux thermique $\Phi$ (arrondir à l'unité).
      answer: '152'
      numeric: true
      tolerance: 2
      unit: W
      explanation: '$\Phi = \dfrac{60 \times (19 - 4)}{5{,}906} = \dfrac{900}{5{,}906} \approx 152$ W. À comparer aux 714 W perdus par 10 m² de parpaing nu : l''isolation change tout.'
      tags:
      - flux
    - type: input
      level: 3
      prompt: Ce toit laisse passer un flux thermique $\Phi = 152$ W. Quelle énergie perd-il en 24 heures, exprimée en kilowattheures ?
      answer: '3.65'
      numeric: true
      tolerance: 0.1
      unit: kWh
      explanation: '$E = \Phi \times \Delta t = 152 \text{ W} \times 24 \text{ h} = 3\,648$ W·h $\approx 3{,}65$ kWh (soit $1{,}3 \times 10^{7}$ J). Erreur classique : multiplier par 24 **et** par 3 600 tout en gardant l''unité kWh.'
      tags:
      - flux
    - type: input
      level: 3
      prompt: On retire la laine de verre ($R = 5{,}400$ m²·K·W⁻¹) du toit précédent ($R_{\text{th}} = 5{,}906$ m²·K·W⁻¹). Par combien le flux thermique est-il multiplié ? (arrondir au dixième)
      answer: '11.7'
      numeric: true
      tolerance: 0.3
      unit: ''
      explanation: Sans laine de verre, $R_{\text{th}} = 5{,}906 - 5{,}400 = 0{,}506$ m²·K·W⁻¹. Le flux étant inversement proportionnel à $R_{\text{th}}$, il est multiplié par $\dfrac{5{,}906}{0{,}506} \approx 11{,}7$.
      tags:
      - isolation
    - type: mcq
      level: 3
      prompt: 'Le toit de combles aménagés a une résistance thermique totale de 5,906 m²·K·W⁻¹. Exigences pour l''isolation d''un **toit** : RT 2005 → 5,0 ; « basse énergie » → 6,7 ; « très basse énergie » → 10 (en m²·K·W⁻¹). Que conclure ?


        {{fig:pc-isolation-niveaux}}'
      choices:
      - Il respecte la RT 2005, mais ni le niveau « basse énergie » ni le « très basse énergie »
      - Il respecte les trois niveaux
      - Il ne respecte aucun des trois niveaux
      - Il respecte la RT 2005 et le niveau « basse énergie », mais pas le « très basse énergie »
      answer: 0
      feedback:
      - null
      - 'Non : 5,906 est inférieur aux 6,7 m²·K·W⁻¹ exigés pour le niveau « basse énergie ».'
      - 'Non : 5,906 dépasse bien les 5,0 m²·K·W⁻¹ de la RT 2005.'
      - 'Non : 5,906 < 6,7, le niveau « basse énergie » n''est pas atteint.'
      explanation: 'Seule la RT 2005 est satisfaite. Attention : ces exigences sont souvent notées $R_{\max}$ alors qu''il s''agit de valeurs **minimales** à atteindre — il faudrait lire $R_{\min}$.'
      tags:
      - isolation
    - type: mcq
      level: 3
      prompt: Les exigences d'isolation « basse énergie » sont de 6,7 m²·K·W⁻¹ pour le toit et de 3,3 m²·K·W⁻¹ pour la façade. Pourquoi le toit est-il le plus exigeant ?
      choices:
      - 'Parce que l''air chaud s''accumule en haut : l''écart de température y est le plus grand et le toit est la paroi la plus déperditive'
      - Parce que le toit a toujours une surface plus grande que les façades
      - Parce que la conductivité de l'ardoise est très faible
      - Parce que la réglementation ne s'applique qu'aux toitures
      answer: 0
      feedback:
      - null
      - 'Non : la surface du toit n''est pas systématiquement la plus grande ; c''est l''écart de température et le mode de transfert (convection de l''air chaud) qui commandent.'
      - 'Non : l''ardoise n''apporte que 0,003 m²·K·W⁻¹ sur 5,906, soit 0,05 % de la résistance du toit : c''est négligeable.'
      - 'Non : la réglementation fixe aussi des exigences pour le plancher (2,0 / 3,3 / 6,7) et pour la façade (2,2 / 3,3 / 6,7).'
      explanation: 'Par convection, l''air chaud monte : la température sous le toit est plus élevée que dans le reste du logement, ce qui augmente $(T_{\text{chaud}} - T_{\text{froid}})$ et donc le flux. D''où l''exigence renforcée sur $R_{\text{th}}$ du toit.'
      tags:
      - isolation
    - type: guided
      level: 3
      title: Isolation et chauffage électrique d'une pièce sous combles
      intro: 'On aménage une pièce sous les combles d''une maison.


        La **toiture**, de surface $S = 60$ m², est constituée de cinq couches dont voici les résistances thermiques, pour 1 m² de paroi, de l''extérieur vers l''intérieur (en m²·K·W⁻¹) : **ardoise 0,003**, **bois de charpente 0,333**, **air peu ventilé 0,130**, **laine de verre 5,400**, **plaque de plâtre 0,040**.


        L''intérieur est maintenu à **19 °C**, l''extérieur est à **4 °C**. Le chauffage est assuré par un **convecteur électrique** (dipôle purement résistif) alimenté sous $U = 230$ V.


        {{fig:pc-resistances-serie}}'
