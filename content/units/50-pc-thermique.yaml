      - 'Non : la vaporisation part du **liquide**.'
      - 'Non : la fusion mène du solide au **liquide**, pas au gaz.'
      explanation: Sur le diagramme des changements d'état, la flèche bleue montante solide → gaz porte le nom **sublimation** ; la flèche rouge en sens inverse porte le nom **condensation**.
      tags:
