        unit: °C
        explanation: '$\Delta\theta = \dfrac{Q_p}{m_{\text{air}} \times c_{\text{air}}} = \dfrac{4{,}26 \times 10^{4}}{0{,}750 \times 1\,000} = 56{,}8$ °C. Attention aux unités : $c$ est donné en kJ·kg⁻¹·K⁻¹, soit $1{,}0 \times 10^{3}$ J·kg⁻¹·K⁻¹.'
      - kind: mcq
