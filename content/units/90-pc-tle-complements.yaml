      - 'Non : l''ion oxonium $\mathrm{H_3O^+}$ n''apparaît pas dans cette équation. L''eau y est formée à partir de $\mathrm{HO^-}$, donc le couple en jeu est $\mathrm{H_2O}/\mathrm{HO^-}$.'
      explanation: L'acide éthanoïque cède un proton ($\mathrm{CH_3COOH} \rightarrow \mathrm{CH_3COO^-}$, couple $\mathrm{CH_3COOH}/\mathrm{CH_3COO^-}$) et l'ion hydroxyde le capte ($\mathrm{HO^-} \rightarrow \mathrm{H_2O}$, couple $\mathrm{H_2O}/\mathrm{HO^-}$). Une réaction acido-basique est un **échange de protons** entre l'acide d'un couple et la base d'un autre.
