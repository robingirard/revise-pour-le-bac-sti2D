      level: 2
      prompt: Dans la réaction $\mathrm{CH_3COOH} + \mathrm{HO^-} \rightarrow \mathrm{CH_3COO^-} + \mathrm{H_2O}$, quels sont les deux couples acide/base mis en jeu ?
