  - id: pc-signaux-spectres
    title: Signaux, spectres et transmission
    icon: 📶
    description: Signal périodique, fondamental et harmoniques, spectre d'amplitude, sons purs et complexes, timbre, niveau sonore, modulation et domaines des télécommunications.
    prerequisites:
    - pc-ondes-bases
    lesson: lessons/pc-signaux-spectres.md
    items:
    - type: mcq
      level: 1
      prompt: Quelle est la définition de la **période** $T$ d'un signal périodique ?
      choices:
      - La plus petite durée au bout de laquelle le signal se reproduit identique à lui-même
      - La durée totale de l'enregistrement du signal
      - L'inverse de l'amplitude du signal
      - La durée séparant deux maximums quelconques du signal
      answer: 0
      feedback:
      - null
      - 'Non : la durée d''enregistrement contient en général plusieurs périodes.'
      - 'Non : l''amplitude (en V) et la période (en s) sont deux grandeurs indépendantes. L''inverse de la période est la **fréquence**.'
      - 'Attention : un signal complexe peut avoir plusieurs maximums par période. Il faut la **plus petite** durée de répétition du motif entier.'
      explanation: La période $T$ d'un signal est la plus petite durée au bout de laquelle le signal se reproduit identique à lui-même. La fréquence du fondamental vaut $f_1 = 1/T$, en hertz.
      tags:
      - signal-periodique
    - type: mcq
      level: 1
      prompt: 'Quand un son est-il dit **pur** ?

        {{fig:pc-spectre-signal}}'
      choices:
      - Si son signal périodique est sinusoïdal et si son spectre d'amplitude ne comporte qu'une seule fréquence
      - Si son niveau sonore est inférieur au seuil de douleur
      - Si sa fréquence est comprise entre 20 Hz et 20 000 Hz
      - Si son spectre ne comporte que des harmoniques de rang pair
      answer: 0
      feedback:
      - null
      - 'Non : le seuil de douleur concerne la sensation auditive, pas la pureté du son.'
      - 'Non : c''est la définition du domaine **audible**, par opposition aux infrasons et aux ultrasons.'
      - 'Non : dès que le spectre comporte plusieurs raies, le son est **complexe**, quel que soit le rang des harmoniques.'
      explanation: Un son est pur si son signal périodique est sinusoïdal et si on n'observe qu'une seule fréquence sur son spectre d'amplitude. Sinon, le son est complexe.
      tags:
      - sons
    - type: mcq
      level: 1
      prompt: À quelle grandeur physique correspond la **hauteur** d'un son ?
      choices:
      - À la fréquence $f_1$ du fondamental
      - À l'amplitude du fondamental
      - Au niveau sonore $L$, en décibels
      - Au nombre d'harmoniques présents
      answer: 0
      feedback:
      - null
      - 'Non : l''amplitude est liée à l''intensité acoustique, donc au niveau sonore, pas à la hauteur.'
      - 'Non : le niveau sonore dit si le son est fort ou faible, pas s''il est aigu ou grave.'
      - 'Non : le nombre d''harmoniques et leurs amplitudes définissent le **timbre** du son.'
      explanation: La hauteur d'un son — la sensation qu'il est plus aigu ou plus grave qu'un autre — est donnée par la fréquence $f_1$ du fondamental.
      tags:
      - sons
    - type: mcq
      level: 1
      prompt: Quelle est la valeur de l'intensité sonore de référence $I_0$ ?
      choices:
      - $10^{-12}$ W·m⁻²
      - $10^{-12}$ W
      - $10^{-6}$ W·m⁻²
      - 0 dB·m⁻²
      answer: 0
      feedback:
      - null
      - 'Il manque la surface : une intensité acoustique s''exprime en watt **par mètre carré**.'
      - 'Non : $10^{-6}$ W·m⁻² correspond à une conversation normale (60 dB), pas au seuil d''audibilité.'
      - 'Non : $I_0$ est une **intensité** (W·m⁻²) ; c''est le **niveau** sonore correspondant qui vaut 0 dB.'
      explanation: '$I_0$ correspond au seuil d''audibilité de l''oreille humaine pour un son de fréquence 1 000 Hz : $I_0 = 10^{-12}$ W·m⁻².'
      tags:
      - niveau-sonore
    - type: mcq
      level: 1
      prompt: Quel est le domaine des fréquences **audibles** par l'oreille humaine ?
      choices:
      - De 20 Hz à 20 000 Hz
      - De 0 Hz à 1 000 Hz
      - De 20 Hz à 20 000 000 Hz
      - De 20 000 Hz à 200 000 Hz
      answer: 0
      feedback:
      - null
      - 'Non : 1 000 Hz est la fréquence de référence du seuil d''audibilité, pas la limite du champ auditif.'
      - 'Attention aux puissances de 10 : la limite haute est 20 000 Hz = 20 kHz, pas 20 MHz.'
      - 'Non : au-delà de 20 000 Hz, ce sont les **ultrasons**, inaudibles.'
      explanation: 'Infrasons : $f < 20$ Hz. Champ auditif : 20 Hz $< f <$ 20 000 Hz. Ultrasons : $f > 20\,000$ Hz. Les seuils d''audibilité et de douleur dépendent en outre de la fréquence.'
      tags:
      - niveau-sonore
    - type: mcq
      level: 1
      prompt: Deux instruments jouent la **même note**. Qu'est-ce qui permet de les distinguer à l'oreille ?
      choices:
      - Le **timbre**, lié au nombre d'harmoniques et à leurs amplitudes respectives
      - La hauteur, c'est-à-dire la fréquence du fondamental
      - Le niveau sonore, en décibels
      - La période du signal
      answer: 0
      feedback:
      - null
      - 'Non : jouer la même note, c''est justement avoir la **même** hauteur, donc le même $f_1$.'
      - 'Non : on peut jouer les deux instruments au même volume et les distinguer quand même.'
      - 'Non : la période $T = 1/f_1$ est la même pour les deux, puisque la note est la même.'
      explanation: 'Deux sons de même hauteur joués par deux instruments différents ne sont pas perçus de la même manière : cela dépend du **timbre**, lié au nombre d''harmoniques présents et à leurs amplitudes respectives — c''est-à-dire à la forme du spectre au-delà du fondamental.'
      tags:
      - sons
    - type: mcq
      level: 1
      prompt: Sur quel phénomène physique repose la propagation de la lumière dans une **fibre optique** ?
      choices:
      - 'La **réflexion totale** : la lumière est piégée dans le cœur de la fibre'
      - La modulation d'amplitude de la lumière
      - La diffraction de la lumière par la gaine optique
      - L'échauffement de l'enveloppe protectrice
      answer: 0
      feedback:
      - null
      - 'Non : la modulation sert à **coder** l''information sur une porteuse ; elle n''explique pas pourquoi la lumière reste dans la fibre.'
      - 'Non : le cours cite explicitement la **réflexion totale**. La fibre est constituée d''un cœur, d''une gaine optique et d''une enveloppe protectrice.'
      - 'Non : l''enveloppe protectrice ne sert qu''à protéger mécaniquement la fibre.'
      explanation: 'La fibre optique transmet des données sous forme d''**impulsions lumineuses**, avec un débit nettement supérieur aux autres supports filaires. La lumière est « piégée » dans le cœur et s''y propage en se réfléchissant : c''est la réflexion totale.'
      tags:
      - telecom
    - type: mcq
      level: 2
      prompt: Le fondamental d'un son vaut $f_1 = 220$ Hz. Quelle est la fréquence de l'harmonique de **rang 3** ?
      choices:
      - 660 Hz
      - 3 Hz
      - 73,3 Hz
      - 440 Hz
      answer: 0
      feedback:
      - null
      - 'Non : 3 est le **rang** de l''harmonique, un entier sans unité, pas une fréquence.'
      - 'Non : on ne divise pas par le rang, on **multiplie** : $f_n = n \times f_1$.'
      - '440 Hz est l''harmonique de rang **2** ($2 \times 220$). Pour le rang 3 : $3 \times 220 = 660$ Hz.'
      explanation: $f_n = n \times f_1 = 3 \times 220 = 660$ Hz. Réciproquement, le rang se retrouve par $n = f_n/f_1$.
      tags:
      - harmoniques
    - type: input
      level: 2
      prompt: Un signal périodique a une période $T = 4{,}0$ ms. Calculer la fréquence $f_1$ de son fondamental, en hertz.
      answer: '250'
      numeric: true
      tolerance: 1
      unit: Hz
      explanation: '$f_1 = 1/T = 1/(4{,}0 \times 10^{-3}) = 250$ Hz. Erreur fréquente : oublier de convertir les millisecondes en secondes (on trouverait 0,25 Hz).'
      tags:
      - signal-periodique
    - type: input
      level: 2
      prompt: 'Sur un spectre d''amplitude, le fondamental est à $f_1 = 250$ Hz et une raie apparaît à $f_n = 1\,250$ Hz. Quel est le **rang** $n$ de cet harmonique ?

        {{fig:pc-spectre-signal}}'
      answer: '5'
      numeric: true
      tolerance: 0
      explanation: $n = f_n/f_1 = 1\,250/250 = 5$. Le rang est un entier naturel non nul, sans unité.
      tags:
      - harmoniques
    - type: input
      level: 2
      prompt: Une source émet une intensité acoustique $I = 10^{-4}$ W·m⁻². Calculer le niveau sonore $L$, en décibels ($I_0 = 10^{-12}$ W·m⁻²).
