      - $\mathrm{CH_3COOH}/\mathrm{HO^-}$ et $\mathrm{CH_3COO^-}/\mathrm{H_2O}$
      - $\mathrm{CH_3COOH}/\mathrm{H_2O}$ et $\mathrm{CH_3COO^-}/\mathrm{HO^-}$
      - $\mathrm{H_3O^+}/\mathrm{H_2O}$ et $\mathrm{CH_3COOH}/\mathrm{CH_3COO^-}$
      answer: 0
