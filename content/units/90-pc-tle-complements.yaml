units:
- id: pc-tle-complements
  matiere: physique
  title: 'Physique-chimie de Terminale : compléments'
  description: Radioactivité et énergie nucléaire, générateurs électrochimiques (piles, accumulateurs, piles à combustible), réactions acido-basiques et pH, signaux périodiques, sons et transmission des ondes.
  skills:
  - id: pc-radioactivite
    title: La radioactivité
    icon: ☢️
    description: Noyaux et isotopes, désintégrations α, β⁻, β⁺ et rayonnement γ, activité en becquerel, loi de décroissance, demi-vie et constante de temps, énergie libérée E = Δm c².
    prerequisites: []
    lesson: lessons/pc-radioactivite.md
    items:
    - type: mcq
      level: 1
      prompt: Le noyau de carbone 14 s'écrit $^{14}_{6}\mathrm{C}$. Combien contient-il de **neutrons** ?
      choices:
      - '8'
      - '6'
      - '14'
      - '20'
      answer: 0
      feedback:
      - null
      - 'Non : 6 est le numéro atomique $Z$, c''est-à-dire le nombre de **protons**.'
      - 'Non : 14 est le nombre de masse $A$, c''est-à-dire le nombre total de **nucléons** (protons + neutrons).'
      - 'Non : on soustrait, on n''additionne pas. Le nombre de neutrons vaut $A - Z$, pas $A + Z$.'
      explanation: 'Le nombre de neutrons vaut $A - Z = 14 - 6 = 8$. Le livre l''écrit ainsi : $^{14}_{6}\mathrm{C}$, 6 protons / 8 neutrons.'
      tags:
      - noyau
    - type: mcq
      level: 1
      prompt: Lors d'une radioactivité **α**, quelle particule le noyau père émet-il ?
      choices:
      - Un noyau d'hélium 4, noté $^{4}_{2}\mathrm{He}$
      - Un électron
      - Un positron (positon)
      - Un neutron lent
      answer: 0
      feedback:
      - null
      - 'Non : l''électron est émis lors de la radioactivité **β⁻**.'
      - 'Non : le positron est émis lors de la radioactivité **β⁺**.'
      - 'Non : le neutron lent est la particule **envoyée** vers les noyaux d''uranium 235 pour provoquer une fission ; ce n''est pas un rayonnement émis.'
      explanation: Un noyau père se désintègre en un noyau fils en émettant un noyau d'hélium 4, la particule α, notée $^{4}_{2}\mathrm{He}$. Le noyau fils perd donc 2 protons et 2 neutrons.
      tags:
      - desintegrations
    - type: mcq
      level: 1
      prompt: 'Le carbone 14 $^{14}_{6}\mathrm{C}$ se désintègre par radioactivité **β⁻**. Quel est le noyau fils ?

        {{fig:pc-desintegrations}}'
      choices:
      - L'azote 14, $^{14}_{7}\mathrm{N}$
      - Le bore 10, $^{10}_{5}\mathrm{B}$
      - Le carbone 13, $^{13}_{6}\mathrm{C}$
      - L'azote 15, $^{15}_{7}\mathrm{N}$
      answer: 0
      feedback:
      - null
      - 'Non : le bore 10 est le noyau fils du **carbone 10** par radioactivité β⁺.'
      - 'Non : le nombre de masse $A$ est conservé, il reste égal à 14. Seul $Z$ change.'
      - 'Non : $A$ est conservé, donc $A = 14$ et non 15. C''est le numéro atomique qui passe de 6 à 7.'
      explanation: '$^{14}_{6}\mathrm{C} \rightarrow {}^{14}_{7}\mathrm{N} + {}^{0}_{-1}\mathrm{e}$ : le carbone 14 (6 protons / 8 neutrons) devient l''azote 14 (7 protons / 7 neutrons).'
      tags:
      - desintegrations
    - type: mcq
      level: 1
      prompt: Que représente la **demi-vie** $t_{1/2}$ d'un radionucléide ?
      choices:
      - La durée au bout de laquelle la quantité de ce radionucléide est divisée par deux
      - La durée au bout de laquelle tous les noyaux père ont disparu
      - La moitié de la durée de vie d'un noyau père
      - Le nombre de désintégrations par seconde
      answer: 0
      feedback:
      - null
      - 'Non : la décroissance est **exponentielle**, elle ne s''annule jamais exactement. Après 3 demi-vies il reste encore $N_0/8$ noyaux.'
      - 'Non : ce n''est pas « la moitié d''une durée de vie ». C''est la durée au bout de laquelle la **population** est divisée par 2.'
      - 'Non : c''est la définition de l''**activité** $A$, exprimée en becquerel.'
      explanation: '$t_{1/2}$ est la demi-vie, durée au bout de laquelle la quantité d''un même radionucléide est divisée par deux. Exemples : 12,32 ans pour $^{3}_{1}\mathrm{H}$, 5 730 ans pour $^{14}_{6}\mathrm{C}$, 7,038 × 10⁸ ans pour $^{235}_{92}\mathrm{U}$.'
      tags:
      - decroissance
    - type: mcq
      level: 1
      prompt: Dans quelle unité s'exprime l'**activité** $A$ d'une source radioactive ?
      choices:
      - Le becquerel (Bq)
      - Le gray (Gy)
      - Le hertz (Hz)
      - Le joule (J)
      answer: 0
      feedback:
      - null
      - 'Non : le gray mesure une **dose absorbée** (énergie de rayonnement reçue par kilogramme de matière), pas un nombre de désintégrations par seconde.'
      - 'Non : le hertz est l''unité d''une **fréquence**. L''activité est bien un nombre par seconde, mais son unité dédiée est le becquerel.'
      - 'Non : le joule est l''unité d''une **énergie**, par exemple celle de $E = \Delta m \times c^2$.'
      explanation: 'L''activité $A$ d''une population de noyaux père, exprimée en **becquerel (Bq)**, est le nombre de désintégrations **par seconde** : 1 Bq = 1 désintégration par seconde.'
      tags:
      - activite
    - type: mcq
      level: 1
      prompt: Qu'est-ce que le **rayonnement γ** ?
      choices:
      - Un photon très énergétique émis quand le noyau fils, trop excité, se désexcite
      - Un noyau d'hélium 4 émis par le noyau père
      - Un électron arraché au cortège électronique de l'atome
      - Un neutron lent envoyé sur le noyau père
      answer: 0
      feedback:
      - null
      - 'Non : c''est la particule **α**.'
      - 'Non : l''électron émis lors d''une désintégration β⁻ vient du **noyau**, pas du cortège électronique — et ce n''est pas un rayonnement γ.'
      - 'Non : le neutron lent est la particule **envoyée** sur l''uranium 235 pour provoquer une fission.'
      explanation: 'Au cours des trois désintégrations α, β⁻ et β⁺, un rayonnement γ peut être émis si le noyau fils, trop excité, se désexcite en l''émettant. $A$ et $Z$ sont alors inchangés : le γ n''est pas une désintégration.'
      tags:
      - desintegrations
    - type: grid
      level: 1
      prompt: 'Pour chaque rayonnement, cochez la particule émise.

        {{fig:pc-desintegrations}}'
      rows:
      - id: al
        label: Radioactivité α
      - id: bm
        label: Radioactivité β⁻
      - id: bp
        label: Radioactivité β⁺
      - id: ga
        label: Rayonnement γ
      cols:
      - id: He
        label: Noyau d'hélium 4
      - id: El
        label: Électron
      - id: Po
        label: Positron
      - id: Ph
        label: Photon
      answer:
      - Heal
      - Elbm
      - Pobp
      - Phga
      labels:
        Heal: α → noyau d'hélium 4
        Elal: α → électron
        Poal: α → positron
        Phal: α → photon
        Hebm: β⁻ → noyau d'hélium 4
        Elbm: β⁻ → électron
        Pobm: β⁻ → positron
        Phbm: β⁻ → photon
        Hebp: β⁺ → noyau d'hélium 4
        Elbp: β⁺ → électron
        Pobp: β⁺ → positron
        Phbp: β⁺ → photon
        Hega: γ → noyau d'hélium 4
        Elga: γ → électron
        Poga: γ → positron
        Phga: γ → photon
      cellFeedback:
        Elbp: en β⁺ c'est un **positron** (antiélectron, charge +) qui est émis, pas un électron
        Pobm: en β⁻ c'est un **électron** (charge −) qui est émis, pas un positron
        Hega: 'le rayonnement γ n''emporte aucun nucléon : c''est un photon, $A$ et $Z$ ne changent pas'
        Elal: la particule α est un noyau d'hélium 4, faite de 2 protons et 2 neutrons
      explanation: α → $^{4}_{2}\mathrm{He}$ ; β⁻ → électron ; β⁺ → positron ; γ → photon de désexcitation. Le rayonnement γ accompagne éventuellement les trois autres, il ne les remplace pas.
      tags:
      - desintegrations
    - type: mcq
      level: 2
      prompt: Le carbone 10 se désintègre par radioactivité **β⁺**. Quelle équation est correcte ?
      choices:
      - $^{10}_{6}\mathrm{C} \rightarrow {}^{10}_{5}\mathrm{B} + {}^{0}_{+1}\mathrm{e}$
      - $^{10}_{6}\mathrm{C} \rightarrow {}^{10}_{7}\mathrm{N} + {}^{0}_{+1}\mathrm{e}$
      - $^{10}_{6}\mathrm{C} \rightarrow {}^{10}_{5}\mathrm{B} + {}^{0}_{-1}\mathrm{e}$
      - $^{10}_{6}\mathrm{C} \rightarrow {}^{6}_{4}\mathrm{Be} + {}^{4}_{2}\mathrm{He}$
      answer: 0
      feedback:
      - null
      - 'Non : $Z$ n''est pas conservé ($6 \neq 7 + 1$). En β⁺ le numéro atomique **diminue** de 1 : 6 → 5.'
      - 'Non : la particule émise en β⁺ est un **positron** (charge +1). Avec un électron, $Z$ ne serait pas conservé ($6 \neq 5 - 1$).'
      - Cette équation est bien équilibrée ($10 = 6 + 4$ et $6 = 4 + 2$) mais elle décrit une désintégration **α**, pas β⁺.
      explanation: '$^{10}_{6}\mathrm{C} \rightarrow {}^{10}_{5}\mathrm{B} + {}^{0}_{+1}\mathrm{e}$ : $A$ est conservé (10) et $Z$ diminue de 1 (6 → 5). Le noyau fils est le bore 10, 5 protons / 5 neutrons.'
      tags:
      - desintegrations
    - type: mcq
      level: 2
      prompt: 'Au bout d''une durée $t = 3 \times t_{1/2}$, quelle fraction des noyaux père initiaux reste-t-il ?

        {{fig:pc-decroissance-radioactive}}'
      choices:
      - $N_0/8$
      - $N_0/3$
      - $N_0/6$
      - $N_0/2$
      answer: 0
      feedback:
      - null
      - 'Non : la décroissance n''est pas proportionnelle au temps. À chaque demi-vie la population est **divisée** par 2.'
      - 'Non : on ne multiplie pas 2 par 3, on élève 2 à la puissance 3 : $2^3 = 8$.'
      - 'Non : $N_0/2$ correspond à **une seule** demi-vie.'
      explanation: 'Après $1\,t_{1/2}$ : $N_0/2$ ; après $2\,t_{1/2}$ : $N_0/4$ ; après $3\,t_{1/2}$ : $N_0/8$. C''est exactement la graduation de l''axe des ordonnées de la courbe de décroissance.'
      tags:
      - decroissance
    - type: input
      level: 2
      prompt: La demi-vie du tritium $^{3}_{1}\mathrm{H}$ vaut $t_{1/2} = 12{,}32$ ans. Au bout de combien d'années la quantité initiale de tritium est-elle divisée par **4** ?
      answer: '24.64'
      numeric: true
      tolerance: 0.1
      unit: ans
      explanation: 'Diviser par 4, c''est diviser deux fois par 2 : $t = 2 \times t_{1/2} = 2 \times 12{,}32 = 24{,}64$ ans. Erreur fréquente : diviser la demi-vie par 4 au lieu de la multiplier par 2.'
      tags:
      - decroissance
    - type: input
      level: 2
      prompt: Une source d'activité initiale $A_0 = 800$ Bq a une demi-vie $t_{1/2} = 30$ ans. Quelle est son activité au bout de 60 ans ?
      answer: '200'
      numeric: true
      tolerance: 1
      unit: Bq
      explanation: '60 ans $= 2 \times t_{1/2}$ : l''activité est divisée deux fois par 2, soit par $2^2 = 4$. $A = 800/4 = 200$ Bq. Erreur fréquente : retrancher deux fois la moitié de $A_0$, ce qui donnerait 0.'
      tags:
      - activite
    - type: input
      level: 2
      prompt: L'activité du carbone 14 d'un ossement fossile vaut le **quart** de son activité initiale. Quel est l'âge de l'ossement, en années ? ($t_{1/2} = 5\,730$ ans)
      answer: '11460'
      numeric: true
      tolerance: 50
      unit: ans
      explanation: 'Diviser par 4 = deux demi-vies : $t = 2 \times 5\,730 = 11\,460$ ans, soit $1{,}15 \times 10^{4}$ ans.'
      tags:
      - decroissance
    - type: input
      level: 2
      prompt: Une réaction nucléaire s'accompagne d'une perte de masse $\Delta m = 2{,}0 \times 10^{-28}$ kg. Calculer l'énergie libérée, en joules ($c = 3{,}00 \times 10^{8}$ m·s⁻¹). Écriture scientifique, par exemple 1,8e-11.
      answer: '1.8e-11'
      numeric: true
      tolerance: 1.0e-12
      unit: J
      explanation: '$E = \Delta m \times c^2 = 2{,}0 \times 10^{-28} \times (3{,}00 \times 10^{8})^2 = 2{,}0 \times 10^{-28} \times 9{,}00 \times 10^{16} = 1{,}8 \times 10^{-11}$ J. Erreur fréquente : oublier d''élever $c$ au carré (on trouverait $6{,}0 \times 10^{-20}$ J).'
      tags:
      - energie-nucleaire
    - type: mcq
      level: 2
      prompt: 'Un neutron lent provoque la fission de l''uranium 235 :

        $^{1}_{0}\mathrm{n} + {}^{235}_{92}\mathrm{U} \rightarrow {}^{94}_{38}\mathrm{Sr} + {}^{140}_{54}\mathrm{Xe} + x\,^{1}_{0}\mathrm{n}$

        Que vaut $x$ ?

        {{fig:pc-fission-fusion}}'
      choices:
      - '2'
      - '1'
      - '3'
      - '0'
      answer: 0
      feedback:
      - null
      - 'Non : à gauche $1 + 235 = 236$ nucléons, à droite $94 + 140 = 234$ : il en manque **2**, donc 2 neutrons.'
      - 'Non : avec 3 neutrons on aurait $94 + 140 + 3 = 237$ nucléons à droite, contre 236 à gauche.'
      - 'Non : sans neutron émis, $94 + 140 = 234 \neq 236$. Ce sont d''ailleurs ces neutrons libérés qui permettent la réaction en chaîne.'
      explanation: 'Conservation de $A$ : $1 + 235 = 236$ et $94 + 140 + 2 \times 1 = 236$. Conservation de $Z$ : $0 + 92 = 92$ et $38 + 54 + 0 = 92$. Donc $x = 2$.'
      tags:
      - energie-nucleaire
    - type: mcq
      level: 2
      prompt: 'Deutérium + tritium → hélium + neutron libre + ÉNERGIE. De quelle réaction s''agit-il ?

        {{fig:pc-fission-fusion}}'
      choices:
      - 'Une **fusion** nucléaire : des noyaux légers forment un noyau plus lourd'
      - 'Une **fission** nucléaire : un noyau lourd se casse en noyaux plus légers'
      - Une désintégration β⁻
      - Une réaction chimique de combustion
      answer: 0
      feedback:
      - null
      - 'Non : la fission part d''un noyau **lourd** bombardé par un neutron, comme $^{235}_{92}\mathrm{U}$, et donne des noyaux fils plus légers.'
      - 'Non : dans une désintégration β⁻ il y a **un seul** noyau père et l''émission d''un électron ; ici deux noyaux s''assemblent.'
      - 'Non : une combustion met en jeu les **électrons** des atomes, pas les noyaux, et libère bien moins d''énergie.'
      explanation: Comme dans les étoiles, des noyaux légers (deutérium et tritium, isotopes de l'hydrogène) réalisent une **fusion nucléaire** pour former un noyau plus lourd (hélium), en libérant un neutron et de l'énergie.
      tags:
      - energie-nucleaire
    - type: mcq
      level: 2
      prompt: Une source contient $N = 1{,}0 \times 10^{12}$ noyaux radioactifs et son activité vaut $A = 500$ Bq. Que signifie cette valeur de 500 Bq ?
      choices:
      - 500 noyaux se désintègrent en moyenne chaque seconde
      - Il reste 500 noyaux radioactifs dans la source
      - La source libère 500 J d'énergie par seconde
      - Il faut 500 s pour que la moitié des noyaux se désintègrent
      answer: 0
      feedback:
      - null
      - 'Non : le nombre de noyaux est $N = 1{,}0 \times 10^{12}$. L''activité, elle, compte les désintégrations **par seconde**.'
      - 'Non : le becquerel compte des désintégrations, pas des joules. Une puissance s''obtiendrait en multipliant $A$ par l''énergie libérée à chaque désintégration.'
      - 'Non : cette durée serait la **demi-vie** $t_{1/2}$ ; elle ne se lit pas sur la seule valeur de l''activité.'
      explanation: '1 Bq = 1 désintégration par seconde. L''activité décroît au cours du temps comme le nombre de noyaux : $A(t) = A_0\,e^{-\lambda t}$.'
      tags:
      - activite
    - type: mcq
      level: 3
      prompt: Pour le carbone 14, $t_{1/2} = 5\,730$ ans. Que vaut la **constante de temps** $\tau$, et que représente-t-elle ?
      choices:
      - '$\tau = t_{1/2}/\ln 2 \approx 8\,268$ ans : une **durée**, inverse de la constante radioactive $\lambda$'
      - '$\tau = t_{1/2} = 5\,730$ ans : demi-vie et constante de temps sont deux noms de la même grandeur'
      - '$\tau = \ln 2 / t_{1/2} \approx 1{,}21 \times 10^{-4}$ an⁻¹ : le nombre de désintégrations par an'
      - '$\tau = t_{1/2}/2 = 2\,865$ ans : la moitié de la demi-vie'
      answer: 0
      feedback:
      - null
      - 'Non : $\tau$ est **plus grande** que $t_{1/2}$, car on divise par $\ln 2 = 0{,}693 < 1$ (soit $\tau \approx 1{,}44\,t_{1/2}$). Au bout de $\tau$ il reste $N_0/e \approx 37$ % des noyaux, et non 50 %.'
      - 'Non : c''est l''expression de la **constante radioactive** $\lambda = \ln 2 / t_{1/2}$, en an⁻¹ ; $\tau$ en est l''inverse. Et $\lambda$ n''est pas un nombre de désintégrations : celui-ci dépend aussi du nombre de noyaux présents.'
      - 'Non : $\tau = t_{1/2}/\ln 2$, et diviser par 0,693 **augmente** la valeur. La demi-vie n''est pas non plus « la moitié d''une durée de vie ».'
      explanation: '$\tau = t_{1/2}/\ln 2 = 5\,730/0{,}693 = 8\,268$ ans. Attention : le livre écrit « τ exprimée en s⁻¹ », c''est une coquille — cette relation donne bien une **durée**. C''est $\lambda = 1/\tau$ qui s''exprime en s⁻¹ (ou an⁻¹).'
      tags:
      - decroissance
    - type: input
      level: 3
      prompt: Calculer la constante de temps $\tau$ du carbone 14, avec $\tau = t_{1/2}/\ln 2$, $t_{1/2} = 5\,730$ ans et $\ln 2 = 0{,}693$. Répondre en années, arrondi à l'unité.
      answer: '8268'
      numeric: true
      tolerance: 20
      unit: ans
      explanation: '$\tau = 5\,730 / 0{,}693 = 8\,268$ ans, soit $8{,}27 \times 10^{3}$ ans. Vérification de cohérence : $\tau$ doit être **plus grande** que la demi-vie.'
      tags:
      - decroissance
    - type: input
      level: 3
      prompt: Au bout de combien de **demi-vies** reste-t-il, pour la première fois, **moins de 10 %** des noyaux père initiaux ? (répondre par un nombre entier)
      answer: '4'
      numeric: true
      tolerance: 0
      explanation: Après $n$ demi-vies il reste $N_0/2^n$. $1/2^3 = 0{,}125 = 12{,}5$ % (encore plus de 10 %) ; $1/2^4 = 0{,}0625 = 6{,}25$ % (moins de 10 %). Il faut donc $n = 4$ demi-vies.
      tags:
      - decroissance
    - type: guided
      level: 3
      title: Datation d'un charbon de bois par le carbone 14
      intro: 'Un archéologue prélève un fragment de **charbon de bois** dans un foyer préhistorique et mesure son activité : $A = 0{,}15$ Bq. À la mort de l''arbre, l''activité de ce fragment valait $A_0 = 0{,}25$ Bq.


        **Données** : demi-vie du carbone 14, $t_{1/2} = 5\,730$ ans ; $\ln 2 = 0{,}693$ ; célérité de la lumière, $c = 3{,}00 \times 10^{8}$ m·s⁻¹ ; perte de masse lors d''une désintégration de $^{14}_{6}\mathrm{C}$, $\Delta m = 2{,}8 \times 10^{-31}$ kg.

        {{fig:pc-decroissance-radioactive}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Écrire l''équation de la désintégration β⁻ du carbone 14 et identifier le noyau fils.'
        choices:
        - $^{14}_{6}\mathrm{C} \rightarrow {}^{14}_{7}\mathrm{N} + {}^{0}_{-1}\mathrm{e}$ — le noyau fils est l'azote 14
        - $^{14}_{6}\mathrm{C} \rightarrow {}^{14}_{5}\mathrm{B} + {}^{0}_{+1}\mathrm{e}$ — le noyau fils est le bore 14
        - $^{14}_{6}\mathrm{C} \rightarrow {}^{13}_{6}\mathrm{C} + {}^{1}_{0}\mathrm{n}$ — le noyau fils est le carbone 13
        - $^{14}_{6}\mathrm{C} \rightarrow {}^{10}_{4}\mathrm{Be} + {}^{4}_{2}\mathrm{He}$ — le noyau fils est le béryllium 10
        answer:
        - 0
        feedback:
        - null
        - 'C''est une désintégration β⁺ (émission d''un positron), pour laquelle $Z$ **diminue**. En β⁻, $Z$ **augmente** de 1 : 6 → 7.'
        - 'Ce n''est pas une désintégration β⁻ : aucune particule β n''est émise et le nombre de masse passerait de 14 à 13, alors que $A$ doit être conservé.'
        - Cette équation est équilibrée ($14 = 10 + 4$ et $6 = 4 + 2$) mais elle décrit une désintégration **α**, pas β⁻.
        explanation: '$^{14}_{6}\mathrm{C} \rightarrow {}^{14}_{7}\mathrm{N} + {}^{0}_{-1}\mathrm{e}$. Le noyau fils est l''**azote 14** (7 protons, 7 neutrons) : $A$ est conservé (14), $Z$ passe de 6 à 7.'
      - kind: mcq
        prompt: '**Étape 2.** Sans calculer l''âge, encadrer la date $t$ du fragment. On compare pour cela le rapport $A/A_0$ à 0,5.'
        choices:
        - $0 < t < t_{1/2}$, soit un âge inférieur à 5 730 ans
        - $t_{1/2} < t < 2\,t_{1/2}$, soit entre 5 730 et 11 460 ans
        - $t > 3\,t_{1/2}$, soit plus de 17 190 ans
        - $t = t_{1/2}$ exactement, soit 5 730 ans
        answer:
        - 0
        feedback:
        - null
        - 'Non : $A/A_0 = 0{,}60 > 0{,}5$, l''activité n''a pas encore été divisée par 2 : la première demi-vie n''est pas écoulée.'
        - 'Non : après 3 demi-vies il ne resterait que $1/8 = 0{,}125$ de l''activité initiale, bien moins que 0,60.'
        - 'Non : au bout d''exactement une demi-vie on aurait $A/A_0 = 0{,}50$ ; ici le rapport vaut 0,60.'
        explanation: '$A/A_0 = 0{,}15/0{,}25 = 0{,}60$. Comme $0{,}5 < 0{,}60 < 1$, moins d''une demi-vie s''est écoulée : $0 < t < 5\,730$ ans.'
      - kind: input
        prompt: '**Étape 3.** Calculer la constante de temps du carbone 14, $\tau = t_{1/2}/\ln 2$, en années (arrondir à l''unité).'
        answer: '8268'
        numeric: true
        tolerance: 20
        unit: ans
        explanation: $\tau = 5\,730/0{,}693 = 8\,268$ ans, soit $8{,}27 \times 10^{3}$ ans. $\tau$ est une **durée** ; c'est $\lambda = 1/\tau = 1{,}21 \times 10^{-4}$ an⁻¹ qui s'exprime en an⁻¹.
      - kind: input
        prompt: '**Étape 4.** De $A(t) = A_0\,e^{-t/\tau}$ on tire $t = \tau \times \ln(A_0/A)$. Calculer l''âge du fragment, en années.'
        answer: '4224'
        numeric: true
        tolerance: 60
        unit: ans
        explanation: $t = \tau \times \ln(A_0/A) = 8\,268 \times \ln(0{,}25/0{,}15) = 8\,268 \times \ln(1{,}667) = 8\,268 \times 0{,}511 = 4{,}22 \times 10^{3}$ ans. Le fragment a environ 4 220 ans, bien compris entre 0 et 5 730 ans comme prévu à l'étape 2.
      - kind: input
        prompt: '**Étape 5.** Quelle sera l''activité de cet échantillon dans 5 730 ans **supplémentaires** ? Répondre en becquerels.'
        answer: '0.075'
        numeric: true
        tolerance: 0.005
        unit: Bq
        explanation: 'Une durée supplémentaire égale à une demi-vie divise l''activité par 2 : $A'' = A/2 = 0{,}15/2 = 0{,}075$ Bq.'
      - kind: input
        prompt: '**Étape 6.** Calculer l''énergie libérée par **une seule** désintégration : $E = \Delta m \times c^2$, avec $\Delta m = 2{,}8 \times 10^{-31}$ kg. Répondre en joules, en écriture scientifique (par exemple 2,5e-14).'
        answer: '2.52e-14'
        numeric: true
        tolerance: 5.0e-16
        unit: J
        explanation: $E = 2{,}8 \times 10^{-31} \times (3{,}00 \times 10^{8})^2 = 2{,}8 \times 10^{-31} \times 9{,}00 \times 10^{16} = 2{,}52 \times 10^{-14}$ J.
      - kind: input
        prompt: '**Étape 7.** L''activité vaut $A = 0{,}15$ Bq, c''est-à-dire 0,15 désintégration par seconde. En déduire la puissance libérée $P = A \times E$, en watts (écriture scientifique).'
        answer: '3.78e-15'
        numeric: true
        tolerance: 1.0e-16
        unit: W
        explanation: '$P = 0{,}15 \times 2{,}52 \times 10^{-14} = 3{,}78 \times 10^{-15}$ W, soit environ $3{,}8 \times 10^{-15}$ W. C''est une puissance minuscule : l''échantillon est sans danger.'
      - kind: mcq
        prompt: '**Étape 8.** Pourquoi le carbone 14 ($t_{1/2} = 5\,730$ ans) convient-il à la datation **archéologique**, alors que l''uranium 235 ($t_{1/2} = 7{,}038 \times 10^{8}$ ans) n''y convient pas ?'
        choices:
        - Sur quelques milliers d'années l'activité du carbone 14 varie de façon mesurable, alors que celle de l'uranium 235 resterait indiscernable de $A_0$
        - Parce que l'uranium 235 n'est pas radioactif
        - Parce que l'uranium 235 se désintègre trop vite pour qu'il en reste
        - Parce que le carbone 14 a une activité initiale $A_0$ plus grande
        answer:
        - 0
        feedback:
        - null
        - 'Non : l''uranium 235 est bien radioactif, mais très **lentement** ($t_{1/2} = 7{,}038 \times 10^{8}$ ans).'
        - 'C''est l''inverse : sa demi-vie est très **longue**, donc il se désintègre très lentement. Il sert d''ailleurs aux datations géologiques.'
        - 'Non : ce n''est pas la valeur de $A_0$ qui compte, mais la **variation** relative $A/A_0$ sur la durée à mesurer.'
        explanation: 'Pour dater, il faut que le rapport $A/A_0$ ait sensiblement changé : la durée à mesurer doit être du même ordre de grandeur que $t_{1/2}$. Quelques milliers d''années, c''est l''ordre de la demi-vie du carbone 14 ; pour l''uranium 235, $t \ll t_{1/2}$ et la mesure serait indiscernable de $A_0$ — il convient en revanche aux datations géologiques.'
      tags:
      - decroissance
      - energie-nucleaire
  - id: pc-piles-accumulateurs
    title: Piles, accumulateurs et piles à combustible
    icon: 🔋
    description: Anode et cathode, polarité, pont salin ; pile, accumulateur (charge et décharge) et pile à combustible ; bilan de matière, capacité en A·h et énergie stockée.
    prerequisites:
    - pc-oxydoreduction
    lesson: lessons/pc-piles-accumulateurs.md
    items:
    - type: mcq
      level: 1
      prompt: 'Dans un générateur électrochimique, à quelle électrode a lieu l''**oxydation** ?

        {{fig:pc-pile-accumulateur}}'
      choices:
      - À l'anode
      - À la cathode
      - Au pont salin
      - Cela dépend du sens du courant
      answer: 0
      feedback:
      - null
      - 'Non : à la cathode a lieu la **réduction**. Moyen mnémotechnique : anode/oxydation (les deux voyelles), cathode/réduction (les deux consonnes).'
      - 'Non : le pont salin n''est pas une électrode ; il assure la neutralité électrique de chaque compartiment.'
      - 'Non : c''est toujours vrai. « L''oxydation a toujours lieu à l''anode, et la réduction à la cathode », en décharge comme en recharge.'
      explanation: 'Anode : oxydation, $\mathrm{red_1} = \mathrm{ox_1} + n_1\,e^-$. Cathode : réduction, $\mathrm{ox_2} + n_2\,e^- = \mathrm{red_2}$.'
      tags:
      - electrodes
    - type: mcq
      level: 1
      prompt: À quoi sert le **pont salin** dans une pile ?
      choices:
      - À assurer la neutralité électrique dans chaque compartiment
      - À laisser circuler les électrons entre les deux électrodes
      - À imposer le sens conventionnel du courant
      - À empêcher toute réaction chimique entre les deux compartiments
      answer: 0
      feedback:
      - null
      - 'Non : les électrons circulent par le **circuit extérieur** (« un échange d''électrons, via un circuit extérieur, entre deux électrodes »), pas par le pont salin, où seuls des ions se déplacent.'
      - 'Non : le sens conventionnel du courant découle de la polarité des électrodes, pas du pont salin.'
      - 'Au contraire : sans pont salin, la réaction s''arrêterait très vite, faute de neutralité électrique.'
      explanation: Le pont salin permet d'assurer la neutralité électrique dans chaque compartiment, en laissant migrer des ions.
      tags:
      - electrodes
    - type: mcq
      level: 1
      prompt: Qu'est-ce qui distingue un **accumulateur** d'une pile ?
      choices:
      - 'Sa transformation chimique est **réversible** : on peut le recharger en régénérant les réactifs'
      - Il ne met pas en jeu de couples oxydant/réducteur
      - Il délivre un courant alternatif
      - 'Sa transformation n''est pas spontanée : il faut un générateur pour l''amorcer'
      answer: 0
      feedback:
      - null
      - 'Non : comme la pile, un accumulateur fonctionne grâce à deux couples oxydant/réducteur qui échangent des électrons.'
      - 'Non : un générateur électrochimique délivre un courant **continu**.'
      - 'Non : la **décharge** d''un accumulateur est bien spontanée ; c''est la **recharge** qui exige un générateur extérieur.'
      explanation: 'La transformation d''un accumulateur est spontanée et **réversible** : il se décharge, puis on inverse le sens de la réaction pour régénérer les réactifs (quasi) disparus. Une pile met en jeu une transformation **irréversible**.'
      tags:
      - accumulateur
    - type: mcq
      level: 1
      prompt: 'Quels sont les deux réactifs d''une **pile à combustible** ?

        {{fig:pc-pile-combustible}}'
      choices:
      - Le dihydrogène $\mathrm{H_2}$ et le dioxygène $\mathrm{O_2}$
      - Le dihydrogène $\mathrm{H_2}$ et l'eau $\mathrm{H_2O}$
      - Le plomb $\mathrm{Pb}$ et le dioxyde de plomb $\mathrm{PbO_2}$
      - Le zinc $\mathrm{Zn}$ et le cuivre $\mathrm{Cu}$
      answer: 0
      feedback:
      - null
      - 'Non : l''eau est le **produit** de la réaction, pas un réactif.'
      - 'Non : $\mathrm{Pb}$ et $\mathrm{PbO_2}$ sont les électrodes d''un **accumulateur au plomb**.'
      - 'Non : $\mathrm{Zn}$ et $\mathrm{Cu}$ interviennent dans la **pile Daniell**.'
      explanation: $2\,\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{H_2O}$. Les couples sont $\mathrm{O_2}/\mathrm{H_2O}$ et $\mathrm{H^+}/\mathrm{H_2}$ ; le seul produit est de l'eau.
      tags:
      - pile-combustible
    - type: mcq
      level: 1
      prompt: Dans quelle unité exprime-t-on couramment la **capacité** d'un accumulateur ?
      choices:
      - L'ampère-heure (A·h)
      - L'ampère (A)
      - Le watt (W)
      - Le volt (V)
      answer: 0
      feedback:
      - null
      - 'Non : l''ampère mesure l''**intensité** du courant débité à un instant donné. La capacité vaut $Q = I \times t$ : il manque la durée.'
      - 'Non : le watt mesure une **puissance**. L''énergie stockée, elle, s''exprime en W·h avec $E = Q \times U$.'
      - 'Non : le volt mesure la **tension** aux bornes de l''accumulateur.'
      explanation: '$Q = I \times t$ : avec $I$ en ampères et $t$ en heures, $Q$ est en **ampère-heures (A·h)**. Conversion : 1 A·h = 3 600 C.'
      tags:
      - capacite
    - type: mcq
      level: 2
      prompt: Dans une pile en fonctionnement (transformation spontanée), quelle est la **polarité de l'anode** ?
      choices:
      - Borne négative, car les électrons produits par l'oxydation quittent l'anode
      - Borne positive, car les électrons arrivent à l'anode
      - Borne négative, car la réduction y a lieu
      - Borne positive, car l'oxydation y a lieu
      answer: 0
      feedback:
      - null
      - 'Non : les électrons **arrivent** à la cathode, qui est la borne positive.'
      - 'Non : c''est la **réduction** qui a lieu à la cathode ; l''anode est le siège de l''oxydation.'
      - 'L''oxydation a bien lieu à l''anode, mais l''anode est la borne **négative** : les électrons qu''elle produit la quittent.'
      explanation: 'Anode : oxydation $\mathrm{red_1} = \mathrm{ox_1} + n_1\,e^-$, les électrons quittent l''électrode : c''est la borne **négative**. Cathode : réduction, les électrons y arrivent : borne **positive**.'
      tags:
      - electrodes
    - type: mcq
      level: 2
      prompt: Dans le **circuit extérieur** d'une pile en fonctionnement, dans quel sens circulent les électrons ?
      choices:
      - De l'anode ⊖ vers la cathode ⊕, donc en sens **inverse** du courant conventionnel
      - De la cathode ⊕ vers l'anode ⊖, dans le même sens que le courant conventionnel
      - Par le pont salin, de l'anode vers la cathode
      - 'Ils ne circulent pas : seuls les ions se déplacent'
      answer: 0
      feedback:
      - null
      - 'Non : le sens conventionnel du courant va de la borne + vers la borne − dans le circuit extérieur ; les électrons, négatifs, vont en sens **inverse**.'
      - 'Non : les électrons passent par le **circuit extérieur**. Le pont salin ne fait circuler que des ions.'
      - 'Non : il y a bien un échange d''électrons via le circuit extérieur entre les deux électrodes — c''est lui qui produit le courant.'
      explanation: Les électrons sont produits par l'oxydation à l'anode ⊖, traversent le circuit extérieur et sont consommés par la réduction à la cathode ⊕. Le courant conventionnel, lui, va de ⊕ vers ⊖ dans le circuit extérieur.
      tags:
      - electrodes
    - type: mcq
      level: 2
      prompt: 'Lors de la **décharge** d''un accumulateur au plomb, quelle demi-équation a lieu à l''électrode de $\mathrm{PbO_2}$ (borne ⊕) ?

        {{fig:pc-pile-accumulateur}}'
      choices:
      - $\mathrm{PbO_2} + 4\,\mathrm{H^+} + 2\,e^- = \mathrm{Pb^{2+}} + 2\,\mathrm{H_2O}$ (réduction)
      - $\mathrm{Pb^{2+}} + 2\,\mathrm{H_2O} = \mathrm{PbO_2} + 4\,\mathrm{H^+} + 2\,e^-$ (oxydation)
      - $\mathrm{Pb} = \mathrm{Pb^{2+}} + 2\,e^-$ (oxydation)
      - $\mathrm{Pb^{2+}} + 2\,e^- = \mathrm{Pb}$ (réduction)
      answer: 0
      feedback:
      - null
      - 'C''est la demi-équation de la **recharge** à cette même électrode : les polarités ne changent pas, mais le sens de la réaction s''inverse.'
      - C'est ce qui se passe à l'**autre** électrode (Pb, borne ⊖) pendant la décharge.
      - C'est ce qui se passe à l'électrode Pb (borne ⊖) pendant la **recharge**.
      explanation: 'En décharge, l''électrode $\mathrm{PbO_2}$ (⊕) est le siège d''une **réduction** : $\mathrm{PbO_2} + 4\,\mathrm{H^+} + 2\,e^- = \mathrm{Pb^{2+}} + 2\,\mathrm{H_2O}$ ; l''électrode Pb (⊖) est le siège d''une oxydation : $\mathrm{Pb} = \mathrm{Pb^{2+}} + 2\,e^-$.'
      tags:
      - accumulateur
    - type: grid
      level: 2
      prompt: 'Accumulateur au plomb : pour chaque électrode, cochez la transformation qui s''y produit.

        {{fig:pc-pile-accumulateur}}'
      rows:
      - id: d1
        label: Décharge — électrode PbO₂ (⊕)
      - id: d2
        label: Décharge — électrode Pb (⊖)
      - id: r1
        label: Recharge — électrode PbO₂ (⊕)
      - id: r2
        label: Recharge — électrode Pb (⊖)
      cols:
      - id: Ox
        label: Oxydation
      - id: Re
        label: Réduction
      answer:
      - Red1
      - Oxd2
      - Oxr1
      - Rer2
      labels:
        Oxd1: 'décharge, PbO₂ : oxydation'
        Red1: 'décharge, PbO₂ : réduction'
        Oxd2: 'décharge, Pb : oxydation'
        Red2: 'décharge, Pb : réduction'
        Oxr1: 'recharge, PbO₂ : oxydation'
        Rer1: 'recharge, PbO₂ : réduction'
        Oxr2: 'recharge, Pb : oxydation'
        Rer2: 'recharge, Pb : réduction'
      cellFeedback:
        Oxd1: 'en décharge, PbO₂ **gagne** des électrons pour donner Pb²⁺ : c''est une réduction'
        Red2: 'en décharge, Pb **perd** des électrons (Pb = Pb²⁺ + 2 e⁻) : c''est une oxydation'
        Rer1: 'en recharge, Pb²⁺ redevient PbO₂ en **perdant** des électrons : c''est une oxydation'
        Oxr2: 'en recharge, Pb²⁺ redevient Pb en **gagnant** des électrons : c''est une réduction'
      explanation: 'Décharge : réduction de PbO₂ (⊕) et oxydation de Pb (⊖). Recharge : tout s''inverse. Les **polarités** ⊕ et ⊖ restent les mêmes ; c''est le sens de circulation des électrons — donc le rôle anode/cathode de chaque électrode — qui change.'
      tags:
      - accumulateur
    - type: input
      level: 2
      prompt: Lors de la décharge d'un accumulateur au plomb, 0,50 mol de $\mathrm{PbO_2}$ disparaît. D'après la demi-équation $\mathrm{PbO_2} + 4\,\mathrm{H^+} + 2\,e^- = \mathrm{Pb^{2+}} + 2\,\mathrm{H_2O}$, quelle quantité de matière d'électrons a été échangée, en mol ?
      answer: '1.0'
      numeric: true
      tolerance: 0.01
      unit: mol
      explanation: 'La quantité de matière d''électrons échangés est égale au **double** de celle de $\mathrm{PbO_2}$ disparue : $n(e^-) = 2 \times 0{,}50 = 1{,}0$ mol.'
      tags:
      - bilan-matiere
    - type: input
      level: 2
      prompt: Une pile à combustible consomme 0,80 mol de dioxygène ($2\,\mathrm{H_2} + \mathrm{O_2} \rightarrow 2\,\mathrm{H_2O}$). Quelle quantité de matière d'eau se forme, en mol ?
      answer: '1.6'
      numeric: true
      tolerance: 0.01
      unit: mol
      explanation: 'L''équation indique 2 mol d''eau formée pour 1 mol de $\mathrm{O_2}$ consommée : $n(\mathrm{H_2O}) = 2 \times 0{,}80 = 1{,}6$ mol. C''est aussi la quantité de $\mathrm{H_2}$ consommée.'
      tags:
      - bilan-matiere
      - pile-combustible
    - type: input
      level: 2
      prompt: Un accumulateur débite un courant constant $I = 2{,}5$ A pendant 4,0 h avant d'être vide. Quelle est sa **capacité** $Q$, en ampères-heures ?
      answer: '10'
      numeric: true
      tolerance: 0.1
      unit: A·h
      explanation: '$Q = I \times t = 2{,}5 \times 4{,}0 = 10$ A·h. Attention à l''unité de temps : la capacité en A·h s''obtient avec $t$ en **heures**.'
      tags:
      - capacite
    - type: input
      level: 2
      prompt: Une batterie de voiture a une capacité $Q = 60$ A·h et une tension nominale $U = 12$ V. Quelle énergie stocke-t-elle, en wattheures ?
      answer: '720'
      numeric: true
      tolerance: 5
      unit: W·h
      explanation: $E = Q \times U = 60 \times 12 = 720$ W·h, soit 0,72 kW·h. Avec $Q$ en A·h et $U$ en V, $E$ est directement en W·h.
      tags:
      - capacite
    - type: input
      level: 2
      prompt: Une batterie de téléphone a une capacité $Q = 3\,000$ mA·h ; l'appareil consomme en moyenne $I = 250$ mA. Quelle est son autonomie, en heures ?
      answer: '12'
      numeric: true
      tolerance: 0.2
      unit: h
      explanation: '$t = Q/I = 3\,000/250 = 12$ h. Les milliampères-heures se divisent par des milliampères : inutile de convertir, mais les deux unités doivent être cohérentes.'
      tags:
      - capacite
    - type: mcq
      level: 3
      prompt: 'Deux batteries ont la même tension nominale : l''une porte l''indication « 5 A·h », l''autre « 5 A ». Que peut-on en conclure ?'
      choices:
      - 'Ce ne sont pas les mêmes grandeurs : 5 A·h est une **capacité** (réserve de charge), 5 A un **courant** (débit)'
      - Elles stockent la même énergie
      - La seconde se décharge dix fois plus vite
      - 5 A·h et 5 A, c'est la même chose écrite autrement
      answer: 0
      feedback:
      - null
      - 'Non : seule la capacité (en A·h), associée à la tension, donne l''énergie $E = Q \times U$. Une intensité seule ne dit rien sur la réserve d''énergie.'
      - 'Non : on ne peut pas comparer un débit et une réserve. « 5 A » indique sans doute le courant maximal admissible, pas l''autonomie.'
      - 'Non : l''ampère-heure est un ampère **multiplié par une heure** (1 A·h = 3 600 C) : c''est une quantité d''électricité, pas une intensité.'
      explanation: '$Q = I \times t$ : la capacité (A·h) est le produit d''un courant par une durée. Une batterie de 5 A·h débite 5 A pendant 1 h, ou 1 A pendant 5 h, ou 0,5 A pendant 10 h.'
      tags:
      - capacite
    - type: mcq
      level: 3
      prompt: On branche un accumulateur au plomb sur un chargeur. Que deviennent les **polarités** de ses électrodes ?
      choices:
      - Elles restent inchangées (PbO₂ reste ⊕, Pb reste ⊖) ; c'est le sens de circulation des électrons qui s'inverse
      - 'Elles s''inversent : l''électrode PbO₂ devient la borne ⊖'
      - 'Elles disparaissent : en recharge l''accumulateur n''a plus de polarité'
      - Elles restent inchangées, et le sens de circulation des électrons aussi
      answer: 0
      feedback:
      - null
      - 'Non : « les polarités demeurent inchangées, contrairement au sens de circulation des électrons ». Ce qui change, c''est le rôle anode/cathode de chaque électrode.'
      - 'Non : les électrodes gardent leurs bornes ⊕ et ⊖ — c''est d''ailleurs pourquoi il faut respecter le branchement du chargeur.'
      - 'Non : si le sens des électrons ne changeait pas, la réaction ne s''inverserait pas et l''accumulateur ne se rechargerait pas.'
      explanation: 'En recharge, le générateur impose le sens du courant : l''électrode PbO₂ (toujours ⊕) devient le siège d''une **oxydation**, donc l''anode ; l''électrode Pb (toujours ⊖) devient le siège d''une **réduction**, donc la cathode.'
      tags:
      - accumulateur
    - type: mcq
      level: 3
      prompt: 'Pile Daniell : $\mathrm{Cu^{2+}} + \mathrm{Zn} \rightarrow \mathrm{Cu} + \mathrm{Zn^{2+}}$. Si 0,30 mol d''ions $\mathrm{Cu^{2+}}$ ont été consommés, quelle quantité de matière d''électrons a circulé dans le circuit extérieur ?'
      choices:
      - 0,60 mol
      - 0,30 mol
      - 0,15 mol
      - 2 mol
      answer: 0
      feedback:
      - null
      - 'Non : la demi-équation est $\mathrm{Cu^{2+}} + 2\,e^- = \mathrm{Cu}$ : il faut **2** électrons par ion $\mathrm{Cu^{2+}}$.'
      - 'Non : c''est la moitié. Il faut au contraire **doubler** la quantité de matière.'
      - 'Non : le 2 de la demi-équation est un **coefficient**, il multiplie la quantité consommée : $2 \times 0{,}30 = 0{,}60$ mol.'
      explanation: $n(e^-) = 2 \times n(\mathrm{Cu^{2+}}) = 2 \times 0{,}30 = 0{,}60$ mol. Par ailleurs $n(\mathrm{Zn^{2+}})$ formé $= n(\mathrm{Cu^{2+}})$ consommé $= 0{,}30$ mol.
      tags:
      - bilan-matiere
  - id: pc-acido-basique
    title: Réactions acido-basiques et pH
    icon: 🧪
    description: Acide et base de Brønsted, couples acide/base, réaction acido-basique, pH et concentration en ions oxonium, mesure du pH, effet d'une dilution.
    prerequisites: []
    lesson: lessons/pc-acido-basique.md
    items:
    - type: mcq
      level: 1
      prompt: Selon Brønsted, qu'est-ce qu'un **acide** ?
      choices:
      - Une espèce chimique capable de **céder** au moins un proton $\mathrm{H^+}$
      - Une espèce chimique capable de **capter** au moins un proton $\mathrm{H^+}$
      - Une espèce chimique capable de capter au moins un électron
      - Une solution dont le pH est inférieur à 7,0
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition de la **base** selon Brønsted.'
      - 'Non : capter un **électron**, c''est être un oxydant ; céder un **proton**, c''est être un acide.'
      - 'Non : le pH caractérise une **solution**. La définition de Brønsted porte sur une **espèce chimique** et sur l''échange de protons.'
      explanation: 'Un acide cède au moins un proton : $\mathrm{AH} \rightarrow \mathrm{A^-} + \mathrm{H^+}$ (ou $\mathrm{AH^+} \rightarrow \mathrm{A} + \mathrm{H^+}$).'
      tags:
      - bronsted
    - type: mcq
      level: 1
      prompt: Selon Brønsted, qu'est-ce qu'une **base** ?
      choices:
      - Une espèce chimique capable de **capter** au moins un proton $\mathrm{H^+}$
      - Une espèce chimique capable de **céder** au moins un proton $\mathrm{H^+}$
      - Une espèce chimique capable de céder au moins un électron
      - Une espèce chimique dont le pH est supérieur à 7,0
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition de l''**acide** selon Brønsted.'
      - 'Non : céder un **électron**, c''est être un réducteur ; capter un **proton**, c''est être une base.'
      - 'Non : le pH caractérise une **solution**, pas une espèce chimique.'
      explanation: 'Une base capte au moins un proton : $\mathrm{A^-} + \mathrm{H^+} \rightarrow \mathrm{AH}$ (ou $\mathrm{A} + \mathrm{H^+} \rightarrow \mathrm{AH^+}$).'
      tags:
      - bronsted
    - type: mcq
      level: 1
      prompt: Quel **couple acide/base** est correctement écrit ?
      choices:
      - $\mathrm{CH_3COOH}/\mathrm{CH_3COO^-}$
      - $\mathrm{CH_3COO^-}/\mathrm{CH_3COOH}$
      - $\mathrm{HO^-}/\mathrm{H_2O}$
      - $\mathrm{H_2O}/\mathrm{H_3O^+}$
      answer: 0
      feedback:
      - null
      - 'L''ordre est inversé : dans un couple on écrit l''**acide** en premier (celui qui cède le proton), puis la base.'
      - 'L''ordre est inversé : c''est $\mathrm{H_2O}$ qui cède un proton pour donner $\mathrm{HO^-}$, donc le couple s''écrit $\mathrm{H_2O}/\mathrm{HO^-}$.'
      - 'L''ordre est inversé : c''est $\mathrm{H_3O^+}$ qui cède un proton pour donner $\mathrm{H_2O}$, donc le couple s''écrit $\mathrm{H_3O^+}/\mathrm{H_2O}$.'
