      numeric: true
      tolerance: 10
      unit: W
      explanation: '$P = C \times \omega = 1\,200 \times 5 = 6\,000$ W. Vérification par l''autre expression : avec $F = 8\,000$ N et $V = 0{,}75$ m·s⁻¹, $P = F \times V = 6\,000$ W.'
      tags:
      - puissance
    - type: input
      level: 2
      prompt: 'Ce moteur absorbe 10 000 W et la roue motrice restitue 6 000 W. Quel est le rendement global de la chaîne d''énergie ? (2 décimales, sans unité)

