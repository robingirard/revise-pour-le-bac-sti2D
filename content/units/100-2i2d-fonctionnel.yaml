      answer: '0.6'
      numeric: true
      tolerance: 0.02
      unit: ''
      explanation: '$\eta = P_{\text{sortie}} / P_{\text{entrée}} = 6\,000 / 10\,000 = 0{,}60$, soit **60 %**. Les 4 000 W manquants sont les « Pertes » figurées sur la chaîne fonctionnelle.'
      tags:
