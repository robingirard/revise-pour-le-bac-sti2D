      level: 3
      title: 'Le trolleybus CRISTALIS : remonter la chaîne énergétique'
      intro: 'On compare les impacts environnementaux d''un **trolleybus CRISTALIS** (alimenté en électricité par des lignes aériennes) et d''un **autobus CITELIS** (gazole).

        **Trolleybus** : 2,7 kWh pour 1 km, soit **9,7 MJ·km⁻¹** en entrée du véhicule ; émissions **92 g Eq CO₂/km** ; 96 passagers au maximum.

        **Chaîne électrique, de l''amont vers l''aval** : énergies primaires → production d''électricité ($\eta_{\text{nucléaire}} = 0{,}30$ ; $\eta_{\text{flamme}} = 0{,}35$ ; aucun rendement indiqué pour la filière renouvelable, on prendra 1) → réseau de transport ($\eta_{\text{transport}} = 0{,}95$) → réseau de distribution ($\eta_{\text{alimentation}} = 0{,}97$) → trolleybus.

        **Origine de l''électricité en France (2024)** : thermique nucléaire 75 %, hydraulique 12 %, éolien et autres énergies renouvelables 3 %, thermique gaz 5 %, thermique charbon 4 %, thermique pétrole 1 %.

        **Autobus** : 42 L de gazole pour 100 km ; pouvoir calorifique du gazole 38 080 kJ·L⁻¹ ; $\eta_{\text{raffinage}} = 0{,}94$, soit **17,0 MJ·km⁻¹** d''énergie primaire ; émissions **1 409 g Eq CO₂/km**.

        {{fig:2i2d-rendements-cascade-muet}}'
      steps:
