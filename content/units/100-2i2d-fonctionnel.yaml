    lesson: lessons/2i2d-chaines.md
    items:
    - type: order
      level: 1
      prompt: 'Remettez dans l''ordre les cinq fonctions de la **chaîne d''énergie**, de l''entrée vers l''action.

        {{fig:2i2d-chaine-energie}}'
      steps:
      - Alimenter
      - Distribuer
      - Convertir
      - Transmettre
      - Agir
      explanation: 'La chaîne d''énergie (ou chaîne de puissance) se présente en général sous la forme Alimenter → Distribuer → Convertir → Transmettre → Agir.'
      tags:
      - chaine-energie
    - type: mcq
      level: 1
      prompt: 'Sur quel bloc de la chaîne d''énergie arrivent les **ordres** issus de la chaîne d''information ?

        {{fig:2i2d-chaine-energie}}'
      choices:
      - Sur le bloc Distribuer
      - Sur le bloc Alimenter
      - Sur le bloc Agir
      - Sur le bloc Convertir
      answer: 0
      feedback:
      - null
      - 'Non : *Alimenter* fournit l''énergie en permanence (réseau, batterie) ; ce n''est pas lui qu''on commande.'
      - 'Non : *Agir* est l''effecteur, en bout de chaîne ; il subit l''énergie qu''on lui envoie.'
      - 'Non : le convertisseur (moteur, vérin) reçoit l''énergie **déjà aiguillée** par le distributeur.'
      explanation: 'Les ordres arrivent sur **Distribuer** : c''est ce bloc (contacteur, distributeur, variateur) qui laisse passer, ou non, l''énergie vers le convertisseur.'
      tags:
      - chaine-energie
    - type: mcq
      level: 1
      prompt: Dans une chaîne d'énergie, à quelle fonction correspond un **distributeur pneumatique** ?
      choices:
      - Distribuer
      - Convertir
      - Transmettre
      - Agir
      answer: 0
      feedback:
      - null
      - 'Non : *Convertir* change la nature de l''énergie (moteur électrique, pompe, vérin, compresseur).'
      - 'Non : *Transmettre* adapte le mouvement (engrenages, poulies-courroie, pignon-crémaillère).'
      - 'Non : *Agir* désigne l''effecteur final (ventouse, roue, chenille, pince).'
      explanation: 'Composants « Distribuer » courants : transistor, distributeur pneumatique, contacteur, relais.'
      tags:
      - chaine-energie
    - type: mcq
      level: 1
      prompt: Dans une chaîne d'énergie, à quelle fonction correspond un **moteur électrique** ?
      choices:
      - Convertir
      - Alimenter
      - Transmettre
      - Agir
      answer: 0
      feedback:
      - null
      - 'Non : *Alimenter*, c''est fournir l''énergie brute (réseau EDF, batterie, réservoir).'
      - 'Non : *Transmettre* adapte vitesse et couple sans changer la nature de l''énergie.'
      - 'Non : *Agir*, c''est l''effecteur qui touche la matière d''œuvre.'
      explanation: 'Le moteur électrique transforme de l''énergie électrique en énergie mécanique : il **convertit**. Même fonction pour une pompe, un vérin ou un compresseur.'
      tags:
      - chaine-energie
    - type: mcq
      level: 1
      prompt: 'Sur le pont transbordeur, un **réducteur à engrenages** est intercalé entre le moteur électrique et les roues du chariot. Quelle fonction remplit-il ?'
      choices:
