  - id: 2i2d-chaines
    title: Chaînes d'information et de puissance
    icon: ⛓️
    description: Alimenter, distribuer, convertir, transmettre, agir ; grandeurs de flux et d'effort ; puissances, rendements et pertes.
    prerequisites:
