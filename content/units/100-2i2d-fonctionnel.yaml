# Ingénierie 2I2D (Tle) — étude fonctionnelle et étude structurelle d'un produit
# Sources : docs/notes/cours-tle-a.md,
#           docs/notes/exercices-tle-a.md (exercices 1, 2, 3 et 4, p. 306-319),
#           docs/notes/exercices-tle-b.md (exercice 4, p. 320-322).
units:
- id: 2i2d-fonctionnel
  matiere: ingenierie
  title: '2I2D Tle : analyse fonctionnelle et structurelle'
  description: Cahier des charges, diagrammes SysML (uc, req, bdd, ibd), chaînes d'information et de puissance, schéma cinématique 3D et énergie fluidique.
  skills:
  - id: 2i2d-cas-exigences
    title: Cas d'utilisation et exigences
    icon: 📋
    description: Cahier des charges, diagramme des cas d'utilisation (uc), diagramme d'exigences (req), liens include, extend, refine et décomposition.
    prerequisites: []
    lesson: lessons/2i2d-cas-exigences.md
    items:
    - type: mcq
      level: 1
      prompt: Quel document définit ce que l'utilisateur attend du produit, en termes de fonctions et de fonctionnalités ?
      choices:
      - Le cahier des charges
      - Le diagramme des cas d'utilisation
      - Le schéma cinématique
      - Le diagramme de blocs internes (ibd)
      answer: 0
      feedback:
      - null
      - 'Non : le diagramme des cas d''utilisation **met en image** une partie du besoin, mais le document de référence est le cahier des charges.'
      - 'Non : le schéma cinématique sert à analyser les mouvements ; il appartient à l''étude structurelle.'
      - 'Non : l''ibd décrit les échanges internes entre composants, pas les attentes de l''utilisateur.'
      explanation: Le cahier des charges est le document (ou dossier de documents) qui définit ce que l'utilisateur attend du produit.
      tags:
      - cahier-des-charges
    - type: mcq
      level: 1
      prompt: 'Que présente un **diagramme des cas d''utilisation** (uc) ?

        {{fig:2i2d-uc-transbordeur}}'
      choices:
      - Les interactions entre le système et son environnement
      - L'architecture matérielle du système
      - Les mouvements des pièces les unes par rapport aux autres
      - La suite des instructions exécutées par le programme
      answer: 0
      feedback:
      - null
      - 'Non : l''architecture matérielle est décrite par le diagramme de définition de blocs (bdd).'
      - 'Non : les mouvements relèvent du schéma cinématique.'
      - 'Non : le déroulement d''un programme se décrit par un algorigramme ou un diagramme d''activité.'
      explanation: Le diagramme des cas d'utilisation présente les interactions entre le système et son environnement ; il décrit **ce que** le système devra faire, **sans spécifier comment**.
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: 'Sur un diagramme des cas d''utilisation, que signifie le lien `«include»` ?

        {{fig:2i2d-uc-elements}}'
      choices:
      - La fonction pointée est indispensable à la réalisation de la fonction principale
      - La fonction pointée n'est pas indispensable à la fonction principale
      - La fonction pointée est un acteur secondaire
      - La fonction pointée est une exigence de priorité haute
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition de `«extend»`, la liaison d''**extension**.'
      - 'Non : les acteurs sont dessinés **hors** de la frontière du système ; `«include»` relie deux cas d''utilisation.'
      - 'Non : les priorités (1, 2, 3) appartiennent au diagramme d''**exigences**, pas au diagramme des cas d''utilisation.'
      explanation: '`«include»` est la liaison d''**inclusion** : la fonction pointée est indispensable.'
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: 'Sur un diagramme des cas d''utilisation, que signifie le lien `«extend»` ?

        {{fig:2i2d-uc-elements}}'
      choices:
      - La fonction à l'origine de la flèche n'est pas indispensable à la fonction principale
      - La fonction à l'origine de la flèche est obligatoire
      - Le système est étendu à un nouvel acteur
      - Le cas d'utilisation est décomposé en sous-fonctions
      answer: 0
      feedback:
      - null
      - 'Non : le caractère obligatoire est marqué par `«include»`.'
      - 'Non : l''ajout d''un acteur se fait simplement en le dessinant hors de la frontière, relié par un trait plein.'
      - 'Non : la décomposition (cercle barré d''une croix) appartient au diagramme d''exigences.'
      explanation: '`«extend»` est la liaison d''**extension** : le service qu''elle porte est un « plus », pas une nécessité.'
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: Où place-t-on les **acteurs principaux** sur un diagramme des cas d'utilisation ?
      choices:
      - À gauche du système, les acteurs secondaires étant à droite
      - À droite du système, les acteurs secondaires étant à gauche
      - À l'intérieur de la frontière du système
      - En bas du diagramme, dans une légende
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''inverse — la convention place les acteurs **principaux** à gauche.'
      - 'Non : les acteurs sont par définition à l''**extérieur** du système ; le rectangle en marque la frontière.'
      - 'Non : les acteurs sont reliés par des traits pleins aux cas d''utilisation, ils ne sont pas relégués en légende.'
      explanation: 'Convention de lecture : acteurs principaux à gauche du rectangle, acteurs secondaires à droite.'
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: 'Sur un diagramme des cas d''utilisation, que représente le **rectangle** qui entoure les ovales ?

        {{fig:2i2d-uc-transbordeur}}'
      choices:
      - La frontière du système étudié
      - L'ensemble des acteurs
      - Le cahier des charges
      - Une exigence de priorité haute
      answer: 0
      feedback:
      - null
      - 'Non : les acteurs sont justement dessinés **à l''extérieur** de ce rectangle.'
      - 'Non : le cahier des charges est un document ; le rectangle délimite le système.'
      - 'Non : les exigences se dessinent sur le diagramme `req`, sous forme de boîtes à deux compartiments.'
      explanation: Le système est délimité par le rectangle qui constitue sa frontière ; à l'intérieur se trouvent les cas d'utilisation, à l'extérieur les acteurs.
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: 'Sur le diagramme des cas d''utilisation du pont transbordeur, les **bateaux** sont représentés par un petit bloc en trois dimensions. Pourquoi ?'
      choices:
      - Ce sont des « choses » en interaction avec le système, et non des acteurs humains
      - Ce sont des acteurs humains dessinés en perspective
      - C'est le symbole d'un cas d'utilisation
      - C'est le symbole d'une exigence physique
      answer: 0
      feedback:
      - null
      - 'Non : un acteur humain se dessine sous forme de bonhomme filiforme.'
      - 'Non : un cas d''utilisation est une **ellipse** placée à l''intérieur du système.'
      - 'Non : une exigence physique est une boîte du diagramme `req`, avec un Id et un texte.'
      explanation: 'On distingue les **acteurs humains** (bonhomme filiforme) des « **choses** » en interaction avec le système (bateaux, énergie, voiture…), figurées par un petit bloc 3D.'
      tags:
      - uc
    - type: mcq
      level: 1
      prompt: Que décrit un **diagramme d'exigences** (req) ?
      choices:
      - Les fonctions que doit réaliser le système et les contraintes qu'il doit respecter
      - Les composants matériels du système
      - Les échanges d'énergie entre les blocs
      - Les mouvements du mécanisme
      answer: 0
      feedback:
      - null
      - 'Non : les composants sont décrits par le diagramme de définition de blocs (bdd).'
      - 'Non : les échanges internes sont décrits par le diagramme de blocs internes (ibd).'
      - 'Non : les mouvements relèvent du schéma cinématique.'
      explanation: 'Le diagramme d''exigences décrit les exigences du cahier des charges : les fonctions à réaliser et les contraintes à respecter.'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: 'Sur un diagramme d''exigences, que signifie le lien `«refine»` ?

        {{fig:2i2d-req-transbordeur}}'
      choices:
      - Il ajoute des précisions sur l'élément pointé
      - Il indique que l'exigence pointée découle d'une autre
      - Il indique qu'un objet répond à la demande formulée
      - Il décompose une exigence générale en exigences détaillées
      answer: 0
      feedback:
      - null
      - 'Non : « découle de » est le sens de `«deriveRqt»`.'
      - 'Non : « répond à la demande » est le sens de `«satisfy»`.'
      - 'Non : la décomposition se trace par un trait plein terminé par un cercle barré d''une croix ⊕.'
      explanation: '`«refine»` : flèche pointillée qui **ajoute des précisions** sur l''élément pointé. Sur le pont transbordeur, l''exigence « 5 » (dimensions du busway) précise l''exigence « 1.1.2 » (traversée en busway).'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: Sur un diagramme d'exigences, que signifie le lien `«deriveRqt»` ?
      choices:
      - L'exigence découle, est déduite de l'exigence pointée
      - L'exigence ajoute des précisions sur l'élément pointé
      - L'exigence est facultative
      - L'exigence est de priorité basse
      answer: 0
      feedback:
      - null
      - 'Non : « ajouter des précisions » est le rôle de `«refine»`.'
      - 'Non : aucun lien SysML ne rend une exigence facultative ; c''est `«extend»`, sur le diagramme des cas d''utilisation, qui marque un service non indispensable.'
      - 'Non : la priorité s''écrit séparément (1 haute, 2 moyenne, 3 basse), elle ne dépend pas du lien.'
      explanation: '`«deriveRqt»` signifie que l''exigence **découle**, est **déduite** de l''exigence pointée.'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: 'Sur un diagramme d''exigences, une flèche pointillée `«satisfy»` part d''un bloc « Liaison : USB » vers une exigence. Que veut-elle dire ?'
      choices:
      - Cet élément répond à la demande formulée par l'exigence pointée
      - Cette exigence est de priorité haute
      - Cette exigence est décomposée en sous-exigences
      - Cet élément remplace l'exigence pointée
      answer: 0
      feedback:
      - null
      - 'Non : la priorité s''indique par 1, 2 ou 3, indépendamment des liens.'
      - 'Non : la décomposition se trace par le cercle barré d''une croix ⊕.'
      - 'Non : la solution technique **satisfait** l''exigence, elle ne la supprime pas ; l''exigence reste au cahier des charges.'
      explanation: '`«satisfy»` : l''élément (souvent un nom d''objet ou une solution technique) **répond à la demande** formulée par l''exigence pointée.'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: 'Sur un diagramme d''exigences, un trait plein se termine par un **cercle barré d''une croix** (⊕) du côté de l''exigence « 1 ». Que signifie ce symbole ?

        {{fig:2i2d-req-transbordeur}}'
      choices:
      - L'exigence « 1 » est constituée d'un ensemble d'exigences plus détaillées
      - L'exigence « 1 » est en contradiction avec les autres
      - L'exigence « 1 » est optionnelle
      - L'exigence « 1 » est satisfaite par un composant
      answer: 0
      feedback:
      - null
      - 'Non : aucun symbole SysML ne signale une contradiction ; ⊕ marque une **composition**.'
      - 'Non : le caractère optionnel se marque, sur un bdd, par un losange **blanc**.'
      - 'Non : la satisfaction par un composant se note `«satisfy»`, en pointillés.'
      explanation: 'Le lien de décomposition indique qu''une exigence générale est constituée d''un **ensemble d''exigences plus détaillées** : « 1 » se décompose en « 1.1 » et « 1.3 ».'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: 'Sur un diagramme d''exigences, une exigence porte la priorité **3**. Que cela signifie-t-il ?'
      choices:
      - Sa priorité est basse
      - Sa priorité est haute
      - Elle se décompose en 3 exigences
      - Elle est reliée à 3 autres exigences
      answer: 0
      feedback:
      - null
      - 'Non : la priorité haute est notée **1**.'
      - 'Non : le nombre d''exigences filles n''a rien à voir avec la priorité.'
      - 'Non : le nombre de liens ne se lit pas dans la priorité.'
      explanation: 'Une priorité haute, moyenne ou basse (**1, 2, 3**) peut être associée à chaque exigence : plus le nombre est grand, plus la priorité est basse.'
      tags:
      - req
    - type: match
      level: 2
      prompt: Associez chaque exigence du pont transbordeur au **stéréotype** qui lui convient.
      pairs:
      - left: Deux cabines permettent le passage simultané de 270 personnes
        right: '«functional Requirement»'
      - left: Le busway mesure 2,55 m de large et 3,12 m de haut
        right: '«physical Requirement»'
      - left: Le sas d'entrée doit être accessible aux personnes handicapées
        right: '«usability Requirement»'
      - left: Le passage doit être effectué en 1,75 minute
        right: '«performance Requirement»'
      tags:
      - req
    - type: grid
      level: 2
      prompt: Pour chaque élément, cochez le diagramme sur lequel on le rencontre.
      rows:
      - id: act
        label: Un acteur (bonhomme filiforme)
      - id: ell
        label: Un cas d'utilisation (ellipse)
      - id: inc
        label: Un lien « include »
      - id: idt
        label: Une boîte avec Id = "…" et Text = "…"
      - id: ref
        label: Un lien « refine »
      - id: pri
        label: Une priorité 1, 2 ou 3
      cols:
      - id: U
        label: Cas d'utilisation (uc)
      - id: R
        label: Exigences (req)
      answer:
      - Uact
      - Uell
      - Uinc
      - Ridt
      - Rref
      - Rpri
      cellFeedback:
        Uact: les acteurs sont dessinés hors de la frontière du système, sur le diagramme uc
        Ract: 'un diagramme d''exigences ne contient que des boîtes d''exigences : pas d''acteur'
        Uell: 'chaque service rendu est une ellipse du diagramme uc'
        Rell: 'les exigences sont des rectangles à deux compartiments, jamais des ellipses'
        Uinc: '« include » relie deux cas d''utilisation'
        Rinc: '« include » et « extend » n''existent que sur le diagramme uc'
        Uidt: 'les ellipses du uc ne portent ni Id ni Text : ce sont des exigences'
        Ridt: 'chaque exigence porte un identifiant Id et un texte Text'
        Uref: '« refine » relie deux exigences, sur le diagramme req'
        Rref: '« refine » précise l''élément pointé, sur le diagramme req'
        Upri: la priorité caractérise une exigence, pas un cas d'utilisation
        Rpri: 'une priorité haute, moyenne ou basse (1, 2, 3) peut être associée à chaque exigence'
      explanation: 'Le `uc` parle d''**acteurs** et de **services** (ellipses, liens include/extend) ; le `req` parle d''**exigences** (Id, Text, priorité, liens refine, deriveRqt, satisfy).'
      tags:
      - req
    - type: input
      level: 2
      prompt: 'D''après le diagramme d''exigences du pont transbordeur, deux cabines fermées permettent le passage simultané de 270 personnes, et un busway transporte jusqu''à 150 personnes. Combien de personnes peuvent traverser la Loire lors d''une même traversée ?

        {{fig:2i2d-req-transbordeur}}'
      answer: '420'
      numeric: true
      tolerance: 0
      unit: personnes
      explanation: 'Il faut **additionner** les passagers des cabines et ceux du busway : $270 + 150 = 420$ personnes.'
      tags:
      - req
    - type: input
      level: 2
      prompt: 'Une exigence du pont transbordeur impose un tirant d''air minimal de 55 m entre la Loire à marée haute et le dessous du tablier. Quelle hauteur libre, en mètres, faut-il donc garantir ?'
      answer: '55'
      numeric: true
      tolerance: 0
      unit: m
      explanation: 'La réponse se **lit** directement dans le texte de l''exigence : 55 mètres. Un diagramme d''exigences n''est pas décoratif, il contient les données chiffrées du projet.'
      tags:
      - req
    - type: mcq
      level: 2
      prompt: 'Sur le diagramme des cas d''utilisation du pont transbordeur, quel lien relie « Franchir la Loire » à « Permettre le passage de bateaux » ?

        {{fig:2i2d-uc-transbordeur}}'
      choices:
      - '`«include»`, car laisser passer les bateaux est indispensable au projet'
      - '`«extend»`, car le passage des bateaux est un service en plus'
      - '`«refine»`, car le passage des bateaux précise le franchissement'
      - '`«satisfy»`, car les bateaux satisfont l''exigence de franchissement'
      answer: 0
      feedback:
      - null
      - 'Non : sur la Loire, un pont doit **obligatoirement** laisser passer les navires ; ce n''est pas un supplément.'
      - 'Non : `«refine»` est un lien du diagramme d''**exigences**, pas du diagramme des cas d''utilisation.'
      - 'Non : `«satisfy»` appartient lui aussi au diagramme d''exigences.'
      explanation: 'Le passage des bateaux conditionne tout le projet (c''est même la raison d''être d''un pont transbordeur) : la liaison est une **inclusion**.'
      tags:
      - uc
    - type: mcq
      level: 3
      prompt: 'Sur le même diagramme, « Déambuler sur la rue aérienne » est relié à « Franchir la Loire » par `«extend»`. Qu''en déduire ?

        {{fig:2i2d-uc-transbordeur}}'
      choices:
      - La promenade sur la rue aérienne est un service supplémentaire, non indispensable au franchissement
      - La promenade est indispensable au franchissement de la Loire
      - La rue aérienne est un acteur du système
      - La rue aérienne est une contrainte physique du cahier des charges
      answer: 0
      feedback:
      - null
      - 'Non : le caractère indispensable se marque par `«include»`.'
      - 'Non : la rue aérienne fait partie du système, ce n''est pas un acteur extérieur.'
      - 'Non : les contraintes physiques figurent sur le diagramme d''exigences ; ici on lit un diagramme de cas d''utilisation.'
      explanation: 'On peut franchir la Loire sans se promener : la déambulation **étend** le service principal. C''est un argument touristique du projet (exigence « 1.3 » Tourisme et affaires), pas une nécessité technique.'
      tags:
      - uc
    - type: mcq
      level: 3
      prompt: Un élève écrit, sous le diagramme des cas d'utilisation d'un portail automatique, « le moteur entraîne un pignon-crémaillère ». Pourquoi cette phrase n'a-t-elle pas sa place ici ?
      choices:
      - Parce que le diagramme des cas d'utilisation dit ce que le système fait, jamais comment il le fait
      - Parce qu'un portail n'a pas d'acteur
      - Parce que le pignon-crémaillère n'est pas une solution valable
      - Parce que le diagramme des cas d'utilisation ne concerne que les systèmes de transport
      answer: 0
      feedback:
      - null
      - 'Non : l''utilisateur du portail est bien un acteur du système.'
      - 'Non : le pignon-crémaillère est au contraire une solution courante pour un portail coulissant.'
      - 'Non : ce diagramme s''applique à n''importe quel système.'
      explanation: 'Le diagramme des cas d''utilisation décrit **ce que** le système devra faire, **sans spécifier comment**. Les solutions techniques apparaîtront plus tard, dans le `bdd` et le schéma cinématique.'
      tags:
      - uc
    - type: guided
      level: 3
      title: 'Le pont transbordeur de Nantes : des exigences au flux de passagers'
      intro: 'La ville de Nantes, confrontée à la saturation de son périphérique, étudie la construction d''un **pont transbordeur** sur la Loire (projet de l''architecte P. Poirier). Une **nacelle** suspendue à un chariot fait la navette entre les deux rives.

        Le diagramme d''exigences fournit les données suivantes : deux cabines fermées permettent le passage simultané de **270 personnes** (exigence 1.1.1) ; une ligne de transport en commun passe par le pont à raison d''**un busway par traversée** (exigence 1.1.2) ; le busway transporte jusqu''à **150 personnes** (exigence 5) ; le passage doit être effectué en **1,75 minute**, embarquement et débarquement compris (exigence 6) ; la hauteur libre sous le tablier vaut au moins **55 m** au-dessus de la Loire à marée haute (exigence 12).

        Comparaison des modes de franchissement : bac 7 M€ et 1 400 pers/heure/sens ; pont bas 35 M€ et 20 000 ; pont transbordeur 30 à 70 M€ ; pont levant (Rouen) 155 M€ et 20 000 ; pont haut (Cheviré) 70 M€ et 20 000 ; tunnel 200 M€ et 20 000 ; téléphérique 15 M€ et 1 200.

        {{fig:2i2d-req-transbordeur}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Sur le diagramme des cas d''utilisation, « Franchir la Loire » est relié à « Permettre le passage de bateaux ». Quel lien convient ?'
        choices:
        - '`«include»`'
        - '`«extend»`'
        - '`«refine»`'
        - '`«deriveRqt»`'
        answer:
        - 0
        feedback:
        - null
        - 'Non : `«extend»` marque un service **non indispensable** ; ici, laisser passer les bateaux est une obligation.'
        - 'Non : `«refine»` est un lien du diagramme d''**exigences**.'
        - 'Non : `«deriveRqt»` est également un lien du diagramme d''exigences.'
        explanation: 'La fonction pointée est indispensable au franchissement : lien d''**inclusion**.'
      - kind: input
        prompt: '**Étape 2.** Lire dans le diagramme d''exigences la hauteur libre minimale sous le tablier, au-dessus de la Loire à marée haute (en m).'
        answer: '55'
        numeric: true
        tolerance: 0
        unit: m
        explanation: 'Exigence « 12 » : au moins 55 m, comme le pont de Cheviré situé en aval.'
      - kind: input
        prompt: '**Étape 3.** Combien de personnes la nacelle transporte-t-elle au maximum lors d''une traversée (piétons en cabines + passagers du busway) ?'
        answer: '420'
        numeric: true
        tolerance: 0
        unit: personnes
        explanation: '$270 + 150 = 420$ personnes. La rue aérienne n''est pas prise en compte (elle relève d''un cas d''utilisation `«extend»`).'
      - kind: input
        prompt: '**Étape 4.** Un passage dure 1,75 minute. Combien de temps dure un **aller-retour** de la nacelle (en minutes) ?'
        answer: '3.5'
        numeric: true
        tolerance: 0.05
        unit: min
        explanation: '$2 \times 1{,}75 = 3{,}5$ min. Il faut compter l''aller **et** le retour, car la nacelle doit revenir avant de repartir dans le même sens.'
      - kind: input
        prompt: '**Étape 5.** Combien la nacelle effectue-t-elle de traversées par heure **dans un sens** ? (1 décimale)'
        answer: '17.1'
        numeric: true
        tolerance: 0.3
        unit: traversées/h
        explanation: '$60 \div 3{,}5 \approx 17{,}1$ traversées par heure et par sens. Erreur classique : diviser 60 par 1,75, ce qui donnerait 34,3 et compterait deux fois chaque sens.'
      - kind: input
        prompt: '**Étape 6.** En déduire le flux maximal de passagers par heure et par sens (arrondir à la centaine).'
        answer: '7200'
        numeric: true
        tolerance: 100
        unit: pers/heure/sens
        explanation: '$17{,}1 \times 420 \approx 7\,200$ personnes par heure et par sens — exactement la valeur annoncée dans le tableau de comparaison, ce qui valide le raisonnement.'
      - kind: mcq
        prompt: '**Étape 7.** Comment qualifier ce flux par rapport aux autres modes de franchissement du tableau ?'
        choices:
        - 'Moyen : environ 2,8 fois moins qu''un pont ou un tunnel, mais 5 à 6 fois plus qu''un bac ou un téléphérique'
        - 'Faible : c''est le plus petit flux du tableau'
        - 'Élevé : c''est le meilleur flux du tableau'
        - Identique à celui d'un pont bas
        answer:
        - 0
        feedback:
        - null
        - 'Non : les flux les plus faibles sont ceux du téléphérique (1 200) et du bac (1 400).'
        - 'Non : ponts et tunnel atteignent 20 000 pers/heure/sens.'
