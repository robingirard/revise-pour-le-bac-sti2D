    - type: input
      level: 3
      prompt: 'Le trolleybus reçoit 9,7 MJ·km⁻¹. Le réseau de **distribution** a un rendement $\eta = 0{,}97$. Quelle énergie faut-il en **entrée** de ce réseau de distribution ? (1 décimale)

