        tolerance: 0.05
        unit: MJ/km
        explanation: '$2{,}7 \times 3{,}6 = 9{,}72$ MJ·km⁻¹, cohérent avec les 9,7 MJ/km du diagramme de flux (l''écart est un arrondi).'
      - kind: input
        prompt: '**Étape 2.** Calculer l''énergie électrique en **sortie** du réseau de transport, c''est-à-dire en entrée du réseau de distribution ($\eta_{\text{alimentation}} = 0{,}97$). Partir de 9,7 MJ·km⁻¹ (1 décimale).'
        answer: '10.0'
        numeric: true
        tolerance: 0.15
        unit: MJ/km
        explanation: 'On remonte la chaîne en **divisant** : $9{,}7 / 0{,}97 = 10{,}0$ MJ·km⁻¹.'
      - kind: input
        prompt: '**Étape 3.** Calculer l''énergie électrique en **entrée** du réseau de transport ($\eta_{\text{transport}} = 0{,}95$) (1 décimale).'
        answer: '10.5'
        numeric: true
        tolerance: 0.2
        unit: MJ/km
        explanation: '$10{,}0 / 0{,}95 \approx 10{,}5$ MJ·km⁻¹. C''est l''électricité qu''il faut **produire** pour faire rouler le trolleybus sur 1 km.'
