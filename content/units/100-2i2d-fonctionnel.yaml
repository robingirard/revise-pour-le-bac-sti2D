    - type: input
      level: 3
      prompt: 'Il faut 10,0 MJ·km⁻¹ en entrée du réseau de distribution. Le réseau de **transport** (acheminement) a un rendement $\eta = 0{,}95$. Quelle énergie faut-il en entrée du réseau de transport ? (1 décimale)'
      answer: '10.5'
