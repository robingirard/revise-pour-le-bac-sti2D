        - 'Non : les deux dernières parts sont interverties. Fossile = gaz 5 + charbon 4 + pétrole 1 = 10 % ; renouvelable = hydraulique 12 + éolien et autres 3 = 15 %.'
        - 'Non : l''hydraulique et l''éolien sont **renouvelables** ; ils ne comptent pas dans le fossile.'
        - 'Non : l''éolien et les autres énergies renouvelables (3 %) ne sont pas nucléaires, et l''hydraulique compte pour 12 %.'
        explanation: 'Fissile = thermique nucléaire 75 % ; fossile = gaz 5 % + charbon 4 % + pétrole 1 % = 10 % ; renouvelable = hydraulique 12 % + éolien et autres 3 % = 15 %.'
      - kind: input
        prompt: '**Étape 5.** Quelle part des 10,5 MJ·km⁻¹ produits provient de la filière **fissile** (75 %) ? (1 décimale)'
        answer: '7.9'
        numeric: true
        tolerance: 0.2
        unit: MJ/km
        explanation: '$0{,}75 \times 10{,}5 = 7{,}875 \approx 7{,}9$ MJ·km⁻¹ d''électricité d''origine nucléaire.'
      - kind: input
        prompt: '**Étape 6.** Le rendement de la filière nucléaire vaut $\eta_{\text{nucléaire}} = 0{,}30$. Quelle **énergie primaire** fissile faut-il pour produire ces 7,9 MJ·km⁻¹ ? (1 décimale)'
        answer: '26.3'
        numeric: true
        tolerance: 0.6
        unit: MJ/km
        explanation: '$7{,}9 / 0{,}30 \approx 26{,}3$ MJ·km⁻¹. Un rendement de 0,30 signifie que les deux tiers de l''énergie primaire sont perdus en chaleur à la centrale.'
      - kind: mcq
        prompt: '**Étape 7.** En ajoutant la filière fossile ($1{,}05 / 0{,}35 = 3{,}0$ MJ·km⁻¹) et la filière renouvelable (1,58 MJ·km⁻¹, sans rendement indiqué), quelle est l''énergie primaire totale du trolleybus ?'
        choices:
        - Environ 30,9 MJ·km⁻¹
        - Environ 10,5 MJ·km⁻¹
        - Environ 9,7 MJ·km⁻¹
        - Environ 17,0 MJ·km⁻¹
        answer:
        - 0
        feedback:
        - null
        - 'Non : 10,5 MJ·km⁻¹ est l''énergie **électrique** produite, pas l''énergie **primaire** consommée en amont.'
        - 'Non : 9,7 MJ·km⁻¹ est l''énergie finale reçue par le véhicule.'
        - 'Non : 17,0 MJ·km⁻¹ est l''énergie primaire de l''**autobus** diesel.'
        explanation: '$26{,}3 + 3{,}0 + 1{,}58 \approx 30{,}9$ MJ·km⁻¹. Le rendement de 0,30 de la filière nucléaire pèse à lui seul plus de 85 % du total.'
      - kind: mcq
        prompt: '**Étape 8.** Trolleybus : 92 g Eq CO₂/km et 30,9 MJ·km⁻¹ d''énergie primaire. Autobus : 1 409 g Eq CO₂/km et 17,0 MJ·km⁻¹. Quelle conclusion est correcte ?'
        choices:
        - Le trolleybus émet environ 15 fois moins de gaz à effet de serre, mais consomme davantage d'énergie primaire à cause du rendement de la filière nucléaire
        - Le trolleybus est meilleur sur les deux critères à la fois
        - Le trolleybus est moins bon sur les deux critères à la fois
        - Le calcul est faux, puisqu'un véhicule électrique consomme forcément moins d'énergie primaire
        answer:
        - 0
        feedback:
        - null
        - 'Non : sur le critère « énergie primaire », le trolleybus est moins bon (30,9 contre 17,0 MJ·km⁻¹).'
        - 'Non : sur les gaz à effet de serre, l''écart est énorme en faveur du trolleybus (92 contre 1 409 g/km).'
        - 'Non, le calcul est correct : c''est un résultat contre-intuitif mais réel, entièrement dû au rendement de 0,30 de la production nucléaire.'
        explanation: '$1\,409 / 92 \approx 15$. Le trolleybus est excellent sur l''effet de serre, la pollution locale et les ressources fossiles (3,0 contre 17,0 MJ·km⁻¹), mais son bilan en énergie primaire dépend entièrement du **mix électrique** du pays.'
  - id: 2i2d-blocs
    title: Diagrammes de blocs (bdd et ibd)
    icon: 🧱
    description: Architecture matérielle avec le bdd (system, subsystem, block, losanges, multiplicités) et flux internes avec l'ibd (ports, natures de flux).
    prerequisites:
    - 2i2d-cas-exigences
    lesson: lessons/2i2d-blocs.md
    items:
    - type: mcq
      level: 1
      prompt: 'Que décrit un **diagramme de définition de blocs** (bdd) ?

        {{fig:2i2d-bdd-ferry}}'
      choices:
      - L'architecture matérielle du système, du point de vue des composants
      - Les échanges d'énergie et d'information entre composants
      - Les services rendus aux utilisateurs
      - Les mouvements des pièces
      answer: 0
      feedback:
      - null
      - 'Non : les échanges internes sont l''objet du diagramme de blocs **internes** (ibd).'
      - 'Non : les services rendus figurent sur le diagramme des cas d''utilisation.'
      - 'Non : les mouvements relèvent du schéma cinématique.'
      explanation: 'Le bdd décrit le système d''un point de vue « composants » et visualise les liens entre les blocs : c''est le diagramme de l''**architecture matérielle**.'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: 'Que décrit un **diagramme de blocs internes** (ibd) ?

        {{fig:2i2d-ibd-ferry}}'
      choices:
      - Les échanges de matière, d'énergie et d'information entre les blocs de même niveau, grâce aux ports de flux
      - La liste des composants et leurs caractéristiques
      - Les exigences du cahier des charges
      - Les interactions entre le système et son environnement
      answer: 0
      feedback:
      - null
      - 'Non : la liste des composants et leurs *values* figurent sur le **bdd**.'
      - 'Non : les exigences sont sur le diagramme `req`.'
      - 'Non : les interactions avec l''environnement sont sur le diagramme `uc`.'
      explanation: 'L''ibd est un diagramme **structurel** : il décrit les échanges matière-énergie-information entre les blocs de même niveau grâce aux **ports de flux**.'
      tags:
      - ibd
    - type: mcq
      level: 1
      prompt: 'Sur un bdd, que signifie un **losange noir** ◆ à la base d''un lien ?

        {{fig:2i2d-bdd-ferry}}'
      choices:
      - L'élément pointé est obligatoire
      - L'élément pointé est optionnel
      - L'élément pointé est un sous-système
      - Le lien transporte de l'énergie électrique
      answer: 0
      feedback:
      - null
      - 'Non : c''est le losange **blanc** qui signale un élément optionnel.'
      - 'Non : le stéréotype `«subsystem»` identifie un sous-système, indépendamment de la couleur du losange.'
      - 'Non : les flux sont représentés sur l''ibd, pas sur le bdd.'
      explanation: 'Losange **noir** = élément obligatoire ; losange **blanc** = élément optionnel.'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: Sur un bdd, que signifie un **losange blanc** ◇ à la base d'un lien ?
      choices:
      - L'élément pointé est optionnel
      - L'élément pointé est obligatoire
      - L'élément pointé est en panne
      - L'élément pointé est un capteur
      answer: 0
      feedback:
      - null
      - 'Non : le losange **noir** marque l''élément obligatoire.'
      - 'Non : un diagramme SysML décrit une architecture, pas un état de fonctionnement.'
      - 'Non : la nature du composant se lit dans son nom et ses *values*, pas dans le losange.'
      explanation: 'Losange blanc ◇ : l''élément pointé est **optionnel**.'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: 'Sur un bdd, un lien porte la valeur « 16 ». Que signifie ce nombre ?

        {{fig:2i2d-bdd-ferry}}'
      choices:
      - Il y a 16 éléments identiques de ce type
      - L'élément coûte 16 euros
      - L'élément a une priorité de 16
      - Le lien transporte 16 V
      answer: 0
      feedback:
      - null
      - 'Non : un bdd ne porte pas d''information de coût.'
      - 'Non : la priorité concerne les **exigences** (1, 2 ou 3), pas les blocs.'
      - 'Non : les tensions se lisent dans le compartiment *values*, par exemple « Tension = 384 V ».'
      explanation: 'Sur le lien, la valeur indique le **nombre d''éléments identiques** : la navette électro-solaire embarque 16 panneaux « propulsion » et 8 panneaux « service ».'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: Où se trouve toujours le **nom d'un diagramme** SysML (`bdd`, `ibd`, `uc`, `req`) ?
      choices:
      - En haut à gauche, dans un onglet
      - En bas à droite, dans un cartouche
      - Au centre du diagramme
      - Il n'est jamais écrit
      answer: 0
      feedback:
      - null
      - 'Non : le cartouche en bas à droite est une convention du **dessin technique**, pas de SysML.'
      - 'Non : le centre est occupé par les blocs.'
      - 'Non : il est toujours écrit, et il indique le type de diagramme, ce qui évite bien des confusions.'
      explanation: 'Le nom du diagramme est toujours situé en haut à gauche : `bdd [Paquet] Blocks [BDD Ferry Boat]`, `ibd [Subsystem] Alimentation électrique`.'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: 'Sur un bdd, que désigne le stéréotype `«subsystem»` ?'
      choices:
      - Un sous-ensemble du système, dont les liens pointent vers les blocs qui le composent
      - Le système entier
      - Un composant élémentaire
      - Un flux d'énergie
      answer: 0
      feedback:
      - null
      - 'Non : le système entier porte le stéréotype `«system»`.'
      - 'Non : un composant élémentaire porte le stéréotype `«block»`.'
      - 'Non : les flux apparaissent sur l''ibd, pas sur le bdd.'
      explanation: 'Trois niveaux : `«system»` (le produit), `«subsystem»` (un sous-ensemble, par exemple l''alimentation électrique), `«block»` (les composants).'
      tags:
      - bdd
    - type: mcq
      level: 1
      prompt: 'Sur un bdd, que trouve-t-on dans le compartiment « values » d''un bloc ?'
      choices:
      - Ses caractéristiques techniques (modèle, dimensions, tension, rendement…)
      - Le nombre d'exemplaires du bloc
      - Le prix du composant
      - La liste des flux entrants
      answer: 0
      feedback:
      - null
      - 'Non : le nombre d''exemplaires est porté **sur le lien**, pas dans les *values*.'
      - 'Non : le bdd est un document technique, pas commercial.'
      - 'Non : les flux sont décrits sur l''**ibd**.'
      explanation: 'Exemple : `«block» Panneaux photovoltaïques Propulsion` — Dimensions = 1,635 m × 0,984 m ; Modèle = CENIT 220 ; Puissance crête = 220 Wc par panneau ; Rendement = 13,8 %.'
      tags:
      - bdd
    - type: mcq
      level: 2
      prompt: 'Sur un ibd, un petit carré posé sur le bord d''un bloc est traversé par une **double flèche** ↔. Que signale-t-il ?

        {{fig:2i2d-ibd-ferry}}'
      choices:
      - Un port de flux qui permet l'échange dans les deux directions
      - Un port en panne
      - Un flux deux fois plus important
      - Une liaison mécanique bidirectionnelle
      answer: 0
      feedback:
      - null
      - 'Non : un diagramme SysML ne représente pas de panne.'
      - 'Non : la « quantité » du flux ne se lit pas dans le symbole du port, mais dans son étiquette.'
      - 'Non : l''ibd décrit des **flux**, pas des liaisons cinématiques.'
      explanation: 'Trois types de ports de flux : entrant (flèche vers l''intérieur), sortant (flèche vers l''extérieur), et **bidirectionnel** (double flèche) — par exemple entre un parc de batteries et son *Battery Management System*.'
      tags:
      - ibd
    - type: mcq
      level: 2
      prompt: 'Sur un ibd, où est indiquée la **nature d''un flux** (« Courant de charge », « Bus CAN », « 384 V ») ?'
      choices:
      - Au-dessus de la ligne qui relie les deux ports
      - Dans le compartiment values du bloc
      - Dans l'onglet du diagramme
      - Elle n'est jamais indiquée
      answer: 0
      feedback:
      - null
      - 'Non : le compartiment *values* est un élément du **bdd**.'
      - 'Non : l''onglet ne porte que le nom du diagramme.'
      - 'Non : c''est au contraire l''information principale de l''ibd.'
      explanation: 'La nature du flux est écrite **au-dessus de la ligne**, et les couleurs distinguent souvent matière, énergie et information.'
      tags:
      - ibd
    - type: input
      level: 2
      prompt: 'Sur le bdd de la navette maritime électro-solaire, 16 panneaux photovoltaïques « propulsion » de 220 Wc chacun sont installés. Quelle est la puissance crête totale de la propulsion ?

        {{fig:2i2d-bdd-ferry}}'
      answer: '3520'
      numeric: true
      tolerance: 10
      unit: Wc
      explanation: '$P = 16 \times 220 = 3\,520$ Wc, soit **3,52 kWc**. Le nombre 16 se lit **sur le lien**, la puissance de 220 Wc dans les *values* du bloc.'
      tags:
      - bdd
    - type: input
      level: 2
      prompt: 'Sur le même bdd, 8 panneaux « service » de 150 Wc chacun alimentent le circuit de bord. Quelle est leur puissance crête totale ?'
      answer: '1200'
      numeric: true
      tolerance: 10
      unit: Wc
      explanation: '$P = 8 \times 150 = 1\,200$ Wc. Attention à ne pas confondre les deux jeux de panneaux : CENIT 220 (propulsion, rendement 13,8 %) et CENIT 150 (service, rendement 11,8 %).'
      tags:
      - bdd
    - type: mcq
      level: 2
      prompt: 'Le bloc `«block» Parc 1 Batteries Propulsion` porte, dans ses *values* : Technologie = Nickel-Cadmium ; Tension = 384 V. Quelle est la tension délivrée par ce parc ?'
      choices:
      - 384 V
      - 24 V
      - 6 V
      - 220 V
      answer: 0
      feedback:
      - null
      - 'Non : 24 V est la tension des **batteries de service**, pas du parc de propulsion.'
      - 'Non : 6 V est la tension nominale d''un **élément** de batterie ; le parc en associe 64 en série.'
      - 'Non : 220 correspond à la puissance crête d''un panneau (220 Wc), pas à une tension.'
      explanation: 'La réponse se lit directement dans le compartiment *values* du bloc.'
      tags:
      - bdd
    - type: mcq
      level: 2
      prompt: 'Sur l''ibd de l''alimentation électrique de la navette, quels composants interviennent pour recharger les batteries de propulsion **depuis la prise de quai EDF** ?

        {{fig:2i2d-ibd-ferry}}'
      choices:
      - Le Chargeur Propulsion et le Battery Management System
      - Les Panneaux photovoltaïques Propulsion et le Chargeur Service
      - Le Chargeur Service et les Batteries Service
      - Les Ventilateurs batteries uniquement
      answer: 0
      feedback:
      - null
      - 'Non : les panneaux interviennent pour la recharge par l''**énergie solaire** ; le chargeur service alimente le circuit 24 V.'
      - 'Non : le chargeur service et les batteries service concernent le réseau de bord 24 V, pas la propulsion.'
      - 'Non : les ventilateurs refroidissent les batteries ; ils ne participent pas à la recharge.'
      explanation: 'Depuis la prise de quai, le flux traverse le **Chargeur Propulsion** puis rejoint les parcs sous la surveillance du **Battery Management System**.'
      tags:
      - ibd
    - type: mcq
      level: 2
      prompt: 'Sur l''ibd, le repère ❶ est placé sur le flux « Prise de quai EDF ». La tension y est-elle continue ou alternative ?

        {{fig:2i2d-ibd-ferry}}'
      choices:
      - Alternative, car c'est le réseau électrique du quai
      - Continue, car elle sert à recharger des batteries
      - Continue, car elle sort d'un chargeur
      - Alternative, car les panneaux photovoltaïques produisent de l'alternatif
      answer: 0
      feedback:
      - null
      - 'Non : la recharge se fait bien en continu, mais **après** le chargeur ; au point ❶ on est encore côté réseau.'
      - 'Non : le point ❶ est en **amont** du chargeur.'
      - 'Non : un panneau photovoltaïque délivre du courant **continu**, et il n''est pas concerné par ce point.'
      explanation: 'Le point ❶ est le raccordement au réseau : **alternatif**. Aux points ❷ (sortie des panneaux), ❸ (courant de charge) et ❹ (384 V d''un parc), le courant est **continu**.'
      tags:
      - ibd
    - type: match
      level: 2
      prompt: Associez chaque diagramme SysML à la question à laquelle il répond.
      pairs:
      - left: Cas d'utilisation (uc)
        right: Que doit faire le système, et pour qui ?
      - left: Exigences (req)
        right: Quelles fonctions et contraintes doit-il respecter ?
      - left: Définition de blocs (bdd)
        right: De quels composants est-il fait ?
      - left: Blocs internes (ibd)
        right: Qu'échangent ces composants entre eux ?
      tags:
      - bdd
    - type: grid
      level: 2
      prompt: Pour chaque élément, cochez le diagramme sur lequel on le rencontre.
      rows:
      - id: los
        label: Un losange noir ou blanc en bout de lien
      - id: mul
        label: Une multiplicité (« 16 ») portée sur un lien
      - id: por
        label: Un port de flux carré avec une flèche
      - id: val
        label: Un compartiment « values »
      - id: bus
        label: Une ligne étiquetée « Bus CAN »
      cols:
      - id: B
        label: Définition de blocs (bdd)
      - id: I
        label: Blocs internes (ibd)
      answer:
      - Blos
      - Bmul
      - Ipor
      - Bval
      - Ibus
      cellFeedback:
        Blos: 'les losanges (obligatoire / optionnel) sont propres au bdd'
        Ilos: 'l''ibd n''emploie pas de losange : il montre des ports et des flux'
        Bmul: 'la quantité d''éléments identiques est portée sur les liens du bdd'
        Imul: 'l''ibd ne compte pas les composants, il décrit ce qu''ils échangent'
        Bpor: 'les ports de flux appartiennent à l''ibd'
        Ipor: 'un port carré traversé par une flèche est l''élément caractéristique de l''ibd'
        Bval: 'le compartiment values donne les caractéristiques d''un bloc, sur le bdd'
        Ival: 'sur l''ibd, les blocs sont réduits à leur nom et à leurs ports'
        Bbus: 'un bus de terrain est un flux : il apparaît sur l''ibd'
        Ibus: 'le bus CAN est un flux d''information tracé entre deux ports de l''ibd'
      explanation: 'Le `bdd` répond à « de quoi est-ce fait ? » (losanges, multiplicités, values) ; l''`ibd` répond à « qu''est-ce qui circule ? » (ports, natures de flux).'
      tags:
      - bdd
    - type: input
      level: 3
      prompt: 'Un parc de batteries de propulsion doit délivrer **384 V**. Il est constitué d''éléments de **6 V** nominal. Combien d''éléments faut-il par parc ?'
      answer: '64'
      numeric: true
      tolerance: 0
      unit: batteries
      explanation: '$384 / 6 = 64$ éléments. Erreur classique : diviser par 24 V, la tension du circuit de **service**.'
      tags:
      - batteries
    - type: mcq
      level: 3
      prompt: Comment faut-il câbler ces 64 éléments de 6 V pour obtenir 384 V ?
      choices:
      - En série, car seule l'association série additionne les tensions
      - En parallèle, car cela additionne les tensions
      - En parallèle, car cela additionne les capacités et donc les tensions
      - Peu importe, les deux câblages donnent 384 V
      answer: 0
      feedback:
      - null
      - 'Non : en parallèle, la tension reste celle d''un seul élément, soit 6 V.'
      - 'Non : l''association parallèle additionne bien les **capacités** (Ah), mais pas les tensions.'
      - 'Non : les deux câblages donnent des résultats très différents.'
      explanation: 'Association **série** : les tensions s''ajoutent ($64 \times 6 = 384$ V) et la capacité reste celle d''un élément. Association **parallèle** : la tension reste 6 V et les capacités s''ajoutent.'
      tags:
      - batteries
    - type: input
      level: 3
      prompt: 'Chaque élément de batterie est donné pour **6 V** et **136 Ah** par la documentation constructeur. Quelle énergie stocke-t-il ?'
      answer: '816'
      numeric: true
      tolerance: 2
      unit: Wh
      explanation: '$E = U \times Q = 6 \times 136 = 816$ Wh. *Attention* : la référence commerciale « STM 5-140 » laisse croire à 140 Ah, mais la documentation donne **136 Ah** — c''est cette valeur qu''il faut utiliser.'
      tags:
      - batteries
    - type: input
      level: 3
      prompt: 'La navette embarque **deux parcs de 64 éléments** de 816 Wh chacun, et la profondeur de décharge est limitée à **70 %** pour préserver la durée de vie. Quelle énergie est réellement disponible ? (arrondir au Wh)'
      answer: '73114'
      numeric: true
      tolerance: 300
      unit: Wh
      explanation: 'Énergie totale : $2 \times 64 \times 816 = 104\,448$ Wh. Disponible : $104\,448 \times 0{,}70 \approx 73\,114$ Wh, soit environ 73 kWh. Erreur classique : oublier la limitation à 70 %, ou ne compter qu''un seul parc.'
      tags:
      - batteries
  - id: 2i2d-structure
    title: Schéma cinématique 3D et structure
    icon: 🦾
    description: Classes d'équivalence, repère et bâti, liaisons repérées par un point et un axe, torseur des actions transmissibles, application à la caméra dôme.
    prerequisites:
    - 2i2d-blocs
    lesson: lessons/2i2d-structure.md
    items:
    - type: mcq
      level: 1
      prompt: 'À quoi sert un **schéma cinématique** ?

        {{fig:2i2d-schema-camera}}'
      choices:
      - À analyser les mouvements des éléments du système les uns par rapport aux autres
      - À donner les cotes de fabrication des pièces
      - À décrire les échanges d'information entre composants
      - À lister les exigences du cahier des charges
      answer: 0
      feedback:
      - null
      - 'Non : les cotes de fabrication figurent sur le dessin de définition, pas sur un schéma.'
      - 'Non : les échanges d''information sont décrits par l''ibd et la chaîne d''information.'
      - 'Non : les exigences sont sur le diagramme `req`.'
      explanation: 'Le schéma cinématique est une figure **spatiale ou plane** qui permet d''analyser les mouvements des éléments du système les uns par rapport aux autres.'
      tags:
      - schema-cinematique
    - type: mcq
      level: 1
      prompt: Quelles pièces regroupe-t-on dans une même **classe d'équivalence cinématique** ?
      choices:
      - Celles qui sont en liaison encastrement les unes par rapport aux autres
      - Celles qui sont en contact
      - Celles qui ont la même trajectoire
      - Celles qui sont du même matériau
      answer: 0
      feedback:
      - null
      - 'Non : deux pièces en contact peuvent parfaitement bouger l''une par rapport à l''autre (un arbre dans son palier).'
      - 'Non : le critère n''est pas la trajectoire, mais l''absence de **mouvement relatif**.'
      - 'Non : le matériau n''intervient pas.'
      explanation: 'Les pièces en liaison **encastrement** les unes par rapport aux autres forment une classe d''équivalence, identifiée par un nom ou un numéro.'
      tags:
      - schema-cinematique
    - type: mcq
      level: 1
      prompt: Sur un schéma cinématique, que représente le symbole en **traits hachurés** ?
      choices:
      - L'élément de référence (le bâti), immobile par rapport au repère d'étude
      - La pièce la plus lourde
      - Une pièce déformable
      - Une liaison encastrement
      answer: 0
      feedback:
      - null
      - 'Non : la masse des pièces n''apparaît pas sur un schéma cinématique.'
      - 'Non : les pièces déformables (ressorts, joints) sont au contraire **exclues** des classes d''équivalence.'
      - 'Non : l''encastrement est justement la liaison **sans** symbole particulier, puisque les pièces forment un seul solide.'
      explanation: 'Le bâti est l''élément de référence : la partie du système **immobile** par rapport au repère d''étude, dessinée avec le symbole normalisé à hachures.'
      tags:
