      answer: '10.0'
      numeric: true
      tolerance: 0.15
      unit: MJ/km
      explanation: 'On **remonte** la chaîne, donc on **divise** par le rendement : $9{,}7 / 0{,}97 = 10{,}0$ MJ·km⁻¹. Erreur classique : multiplier, ce qui donnerait 9,4 MJ·km⁻¹ — moins que l''énergie utilisée, ce qui est impossible.'
      tags:
