      - 'Non : les mouvements relatifs sont l''objet du schéma cinématique.'
      explanation: 'La chaîne d''énergie décrit la façon dont l''énergie (ou la puissance) est **distribuée, convertie et transmise** aux différents composants de façon à réaliser une action.'
      tags:
      - chaine-energie
    - type: mcq
      level: 2
      prompt: 'Sur un lien de puissance **électrique en courant continu**, quelles sont les grandeurs de flux et d''effort ?'
      choices:
      - 'Flux : intensité $I$ (A) ; effort : tension $U$ (V) ; $P = U \times I$'
      - 'Flux : tension $U$ (V) ; effort : intensité $I$ (A) ; $P = U \times I$'
      - 'Flux : puissance $P$ (W) ; effort : résistance $R$ (Ω)'
      - 'Flux : charge $q$ (C) ; effort : énergie $E$ (J)'
      answer: 0
      feedback:
      - null
      - 'Non : les deux grandeurs sont inversées. Ce qui « coule » dans un conducteur, ce sont les charges : l''**intensité** est le flux.'
      - 'Non : la puissance est le **produit** du flux par l''effort, pas l''une des deux grandeurs.'
      - 'Non : ces grandeurs n''apparaissent pas dans le tableau des liens de puissance.'
      explanation: 'Tableau effort/flux : électrique continu → flux $I$ (A), effort $U$ (V), $P = U \times I$ (W).

        {{fig:2i2d-flux-effort}}'
      tags:
      - flux-effort
    - type: mcq
      level: 2
      prompt: En **mécanique de rotation**, quelle est l'expression de la puissance échangée ?
      choices:
      - '$P = C \times \omega$, avec $C$ en N·m et $\omega$ en rad·s⁻¹'
      - '$P = F \times V$, avec $F$ en N et $V$ en m·s⁻¹'
      - '$P = Q \times p$, avec $Q$ en m³·s⁻¹ et $p$ en Pa'
      - '$P = C \times N$, avec $N$ en tr·min⁻¹'
      answer: 0
      feedback:
      - null
      - 'Non : $P = F \times V$ est la puissance en **translation**.'
      - 'Non : $P = Q \times p$ est la puissance **hydraulique**.'
      - 'Non : la vitesse doit être en **rad·s⁻¹** pour obtenir des watts ; il faut convertir les tr·min⁻¹.'
      explanation: 'Mécanique de rotation : flux $\omega$ (rad·s⁻¹), effort $C$ (N·m), $P = C \times \omega$.'
      tags:
      - flux-effort
    - type: mcq
      level: 2
      prompt: En **hydraulique**, quelles sont les grandeurs de flux et d'effort ?
      choices:
      - 'Flux : débit $Q$ (m³·s⁻¹) ; effort : pression $p$ (Pa)'
      - 'Flux : pression $p$ (Pa) ; effort : débit $Q$ (m³·s⁻¹)'
      - 'Flux : volume $V$ (m³) ; effort : force $F$ (N)'
      - 'Flux : vitesse $V$ (m·s⁻¹) ; effort : section $S$ (m²)'
      answer: 0
      feedback:
      - null
      - 'Non : les deux grandeurs sont inversées. Ce qui « coule », c''est le **fluide**, donc le débit.'
      - 'Non : un volume n''est pas un débit ; le flux est un débit, donc un volume **par seconde**.'
      - 'Non : une section n''est pas une grandeur d''effort ; c''est la pression qui pousse.'
      explanation: 'Hydraulique : flux $Q$ (m³·s⁻¹), effort $p$ (Pa), $P = Q \times p$.'
      tags:
      - flux-effort
    - type: grid
      level: 2
      prompt: 'Pour chaque grandeur, cochez s''il s''agit d''une grandeur de **flux** ou d''une grandeur d''**effort**.

        {{fig:2i2d-flux-effort}}'
      rows:
      - id: i
        label: Intensité I (A)
      - id: u
        label: Tension U (V)
      - id: w
        label: Vitesse angulaire ω (rad·s⁻¹)
      - id: c
        label: Couple C (N·m)
      - id: q
        label: Débit Q (m³·s⁻¹)
      - id: p
        label: Pression p (Pa)
      cols:
      - id: F
        label: Grandeur de flux
      - id: E
        label: Grandeur d'effort
      answer:
      - Fi
      - Eu
      - Fw
      - Ec
      - Fq
      - Ep
      cellFeedback:
        Fi: 'ce sont les charges qui circulent : l''intensité est bien le flux électrique'
        Ei: 'l''intensité mesure un débit de charges : c''est un flux, pas un effort'
        Fu: 'la tension ne « coule » pas, elle pousse : c''est l''effort électrique'
        Eu: 'la tension est bien la grandeur d''effort en électricité'
        Fw: 'la vitesse angulaire est le flux en rotation'
        Ew: 'la vitesse angulaire décrit le mouvement, pas ce qui le provoque'
        Fc: 'le couple est ce qui fait tourner : c''est un effort'
        Ec: 'le couple est bien la grandeur d''effort en rotation'
        Fq: 'le débit est le flux hydraulique'
        Eq: 'un débit est un volume par seconde : c''est un flux'
        Fp: 'la pression pousse le fluide : c''est un effort'
        Ep: 'la pression est bien la grandeur d''effort en hydraulique'
      explanation: 'Flux : $I$, $V$, $\omega$, $Q$ — effort : $U$, $F$, $C$, $p$. Dans tous les domaines, **puissance = flux × effort**.'
      tags:
      - flux-effort
    - type: input
      level: 2
      prompt: 'Le moteur du chariot d''un pont transbordeur est alimenté sous $U = 400$ V et absorbe une intensité $I = 25$ A. Quelle puissance électrique absorbe-t-il ?'
      answer: '10000'
      numeric: true
      tolerance: 10
      unit: W
      explanation: '$P = U \times I = 400 \times 25 = 10\,000$ W, soit 10 kW.'
      tags:
