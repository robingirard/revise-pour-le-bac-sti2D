      - 'Calculer la puissance lumineuse reçue par le panneau : P surf × S, en watts.'
      - Relever sur la caractéristique les coordonnées U ppm et I ppm du point de puissance maximale.
      - 'Calculer la puissance électrique maximale : P max = U ppm × I ppm, en watts.'
      - Calculer le rendement r = P max / (P surf × S), sans unité.
      - Exprimer le résultat en pourcentage.
      explanation: Le rendement compare la puissance électrique **utile** à la puissance lumineuse **reçue** ; il est toujours inférieur à 100 % à cause des pertes, principalement thermiques.
      tags:
