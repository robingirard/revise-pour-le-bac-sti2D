      - Parce que la surface du panneau est toujours plus petite que la surface éclairée.
      answer: 0
      feedback:
      - null
      - 'Non : le rendement compare des puissances **au même instant** ; l''alternance jour/nuit n''y change rien.'
      - 'Non : la nature du courant ne fait pas perdre d''énergie dans la cellule elle-même.'
      - 'Non : dans r = P max / (P surf × S), c''est précisément la surface **du panneau** qui est prise en compte.'
      explanation: 'Chaîne énergétique : énergie rayonnante → cellule photovoltaïque → énergie électrique (utile) + énergie perdue (thermique et rayonnante). Seule l''énergie électrique est utile, d''où r < 1.'
      tags:
      - photovoltaique
    - type: input
      level: 3
      prompt: Un atome de mercure émet un photon de longueur d'onde λ = 436 nm. Calculer l'énergie de ce photon, en 10⁻¹⁹ J (h = 6,63 × 10⁻³⁴ J·s ; c = 3,00 × 10⁸ m·s⁻¹ ; arrondir au centième).
      answer: '4.56'
      numeric: true
      tolerance: 0.05
      unit: 10⁻¹⁹ J
      explanation: E = h c / λ = 1,989 × 10⁻²⁵ / (4,36 × 10⁻⁷) = 4,56 × 10⁻¹⁹ J. C'est bien l'écart d'énergie entre les niveaux E₅ = 12,40 × 10⁻¹⁹ J et E₂ = 7,84 × 10⁻¹⁹ J du mercure.
      tags:
