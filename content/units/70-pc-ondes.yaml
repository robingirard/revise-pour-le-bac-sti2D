      - 'Non : c''est le **photon** qui possède une fréquence ; l''électron, lui, change de niveau d''énergie.'
      explanation: 'Absorption : l''électron absorbe l''énergie du photon et passe à un niveau supérieur (photorésistances, photodiodes, cellules photovoltaïques). Émission : l''électron perd cette énergie et passe à un niveau inférieur (lasers, LED).'
      tags:
      - photon
    - type: mcq
      level: 3
      prompt: Pourquoi un laser de faible puissance (quelques milliwatts) peut-il être dangereux pour l'œil, alors qu'une lampe de 60 W ne l'est pas ?
      choices:
