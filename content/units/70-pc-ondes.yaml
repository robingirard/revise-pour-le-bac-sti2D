  - id: pc-lumiere-energie
    title: Énergie transportée par la lumière
    icon: ☀️
    description: Photon et énergie E = h ν, puissance lumineuse et irradiance, rendement d'un panneau photovoltaïque, lasers.
    prerequisites:
    - pc-ondes-em
    lesson: lessons/pc-lumiere-energie.md
    items:
    - type: mcq
      level: 1
      prompt: Dans le **modèle corpusculaire**, qu'est-ce que la lumière ?
      choices:
      - Un flux de photons, particules de masse nulle se déplaçant à la célérité de la lumière.
      - Un flux d'électrons arrachés à la source.
      - Une vibration de la matière, comme le son.
      - Un flux de photons de masse très faible mais non nulle.
      answer: 0
      feedback:
      - null
      - 'Non : l''électron a une masse et une charge. Le photon, lui, est de masse nulle et non chargé.'
      - 'Non : c''est le modèle de l''onde **mécanique**. La lumière se propage aussi dans le vide.'
      - 'Non : la masse du photon est exactement **nulle** ; c''est ce qui lui permet d''aller à la célérité c.'
      explanation: Dans le modèle corpusculaire, la lumière est un flux de photons, particules de masse nulle se déplaçant à la célérité de la lumière.
      tags:
      - photon
    - type: mcq
      level: 1
      prompt: 'Quelle est l''expression de l''énergie E d''un photon de fréquence ν ?

        {{fig:pc-photon-panneau}}'
      choices:
      - E = h × ν, avec h = 6,63 × 10⁻³⁴ J·s
      - E = h / ν, avec h = 6,63 × 10⁻³⁴ J·s
      - E = ν / h, avec h = 6,63 × 10⁻³⁴ J·s
      - E = h × c × ν, avec h = 6,63 × 10⁻³⁴ J·s
      answer: 0
      feedback:
      - null
      - 'Non : c''est un **produit**, pas un quotient. Vérifie les unités : J·s × s⁻¹ = J.'
      - 'Non : ν / h s''exprimerait en s⁻¹/(J·s) = J⁻¹·s⁻², ce n''est pas une énergie.'
      - 'Non : c n''intervient que si l''on remplace ν par c / λ, ce qui donne E = h c / λ (et non h c ν).'
      explanation: E = h × ν, avec E en joule (J), h la constante de Planck (6,63 × 10⁻³⁴ J·s) et ν la fréquence en hertz. Comme ν = c / λ, on a aussi E = h c / λ.
      tags:
      - photon
    - type: mcq
      level: 1
      prompt: 'L''**irradiance** (puissance surfacique) d''un rayonnement, mesurée par un solarimètre, s''exprime en :'
      choices:
      - W·m⁻²
      - W
      - J
      - W·m⁻²·s⁻¹
      answer: 0
      feedback:
      - null
      - 'Non : le watt est l''unité d''une **puissance**, sans référence à la surface éclairée.'
      - 'Non : le joule est l''unité d''une **énergie**.'
      - 'Non : le watt contient déjà les secondes (1 W = 1 J·s⁻¹) ; il ne faut pas les compter deux fois.'
      explanation: L'irradiance P surf est la puissance lumineuse reçue par unité de surface, en watt par mètre carré (W·m⁻²). Elle se mesure avec un solarimètre (ou pyranomètre).
      tags:
      - photovoltaique
    - type: mcq
      level: 1
      prompt: Un panneau photovoltaïque fournit un courant continu d'intensité I sous une tension continue U. Quelle est la puissance électrique délivrée ?
      choices:
      - P élec = U × I, en watts
      - P élec = U / I, en watts
      - P élec = U × I², en watts
      - P élec = U + I, en watts
      answer: 0
      feedback:
      - null
      - 'Non : U / I est une **résistance** (loi d''Ohm), en ohms.'
      - 'Non : P = U I pour un dipôle quelconque ; P = R I² ne vaut que pour un résistor.'
      - 'Non : on ne peut pas additionner des volts et des ampères.'
      explanation: P élec = U × I, avec P en watt (W), U en volt (V) et I en ampère (A).
      tags:
      - photovoltaique
    - type: mcq
      level: 1
      prompt: Quelle est l'expression du rendement maximal r d'un panneau photovoltaïque de surface S soumis à une irradiance P surf ?
      choices:
      - r = P max / (P surf × S), sans unité
      - r = P surf × S / P max, sans unité
      - r = P max × P surf × S, en watts
      - r = P max / P surf, en m²
      answer: 0
      feedback:
      - null
      - 'Non : le rapport est inversé. Le rendement est toujours « utile ÷ reçue », donc inférieur à 1.'
      - 'Non : un rendement est un **rapport** de deux puissances, donc sans unité.'
      - 'Non : il manque la surface. P max / P surf donnerait bien des m², ce qui n''est pas un rendement.'
      explanation: 'r = P max / (P surf × S) : puissance électrique maximale divisée par la puissance lumineuse reçue. r est sans unité, souvent exprimé en %.'
      tags:
      - photovoltaique
    - type: mcq
      level: 1
      prompt: Quelles sont les trois caractéristiques d'un faisceau **laser** ?
      choices:
      - Quasi monochromatique, très peu divergent (directif), concentrant une grande quantité d'énergie.
      - Polychromatique, très divergent, de faible énergie.
      - Quasi monochromatique, très divergent, de faible énergie.
      - Polychromatique, directif, concentrant une grande quantité d'énergie.
      answer: 0
      feedback:
      - null
      - 'Non : c''est presque la description d''une lampe ordinaire, à l''opposé du laser.'
      - 'Non : un faisceau laser est au contraire **très peu divergent** — son diamètre augmente très peu avec la distance.'
      - 'Non : le laser n''émet qu''une seule longueur d''onde : il est **monochromatique**.'
      explanation: 'LASER = « light amplification by stimulated emission of radiation ». Le faisceau est quasi monochromatique, très peu divergent et concentre une grande énergie sur une très faible surface : d''où le pictogramme de sécurité obligatoire.'
      tags:
      - laser
    - type: mcq
      level: 1
      prompt: L'énergie d'un photon est très faible, on l'exprime souvent en électronvolts. Quelle est la correspondance ?
      choices:
      - 1,0 eV = 1,6 × 10⁻¹⁹ J
      - 1,0 eV = 1,6 × 10⁻³⁴ J
      - 1,0 J = 1,6 × 10⁻¹⁹ eV
      - 1,0 eV = 6,63 × 10⁻³⁴ J
      answer: 0
      feedback:
      - null
      - 'Non : 10⁻³⁴ est l''ordre de grandeur de la constante de Planck h, pas de la charge élémentaire.'
      - 'Non : la conversion est inversée. L''électronvolt est **beaucoup plus petit** que le joule.'
      - 'Non : 6,63 × 10⁻³⁴ J·s est la constante de Planck h, ce n''est pas une énergie.'
      explanation: 1,0 eV = 1,6 × 10⁻¹⁹ J. Pour convertir une énergie de joules en électronvolts, on divise par 1,6 × 10⁻¹⁹.
      tags:
      - photon
    - type: input
      level: 2
      prompt: 'Calculer l''énergie E d''un photon de longueur d''onde λ = 550 nm, en 10⁻¹⁹ J (donner le coefficient devant 10⁻¹⁹). Données : h = 6,63 × 10⁻³⁴ J·s ; c = 3,00 × 10⁸ m·s⁻¹.'
      answer: '3.62'
      numeric: true
      tolerance: 0.05
      unit: 10⁻¹⁹ J
      explanation: E = h c / λ = (6,63 × 10⁻³⁴ × 3,00 × 10⁸) / (550 × 10⁻⁹) = 1,989 × 10⁻²⁵ / (5,50 × 10⁻⁷) = 3,62 × 10⁻¹⁹ J.
      tags:
      - photon
    - type: input
      level: 2
      prompt: Le photon précédent a une énergie E = 3,62 × 10⁻¹⁹ J. Exprimer cette énergie en électronvolts (1,0 eV = 1,6 × 10⁻¹⁹ J ; arrondir au dixième).
      answer: '2.3'
      numeric: true
      tolerance: 0.1
      unit: eV
      explanation: 'E = 3,62 × 10⁻¹⁹ / (1,6 × 10⁻¹⁹) = 2,26 soit 2,3 eV. Erreur fréquente : multiplier au lieu de diviser, ce qui donne un nombre minuscule.'
      tags:
      - photon
    - type: input
      level: 2
      prompt: Un panneau photovoltaïque de surface S = 1,6 m² reçoit une irradiance de 1 000 W·m⁻² et fournit une puissance électrique de 250 W. Calculer son rendement, en pourcentage (arrondir au dixième).
      answer: '15.6'
      numeric: true
      tolerance: 0.3
      unit: '%'
      explanation: 'Puissance lumineuse reçue : P surf × S = 1 000 × 1,6 = 1 600 W. r = 250 / 1 600 = 0,156 25 soit 15,6 %. Erreur fréquente : oublier de multiplier par la surface et calculer 250 / 1 000 = 25 %.'
      tags:
      - photovoltaique
    - type: input
      level: 2
      prompt: Un laser continu de puissance lumineuse P = 5,0 mW a un faisceau de section S = 1,0 mm². Calculer l'irradiance P surf du faisceau, en kW·m⁻² (1 mm² = 1,0 × 10⁻⁶ m²).
      answer: '5'
      numeric: true
      tolerance: 0.1
      unit: kW·m⁻²
      explanation: 'P = P surf × S donc P surf = P / S = 5,0 × 10⁻³ / (1,0 × 10⁻⁶) = 5,0 × 10³ W·m⁻² = 5,0 kW·m⁻². C''est cinq fois l''irradiance du Soleil au sol (environ 1 kW·m⁻²), pour seulement 5 mW : voilà pourquoi un laser est dangereux.'
      tags:
      - laser
    - type: input
      level: 2
      prompt: Un laser impulsionnel délivre des impulsions de durée τ = 5,0 ns sous une puissance crête P crête = 2,0 MW. Calculer l'énergie E délivrée lors d'une impulsion, en millijoules.
      answer: '10'
      numeric: true
      tolerance: 0.2
      unit: mJ
      explanation: E = P crête × τ = 2,0 × 10⁶ × 5,0 × 10⁻⁹ = 1,0 × 10⁻² J = 10 mJ. La puissance crête est énorme, mais la durée est si brève que l'énergie reste modeste.
      tags:
      - laser
    - type: order
      level: 2
      prompt: Remettre dans l'ordre les étapes du calcul du rendement maximal d'un panneau photovoltaïque.
      steps:
