      choices:
      - 'Il absorbe l''énergie du photon et passe à un niveau supérieur : photorésistances, photodiodes, cellules photovoltaïques.'
      - 'Il perd l''énergie correspondante et passe à un niveau inférieur : lasers et diodes électroluminescentes.'
      - Il quitte définitivement l'atome en emportant le photon.
      - Il change de fréquence, ce qui modifie la couleur de l'atome.
      answer: 0
