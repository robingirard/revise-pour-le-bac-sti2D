    - type: guided
      level: 3
      title: 'Le refuge solaire : du photon au panneau photovoltaïque'
      intro: 'Un refuge de montagne est alimenté par un **panneau photovoltaïque** qui fait fonctionner une pompe.


        **Données** : irradiance mesurée au solarimètre P surf = 800 W·m⁻² ; longueur d''onde moyenne du rayonnement utilisé λ = 550 nm ; surface du panneau S = 2,0 m² ; rendement r = 18 % ; point de puissance maximale relevé sur la caractéristique : U ppm = 36 V et I ppm = 8,0 A.


        **Constantes** : h = 6,63 × 10⁻³⁴ J·s ; c = 3,00 × 10⁸ m·s⁻¹ ; 1,0 eV = 1,6 × 10⁻¹⁹ J.

        {{fig:pc-photon-panneau}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Dans le modèle corpusculaire, comment décrit-on le rayonnement reçu par le panneau ?'
        choices:
        - Comme un flux de photons, particules de masse nulle se déplaçant à la célérité de la lumière.
        - Comme un flux d'électrons émis par le Soleil.
        - Comme une onde mécanique se propageant dans l'air jusqu'au panneau.
        - Comme un courant électrique qui circule directement dans le panneau.
        answer:
        - 0
        feedback:
        - null
        - 'Non : l''électron possède une masse et une charge ; le photon n''a ni l''une ni l''autre.'
        - 'Non : la lumière du Soleil nous parvient à travers le **vide** de l''espace : elle n''est pas mécanique.'
        - 'Non : le courant électrique n''apparaît qu''**après** conversion dans la cellule photovoltaïque.'
        explanation: Dans le modèle corpusculaire, la lumière est un flux de photons, particules de masse nulle se déplaçant à la célérité de la lumière.
      - kind: input
        prompt: '**Étape 2.** Calculer la fréquence ν associée à la longueur d''onde λ = 550 nm, en 10¹⁴ Hz (donner le coefficient devant 10¹⁴, arrondi au centième).'
        answer: '5.45'
        numeric: true
        tolerance: 0.05
        unit: 10¹⁴ Hz
        explanation: ν = c / λ = 3,00 × 10⁸ / (550 × 10⁻⁹) = 3,00 × 10⁸ / (5,50 × 10⁻⁷) = 5,45 × 10¹⁴ Hz. Attention à convertir les nanomètres en mètres.
      - kind: input
        prompt: '**Étape 3.** En déduire l''énergie E d''un photon de cette longueur d''onde, en 10⁻¹⁹ J (coefficient devant 10⁻¹⁹, arrondi au centième).'
        answer: '3.62'
        numeric: true
        tolerance: 0.05
        unit: 10⁻¹⁹ J
        explanation: E = h × ν = 6,63 × 10⁻³⁴ × 5,45 × 10¹⁴ = 3,62 × 10⁻¹⁹ J. On peut aussi calculer directement E = h c / λ = 1,989 × 10⁻²⁵ / (5,50 × 10⁻⁷) = 3,62 × 10⁻¹⁹ J.
      - kind: input
        prompt: '**Étape 4.** Exprimer cette énergie en électronvolts (1,0 eV = 1,6 × 10⁻¹⁹ J ; arrondir au dixième).'
        answer: '2.3'
        numeric: true
        tolerance: 0.1
        unit: eV
        explanation: E = 3,62 × 10⁻¹⁹ / (1,6 × 10⁻¹⁹) = 2,26 soit 2,3 eV.
      - kind: input
        prompt: '**Étape 5.** Calculer la puissance lumineuse reçue par le panneau, en watts (P surf = 800 W·m⁻², S = 2,0 m²).'
        answer: '1600'
        numeric: true
        tolerance: 5
        unit: W
        explanation: P lumineuse = P surf × S = 800 × 2,0 = 1 600 W. C'est la puissance **reçue**, pas la puissance produite.
      - kind: input
        prompt: '**Étape 6.** Le rendement du panneau vaut r = 18 %. Calculer la puissance électrique délivrée, en watts.'
        answer: '288'
        numeric: true
        tolerance: 2
        unit: W
        explanation: 'r = P électrique / (P surf × S) donc P électrique = 0,18 × 1 600 = 288 W. Erreur fréquente : oublier de convertir 18 % en 0,18.'
      - kind: mcq
