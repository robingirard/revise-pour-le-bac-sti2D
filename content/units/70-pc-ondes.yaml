      - Parce que le laser émet des ultraviolets, contrairement à une lampe.
      - Parce que la puissance d'un laser est mesurée en milliwatts, une unité plus dangereuse.
      - Parce que la lumière du laser est polychromatique et sature la rétine.
      answer: 0
      feedback:
      - null
      - 'Non : un laser rouge n''émet pas d''UV. Le danger vient de la **concentration** de l''énergie.'
      - 'Non : le milliwatt est simplement un sous-multiple du watt ; 5 mW = 0,005 W.'
      - 'Non : le laser est **monochromatique** ; c''est justement le contraire.'
      explanation: 'P = P surf × S : à puissance égale, plus la section S du faisceau est petite, plus l''irradiance P surf est grande. Un laser de 5 mW sur 1 mm² donne 5 kW·m⁻², bien plus que le Soleil au sol. D''où le pictogramme de sécurité obligatoire sur tout laser.'
      tags:
