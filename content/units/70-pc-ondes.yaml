# Unité « Physique : ondes et lumière » (physique-chimie 1re et Tle STI2D).
# Sources : docs/notes/pc-1re-cours-c.md (ch. 13, 14, 15) et docs/notes/pc-1re-cours-b.md (ch. 9),
# complétées par docs/notes/pc-tle-cours-b.md (ch. 9 : photon, rendement d'une cellule photovoltaïque)
# et docs/notes/cours-tle-c.md (§5.1 : plage 0 à 130 dB de l'oreille humaine).
#
# [VERIFY] Le niveau sonore L = 10 log(I / I₀) et l'intensité de référence I₀ = 1,0 × 10⁻¹² W·m⁻²
#   NE figurent PAS dans les pages transcrites du livre de 1re (voir docs/notes/pc-1re-cours-c.md,
#   « Notions du programme absentes de cet extrait » : « pas de niveau sonore en décibels »).
#   Ils sont ici au programme et cohérents avec le tableau d'intensités p. 52 (dont la valeur la plus
#   basse, 10⁻¹² W·m⁻², est exactement I₀) et avec la plage 0 – 130 dB de cours-tle-c.md p. 274.
#   À confirmer sur le chapitre 16 du livre de Tle (docs/notes/pc-tle-cours-c.md, non transcrit).
# [VERIFY] Le livre de 1re note la fréquence f aux ch. 13-14 et ν au ch. 15 ; le livre de Tle note f.
#   Les deux notations sont utilisées ici, et un exercice porte explicitement sur cette équivalence.
units:
- id: pc-ondes
  matiere: physique
  title: 'Physique : ondes et lumière'
  description: Périodicité et célérité d'une onde, ondes sonores et ultrasons, spectre électromagnétique, énergie transportée par la lumière.
  skills:
  - id: pc-ondes-bases
    title: Notion d'onde
    icon: 〰️
    description: Onde mécanique ou électromagnétique, période, fréquence, longueur d'onde, célérité, réflexion, absorption et transmission.
    prerequisites: []
    lesson: lessons/pc-ondes-bases.md
    items:
    - type: mcq
      level: 1
      prompt: Quelle est la différence essentielle entre une onde **mécanique** et une onde **électromagnétique** ?
      choices:
      - L'onde mécanique a besoin d'un milieu matériel de propagation, pas l'onde électromagnétique.
      - L'onde mécanique transporte de la matière, pas l'onde électromagnétique.
      - L'onde mécanique est toujours longitudinale, l'onde électromagnétique toujours transversale.
      - L'onde mécanique se propage toujours plus vite que l'onde électromagnétique.
      answer: 0
      feedback:
      - null
      - 'Non : AUCUNE onde ne transporte de matière. La propagation d''une onde est un transfert d''énergie **sans déplacement de matière**.'
      - 'Non : longitudinale ou transversale décrit la **direction de la perturbation**, pas le type d''onde. Le son est mécanique et longitudinal, une vague est mécanique et transversale.'
      - 'Non, c''est l''inverse : c = 3,0 × 10⁸ m·s⁻¹ pour la lumière contre 340 m·s⁻¹ pour le son dans l''air à 20 °C.'
      explanation: 'Ondes mécaniques (son, ultrasons, ondes sismiques) : un milieu matériel est indispensable. Ondes électromagnétiques (lumière, ondes radio) : elles se propagent aussi dans le vide.'
      tags:
      - ondes-nature
    - type: mcq
      level: 1
      prompt: Que transporte une onde qui se propage ?
      choices:
      - De l'énergie, sans déplacement de matière.
      - De la matière, qui est entraînée par l'onde.
      - De l'énergie et de la matière.
      - 'Ni énergie ni matière : seule la forme se déplace.'
      answer: 0
      feedback:
      - null
      - 'Non : un bouchon sur l''eau monte et descend sur place, il n''est pas emporté par la vague. La matière ne se déplace pas globalement.'
      - 'Non : la matière ne se déplace pas globalement. Seule l''énergie se propage.'
      - 'Non : une onde transporte bien de l''**énergie** — c''est elle qui fait vibrer le tympan ou chauffer une surface éclairée.'
      explanation: 'À retenir : la propagation d''une onde s''accompagne d''un **transfert d''énergie sans déplacement de matière**.'
      tags:
      - ondes-nature
    - type: mcq
      level: 1
      prompt: 'Une onde est dite **longitudinale** lorsque :

        {{fig:pc-onde-longitudinale-transversale}}'
      choices:
      - la direction de la perturbation est parallèle à la direction de propagation
      - la direction de la perturbation est perpendiculaire à la direction de propagation
      - elle se propage sur une grande longueur
      - sa longueur d'onde est grande devant sa période
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition d''une onde **transversale** (exemple : une corde que l''on secoue).'
      - 'Non : « longitudinale » ne parle pas de la distance parcourue, mais de la **direction de la perturbation**.'
      - 'Non : λ (en m) et T (en s) ne sont pas des grandeurs comparables entre elles.'
      explanation: 'Longitudinale : perturbation **parallèle** à la propagation (compression d''un ressort, son). Transversale : perturbation **perpendiculaire** (corde, vague).'
      tags:
      - ondes-nature
    - type: mcq
      level: 1
      prompt: Lorsqu'une onde se propage, il y a une **double périodicité**. Quelles grandeurs la décrivent ?
      choices:
      - La longueur d'onde λ (périodicité dans l'espace) et la période T (périodicité dans le temps).
      - La célérité v (périodicité dans l'espace) et la fréquence f (périodicité dans le temps).
      - L'amplitude (périodicité dans l'espace) et la période T (périodicité dans le temps).
      - La longueur d'onde λ (périodicité dans le temps) et la période T (périodicité dans l'espace).
      answer: 0
      feedback:
      - null
      - 'Non : la célérité n''est pas une périodicité, c''est une **vitesse de propagation** (en m·s⁻¹).'
      - 'Non : l''amplitude mesure la **hauteur** de la perturbation, pas une périodicité.'
      - 'Non : les deux grandeurs sont inversées. λ se mesure en **mètre** : c''est une périodicité **spatiale** ; T se mesure en **seconde** : c''est une périodicité **temporelle**.'
      explanation: 'Périodicité spatiale : longueur d''onde λ, en mètre (m). Périodicité temporelle : période T, en seconde (s).'
      tags:
      - periodicite
    - type: mcq
      level: 1
      prompt: 'Quelle relation lie la longueur d''onde λ, la célérité v, la période T et la fréquence f ?

        {{fig:pc-onde-periode-longueur}}'
      choices:
      - λ = v × T = v / f
      - λ = v × f = v / T
      - λ = f / v = T × v
      - λ = T / v = f × v
      answer: 0
      feedback:
      - null
      - 'Erreur la plus fréquente : on **multiplie** par la fréquence au lieu de diviser. Vérifie avec les unités : m·s⁻¹ × Hz = m·s⁻² ; ce n''est pas une longueur.'
      - 'Non : f / v s''exprime en Hz/(m·s⁻¹) = m⁻¹, l''inverse d''une longueur.'
      - 'Non : T / v s''exprime en s/(m·s⁻¹) = s²·m⁻¹. Aucun de ces deux calculs ne donne des mètres.'
      explanation: 'λ = v × T = v / f, avec λ en m, v en m·s⁻¹, T en s et f en Hz. Contrôle par les unités : m·s⁻¹ × s = m, et m·s⁻¹ / s⁻¹ = m.'
      tags:
      - periodicite
    - type: mcq
      level: 1
      prompt: Quelle relation lie la période T et la fréquence f d'une onde périodique ?
      choices:
      - f = 1 / T, avec f en hertz (Hz) et T en seconde (s)
      - f = T, avec f et T en hertz (Hz)
      - f = T / 2, avec f en hertz (Hz) et T en seconde (s)
      - f = 2 π T, avec f en hertz (Hz) et T en seconde (s)
      answer: 0
      feedback:
      - null
      - 'Non : ce sont deux grandeurs différentes, d''unités différentes (s pour T, Hz = s⁻¹ pour f).'
      - 'Non : le facteur 2 n''a pas lieu d''être ; la fréquence est l''**inverse** de la période.'
      - 'Non : le facteur 2π sert à passer d''une fréquence à une pulsation, ce n''est pas au programme ici.'
      explanation: 'La fréquence est le nombre d''oscillations par seconde : f = 1 / T. Une période T = 5 ms donne f = 1 / 0,005 = 200 Hz.'
      tags:
      - periodicite
    - type: mcq
      level: 1
      prompt: 'Une onde passe d''un milieu A à un milieu B. Comment son énergie se répartit-elle ?

        {{fig:pc-reflexion-transmission}}'
      choices:
      - 'Elle est en partie réfléchie dans A, absorbée dans B et transmise après B : I = I r + I a + I t.'
      - 'Elle est intégralement transmise dans B : I = I t.'
      - 'Elle est intégralement réfléchie dans A : I = I r.'
      - 'Elle est réfléchie et transmise, mais jamais absorbée : I = I r + I t.'
      answer: 0
      feedback:
      - null
      - 'Non : il y a toujours une part réfléchie à la surface de séparation, et une part absorbée dans le milieu B.'
      - 'Non : une paroi laisse toujours passer une partie de l''énergie (c''est pourquoi on entend les voisins).'
      - 'Non : la part absorbée dans le milieu B (dissipée en chaleur) fait partie du bilan.'
      explanation: 'L''énergie de l''onde incidente est égale à la somme des énergies des ondes réfléchie, absorbée et transmise : I = I r + I a + I t.'
      tags:
      - reflexion-transmission
    - type: input
      level: 2
      prompt: Une onde sonore de fréquence f = 170 Hz se propage dans l'air à 20 °C, où la célérité du son vaut v = 340 m·s⁻¹. Calculer sa longueur d'onde λ, en mètres.
      answer: '2'
      numeric: true
      tolerance: 0.05
      unit: m
      explanation: 'λ = v / f = 340 / 170 = 2,0 m. Erreur fréquente : calculer f / v = 0,5, qui n''est pas une longueur.'
      tags:
      - periodicite
    - type: input
      level: 2
      prompt: Dans l'eau, où la célérité du son vaut v = 1 500 m·s⁻¹, une onde a une longueur d'onde λ = 3,0 m. Calculer sa fréquence f, en hertz.
      answer: '500'
      numeric: true
      tolerance: 5
      unit: Hz
      explanation: λ = v / f donc f = v / λ = 1 500 / 3,0 = 500 Hz.
      tags:
      - periodicite
    - type: input
      level: 2
      prompt: Une onde a pour fréquence f = 250 Hz. Calculer sa période T, en millisecondes.
      answer: '4'
      numeric: true
      tolerance: 0.05
      unit: ms
      explanation: 'T = 1 / f = 1 / 250 = 0,004 s = 4,0 ms. Erreur fréquente : oublier de convertir les secondes en millisecondes.'
      tags:
      - periodicite
    - type: grid
      level: 2
      prompt: Cochez uniquement les ondes **mécaniques** (les autres sont électromagnétiques).
      rows:
      - id: son
        label: Le son
      - id: lum
        label: La lumière visible
      - id: sis
        label: Les ondes sismiques
      - id: rad
        label: Les ondes radio
      - id: ult
        label: Les ultrasons
      - id: rx
        label: Les rayons X
      cols:
      - id: M
        label: Onde mécanique
      answer:
      - Mson
      - Msis
      - Mult
      labels:
        Mson: le son
        Mlum: la lumière visible
        Msis: les ondes sismiques
        Mrad: les ondes radio
        Mult: les ultrasons
        Mrx: les rayons X
      cellFeedback:
        Mson: 'le son est bien une onde mécanique : il ne se propage pas dans le vide'
        Mlum: 'la lumière est une onde **électromagnétique** : elle nous parvient du Soleil à travers le vide'
        Msis: 'les ondes sismiques sont mécaniques : elles se propagent dans les roches'
        Mrad: les ondes radio sont **électromagnétiques**, comme la lumière
        Mult: 'les ultrasons sont des sons : ondes mécaniques, de fréquence supérieure à 20 kHz'
        Mrx: les rayons X figurent sur le spectre **électromagnétique**, à gauche des UV
      explanation: 'Ondes mécaniques : son, ultrasons, ondes sismiques (un milieu matériel est indispensable). Ondes électromagnétiques : lumière visible, ondes radio, rayons X (elles se propagent aussi dans le vide).'
      tags:
      - ondes-nature
    - type: mcq
      level: 2
      prompt: De quoi dépend la **célérité** d'une onde ?
      choices:
      - De la nature de l'onde et du milieu de propagation.
      - De la fréquence de la source qui l'émet.
      - De l'amplitude de la perturbation.
      - De la distance parcourue depuis la source.
      answer: 0
      feedback:
      - null
      - 'Non : quand on change la fréquence, c''est la **longueur d''onde** qui change (λ = v / f), pas la célérité.'
      - 'Non : un son fort et un son faible se propagent à la même vitesse dans l''air.'
      - 'Non : la célérité ne diminue pas avec la distance ; c''est l''**intensité** de l''onde qui diminue.'
      explanation: 'La vitesse de propagation (célérité) d''une onde dépend de sa **nature** et de son **milieu de propagation** : 340 m·s⁻¹ pour le son dans l''air à 20 °C, 1 500 m·s⁻¹ dans l''eau, 3,0 × 10⁸ m·s⁻¹ pour la lumière dans le vide.'
      tags:
      - celerite
    - type: order
      level: 2
      prompt: Remettre dans l'ordre la méthode permettant de calculer la longueur d'onde à partir d'un enregistrement de la perturbation en fonction du temps.
      steps:
      - Relever la période T sur l'enregistrement, entre deux motifs identiques.
      - Calculer la fréquence f = 1 / T, en hertz.
      - Relever la célérité v de l'onde dans le milieu de propagation, en m·s⁻¹.
      - Calculer la longueur d'onde λ = v / f (ou, plus directement, λ = v × T).
      - 'Vérifier l''unité obtenue : λ doit s''exprimer en mètre.'
      explanation: λ = v × T = v / f. Le contrôle des unités est le meilleur garde-fou contre la confusion entre v / f et v × f.
      tags:
      - periodicite
    - type: mcq
      level: 2
      prompt: Pour transmettre une information (voix, musique) à distance, on utilise une **onde porteuse** électromagnétique. Comment l'information est-elle inscrite sur cette onde ?
      choices:
      - L'onde porteuse est **modulée** (en amplitude, en fréquence…) par le signal modulant, selon un code convenu entre émetteur et récepteur.
      - L'onde porteuse transporte physiquement l'air vibrant depuis l'émetteur.
      - L'onde porteuse est simplement émise plus fort quand le message est important.
      - Le signal modulant remplace l'onde porteuse pendant la durée du message.
      answer: 0
      feedback:
      - null
      - 'Non : une onde électromagnétique ne déplace pas de matière, et elle se propage même dans le vide.'
      - 'Non : augmenter la puissance ne code aucune information. Il faut faire varier une caractéristique de la porteuse selon un code.'
      - 'Non : la porteuse est présente en permanence ; c''est elle qui est déformée (modulée) par le signal.'
      explanation: L'onde porteuse est modulée (en amplitude, en fréquence, etc.) selon un code donné entre émetteur et récepteur par un signal modulant (voix, musique…). « FM » signifie modulation de fréquence.
      tags:
      - transmission-info
    - type: mcq
      level: 3
      prompt: 'Une onde arrive sur une paroi. On mesure I r = 0,30 I et I a = 0,50 I. Quelle est la part transmise I t ?

        {{fig:pc-reflexion-transmission}}'
      choices:
      - I t = 0,20 I
      - I t = 0,80 I
      - I t = 1,80 I
      - On ne peut pas le savoir sans connaître le matériau.
      answer: 0
      feedback:
      - null
      - 'Non : 0,80 I est la somme des parts réfléchie et absorbée, c''est-à-dire ce qui **ne traverse pas**.'
      - 'Non : l''énergie transmise ne peut pas dépasser l''énergie incidente. La relation est une somme **égale** à I.'
      - 'Non : la relation I = I r + I a + I t suffit ici, quel que soit le matériau.'
      explanation: I = I r + I a + I t donc I t = I − I r − I a = I × (1 − 0,30 − 0,50) = 0,20 I, soit 20 % de l'énergie incidente.
      tags:
      - reflexion-transmission
    - type: input
      level: 3
      prompt: Un haut-parleur émet dans l'air à 20 °C (v = 340 m·s⁻¹) un son de période T = 2,0 ms. Calculer sa longueur d'onde λ, en mètres.
      answer: '0.68'
      numeric: true
      tolerance: 0.02
      unit: m
      explanation: 'λ = v × T = 340 × 2,0 × 10⁻³ = 0,68 m. Erreur fréquente : oublier de convertir les millisecondes en secondes, ce qui donne 680 m.'
      tags:
      - periodicite
    - type: input
      level: 3
      prompt: Dans l'air à 20 °C (v = 340 m·s⁻¹), une onde sonore a une longueur d'onde λ = 1,7 m. Calculer sa fréquence f, en hertz.
      answer: '200'
      numeric: true
      tolerance: 2
      unit: Hz
      explanation: 'f = v / λ = 340 / 1,7 = 200 Hz. Cette fréquence est comprise entre 20 Hz et 20 kHz : le son est audible.'
      tags:
      - periodicite
    - type: mcq
      level: 3
      prompt: Une onde sonore traverse une cloison. Dans quel milieu se produit l'**absorption** de l'énergie, et que devient cette énergie ?
      choices:
      - 'Dans la cloison (milieu B) : l''énergie y est dissipée, essentiellement en chaleur.'
      - 'Dans la pièce de départ (milieu A) : l''énergie y revient sous forme d''écho.'
      - 'Dans la pièce d''arrivée : l''énergie absorbée est celle que l''on entend de l''autre côté.'
      - 'Nulle part : l''absorption n''existe que pour la lumière, pas pour le son.'
      answer: 0
      feedback:
      - null
      - 'Non : l''énergie qui revient dans le milieu A est la part **réfléchie** I r, pas la part absorbée.'
      - 'Non : l''énergie que l''on entend de l''autre côté est la part **transmise** I t.'
      - 'Non : toute onde, mécanique ou électromagnétique, peut être absorbée par la matière.'
      explanation: 'Réflexion : dans le milieu A, à la surface de contact. Absorption : dans le milieu B. Transmission : après le milieu B. C''est la part transmise que l''isolation acoustique cherche à réduire.'
      tags:
      - reflexion-transmission
  - id: pc-son
    title: Ondes sonores
    icon: 🔊
    description: Célérité du son, hauteur et fréquence, intensité acoustique et niveau sonore en décibels, ultrasons et mesure de distance.
    prerequisites:
    - pc-ondes-bases
    lesson: lessons/pc-son.md
    items:
    - type: mcq
      level: 1
      prompt: Pourquoi n'entend-on aucun son dans le vide ?
      choices:
      - 'Parce que le son est une onde mécanique : son énergie ne se propage que dans la matière.'
      - Parce que le son se propage trop lentement dans le vide.
      - Parce que le vide absorbe totalement l'énergie sonore.
      - Parce que la fréquence du son devient nulle dans le vide.
      answer: 0
      feedback:
      - null
      - 'Non : il ne s''y propage pas du tout, ce n''est pas une question de vitesse.'
      - 'Non : absorber suppose de la matière ; dans le vide, il n''y a rien pour absorber.'
      - 'Non : la fréquence est fixée par la source ; le problème est l''absence de milieu de propagation.'
      explanation: L'énergie d'une onde sonore ou ultrasonore se propage **uniquement dans la matière**, sans déplacement de celle-ci, à une célérité qui dépend des propriétés du milieu.
      tags:
      - son-celerite
    - type: mcq
      level: 1
      prompt: Quelle est la bande de fréquences des sons **audibles** par l'être humain ?
      choices:
      - De 20 Hz à 20 kHz
      - De 0 Hz à 20 kHz
      - De 20 Hz à 20 MHz
      - De 2 Hz à 2 kHz
      answer: 0
      feedback:
      - null
      - 'Non : en dessous de 20 Hz, ce sont des **infrasons**, inaudibles.'
      - 'Non : 20 MHz = 20 000 kHz, mille fois trop haut. On est très loin dans les ultrasons.'
      - 'Non : les deux bornes sont dix fois trop petites.'
      explanation: 'Les fréquences des sons audibles sont comprises entre 20 Hz et 20 kHz. En dessous : infrasons ; au-dessus : ultrasons.'
      tags:
      - son-hauteur
    - type: mcq
      level: 1
      prompt: La **hauteur** d'un son permet de distinguer les sons graves, médiums et aigus. À quelle grandeur est-elle liée ?
      choices:
      - 'À la fréquence : plus la fréquence est élevée, plus le son est aigu.'
      - 'À la fréquence : plus la fréquence est élevée, plus le son est grave.'
      - 'À l''amplitude : plus l''amplitude est grande, plus le son est aigu.'
      - 'À la célérité : plus le son va vite, plus il est aigu.'
      answer: 0
      feedback:
      - null
      - 'Non, c''est l''inverse : une **basse** a une fréquence faible, une flûte piccolo une fréquence élevée.'
      - 'Non : l''amplitude est liée à l''**intensité acoustique**, donc au fait que le son soit fort ou faible, pas à sa hauteur.'
      - 'Non : dans un même milieu, tous les sons se propagent à la même célérité, graves comme aigus.'
      explanation: 'Hauteur ↔ fréquence : plus f est élevée, plus le son est **aigu** ; plus f est basse, plus le son est **grave**.'
      tags:
      - son-hauteur
    - type: mcq
      level: 1
      prompt: Dans lequel de ces milieux le son se propage-t-il **le plus vite** ?
      choices:
      - L'acier à 20 °C (6 000 m·s⁻¹)
      - L'air à 20 °C (340 m·s⁻¹)
      - L'eau à 20 °C (1 500 m·s⁻¹)
      - La glace à 0 °C (3 200 m·s⁻¹)
      answer: 0
      feedback:
      - null
      - 'Non : l''air est un gaz, c''est le milieu où le son est le plus lent des quatre.'
      - 'Non : dans l''eau (liquide) le son va plus vite que dans l''air, mais moins vite que dans un solide.'
      - 'Non : la glace est un solide, donc rapide (3 200 m·s⁻¹), mais l''acier l''est encore plus.'
      explanation: 'Le son se propage de plus en plus vite quand l''état de la matière est successivement gazeux, liquide, puis solide : air 340, eau 1 500, glace 3 200, acier 6 000 m·s⁻¹ (valeurs du livre).'
      tags:
      - son-celerite
    - type: mcq
      level: 1
      prompt: Quelle est l'unité de l'**intensité acoustique** I, et quelle est la valeur de l'intensité de référence I₀ ?
      choices:
      - I s'exprime en W·m⁻² et I₀ = 1,0 × 10⁻¹² W·m⁻²
      - I s'exprime en décibels (dB) et I₀ = 0 dB
      - I s'exprime en watts (W) et I₀ = 1,0 × 10⁻¹² W
      - I s'exprime en W·m⁻² et I₀ = 1,0 × 10⁻¹² dB
      answer: 0
      feedback:
      - null
      - 'Non : le décibel est l''unité du **niveau sonore** L, pas de l''intensité acoustique I.'
      - 'Non : il manque la surface. L''intensité acoustique est une puissance **par unité de surface**, en W·m⁻².'
      - 'Non : le mélange d''unités est impossible. I₀ est une intensité acoustique, donc en W·m⁻².'
      explanation: Intensité acoustique I en watt par mètre carré (W·m⁻²). L'intensité de référence, la plus basse perceptible, vaut I₀ = 1,0 × 10⁻¹² W·m⁻², ce qui correspond à un niveau sonore de 0 dB.
      tags:
      - intensite-acoustique
    - type: mcq
      level: 1
      prompt: Qu'est-ce qu'un **ultrason** ?
      choices:
      - Une onde sonore de fréquence supérieure à 20 kHz, donc inaudible.
      - Un son d'intensité acoustique très élevée.
      - Une onde électromagnétique très rapide.
      - Une onde sonore de fréquence inférieure à 20 Hz.
      answer: 0
      feedback:
