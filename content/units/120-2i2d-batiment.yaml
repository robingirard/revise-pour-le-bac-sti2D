    title: Acoustique du bâtiment
    icon: 🔊
    description: Son, fréquence et pression acoustique, niveaux en décibels, énergie transmise/absorbée/réfléchie, isolation et correction acoustiques, affaiblissement, réverbération.
    prerequisites:
    - 2i2d-bat-parois
    lesson: lessons/2i2d-batiment-acoustique.md
    items:
    - type: mcq
      level: 1
      prompt: 'Qu''est-ce qu''un **son**, selon le livre ?'
      choices:
      - Une sensation auditive produite par une variation rapide de la pression de l'air
      - Un déplacement d'air d'un point à un autre de la pièce
      - Une onde électromagnétique qui se propage dans le vide
      - Une élévation de la température de l'air
      answer: 0
      feedback:
      - null
      - 'Non : les molécules d''air vibrent autour de leur position, elles ne sont pas transportées d''un bout à l''autre du local.'
      - 'Non : le son a besoin de matière pour se propager ; c''est la lumière qui traverse le vide.'
      - 'Non : la température n''intervient pas dans la définition (elle modifie seulement la vitesse de propagation).'
      explanation: '« Le son est une sensation auditive produite par une variation rapide de la pression de l''air », créée par la vibration d''un corps ; il en résulte une succession de zones de pression et de dépression qui fait vibrer le tympan (Tle, p. 274).'
      tags:
      - son
    - type: mcq
      level: 1
      prompt: 'Quelle est la vitesse de propagation du son dans l''air retenue par le livre ?'
      choices:
      - 340 m/s
      - 340 km/s
      - 3 × 10⁸ m/s
      - 1 500 m/s
      answer: 0
      feedback:
      - null
      - 'Non : 340 km/s serait mille fois trop rapide.'
      - 'Non : 3 × 10⁸ m/s est la vitesse de la **lumière** dans le vide.'
      - 'Non : 1 500 m/s est l''ordre de grandeur de la vitesse du son dans l''**eau**, pas dans l''air.'
      explanation: '« La vitesse de propagation du son dans l''air est de 340 m/s » (Tle, p. 274). C''est cette valeur qui explique l''écho perçu dans les grands volumes et qu''on utilise pour calculer les retards de propagation.'
      tags:
      - son
    - type: mcq
      level: 1
      prompt: 'Quelle plage de fréquences l''oreille humaine perçoit-elle ?'
      choices:
      - Entre 20 Hz et 20 000 Hz
      - Entre 0 Hz et 130 Hz
      - Entre 20 Hz et 2 000 Hz
      - Entre 200 Hz et 20 000 Hz
      answer: 0
      feedback:
      - null
      - 'Non : 0 à 130 est la plage des **niveaux sonores** en décibels, pas des fréquences.'
      - 'Non : erreur d''un facteur 10 sur la borne haute.'
      - 'Non : erreur d''un facteur 10 sur la borne basse.'
      explanation: '« L''oreille humaine perçoit les sons dont la fréquence est comprise entre 20 Hz et 20 000 Hz » (Tle, p. 274). Plus la fréquence est élevée, plus le son est aigu. En acoustique du bâtiment, les basses fréquences (bruits d''impact, machines) sont les plus difficiles à traiter.'
      tags:
      - son
    - type: mcq
      level: 2
      prompt: 'L''oreille est sensible à des pressions acoustiques allant de 0,00002 Pa à 20 Pa. Pourquoi a-t-on créé le **décibel** ?'
      choices:
      - 'Parce que le rapport de 1 à 1 000 000 entre ces pressions est trop large : l''échelle logarithmique le ramène à 0-130 dB'
      - Parce que le pascal n'est pas une unité du système international
      - Parce que la pression acoustique ne se mesure pas
      - Parce que le décibel est proportionnel à la fréquence du son
      answer: 0
      feedback:
      - null
      - 'Non : le pascal est bien l''unité SI de pression ; il est simplement peu commode ici.'
      - 'Non : elle se mesure très bien (sonomètre) ; c''est l''**étendue** des valeurs qui pose problème.'
      - 'Non : le décibel ne dit rien de la fréquence, seulement de l''intensité.'
      explanation: 'L''oreille est sensible « à des pressions allant de 0,00002 Pa à 20 Pa, soit un rapport de 1 à 1 000 000. Pour ramener cette large échelle à une échelle plus réduite […] on a adopté la notation logarithmique et créé le décibel » (Tle, p. 274). L''oreille perçoit de 0 à 130 dB, seuil de la douleur.


        {{fig:pc-echelle-decibels}}'
      tags:
      - decibels
    - type: input
      level: 2
      prompt: 'Un local industriel présente une intensité acoustique $I = 1{,}0 \times 10^{-5}$ W/m². Calculer le niveau sonore $L$, avec $L = 10\log(I/I_0)$ et $I_0 = 1{,}0 \times 10^{-12}$ W/m².


        {{fig:pc-echelle-decibels}}'
      answer: '70'
      numeric: true
      tolerance: 1
      unit: dB
      explanation: '$\dfrac{I}{I_0} = \dfrac{10^{-5}}{10^{-12}} = 10^{7}$ ; $L = 10\log(10^{7}) = 70$ dB. Retenir que chaque puissance de 10 sur $I$ ajoute 10 dB.'
      tags:
      - decibels
    - type: input
      level: 2
      prompt: 'Deux machines identiques produisent chacune 60 dB dans un atelier. Quel niveau sonore obtient-on quand elles fonctionnent ensemble (arrondir à l''unité) ?'
      answer: '63'
      numeric: true
      tolerance: 1
      unit: dB
      explanation: 'Les décibels ne s''additionnent pas : ce sont les **intensités** qui s''ajoutent. $I_{\text{tot}} = 2 \times 10^{-6}$ W/m², donc $L = 10\log(2 \times 10^{6}) = 63$ dB. Doubler l''intensité, c''est **+3 dB**, pas 120 dB.'
      tags:
      - decibels
    - type: mcq
      level: 3
      prompt: 'Dix machines identiques de 60 dB chacune fonctionnent ensemble. Quel est le niveau sonore résultant ?'
      choices:
      - 70 dB
      - 600 dB
      - 63 dB
      - 130 dB
      answer: 0
      feedback:
      - null
      - 'Non : on n''additionne jamais des décibels entre eux.'
      - 'Non : 63 dB correspond à **deux** sources (× 2 sur l''intensité).'
      - 'Non : 130 dB est le seuil de la douleur, il n''y a aucune raison de l''atteindre ici.'
      explanation: 'L''intensité est multipliée par 10, donc le niveau augmente de $10\log(10) = 10$ dB : $60 + 10 = 70$ dB. Conséquence pratique : supprimer la moitié des sources ne fait gagner que 3 dB — il vaut souvent mieux traiter la source la plus bruyante.'
      tags:
      - decibels
    - type: mcq
      level: 1
      prompt: 'Une onde sonore rencontre une paroi. En combien de parts son énergie incidente se divise-t-elle ?


        {{fig:pc-reflexion-transmission}}'
      choices:
      - Trois — l'énergie transmise, l'énergie absorbée et l'énergie réfléchie
      - Deux — l'énergie réfléchie et l'énergie transmise
      - Deux — l'énergie absorbée et l'énergie transmise
      - Une seule — toute l'énergie traverse la paroi
      answer: 0
      feedback:
      - null
      - 'Non : il manque l''énergie **absorbée**, dissipée en chaleur dans le matériau.'
      - 'Non : il manque l''énergie **réfléchie** vers le local d''origine.'
      - 'Non : une paroi réfléchit et absorbe toujours une partie de l''énergie incidente.'
      explanation: '« Lorsqu''une onde sonore rencontre une paroi, son énergie incidente est divisée en trois : l''énergie transmise qui traverse la paroi, l''énergie absorbée par la paroi et dissipée en chaleur, l''énergie réfléchie vers le local d''origine » (Tle, p. 274-275).'
      tags:
      - transmission
    - type: mcq
      level: 2
      prompt: 'Un acousticien veut réduire le bruit qui passe d''un logement à l''autre à travers un mur. Sur quelle part de l''énergie agit-il, et de quel domaine relève son action ?


        {{fig:pc-reflexion-transmission}}'
      choices:
      - Sur l'énergie **transmise**, qu'il cherche à réduire — c'est l'isolation acoustique
      - Sur l'énergie **absorbée**, qu'il cherche à réduire — c'est l'isolation acoustique
      - Sur l'énergie **réfléchie**, qu'il cherche à augmenter — c'est l'isolation acoustique
      - Sur l'énergie **transmise**, qu'il cherche à augmenter — c'est la correction acoustique
      answer: 0
      feedback:
      - null
      - 'Non : l''énergie absorbée relève de la **correction** acoustique, et on cherche plutôt à l''augmenter.'
      - 'Non : l''énergie réfléchie relève également de la correction acoustique.'
      - 'Non : on cherche à **réduire** l''énergie transmise, et cela relève de l''isolation.'
      explanation: '« L''isolation acoustique traite de l''énergie transmise par la paroi en la réduisant le plus possible. Les parties absorbées et réfléchies sont du domaine de la correction acoustique » (Tle, p. 275).'
      tags:
      - isolation-acoustique
    - type: mcq
      level: 2
      prompt: 'On pose des panneaux absorbants au plafond d''une salle de restaurant trop bruyante. De quoi s''agit-il ?'
      choices:
      - De correction acoustique — on agit sur l'énergie absorbée et réfléchie **dans** le local
      - D'isolation acoustique — on empêche le bruit de sortir du local
      - D'isolation thermique — les panneaux absorbants sont d'abord des isolants
      - De ventilation — les panneaux améliorent la circulation de l'air
      answer: 0
      feedback:
      - null
      - 'Non : l''isolation traite le bruit **transmis** vers les autres locaux ; ici on traite le confort à l''intérieur de la salle.'
      - 'Non : même si les matériaux se ressemblent, la fonction visée est acoustique.'
      - 'Non : les panneaux acoustiques ne sont pas des dispositifs de ventilation.'
      explanation: Correction acoustique = confort **à l'intérieur** du local (on absorbe l'énergie réfléchie pour réduire la réverbération). Isolation acoustique = protection **entre** locaux (on réduit l'énergie transmise à travers la paroi).
      tags:
      - correction-acoustique
    - type: input
      level: 2
      prompt: 'Un atelier produit un niveau sonore $L_1 = 85$ dB. Il est séparé d''un bureau par une paroi dont l''**indice d''affaiblissement acoustique** vaut $R = 42$ dB. Quel niveau $L_2$ reçoit-on dans le bureau ?


        {{fig:2i2d-affaiblissement-paroi}}'
      answer: '43'
      numeric: true
      tolerance: 1
      unit: dB
      explanation: '$L_2 = L_1 - R = 85 - 42 = 43$ dB. L''indice d''affaiblissement $R$, exprimé en décibels, mesure la réduction de niveau apportée par la paroi : il ne se calcule pas comme une résistance thermique, il se **soustrait** au niveau émis.'
      tags:
      - isolation-acoustique
    - type: input
      level: 3
      prompt: 'Le même atelier émet $L_1 = 85$ dB. Le cahier des charges impose un niveau maximal de $L_2 = 35$ dB dans le bureau voisin. Quel indice d''affaiblissement $R$ la paroi doit-elle présenter au minimum ?'
      answer: '50'
      numeric: true
      tolerance: 1
      unit: dB
      explanation: '$R = L_1 - L_2 = 85 - 35 = 50$ dB. Passer de 42 à 50 dB d''affaiblissement suppose une paroi bien plus lourde ou un doublage désolidarisé : les derniers décibels coûtent très cher.'
      tags:
      - isolation-acoustique
    - type: mcq
      level: 2
      prompt: 'Deux cloisons simples de même épaisseur, l''une en plaques de plâtre légères, l''autre en béton lourd. Laquelle isole le mieux du bruit aérien, et pourquoi ?'
      choices:
      - La cloison en béton, car plus une paroi est lourde, plus elle est difficile à mettre en vibration
      - La cloison en plâtre, car les matériaux légers absorbent mieux le son
      - Les deux sont équivalentes, seule l'épaisseur compte
      - La cloison en plâtre, car elle est meilleure isolante thermique
      answer: 0
      feedback:
      - null
      - 'Non : absorber le son **dans** un local (correction) et l''empêcher de traverser une paroi (isolation) sont deux problèmes différents. Un matériau léger et poreux absorbe bien mais isole mal.'
      - 'Non : à épaisseur égale, la masse par mètre carré change tout.'
      - 'Non : les qualités thermiques et acoustiques ne vont pas de pair — la laine minérale isole thermiquement mais n''arrête pas seule le bruit.'
      explanation: 'Une onde sonore fait vibrer la paroi, qui rayonne à son tour du son de l''autre côté. Plus la paroi est **lourde**, plus elle est difficile à mettre en mouvement et plus l''énergie transmise est faible. C''est pourquoi on distingue les matériaux **isolants** acoustiques (lourds ou en système masse-ressort-masse) des matériaux **absorbants** (légers et poreux).'
      tags:
      - isolation-acoustique
    - type: mcq
      level: 3
      prompt: 'Pourquoi un doublage « masse-ressort-masse » (deux parois séparées par une lame d''air garnie de laine) isole-t-il mieux qu''une paroi unique de même masse totale ?'
      choices:
      - 'La lame d''air et la laine découplent les deux parois : la vibration de la première se transmet mal à la seconde'
      - Parce que l'air est un excellent isolant acoustique
      - Parce que la laine réfléchit le son vers le local d'origine
      - Parce que deux parois pèsent forcément plus lourd qu'une seule
      answer: 0
      feedback:
      - null
      - 'Non : l''air seul transmet parfaitement le son — c''est justement le milieu de propagation. C''est le **découplage mécanique** qui agit.'
      - 'Non : la laine **absorbe** l''énergie dans la cavité, elle ne la renvoie pas.'
      - 'Non : l''énoncé précise « à masse totale égale » : l''avantage ne vient pas de la masse.'
      explanation: Le système se comporte comme deux masses reliées par un ressort amorti. Au-delà de sa fréquence de résonance, ce montage atténue bien plus qu'une paroi simple de même masse. C'est le principe du double vitrage et des cloisons de doublage.
      tags:
      - isolation-acoustique
    - type: mcq
      level: 2
      prompt: 'Qu''appelle-t-on **temps de réverbération** d''une salle ?


        {{fig:2i2d-reverberation-salle}}'
      choices:
      - La durée nécessaire pour que le niveau sonore décroisse de 60 dB après l'arrêt de la source
      - La durée que met le son pour traverser la salle
      - Le nombre d'échos perçus dans la salle
      - La durée pendant laquelle une source doit émettre pour être entendue
      answer: 0
      feedback:
      - null
      - 'Non : le trajet direct dure quelques centièmes de seconde (340 m/s) ; la réverbération dure bien plus longtemps.'
      - 'Non : le temps de réverbération est une **durée**, exprimée en secondes.'
      - 'Non : la définition porte sur ce qui se passe **après** l''arrêt de la source.'
      explanation: 'Après l''arrêt de la source, le son continue de rebondir sur les parois avant de s''éteindre. Le temps de réverbération $T_R$ est la durée au bout de laquelle le niveau a chuté de 60 dB. Une salle trop réverbérante devient inintelligible ; c''est un objet de **correction** acoustique.'
      tags:
      - reverberation
    - type: input
      level: 3
      prompt: 'Un gymnase a un volume $V = 1\,000$ m³ et une aire d''absorption équivalente $A = 200$ m². La formule de Sabine donne $T_R = 0{,}16 \times \dfrac{V}{A}$ (avec $V$ en m³, $A$ en m² et $T_R$ en s). Calculer le temps de réverbération.'
      answer: '0.8'
      numeric: true
      tolerance: 0.03
      unit: s
      explanation: '$T_R = 0{,}16 \times \dfrac{1\,000}{200} = 0{,}80$ s. Plus le volume est grand, plus la réverbération dure ; plus l''absorption est grande, plus elle est courte.'
      tags:
      - reverberation
    - type: input
      level: 3
      prompt: 'Dans ce gymnase ($V = 1\,000$ m³, $A = 200$ m²), on veut ramener le temps de réverbération à $T_R = 0{,}50$ s. Quelle aire d''absorption équivalente $A$ faut-il atteindre ?'
      answer: '320'
      numeric: true
      tolerance: 5
      unit: m²
      explanation: '$A = 0{,}16 \times \dfrac{V}{T_R} = 0{,}16 \times \dfrac{1\,000}{0{,}50} = 320$ m². Il faut donc **ajouter 120 m²** d''absorption équivalente, par exemple sous forme de panneaux absorbants au plafond ou en haut des murs.'
      tags:
      - reverberation
    - type: mcq
      level: 2
      prompt: 'Pourquoi la parole est-elle difficile à comprendre dans un hall d''entrée entièrement carrelé et vitré ?'
      choices:
      - 'Les parois lisses et dures réfléchissent presque toute l''énergie : la réverbération brouille les syllabes'
      - Le carrelage absorbe les sons aigus et ne laisse passer que les graves
      - Le verre transmet le bruit de l'extérieur vers l'intérieur
      - La vitesse du son y est plus élevée
      answer: 0
      feedback:
      - null
      - 'Non : le carrelage n''absorbe presque rien, ni les aigus ni les graves — il **réfléchit**.'
      - 'Non : c''est un problème d''isolation, réel mais différent de l''intelligibilité dans le hall.'
      - 'Non : la vitesse du son dans l''air reste de 340 m/s quelles que soient les parois.'
      explanation: Des parois dures et lisses renvoient l'essentiel de l'énergie incidente ; l'aire d'absorption équivalente est faible, donc le temps de réverbération est long. Chaque syllabe est encore audible quand la suivante est prononcée, et le message devient confus.
      tags:
      - reverberation
    - type: grid
      level: 2
      prompt: 'Pour chaque solution, cochez le domaine dont elle relève.'
      rows:
      - id: mur
        label: Épaissir et alourdir le mur mitoyen
      - id: pan
        label: Poser des panneaux absorbants au plafond de la salle
      - id: dou
        label: Doubler la cloison avec une lame d'air et de la laine
      - id: rid
        label: Installer des rideaux épais et un tapis dans la salle
      cols:
      - id: I
        label: Isolation acoustique (énergie transmise)
      - id: C
        label: Correction acoustique (énergies absorbée et réfléchie)
      answer:
      - Imur
      - Cpan
      - Idou
      - Crid
      cellFeedback:
        Imur: alourdir la paroi réduit l'énergie transmise vers le local voisin
        Cmur: 'la masse du mur ne change presque rien à la réverbération dans le local : elle agit sur la transmission'
        Cpan: les panneaux absorbent l'énergie réfléchie et réduisent la réverbération
        Ipan: 'un panneau absorbant léger arrête très mal le bruit transmis : il ne fait pas office d''isolant'
        Idou: le système masse-ressort-masse réduit l'énergie transmise
        Crid: rideaux et tapis augmentent l'aire d'absorption équivalente de la salle
        Irid: 'un rideau ne pèse presque rien : il ne réduit pas le bruit transmis au local voisin'
      explanation: 'Deux problèmes, deux familles de solutions : contre le bruit **venu d''ailleurs**, on alourdit ou on découple les parois (isolation) ; contre le bruit **produit sur place**, on absorbe (correction).'
      tags:
      - correction-acoustique
    - type: order
      level: 2
      prompt: 'Remettez dans l''ordre le parcours de l''énergie sonore, de la source au local voisin.


        {{fig:pc-reflexion-transmission}}'
      steps:
      - Un corps vibre et met en mouvement les molécules d'air voisines
      - L'onde acoustique se propage dans l'air à 340 m/s et atteint la paroi
      - Une part de l'énergie est réfléchie vers le local d'origine
      - Une part est absorbée dans la paroi et dissipée en chaleur
      - La part restante est transmise et rayonnée dans le local voisin
      explanation: 'C''est la décomposition de la p. 274-275 : énergie incidente = réfléchie + absorbée + transmise. L''isolation vise la dernière part, la correction les deux premières.'
      tags:
      - transmission
    - type: match
      level: 1
      prompt: Associez chaque grandeur de l'acoustique du bâtiment à son unité.
      pairs:
      - left: Fréquence d'un son
        right: hertz (Hz)
      - left: Pression acoustique
        right: pascal (Pa)
      - left: Niveau sonore
        right: décibel (dB)
      - left: Indice d'affaiblissement d'une paroi
        right: décibel (dB)
      - left: Temps de réverbération
        right: seconde (s)
      explanation: 'Attention : le niveau sonore et l''indice d''affaiblissement s''expriment tous deux en décibels, mais le premier décrit un **bruit** et le second une **paroi** ; on les soustrait ($L_2 = L_1 - R$).'
      tags:
      - unites
    - type: mcq
      level: 2
      prompt: 'Un occupant se plaint des bruits de pas de l''étage au-dessus. De quel type de bruit s''agit-il, et comment le traiter en priorité ?'
      choices:
      - D'un bruit d'impact — on interpose une couche résiliente sous la chape (chape flottante)
      - D'un bruit aérien — il suffit d'alourdir le plafond
      - D'un problème de réverbération — il faut poser des absorbants
      - D'un défaut d'isolation thermique du plancher
      answer: 0
      feedback:
      - null
      - 'Non : un bruit aérien naît dans l''air (voix, musique). Ici, le choc est appliqué **directement** à la structure.'
      - 'Non : la réverbération concerne le son qui rebondit dans un local, pas la transmission par la structure.'
      - 'Non : les performances thermiques et acoustiques d''un plancher sont indépendantes.'
      explanation: 'Un bruit d''impact est injecté directement dans la structure, qui le propage très efficacement. Alourdir ne suffit pas : il faut **désolidariser**, en interposant un matériau résilient entre la chape et la dalle porteuse.'
      tags:
      - isolation-acoustique
  - id: 2i2d-bat-eclairage
    title: Éclairage et grandeurs photométriques
    icon: 💡
    description: Flux lumineux en lumen, intensité en candela, éclairement en lux, efficacité lumineuse en lm/W, sources lumineuses et dimensionnement d'une installation.
    prerequisites: []
    lesson: lessons/2i2d-batiment-eclairage.md
    items:
    - type: mcq
      level: 1
      prompt: 'Comment le livre définit-il le **flux lumineux** $\varphi$, et dans quelle unité s''exprime-t-il ?


        {{fig:2i2d-grandeurs-photometriques}}'
      choices:
      - La quantité d'énergie émise par une source sous forme de rayonnements visibles dans **toutes les directions**, par unité de temps — en lumen (lm)
      - L'importance du rayonnement émis dans **une direction** donnée — en candela (cd)
      - La quantité de lumière reçue par unité de surface — en lux (lx)
      - Le rapport du flux lumineux à la puissance électrique — en lm/W
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition de l''**intensité lumineuse** $I$, en candela.'
      - 'Non : c''est la définition de l''**éclairement** $E$, en lux.'
      - 'Non : c''est la définition de l''**efficacité lumineuse** $\eta$.'
      explanation: 'Le flux lumineux est « la quantité d''énergie émise par une source sous forme de rayonnements visibles dans toutes les directions, par unité de temps ». Symbole $\varphi$, unité le **lumen (lm)** (Tle, p. 275). C''est la grandeur inscrite sur les emballages des ampoules.'
      tags:
      - photometrie
    - type: mcq
      level: 1
      prompt: 'Dans quelle unité s''exprime l''**intensité lumineuse** $I$ ?


        {{fig:2i2d-grandeurs-photometriques}}'
      choices:
      - La candela (cd)
      - Le lumen (lm)
      - Le lux (lx)
      - Le watt (W)
      answer: 0
      feedback:
      - null
      - 'Non : le lumen est l''unité du **flux** lumineux, émis dans toutes les directions.'
      - 'Non : le lux est l''unité de l''**éclairement** d''une surface.'
      - 'Non : le watt est l''unité de la puissance électrique consommée par la source.'
      explanation: '« L''intensité lumineuse définit l''importance du flux lumineux émis dans une direction donnée par une source ponctuelle. » Symbole $I$, unité la **candela (cd)** (Tle, p. 275). C''est elle qui distingue un spot directif d''une ampoule diffusante à flux égal.'
      tags:
      - photometrie
    - type: mcq
      level: 1
      prompt: 'Quelle est l''unité de l''**éclairement lumineux** $E$ ?


