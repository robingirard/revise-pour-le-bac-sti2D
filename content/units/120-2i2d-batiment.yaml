# 2I2D Tle — le bâtiment : thermique, acoustique, éclairage
# Sources : docs/notes/cours-tle-b.md (représentation du bâtiment, p. 263-264),
#           docs/notes/cours-tle-c.md (comportement thermique p. 273-274, acoustique p. 274-275,
#           éclairage p. 275-276), docs/notes/cours-tle-d.md (thermique des matériaux, p. 284-285),
#           docs/notes/exercices-1re-b.md (exercice 13, pergola climatique, p. 179-181).
# Les bases de physique (chaleur, flux, R_th, conduction/convection/rayonnement) sont traitées
# dans l'unité pc-thermique : cette unité prend le point de vue de l'ingénieur du bâtiment.
units:
- id: 2i2d-batiment
  matiere: ingenierie
  title: '2I2D Tle : bâtiment — thermique, acoustique, éclairage'
  description: Parois et coefficient U, déperditions d'une pièce, ponts thermiques, inertie et confort, isolation acoustique, éclairage et dimensionnement.
  skills:
  - id: 2i2d-bat-parois
    title: Parois, résistance thermique et coefficient U
    icon: 🧱
    description: Conductivité λ, résistance thermique R = e/λ, parois multicouches, coefficient de transmission U = 1/R, flux surfacique φ.
    prerequisites: []
    lesson: lessons/2i2d-batiment-parois.md
    items:
    - type: mcq
      level: 1
      prompt: 'Dans quelle unité s''exprime la **conductivité thermique** $\lambda$ d''un matériau de construction ?'
      choices:
      - W/(m·K)
      - m²·K/W
      - W/(m²·K)
      - J/(kg·K)
      answer: 0
      feedback:
      - null
      - 'Non : m²·K/W est l''unité de la **résistance thermique** $R$, qui tient compte de l''épaisseur.'
      - 'Non : W/(m²·K) est l''unité du **coefficient de transmission surfacique** $U$ d''une paroi.'
      - 'Non : J/(kg·K) est l''unité de la **chaleur massique** $C$.'
      explanation: '$\lambda$ mesure « la quantité de chaleur qui se propage à travers un matériau d''un mètre d''épaisseur pour une différence de température de 1 kelvin entre les deux faces » (Tle, p. 283). Elle s''exprime en **W/(m·K)**.'
      tags:
      - conductivite
    - type: mcq
      level: 1
      prompt: 'Dans quelle unité s''exprime la **résistance thermique** $R$ d''une couche de matériau ?'
      choices:
      - m²·K/W
      - W/(m·K)
      - W/m²
      - W/(m²·K)
      answer: 0
      feedback:
      - null
      - 'Non : W/(m·K) est l''unité de la conductivité $\lambda$, une propriété du **matériau** qui ne dépend pas de l''épaisseur.'
      - 'Non : W/m² est l''unité du **flux surfacique** $\varphi$.'
      - 'Non : W/(m²·K) est l''unité du coefficient $U$, qui est l''**inverse** de $R$.'
      explanation: '$R = \dfrac{e}{\lambda}$ : une épaisseur en m divisée par une conductivité en W/(m·K) donne bien des **m²·K/W** (Tle, p. 284).'
      tags:
      - resistance
    - type: mcq
      level: 1
      prompt: 'Un ingénieur cherche un matériau **isolant** pour une façade. Que doit-il regarder ?'
      choices:
      - Une conductivité $\lambda$ **faible**, qui donne une résistance thermique élevée
      - Une conductivité $\lambda$ **élevée**, qui freine le passage de la chaleur
      - Une masse volumique élevée, seul critère de l'isolation thermique
      - Une résistance thermique $R$ **faible**
      answer: 0
      feedback:
      - null
      - 'Non : une conductivité élevée signifie au contraire que la chaleur **traverse facilement** le matériau.'
      - 'Non : la masse volumique intervient dans l''**inertie** thermique et dans l''isolation **acoustique**, pas dans la conductivité.'
      - 'Non : une résistance faible laisse passer beaucoup de flux — c''est le comportement d''un conducteur.'
      explanation: '« Plus la conductivité thermique est faible, plus le matériau est isolant » (Tle, p. 283). Comme $R = e/\lambda$, un petit $\lambda$ donne une grande résistance thermique à épaisseur égale.'
      tags:
      - conductivite
    - type: mcq
      level: 1
      prompt: 'Deux moyens permettent d''augmenter la résistance thermique $R$ d''une paroi. Lesquels ?'
      choices:
      - Choisir un matériau de $\lambda$ plus faible et/ou augmenter l'épaisseur $e$
      - Choisir un matériau de $\lambda$ plus élevée et/ou augmenter l'épaisseur $e$
      - Choisir un matériau de $\lambda$ plus faible et/ou diminuer l'épaisseur $e$
      - Augmenter la surface de la paroi
      answer: 0
      feedback:
      - null
      - 'Non : $R = e/\lambda$ — augmenter $\lambda$ **diminue** la résistance.'
      - 'Non : $e$ est au numérateur ; diminuer l''épaisseur réduit la résistance.'
      - 'Non : la surface n''intervient pas dans $R$, qui est la résistance d''**un mètre carré** de paroi.'
      explanation: '« Pour perdre moins d''énergie, il faut choisir un matériau isolant ayant une faible conductivité thermique et/ou augmenter l''épaisseur de la paroi isolante » (Tle, p. 284).'
      tags:
      - resistance
    - type: input
      level: 2
      prompt: 'Une couche de **laine de verre** ($\lambda = 0{,}04$ W/(m·K)) a une épaisseur $e = 0{,}20$ m. Calculer sa résistance thermique $R$.


        {{fig:2i2d-paroi-multicouche}}'
      answer: '5'
      numeric: true
      tolerance: 0.05
      unit: m²·K/W
      explanation: '$R = \dfrac{e}{\lambda} = \dfrac{0{,}20}{0{,}04} = 5$ m²·K/W. Erreur classique : garder l''épaisseur en centimètres (20/0,04 donnerait 500).'
      tags:
      - resistance
    - type: input
      level: 2
      prompt: 'Un voile de **béton** ($\lambda = 1$ W/(m·K)) a une épaisseur $e = 0{,}20$ m. Calculer sa résistance thermique $R$.'
      answer: '0.2'
      numeric: true
      tolerance: 0.01
      unit: m²·K/W
      explanation: '$R = \dfrac{0{,}20}{1} = 0{,}20$ m²·K/W. À épaisseur égale, la laine de verre fait 25 fois mieux (5 m²·K/W) : le béton est un matériau **porteur**, pas un isolant.'
      tags:
      - resistance
    - type: input
      level: 2
      prompt: 'Un vitrage simple de **verre** ($\lambda = 1{,}2$ W/(m·K)) a une épaisseur $e = 4$ mm. Calculer sa résistance thermique $R$ (trois chiffres significatifs).'
      answer: '0.0033'
      numeric: true
      tolerance: 0.0004
      unit: m²·K/W
      explanation: '$R = \dfrac{0{,}004}{1{,}2} = 3{,}33 \times 10^{-3}$ m²·K/W, soit **1 500 fois moins** qu''une couche de 20 cm de laine de verre. Un simple vitrage n''isole pratiquement pas : c''est l''**air emprisonné** entre deux verres qui isole dans un double vitrage (Tle, p. 283).'
      tags:
      - resistance
    - type: mcq
      level: 2
      prompt: 'Un mur est composé de plusieurs couches de matériaux accolées. Comment obtient-on sa résistance thermique totale ?


        {{fig:pc-resistances-serie}}'
      choices:
      - On additionne les résistances thermiques de chaque couche
      - On additionne les conductivités thermiques de chaque couche
      - On ne garde que la résistance de la couche isolante
      - On fait la moyenne des résistances des couches
      answer: 0
      feedback:
      - null
      - 'Non : les conductivités ne s''additionnent pas. Il faut d''abord convertir chaque couche en résistance $e/\lambda$.'
      - 'Non : les autres couches apportent leur part, même si elle est faible ; on les compte toutes.'
      - 'Non : les couches sont traversées par le **même** flux, elles sont en **série** : leurs résistances s''ajoutent, elles ne se moyennent pas.'
      explanation: '« La résistance thermique totale du mur est égale à la somme des résistances thermiques de chaque matériau » (Tle, p. 284) : $R^{\text{série}} = R^1 + R^2 + \cdots + R^n$.'
      tags:
      - multicouche
    - type: input
      level: 2
      prompt: 'Un mur est constitué de 0,20 m de **béton** ($\lambda = 1$ W/(m·K)) doublé de 0,12 m de **laine de verre** ($\lambda = 0{,}04$ W/(m·K)). Calculer la résistance thermique totale du mur.


        {{fig:2i2d-paroi-multicouche}}'
      answer: '3.2'
      numeric: true
      tolerance: 0.05
      unit: m²·K/W
      explanation: '$R_{\text{béton}} = 0{,}20/1 = 0{,}20$ m²·K/W ; $R_{\text{laine}} = 0{,}12/0{,}04 = 3{,}0$ m²·K/W. En série : $R = 0{,}20 + 3{,}0 = 3{,}2$ m²·K/W. L''isolant apporte 94 % de la résistance du mur.'
      tags:
      - multicouche
    - type: input
      level: 3
      prompt: 'Calculer la résistance thermique totale d''un mur de trois couches : **parpaing** 0,20 m ($\lambda = 0{,}95$ W/(m·K)), **laine de verre** 0,10 m ($\lambda = 0{,}04$ W/(m·K)), **plaque de plâtre** 0,013 m ($\lambda = 0{,}25$ W/(m·K)). Arrondir au centième.'
      answer: '2.76'
      numeric: true
      tolerance: 0.04
      unit: m²·K/W
      explanation: '$0{,}20/0{,}95 = 0{,}211$ ; $0{,}10/0{,}04 = 2{,}50$ ; $0{,}013/0{,}25 = 0{,}052$. Total $R = 0{,}211 + 2{,}500 + 0{,}052 = 2{,}76$ m²·K/W. Piège classique : oublier de convertir les 13 mm de plâtre en 0,013 m.'
      tags:
      - multicouche
    - type: mcq
      level: 2
      prompt: 'Que représente le **coefficient de transmission surfacique** $U$ d''une paroi ?'
      choices:
      - L'inverse de la résistance thermique totale, $U = 1/R$, en W/(m²·K)
      - La somme des conductivités des couches, en W/(m·K)
      - Le flux qui traverse la paroi, en W
      - La résistance thermique totale, en m²·K/W
      answer: 0
      feedback:
      - null
      - 'Non : $U$ n''est pas une somme de conductivités, et son unité comporte des **mètres carrés**.'
      - 'Non : le flux dépend en plus de la surface et de l''écart de température ; $U$ est une caractéristique de la paroi seule.'
      - 'Non : c''est exactement l''inverse. Une paroi bien isolée a un **grand** $R$ et un **petit** $U$.'
      explanation: '$U = \dfrac{1}{R}$ : la paroi laisse passer $U$ watts par mètre carré et par kelvin d''écart. Les fabricants de menuiseries et les réglementations thermiques raisonnent en $U$, les fabricants d''isolants en $R$.'
      tags:
      - coefficient-u
    - type: input
      level: 2
      prompt: 'Un mur a une résistance thermique totale $R = 3{,}2$ m²·K/W. Calculer son coefficient de transmission surfacique $U$ (arrondir au centième).'
      answer: '0.31'
      numeric: true
      tolerance: 0.015
      unit: W/(m²·K)
      explanation: '$U = \dfrac{1}{R} = \dfrac{1}{3{,}2} = 0{,}3125 \approx 0{,}31$ W/(m²·K). Erreur classique : recopier 3,2 en changeant simplement d''unité.'
      tags:
      - coefficient-u
    - type: input
      level: 3
      prompt: 'Un mur de trois couches a une résistance thermique $R = 2{,}76$ m²·K/W. Calculer son coefficient $U$ (arrondir au centième).'
      answer: '0.36'
      numeric: true
      tolerance: 0.015
      unit: W/(m²·K)
      explanation: '$U = 1/2{,}76 = 0{,}362 \approx 0{,}36$ W/(m²·K). À comparer aux 0,31 W/(m²·K) du mur béton + 12 cm de laine : le mur le mieux isolé est celui dont le $U$ est le plus **petit**.'
      tags:
      - coefficient-u
    - type: mcq
      level: 2
      prompt: 'Le livre donne le flux de chaleur surfacique sous la forme $\varphi = \lambda \times \dfrac{\Delta T}{e}$. Quelle est son unité ?


        {{fig:pc-mur-flux-thermique}}'
      choices:
      - W/m²
      - W
      - W/(m²·K)
      - kWh
      answer: 0
      feedback:
      - null
      - 'Non : le watt seul est l''unité du flux **total** $\Phi$ traversant toute la paroi, pas du flux rapporté au mètre carré.'
      - 'Non : W/(m²·K) est l''unité de $U$ ; $\varphi$ tient déjà compte de l''écart de température.'
      - 'Non : le kilowattheure est une **énergie**, pas une puissance.'
      explanation: '$\varphi$ est une puissance **par mètre carré** de paroi : elle s''exprime en **W/m²** (Tle, p. 284). Le flux total vaut $\Phi = \varphi \times S$, en watts.'
      tags:
      - flux
    - type: input
      level: 2
      prompt: 'Une paroi de **laine de verre** ($\lambda = 0{,}04$ W/(m·K)) de 0,20 m d''épaisseur sépare un intérieur à 19 °C d''un extérieur à −1 °C. Calculer le flux de chaleur surfacique $\varphi$.'
      answer: '4'
      numeric: true
      tolerance: 0.05
      unit: W/m²
      explanation: '$\Delta T = 19 - (-1) = 20$ K ; $\varphi = \lambda \dfrac{\Delta T}{e} = 0{,}04 \times \dfrac{20}{0{,}20} = 4$ W/m². Erreur classique : écrire $\Delta T = 19 - 1 = 18$ K en oubliant le signe de la température extérieure.'
      tags:
      - flux
    - type: input
      level: 2
      prompt: 'Le mur béton + laine de verre a une résistance totale $R = 3{,}2$ m²·K/W. L''intérieur est à 19 °C, l''extérieur à −1 °C. Calculer le flux de chaleur surfacique $\varphi$.'
      answer: '6.25'
      numeric: true
      tolerance: 0.1
      unit: W/m²
      explanation: '$\varphi = \dfrac{\Delta T}{R} = \dfrac{20}{3{,}2} = 6{,}25$ W/m². Cette relation est la généralisation de $\varphi = \lambda \Delta T / e$ au mur **multicouche** : on remplace $e/\lambda$ par la résistance totale.'
      tags:
      - flux
    - type: mcq
      level: 1
      prompt: 'Dans quel sens circule le flux de chaleur à travers une paroi de bâtiment ?


        {{fig:pc-modes-transfert}}'
      choices:
      - Toujours du chaud vers le froid
      - Toujours du froid vers le chaud
      - Toujours de l'intérieur vers l'extérieur
      - Dans le sens de la plus grande épaisseur
      answer: 0
      feedback:
      - null
      - 'Non : spontanément, l''énergie ne remonte jamais du froid vers le chaud.'
      - 'Non : en été, quand il fait 35 °C dehors et 25 °C dedans, le flux **entre** dans le bâtiment.'
      - 'Non : l''épaisseur agit sur la **valeur** du flux, pas sur son sens.'
      explanation: '« Le flux de chaleur va toujours du chaud vers le froid » (Tle, p. 284). C''est ce qui explique qu''une même isolation serve l''hiver (limiter les déperditions) et l''été (limiter les apports).'
      tags:
      - flux
    - type: grid
      level: 2
      prompt: 'Pour chacun de ces matériaux, cochez son comportement thermique (valeurs de $\lambda$ du livre, p. 284).'
      rows:
      - id: lv
        label: Laine de verre (0,04 W/(m·K))
      - id: ny
        label: Nylon (0,25 W/(m·K))
      - id: fe
        label: Fer (80 W/(m·K))
      - id: al
        label: Aluminium (237 W/(m·K))
      - id: cu
        label: Cuivre (390 W/(m·K))
      cols:
      - id: I
        label: Isolant
      - id: C
        label: Conducteur
      answer:
      - Ilv
      - Iny
      - Cfe
      - Cal
      - Ccu
      cellFeedback:
        Ilv: la laine de verre (0,04) est l'isolant de référence du bâtiment
        Clv: 'une conductivité de 0,04 W/(m·K) est parmi les plus faibles du tableau : c''est un isolant'
        Iny: le nylon (0,25) reste classé isolant par le livre
        Cfe: le fer (80) conduit 2 000 fois mieux que la laine de verre
        Ife: 'avec 80 W/(m·K), le fer évacue la chaleur très vite : c''est un conducteur'
        Ial: 'l''aluminium (237) est un excellent conducteur : d''où les radiateurs et dissipateurs en aluminium'
        Icu: 'le cuivre (390) est le meilleur conducteur du tableau : on en fait des échangeurs, pas des isolants'
      explanation: Tableau p. 284 — isolants (λ faible) — laine de verre 0,04 et nylon 0,25 ; conducteurs (λ élevée) — fer 80, aluminium 237, cuivre 390 W/(m·K). Trois ordres de grandeur séparent les deux familles.
      tags:
      - conductivite
    - type: order
      level: 2
      prompt: 'Classez ces matériaux du **plus isolant** au **plus conducteur** (valeurs de $\lambda$ du livre, p. 284).'
      steps:
      - Laine de verre — 0,04 W/(m·K)
      - Nylon — 0,25 W/(m·K)
      - Béton — 1 W/(m·K)
      - Fer — 80 W/(m·K)
      - Cuivre — 390 W/(m·K)
      explanation: 'L''ordre est celui des conductivités croissantes. Entre la laine de verre et le cuivre, le rapport atteint 10 000 : le choix du matériau pèse bien plus que celui de l''épaisseur.'
      tags:
      - conductivite
    - type: mcq
      level: 3
      prompt: 'Le tableau du livre (p. 284) classe le **béton** ($\lambda = 1$ W/(m·K)) et le **verre** ($\lambda = 1{,}2$ W/(m·K)) parmi les « isolants ». Qu''en penser en tant qu''ingénieur du bâtiment ?'
      choices:
      - 'Ce classement est trompeur : à 1 W/(m·K), le béton conduit 25 fois plus que la laine de verre — c''est un matériau porteur, pas un isolant'
      - 'Le classement est juste : tout matériau non métallique est un isolant thermique'
      - 'Le classement est juste : un mur de béton de 20 cm suffit à isoler une maison'
      - 'Le béton est isolant parce qu''il est lourd : la masse s''oppose au passage de la chaleur'
      answer: 0
      feedback:
      - null
      - 'Non : le verre, le béton ou la pierre conduisent bien mieux que les isolants. Le tableau oppose seulement les non-métaux aux métaux.'
      - 'Non : 0,20 m de béton donnent $R = 0{,}20$ m²·K/W, très loin des 3 à 5 m²·K/W attendus pour une façade.'
      - 'Non : la masse gouverne l''**inertie** thermique et l''isolation **acoustique**, pas la conductivité.'
      explanation: 'Le tableau p. 284 n''oppose en réalité que deux familles extrêmes (non-métaux / métaux). Un ingénieur compare les valeurs : laine de verre 0,04 ; béton 1 ; verre 1,2. Le béton et le verre assurent la **structure** et la **transparence** ; l''isolation vient d''une couche dédiée.'
      tags:
      - conductivite
    - type: mcq
      level: 3
      prompt: 'Le mur béton (0,20 m) + laine de verre (0,12 m) a une résistance $R = 3{,}2$ m²·K/W. On **double** l''épaisseur de laine (0,24 m). Le flux est-il divisé par deux ?'
      choices:
      - 'Non : $R$ passe à 6,2 m²·K/W (et non 6,4), le flux est divisé par 1,94'
      - 'Oui : doubler l''isolant divise toujours le flux par deux'
      - 'Non : le flux est divisé par 4, car $R$ intervient au carré'
      - 'Non : le flux ne change pas, seule la couche de béton compte'
      answer: 0
      feedback:
      - null
      - 'Non : seule la couche de laine double. Le béton conserve ses 0,20 m²·K/W, qui ne sont pas doublés.'
      - 'Non : $\varphi = \Delta T / R$ est **inversement proportionnel** à $R$ (puissance 1), pas à son carré.'
      - 'Non : le flux passe de 6,25 à 3,23 W/m², il change beaucoup.'
      explanation: 'Nouvelle résistance : $R = 0{,}20 + 0{,}24/0{,}04 = 0{,}20 + 6{,}00 = 6{,}20$ m²·K/W. Le flux passe de $20/3{,}2 = 6{,}25$ à $20/6{,}2 = 3{,}23$ W/m², soit un rapport $6{,}25/3{,}23 = 1{,}94$. Chaque centimètre d''isolant supplémentaire rapporte de moins en moins : c''est la loi des rendements décroissants de l''isolation.'
      tags:
      - multicouche
    - type: match
      level: 1
      prompt: Associez chaque grandeur thermique du bâtiment à son unité.
      pairs:
      - left: Conductivité thermique $\lambda$
        right: W/(m·K)
      - left: Résistance thermique $R$
        right: m²·K/W
      - left: Coefficient de transmission $U$
        right: W/(m²·K)
      - left: Flux surfacique $\varphi$
        right: W/m²
      - left: Flux total $\Phi$
        right: W
      explanation: 'Enchaînement à retenir : $\lambda$ (matériau) → $R = e/\lambda$ (couche) → $U = 1/R$ (paroi) → $\varphi = U \Delta T$ (par m²) → $\Phi = \varphi S$ (paroi entière).'
      tags:
      - unites
  - id: 2i2d-bat-deperditions
    title: Déperditions et bilan thermique d'une pièce
    icon: 🏠
    description: Flux Φ = U × S × ΔT, bilan des déperditions par les parois, ponts thermiques, renouvellement d'air, énergie et puissance de chauffage.
    prerequisites:
    - 2i2d-bat-parois
    lesson: lessons/2i2d-batiment-deperditions.md
    items:
    - type: mcq
      level: 1
      prompt: 'Quelle relation donne le flux thermique $\Phi$ traversant une paroi de surface $S$ ?


        {{fig:2i2d-coefficient-u}}'
      choices:
      - $\Phi = U \times S \times \Delta T$
      - $\Phi = \dfrac{U \times S}{\Delta T}$
      - $\Phi = \dfrac{S \times \Delta T}{U}$
      - $\Phi = U \times \Delta T$
      answer: 0
      feedback:
      - null
      - 'Non : un écart de température plus grand doit **augmenter** les pertes, pas les diminuer.'
      - 'Non : c''est la formule avec la **résistance** $R$ ; $U$ est son inverse, il se multiplie.'
      - 'Non : il manque la surface. Une baie vitrée de 10 m² perd dix fois plus que 1 m² de la même menuiserie.'
      explanation: '$\Phi = U \times S \times \Delta T$ : $U$ en W/(m²·K), $S$ en m², $\Delta T$ en K (ou en °C d''écart), $\Phi$ en W. Avec la résistance : $\Phi = \dfrac{S \times \Delta T}{R}$, ce qui revient au même puisque $U = 1/R$.'
      tags:
      - deperditions
    - type: mcq
      level: 1
      prompt: 'Faut-il convertir les températures en kelvins pour calculer des déperditions ?'
      choices:
      - 'Non : une **variation** de température a la même valeur en °C et en K'
      - Oui, sinon le flux est faux de 273,15 W
      - Oui, il faut ajouter 273,15 au résultat
      - Cela dépend de l'épaisseur de la paroi
      answer: 0
      feedback:
      - null
      - 'Non : c''est une **différence**. De 19 °C à −1 °C, l''écart vaut 20 °C, soit exactement 20 K.'
      - 'Non : $\Phi$ est une puissance en watts, on n''y ajoute pas une température.'
      - 'Non : aucun facteur correctif n''est nécessaire.'
      explanation: '« Une variation de température s''exprime indifféremment en °C ou en K » (Tle, p. 274). Seule une température **absolue** doit être convertie ($K = {}^\circ C + 273{,}15$).'
      tags:
      - deperditions
    - type: input
      level: 2
      prompt: 'Les murs extérieurs d''un bureau ont une surface $S = 30$ m² et un coefficient $U = 0{,}31$ W/(m²·K). L''intérieur est à 19 °C, l''extérieur à −1 °C. Calculer le flux thermique $\Phi$ perdu par ces murs.


        {{fig:2i2d-deperditions-piece}}'
      answer: '186'
      numeric: true
      tolerance: 3
      unit: W
