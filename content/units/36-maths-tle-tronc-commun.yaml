# Mathématiques Tle — enseignement commun (tronc commun de la voie technologique, 3 h).
# Programme : arrêté du 19 juillet 2019 (NOR MENE1921242A, BO spécial n° 8 du 25 juillet 2019),
# applicable jusqu'à la session 2027. Source de travail : docs/notes/maths-tle-tronc-commun.md
# (§ 2 pour le programme chapitre par chapitre, § 2.3 pour les automatismes, § 6 pour le découpage
# C1-C6 suivi ici). Évalué en contrôle continu, coefficient 6 sur le cycle terminal (§ 4.1).
# Volontairement absents (hors programme 2019 du tronc commun) : loi normale, loi uniforme,
# intervalles de fluctuation ou de confiance, trigonométrie, nombres complexes, intégrale,
# équations différentielles, géométrie (réservée à la série STD2A).
# Ne double pas 30-maths-1re.yaml ni 35-maths-tle.yaml (spécialité : dérivation des composées,
# exponentielle de base e et logarithme népérien, intégrale, complexes).
# Tous les énoncés sont originaux ; les valeurs numériques ont été recalculées, arrondis explicites.
units:
- id: maths-tle-commun
  matiere: maths
  title: 'Mathématiques Tle : enseignement commun'
  description: Automatismes, suites arithmétiques et géométriques, fonctions exponentielles de base $a$ et logarithme décimal, fonction inverse et lecture de courbes, statistiques à deux variables, probabilités conditionnelles et loi binomiale — le tronc commun de mathématiques de terminale technologique, évalué en contrôle continu (coefficient 6 sur le cycle).
  skills:
  - id: mathstc-automatismes
    title: Automatismes
    icon: 🎯
    description: Proportions et pourcentages, évolutions et taux, calcul algébrique, dérivée d'un polynôme, lectures graphiques.
    prerequisites: []
    lesson: lessons/maths-tle-commun-automatismes.md
    items:
    - type: mcq
      level: 1
      prompt: Par quel nombre faut-il multiplier une valeur pour l'augmenter de $8\ \%$ ?
      choices:
      - $1{,}08$
      - $0{,}08$
      - $8$
      - $1{,}8$
      answer: 0
      feedback:
      - null
      - $0{,}08$ est la **proportion** ajoutée, pas le coefficient multiplicateur ; il faut y ajouter $1$.
      - Multiplier par $8$ reviendrait à augmenter de $700\ \%$.
      - $1{,}8$ correspond à une augmentation de $80\ \%$, pas de $8\ \%$.
      explanation: 'Augmenter de $t\ \%$ revient à multiplier par $1+\dfrac{t}{100}$. Ici $1+0{,}08=1{,}08$.'
    - type: mcq
      level: 1
      prompt: Par quel nombre faut-il multiplier une valeur pour la diminuer de $18\ \%$ ?
      choices:
      - $0{,}82$
      - $1{,}18$
      - $0{,}18$
      - $0{,}88$
      answer: 0
      feedback:
      - null
      - $1{,}18$ est le coefficient d'une **hausse** de $18\ \%$.
      - $0{,}18$ ne garde que $18\ \%$ de la valeur, ce qui correspond à une baisse de $82\ \%$.
      - Erreur de calcul ; $1-0{,}18=0{,}82$ et non $0{,}88$.
      explanation: 'Diminuer de $t\ \%$ revient à multiplier par $1-\dfrac{t}{100}$. Ici $1-0{,}18=0{,}82$ : il reste $82\ \%$ de la valeur.'
    - type: mcq
      level: 1
      prompt: Multiplier une valeur par $0{,}975$ correspond à quelle évolution ?
      choices:
      - une baisse de $2{,}5\ \%$
      - une baisse de $97{,}5\ \%$
      - une baisse de $0{,}975\ \%$
      - une hausse de $2{,}5\ \%$
      answer: 0
      feedback:
      - null
      - Une baisse de $97{,}5\ \%$ correspondrait au coefficient $0{,}025$.
      - Le taux se lit sur l'écart à $1$, pas sur le coefficient lui-même.
      - Le coefficient est **inférieur** à $1$, l'évolution est donc une baisse.
      explanation: 'Le taux est $t=(0{,}975-1)\times100=-2{,}5$, soit une baisse de $2{,}5\ \%$.'
    - type: input
      level: 1
      prompt: Multiplier une valeur par $1{,}4$ correspond à une hausse de combien de pour cent ?
      answer: '40'
      numeric: true
      tolerance: 0.1
      unit: '%'
      explanation: '$1{,}4-1=0{,}4$, soit $+40\ \%$. Réflexe : le coefficient $1{,}4$ ne signifie pas $+1{,}4\ \%$ ni $+14\ \%$.'
    - type: match
      level: 1
      prompt: Associer chaque formulation additive à son coefficient multiplicateur.
      pairs:
      - left: augmenter de $5\ \%$
        right: $\times1{,}05$
      - left: diminuer de $5\ \%$
        right: $\times0{,}95$
      - left: augmenter de $50\ \%$
        right: $\times1{,}5$
      - left: diminuer de $75\ \%$
        right: $\times0{,}25$
      - left: augmenter de $0{,}4\ \%$
        right: $\times1{,}004$
    - type: mcq
      level: 2
      prompt: Une production augmente de $15\ \%$ une année, puis diminue de $8\ \%$ l'année suivante. Quel est le taux d'évolution global sur les deux années ?
      choices:
      - environ $+5{,}8\ \%$
      - $+7\ \%$
      - $+23\ \%$
      - environ $+6{,}9\ \%$
      answer: 0
      feedback:
      - null
      - 'Erreur classique : les taux successifs **ne s''additionnent pas**. Ce sont les coefficients multiplicateurs qui se multiplient.'
      - Les deux taux ne s'ajoutent pas non plus en valeur absolue ; la seconde évolution est une baisse.
      - Recalcule le produit $1{,}15\times0{,}92$ ; il vaut $1{,}058$ et non $1{,}069$.
      explanation: 'Coefficient global : $1{,}15\times0{,}92=1{,}058$, donc $+5{,}8\ \%$. La baisse de $8\ \%$ porte sur une valeur déjà augmentée, elle ne compense pas $8$ des $15$ points.'
    - type: mcq
      level: 2
      prompt: Après une hausse de $25\ \%$, quelle baisse ramène exactement à la valeur initiale ?
      choices:
      - une baisse de $20\ \%$
      - une baisse de $25\ \%$
      - une baisse de $22{,}5\ \%$
      - une baisse de $30\ \%$
      answer: 0
      feedback:
      - null
      - 'Piège du taux réciproque : $1{,}25\times0{,}75=0{,}9375\neq1$, on n''est pas revenu au point de départ.'
      - La moyenne des deux taux n'a aucune raison de convenir.
      - $1{,}25\times0{,}70=0{,}875$ ; on descend en dessous de la valeur initiale.
      explanation: 'Il faut le coefficient réciproque $\dfrac{1}{1{,}25}=0{,}80$, soit une baisse de $20\ \%$. Vérification : $1{,}25\times0{,}80=1$.'
    - type: input
      level: 2
      prompt: Après une baisse de $20\ \%$, quelle hausse, en pour cent, ramène exactement à la valeur initiale ?
      answer: '25'
      numeric: true
      tolerance: 0.2
      unit: '%'
      explanation: 'Le coefficient réciproque de $0{,}80$ est $\dfrac{1}{0{,}80}=1{,}25$, soit $+25\ \%$. Baisse et hausse réciproques n''ont pas le même taux.'
    - type: mcq
      level: 2
      prompt: Dans un lycée, $42\ \%$ des élèves sont en voie technologique et, parmi eux, $35\ \%$ sont en STI2D. Quelle part des élèves du lycée cela représente-t-il ?
      choices:
      - $14{,}7\ \%$
      - $77\ \%$
      - $35\ \%$
      - $7\ \%$
      answer: 0
      feedback:
      - null
      - On n'additionne pas deux proportions qui ne portent pas sur le même ensemble.
      - $35\ \%$ est la proportion **dans la voie technologique**, pas dans le lycée.
      - La différence des deux taux n'a pas de sens ici.
      explanation: 'La proportion d''une proportion se **multiplie** : $0{,}42\times0{,}35=0{,}147$, soit $14{,}7\ \%$ des élèves du lycée.'
    - type: input
      level: 2
      prompt: La consommation d'un atelier est repérée par un indice de base $100$ en $2020$. Il vaut $108$ en $2022$ et $117{,}5$ en $2024$. Quel est le taux d'évolution entre $2022$ et $2024$, en pour cent, arrondi à $0{,}1$ ?
      answer: '8.8'
      numeric: true
      tolerance: 0.1
      unit: '%'
      explanation: '$\dfrac{117{,}5}{108}\approx1{,}0880$, soit environ $+8{,}8\ \%$. On ne soustrait pas les indices : $117{,}5-108=9{,}5$ n''est **pas** le taux en pourcentage.'
    - type: mcq
      level: 2
      prompt: Un indice de base $100$ en $2020$ vaut $117{,}5$ en $2024$. Que peut-on en conclure ?
      choices:
      - la grandeur a augmenté de $17{,}5\ \%$ entre $2020$ et $2024$
      - la grandeur a augmenté de $117{,}5\ \%$ entre $2020$ et $2024$
      - la grandeur vaut $117{,}5$ unités en $2024$
      - la grandeur a augmenté de $17{,}5$ unités entre $2020$ et $2024$
      answer: 0
      feedback:
      - null
      - L'indice **contient** déjà la base $100$ ; le taux se lit sur l'écart à $100$.
      - Un indice n'est pas une valeur mesurée, il n'a pas d'unité.
      - Un indice donne une évolution **relative**, jamais une variation absolue.
      explanation: 'L''indice $117{,}5$ signifie que la grandeur vaut $1{,}175$ fois sa valeur de $2020$, soit $+17{,}5\ \%$.'
    - type: order
      level: 2
      prompt: Remettre dans l'ordre les étapes du calcul du taux d'évolution global équivalent à plusieurs évolutions successives.
      steps:
      - Traduire chaque évolution en coefficient multiplicateur
      - Multiplier tous les coefficients entre eux
      - Retrancher $1$ au coefficient global obtenu
      - Multiplier le résultat par $100$
      - Conclure par une hausse ou une baisse, selon le signe
      explanation: 'La seule opération autorisée sur des évolutions successives est la **multiplication des coefficients**. On ne repasse en pourcentage qu''à la toute fin.'
    - type: mcq
      level: 1
      prompt: Quelle est l'écriture scientifique de $0{,}000\,47$ ?
      choices:
      - $4{,}7\times10^{-4}$
      - $4{,}7\times10^{-3}$
      - $4{,}7\times10^{4}$
      - $47\times10^{-3}$
      answer: 0
      feedback:
      - null
      - $4{,}7\times10^{-3}=0{,}004\,7$, c'est dix fois trop grand.
      - L'exposant doit être **négatif** pour un nombre inférieur à $1$.
      - 'Deux défauts : la valeur ($47\times10^{-3}=0{,}047$) et la forme, car le premier facteur doit être compris entre $1$ et $10$.'
      explanation: 'L''écriture scientifique est $a\times10^{n}$ avec $1\leqslant a<10$. On déplace la virgule de $4$ rangs vers la droite, d''où l''exposant $-4$.'
    - type: input
      level: 1
      prompt: Convertir $45$ minutes en heures (écriture décimale).
      answer: '0.75'
      numeric: true
      tolerance: 0.001
      unit: h
      explanation: '$\dfrac{45}{60}=0{,}75$ h. Attention, $45$ min ne s''écrit pas $0{,}45$ h.'
    - type: mcq
      level: 2
      prompt: Soit $f(x)=2x^{3}-5x^{2}+x-7$. Quelle est sa dérivée ?
      choices:
      - $f'(x)=6x^{2}-10x+1$
      - $f'(x)=6x^{2}-10x$
      - $f'(x)=6x^{2}-5x+1$
      - $f'(x)=2x^{2}-10x+1$
      answer: 0
      feedback:
      - null
      - Le terme $x$ a pour dérivée $1$, il ne disparaît pas ; c'est la constante $-7$ qui disparaît.
      - Le terme $-5x^{2}$ a pour dérivée $-10x$, pas $-5x$.
      - Le terme $2x^{3}$ a pour dérivée $3\times2x^{2}=6x^{2}$.
      explanation: 'On dérive terme à terme : $\left(x^{n}\right)''=nx^{n-1}$. D''où $f''(x)=6x^{2}-10x+1$, et la constante $-7$ disparaît.'
    - type: input
      level: 2
      prompt: Toujours avec $f(x)=2x^{3}-5x^{2}+x-7$, calculer le coefficient directeur de la tangente à la courbe au point d'abscisse $2$.
      answer: '5'
      numeric: true
      tolerance: 0.01
      explanation: 'Le coefficient directeur de la tangente en $a$ est $f''(a)$. Ici $f''(x)=6x^{2}-10x+1$, donc $f''(2)=24-20+1=5$.'
    - type: mcq
      level: 2
      prompt: Quel est le signe de $-2(x-1)(x-3)$ ?
      choices:
      - positif sur $\left]1\,;3\right[$, négatif à l'extérieur
      - négatif sur $\left]1\,;3\right[$, positif à l'extérieur
      - positif sur $\mathbb{R}$
      - négatif sur $\mathbb{R}$
      answer: 0
      feedback:
      - null
      - 'C''est le signe d''une parabole tournée vers le haut ; ici le coefficient $-2$ la retourne vers le bas.'
      - L'expression s'annule en $1$ et en $3$, elle change donc de signe.
      - L'expression vaut $+2$ en $x=2$, elle n'est pas toujours négative.
      explanation: 'Image mentale : la courbe de $x\mapsto-2(x-1)(x-3)$ est une parabole tournée vers le **bas** qui coupe l''axe en $1$ et $3$. Elle est donc au-dessus de l''axe entre les racines.


        {{fig:mathstc-signe-parabole}}'
    - type: grid
      level: 2
      prompt: Pour chaque expression, cocher son signe en $x=2$.
      rows:
      - id: a
        label: $-2(x-1)(x-3)$
      - id: b
        label: $(2x+3)(5-x)$
      - id: c
        label: $(x-5)(x+1)$
      - id: d
        label: $3x-8$
      - id: e
        label: $x^{2}-9$
      cols:
      - id: P
        label: Positif
      - id: N
        label: Négatif
      answer:
      - Pa
      - Pb
      - Nc
      - Nd
      - Ne
      cellFeedback:
        Na: $-2\times1\times(-1)=+2$, le produit de deux facteurs négatifs redevient positif
        Nb: $7\times3=21$, les deux facteurs sont positifs en $x=2$
        Pc: $(-3)\times3=-9$, un seul facteur est négatif
        Pd: $3\times2-8=-2$, la valeur $2$ est en dessous de la racine $\dfrac{8}{3}\approx2{,}67$
        Pe: $4-9=-5$, la valeur $2$ est comprise entre les racines $-3$ et $3$
      explanation: 'Pour un produit de facteurs, on regarde le signe de **chaque** facteur puis on applique la règle des signes. Une simple substitution suffit quand on demande le signe en un point.'
    - type: mcq
      level: 2
      prompt: Dans la relation $P=\rho g h$, exprimer $h$ en fonction des autres grandeurs.
      choices:
      - $h=\dfrac{P}{\rho g}$
      - $h=P\rho g$
      - $h=\dfrac{\rho g}{P}$
      - $h=P-\rho g$
      answer: 0
      feedback:
      - null
      - Pour isoler $h$, on divise les deux membres par $\rho g$, on ne multiplie pas.
      - Le quotient est inversé ; c'est $P$ qui doit être au numérateur.
      - $\rho g$ multiplie $h$, on ne l'enlève pas par soustraction.
      explanation: '$P=\rho g h$ donne $h=\dfrac{P}{\rho g}$. Contrôle par les unités : des pascals divisés par des $\mathrm{kg}\cdot\mathrm{m}^{-3}\times\mathrm{m}\cdot\mathrm{s}^{-2}$ donnent bien des mètres.'
    - type: input
      level: 3
      prompt: Un solide de masse $m=25$ kg possède l'énergie cinétique $E=450$ J. Sachant que $E=\dfrac{1}{2}mv^{2}$, calculer sa vitesse $v$.
      answer: '6'
      numeric: true
      tolerance: 0.05
      unit: m/s
      explanation: '$v^{2}=\dfrac{2E}{m}=\dfrac{900}{25}=36$, donc $v=\sqrt{36}=6\ \mathrm{m\cdot s^{-1}}$ (la solution négative est écartée, une vitesse est positive).'
    - type: mcq
      level: 2
      prompt: Une droite passe par les points $A(1\,;5)$ et $B(4\,;14)$. Quelle est son équation réduite ?
      choices:
      - $y=3x+2$
      - $y=3x+5$
      - $y=\dfrac{1}{3}x+2$
      - $y=9x-4$
      answer: 0
      feedback:
      - null
      - L'ordonnée à l'origine n'est pas l'ordonnée de $A$ ; il faut remplacer dans $y=3x+b$.
      - Le coefficient directeur est $\dfrac{\Delta y}{\Delta x}$, et non $\dfrac{\Delta x}{\Delta y}$.
      - $9$ est la variation des ordonnées seule ; il faut la diviser par la variation des abscisses.
      explanation: '$a=\dfrac{14-5}{4-1}=\dfrac{9}{3}=3$, puis $5=3\times1+b$ donne $b=2$. D''où $y=3x+2$, vérifiée par $B$ : $3\times4+2=14$.'
    - type: mcq
      level: 2
      prompt: 'Sur la figure ci-dessous, la droite $\mathcal{D}$ représente le coût, en euros, en fonction du nombre de pièces. Lire graphiquement le nombre de pièces à partir duquel le coût dépasse $260$ €.


        {{fig:mathstc-lecture-droite}}'
      choices:
      - à partir de $40$ pièces
      - à partir de $26$ pièces
      - à partir de $60$ pièces
      - à partir de $260$ pièces
      answer: 0
      feedback:
      - null
      - $26$ est une lecture sur l'axe des ordonnées divisée par $10$ ; il faut lire l'abscisse du point d'intersection.
      - Relis l'échelle de l'axe des abscisses, une graduation vaut $10$ pièces.
      - $260$ est le **coût**, pas le nombre de pièces.
      explanation: 'On trace l''horizontale $y=260$, on repère son point d''intersection avec $\mathcal{D}$, puis on lit l''abscisse : $40$ pièces. Au-delà, la droite est au-dessus de l''horizontale.'
    - type: mcq
      level: 2
      prompt: 'À partir de la parabole représentée dans la leçon, résoudre graphiquement $-2(x-1)(x-3)\geqslant0$.'
      choices:
      - $x\in\left[1\,;3\right]$
      - $x\in\left]-\infty\,;1\right]\cup\left[3\,;+\infty\right[$
      - $x\in\left[-2\,;3\right]$
      - $x\in\left[0\,;2\right]$
      answer: 0
      feedback:
      - null
      - C'est l'ensemble où la courbe est **en dessous** de l'axe des abscisses.
      - $-2$ est le coefficient de l'expression, pas une racine.
      - Les racines sont $1$ et $3$, elles se lisent sur les points d'intersection avec l'axe.
      explanation: 'Résoudre $f(x)\geqslant0$, c''est chercher les $x$ pour lesquels la courbe est **au-dessus ou sur** l''axe des abscisses. Les bornes $1$ et $3$ sont incluses car l''inégalité est large.'
    - type: guided
      level: 3
      title: Le suivi de production d'une usine de nacelles d'éoliennes
      prompt: 'Exercice complet : évolutions successives, taux global, indice base 100, taux réciproque, proportion d''une proportion et isolement d''une variable.'
      intro: 'Une usine assemble des nacelles d''éoliennes. Elle en a produit $1\,200$ en $2022$.
        En $2023$, la production augmente de $15\ \%$ ; en $2024$, elle diminue de $5\ \%$.


        Le service de gestion suit ces variations avec un indice de base $100$ en $2022$.'
      steps:
      - kind: input
        prompt: '**Étape 1.** Combien de nacelles ont été produites en $2023$ ?'
        answer: '1380'
        numeric: true
        tolerance: 1
        explanation: '$1\,200\times1{,}15=1\,380$ nacelles.'
      - kind: input
        prompt: '**Étape 2.** Combien de nacelles ont été produites en $2024$ ?'
        answer: '1311'
        numeric: true
        tolerance: 1
        explanation: '$1\,380\times0{,}95=1\,311$ nacelles. La baisse de $5\ \%$ porte sur $1\,380$, pas sur $1\,200$.'
      - kind: input
        prompt: '**Étape 3.** Quel est le taux d''évolution global de la production entre $2022$ et $2024$, en pour cent, arrondi à $0{,}01$ ?'
        answer: '9.25'
        numeric: true
        tolerance: 0.05
        unit: '%'
        explanation: 'Coefficient global $1{,}15\times0{,}95=1{,}0925$, soit $+9{,}25\ \%$. Vérification directe : $\dfrac{1\,311}{1\,200}=1{,}0925$.'
      - kind: mcq
        prompt: '**Étape 4.** Un stagiaire annonce « $+15-5=+10\ \%$ ». Pourquoi est-ce faux ?'
        choices:
        - Parce que les taux successifs ne s'additionnent pas ; ce sont les coefficients multiplicateurs qui se multiplient
        - Parce qu'il fallait écrire $-5+15$ et non $+15-5$
        - Parce que la baisse de $5\ \%$ doit être comptée deux fois
        - Parce qu'il fallait faire la moyenne des deux taux
        answer:
        - 0
        feedback:
        - null
        - L'ordre des opérations n'est pas en cause, c'est l'opération elle-même qui est fausse.
        - La baisse n'intervient qu'une seule fois, mais sur une base plus grande.
        - La moyenne des taux ne donne pas non plus le taux global.
        explanation: 'La baisse de $5\ \%$ s''applique à $1\,380$ et retire $69$ nacelles, alors que $5\ \%$ de $1\,200$ n''en retirerait que $60$. D''où un écart entre $+10\ \%$ et le vrai $+9{,}25\ \%$.'
      - kind: input
        prompt: '**Étape 5.** Quel est l''indice de la production de $2024$, en base $100$ en $2022$ ?'
        answer: '109.25'
        numeric: true
        tolerance: 0.05
        explanation: 'L''indice est $100\times\dfrac{1\,311}{1\,200}=109{,}25$. Un indice se lit directement comme le coefficient global multiplié par $100$.'
      - kind: input
        prompt: '**Étape 6.** De quel pourcentage la production devrait-elle baisser en $2025$ pour revenir exactement au niveau de $2022$ ? (donner un nombre négatif, arrondi à $0{,}01$)'
        answer: '-8.47'
        numeric: true
        tolerance: 0.05
        unit: '%'
        explanation: 'Il faut le taux réciproque : $\dfrac{1}{1{,}0925}\approx0{,}9153$, soit environ $-8{,}47\ \%$. Ce n''est pas $-9{,}25\ \%$.'
      - kind: input
        prompt: '**Étape 7.** En $2024$, $40\ \%$ de la production est exportée et $25\ \%$ de ces exportations partent en Allemagne. Quelle part de la production totale, en pour cent, part en Allemagne ?'
        answer: '10'
        numeric: true
        tolerance: 0.1
        unit: '%'
        explanation: 'Proportion d''une proportion : $0{,}40\times0{,}25=0{,}10$, soit $10\ \%$ de la production, c''est-à-dire environ $131$ nacelles.'
      - kind: mcq
        prompt: '**Étape 8.** La surface balayée par le rotor est $S=\pi R^{2}$. Exprimer le rayon $R$ en fonction de $S$.'
        choices:
        - $R=\sqrt{\dfrac{S}{\pi}}$
        - $R=\dfrac{S}{\pi}$
        - $R=\dfrac{\sqrt{S}}{\pi}$
        - $R=\sqrt{S\pi}$
        answer:
        - 0
        feedback:
        - null
        - Il reste le carré à défaire ; il faut prendre la racine carrée.
        - La racine carrée porte sur **tout** le quotient $\dfrac{S}{\pi}$.
        - On divise par $\pi$, on ne multiplie pas.
        explanation: '$S=\pi R^{2}$ donne $R^{2}=\dfrac{S}{\pi}$, puis $R=\sqrt{\dfrac{S}{\pi}}$ car un rayon est positif. Pour $S=5\,000\ \mathrm{m}^{2}$, on obtient $R\approx39{,}9$ m.'
  - id: mathstc-suites
    title: Suites et sommes de termes
    icon: 🔢
    description: Suites arithmétiques et géométriques, moyennes, terme général, sommes de termes consécutifs et notation $\Sigma$.
    prerequisites:
    - mathstc-automatismes
    lesson: lessons/maths-tle-commun-suites.md
    items:
    - type: mcq
      level: 1
      prompt: Comment reconnaît-on une suite géométrique définie par une relation de récurrence ?
      choices:
