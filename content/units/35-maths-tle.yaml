      unit: V
      explanation: '$u(\tau)=5{,}0\left(1-\mathrm{e}^{-1}\right)=5{,}0\times0{,}632\approx3{,}16$ V. Au bout d''une constante de temps, le condensateur est chargé à $63\ \%$ : c''est un repère à connaître.'
    - type: input
      level: 3
      prompt: 'Au bout de combien de temps la tension $u(t)=5{,}0\left(1-\mathrm{e}^{-t/0{,}22}\right)$ atteint-elle $99\ \%$ de $E=5{,}0$ V ? (arrondir à $0{,}01$)'
