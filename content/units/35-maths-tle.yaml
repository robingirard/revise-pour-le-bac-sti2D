      prompt: 'Un condensateur de capacité $C$ se charge à travers une résistance $R$ sous une tension constante $E$. La tension $u$ à ses bornes vérifie $RC\,u''+u=E$. Sous la forme $y''=ay+b$, cette équation s''écrit'
      choices:
