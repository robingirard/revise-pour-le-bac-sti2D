      prompt: 'La pièce est à $23{,}0$ °C. Le modèle $T_{1}(t)=11{,}5\,\mathrm{e}^{-0{,}006t}+11{,}5$ est-il encore utilisable au bout de $3$ heures ?'
      choices:
      - 'Non : au bout de quelques heures la boisson doit remonter vers $23$ °C, alors que le modèle prévoit $11{,}5$ °C'
      - 'Oui : le modèle est valable pour tout $t\geqslant0$'
      - 'Non : la fonction $T_{1}$ n''est pas définie en $t=10\,800$'
      - 'Oui : la limite $11{,}5$ °C est bien la température de la pièce'
      answer: 0
      feedback:
