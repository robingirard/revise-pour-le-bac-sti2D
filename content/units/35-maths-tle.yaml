      - 'On fait passer $0{,}006y$ dans l''autre membre : son signe change.'
      - Les deux coefficients ont été échangés.
      - 'C''est $a$ qui change de signe en passant de l''autre côté, pas $b$.'
      explanation: 'Réflexe : **réécrire** l''équation sous la forme du cours avant toute chose. $y''+0{,}006y=0{,}069$ équivaut à $y''=-0{,}006y+0{,}069$, et la solution constante vaut $-\dfrac{b}{a}=\dfrac{0{,}069}{0{,}006}=11{,}5$.'
    - type: mcq
      level: 3
      prompt: 'Comment montrer que $T_{1}(t)=11{,}5\,\mathrm{e}^{-0{,}006t}+11{,}5$ est **la** solution de $(E)\ y''=-0{,}006y+0{,}069$ vérifiant $T_{1}(0)=23$ ?'
      choices:
      - En vérifiant que $T_{1}$ est de la forme $k\,\mathrm{e}^{-0{,}006t}+11{,}5$, puis que $T_{1}(0)=23$
      - En vérifiant seulement que $T_{1}(0)=23$
      - En vérifiant seulement que $T_{1}$ est décroissante
      - En calculant $\displaystyle\int_{0}^{1}T_{1}(t)\,\mathrm{d}t$
      answer: 0
      feedback:
