      - Écrire l'ensemble des solutions $y(x)=k\,\mathrm{e}^{ax}-\dfrac{b}{a}$
      - Utiliser la condition initiale pour calculer $k$
      - Vérifier en dérivant, puis donner la limite en $+\infty$ si elle est demandée
      explanation: 'La première étape est celle qu''on oublie : tant que l''équation est écrite $y''+ay=b$ ou $RC\,u''+u=E$, les coefficients lus sont faux. Isoler $y''$ d''abord, identifier ensuite.'
    - type: grid
      level: 3
      prompt: Pour chaque affirmation sur les équations différentielles, cocher vrai ou faux.
      rows:
