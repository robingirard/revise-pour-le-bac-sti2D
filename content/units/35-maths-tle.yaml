        explanation: 'Solutions de $y''=ay+b$ : $k\,\mathrm{e}^{at}-\dfrac{b}{a}$ avec ici $a=-5$ et $b=10$, soit $f(t)=k\,\mathrm{e}^{-5t}+2$.'
      - kind: input
        prompt: '**Étape 3.** La vitesse à l''ouverture est $v(0)=50$. Que vaut la constante $k$ ?'
        answer: '48'
        numeric: true
        tolerance: 0.01
        explanation: '$v(0)=k+2=50$ donne $k=48$, donc $v(t)=48\,\mathrm{e}^{-5t}+2$.'
      - kind: input
        prompt: '**Étape 4.** Calculer la vitesse $1$ seconde après l''ouverture, arrondie à $0{,}01$.'
        answer: '2.32'
        numeric: true
        tolerance: 0.02
        unit: m/s
        explanation: '$v(1)=48\,\mathrm{e}^{-5}+2\approx48\times0{,}006\,738+2\approx0{,}32+2\approx2{,}32\ \mathrm{m}\cdot\mathrm{s}^{-1}$. Le freinage est donc très brutal.'
      - kind: input
        prompt: '**Étape 5.** Au bout de combien de temps la vitesse descend-elle à $2{,}5\ \mathrm{m}\cdot\mathrm{s}^{-1}$ ? (arrondir à $0{,}01$)'
        answer: '0.91'
        numeric: true
        tolerance: 0.02
        unit: s
        explanation: '$48\,\mathrm{e}^{-5t}+2=2{,}5$ donne $\mathrm{e}^{-5t}=\dfrac{0{,}5}{48}=\dfrac{1}{96}$, donc $-5t=-\ln(96)$ et $t=\dfrac{\ln(96)}{5}\approx\dfrac{4{,}564}{5}\approx0{,}91$ s.'
      - kind: mcq
        prompt: '**Étape 6.** Que vaut $\lim\limits_{t\to+\infty}v(t)$, et que représente cette valeur ?'
        choices:
        - $2\ \mathrm{m}\cdot\mathrm{s}^{-1}$, la vitesse limite du parachutiste
        - $50\ \mathrm{m}\cdot\mathrm{s}^{-1}$, la vitesse d'ouverture
        - $0\ \mathrm{m}\cdot\mathrm{s}^{-1}$, car l'exponentielle tend vers $0$
        - $48\ \mathrm{m}\cdot\mathrm{s}^{-1}$, le coefficient de l'exponentielle
        answer:
        - 0
        feedback:
        - null
        - C'est la vitesse **initiale**, celle du début du mouvement.
        - Seul le terme $48\,\mathrm{e}^{-5t}$ tend vers $0$ ; le terme constant $2$ subsiste.
        - $48$ est le coefficient du terme qui disparaît, pas la limite.
        explanation: 'La vitesse tend vers $-\dfrac{b}{a}=2\ \mathrm{m}\cdot\mathrm{s}^{-1}$ : c''est la vitesse limite, celle avec laquelle le parachutiste touche le sol. Elle ne dépend pas de la vitesse d''ouverture.'
      - kind: input
        prompt: '**Étape 7.** Calculer $\displaystyle\int_{0}^{10}\left(48\,\mathrm{e}^{-5t}+2\right)\mathrm{d}t$, arrondi à $0{,}1$, qui donne la distance parcourue en $10$ s.'
        answer: '29.6'
        numeric: true
        tolerance: 0.2
        unit: m
        explanation: 'Une primitive est $V(t)=-\dfrac{48}{5}\mathrm{e}^{-5t}+2t=-9{,}6\,\mathrm{e}^{-5t}+2t$. Alors $V(10)-V(0)=\left(20-9{,}6\,\mathrm{e}^{-50}\right)-\left(-9{,}6\right)\approx29{,}6$ m, car $\mathrm{e}^{-50}$ est négligeable.'
      - kind: mcq
        prompt: '**Étape 8.** Si le parachutiste ouvrait son parachute à $70\ \mathrm{m}\cdot\mathrm{s}^{-1}$ au lieu de $50$, que changerait-il ?'
        choices:
        - Seule la constante $k$ change ($k=68$) ; la vitesse limite reste $2\ \mathrm{m}\cdot\mathrm{s}^{-1}$
        - La vitesse limite deviendrait $2{,}8\ \mathrm{m}\cdot\mathrm{s}^{-1}$
        - L'équation différentielle changerait de coefficients
        - Rien ne changerait, car la solution est unique
        answer:
        - 0
        feedback:
        - null
        - 'La limite vaut $-\dfrac{b}{a}$ : elle ne dépend que de l''équation, pas de la condition initiale.'
        - Les coefficients $a$ et $b$ viennent du bilan des forces et de la voilure, pas de la vitesse d'ouverture.
        - 'La solution est unique **pour une condition initiale donnée** : en changer donne une autre solution.'
        explanation: 'La condition initiale ne fixe que $k$ : ici $k=70-2=68$, soit $v(t)=68\,\mathrm{e}^{-5t}+2$. La vitesse limite $2\ \mathrm{m}\cdot\mathrm{s}^{-1}$, elle, est une propriété de l''équation.'
  - id: mathstle-complexes-exp
    title: Complexes sous forme exponentielle
    icon: 🧭
    description: Forme exponentielle $r\mathrm{e}^{i\theta}$, module et argument, produit, quotient, puissances, formule de Moivre et impédance complexe.
    prerequisites:
    - mathstle-exp-ln
    lesson: lessons/maths-tle-complexes-exp.md
    items:
    - type: mcq
      level: 1
      prompt: Par définition, que vaut $\mathrm{e}^{i\theta}$ pour un réel $\theta$ ?
      choices:
      - $\cos(\theta)+i\sin(\theta)$
      - $\sin(\theta)+i\cos(\theta)$
      - $\cos(\theta)-i\sin(\theta)$
      - $\theta\left(\cos(\theta)+i\sin(\theta)\right)$
      answer: 0
      feedback:
      - null
      - 'Le cosinus donne la partie **réelle**, le sinus la partie imaginaire : ils sont échangés.'
      - 'C''est $\mathrm{e}^{-i\theta}$, le conjugué.'
      - 'Il n''y a pas de facteur $\theta$ : le module de $\mathrm{e}^{i\theta}$ vaut $1$.'
      explanation: 'Le programme **pose** $\mathrm{e}^{i\theta}=\cos(\theta)+i\sin(\theta)$ et admet que cette exponentielle a les mêmes propriétés algébriques que l''exponentielle réelle. Toutes les formules de trigonométrie en découlent.'
    - type: mcq
      level: 1
      prompt: Que vaut le module $\left|\mathrm{e}^{i\theta}\right|$ ?
      choices:
      - $1$, quel que soit $\theta$
      - $\theta$
      - $\mathrm{e}^{\theta}$
      - $\cos(\theta)+\sin(\theta)$
      answer: 0
      feedback:
      - null
      - $\theta$ est l'argument, pas le module.
      - 'L''exposant est **imaginaire** : $\mathrm{e}^{i\theta}$ n''a rien d''un nombre qui grandit.'
      - Le module est une racine carrée de somme de carrés, pas une somme.
      explanation: '$\left|\mathrm{e}^{i\theta}\right|=\sqrt{\cos^{2}(\theta)+\sin^{2}(\theta)}=1$. Les points d''affixe $\mathrm{e}^{i\theta}$ décrivent donc exactement le **cercle trigonométrique**.'
    - type: mcq
      level: 1
      prompt: 'Dans l''écriture $z=r\,\mathrm{e}^{i\theta}$ d''un complexe non nul, que représentent $r$ et $\theta$ ?'
      choices:
      - $r=\left|z\right|>0$ est le module et $\theta=\arg(z)$ est l'argument, en radians
      - $r$ est la partie réelle et $\theta$ la partie imaginaire
      - $r$ est l'argument et $\theta$ le module
      - $r$ et $\theta$ sont les deux coordonnées du point image
      answer: 0
      feedback:
      - null
      - Partie réelle et partie imaginaire sont les coordonnées de la **forme algébrique**.
      - Les deux rôles sont inversés.
      - 'Les coordonnées cartésiennes sont $a$ et $b$ ; $r$ et $\theta$ sont des coordonnées **polaires**.'
      explanation: '$r$ est la distance $OM$ et $\theta$ l''angle orienté $\left(\overrightarrow{OI},\overrightarrow{OM}\right)$, défini modulo $2\pi$. Le module est toujours strictement positif pour $z\neq0$.


        {{fig:maths-plan-complexe}}'
    - type: input
      level: 2
      prompt: Calculer le module du nombre complexe $z=\sqrt{3}+i$.
      answer: '2'
      numeric: true
      tolerance: 0.01
      explanation: '$\left|z\right|=\sqrt{\left(\sqrt{3}\right)^{2}+1^{2}}=\sqrt{3+1}=\sqrt{4}=2$. Le module se calcule **toujours** avant l''argument.'
    - type: mcq
      level: 2
      prompt: Quelle est la forme exponentielle de $z=\sqrt{3}+i$ ?
      choices:
      - $2\,\mathrm{e}^{i\frac{\pi}{6}}$
      - $2\,\mathrm{e}^{i\frac{\pi}{3}}$
      - $2\,\mathrm{e}^{-i\frac{\pi}{6}}$
      - $4\,\mathrm{e}^{i\frac{\pi}{6}}$
      answer: 0
      feedback:
      - null
      - '$\cos\left(\dfrac{\pi}{3}\right)=\dfrac{1}{2}$ : ce n''est pas la valeur trouvée pour $\dfrac{a}{r}$.'
      - 'La partie imaginaire est **positive** : le point est au-dessus de l''axe réel, l''argument est positif.'
      - 'Le module est $\sqrt{4}=2$, pas $4$ : il ne faut pas oublier la racine.'
      explanation: '$r=2$, puis $\cos(\theta)=\dfrac{\sqrt{3}}{2}$ et $\sin(\theta)=\dfrac{1}{2}$, ce qui donne $\theta=\dfrac{\pi}{6}$. Donc $z=2\,\mathrm{e}^{i\frac{\pi}{6}}$.


        {{fig:maths-cercle-angles}}'
    - type: mcq
      level: 2
      prompt: Quelle est la forme exponentielle de $z_{1}=\sqrt{3}-i$ ?
      choices:
      - $2\,\mathrm{e}^{-i\frac{\pi}{6}}$
      - $2\,\mathrm{e}^{i\frac{\pi}{6}}$
      - $2\,\mathrm{e}^{-i\frac{\pi}{3}}$
      - $-2\,\mathrm{e}^{i\frac{\pi}{6}}$
      answer: 0
      feedback:
      - null
      - 'La partie imaginaire est négative : le point est **sous** l''axe réel, l''argument est négatif.'
      - '$\sin(\theta)=-\dfrac{1}{2}$ correspond à $-\dfrac{\pi}{6}$, alors que $-\dfrac{\pi}{3}$ donnerait $-\dfrac{\sqrt{3}}{2}$.'
      - 'Un module est toujours **positif** : on n''écrit jamais $-2\,\mathrm{e}^{i\theta}$ comme forme exponentielle.'
      explanation: '$z_{1}$ est le conjugué de $\sqrt{3}+i$ : même module $2$, argument opposé. Règle générale : $\overline{r\,\mathrm{e}^{i\theta}}=r\,\mathrm{e}^{-i\theta}$.'
    - type: mcq
      level: 3
      prompt: Quelle est la forme exponentielle de $z=-2\sqrt{3}+2i$ ?
      choices:
      - $4\,\mathrm{e}^{i\frac{5\pi}{6}}$
      - $4\,\mathrm{e}^{i\frac{\pi}{6}}$
      - $4\,\mathrm{e}^{-i\frac{5\pi}{6}}$
      - $2\,\mathrm{e}^{i\frac{5\pi}{6}}$
      answer: 0
      feedback:
      - null
      - 'La partie réelle est **négative** : le point est à gauche de l''axe des ordonnées, l''argument ne peut pas être $\dfrac{\pi}{6}$.'
      - 'La partie imaginaire est positive : l''argument est dans $\left]0\,;\pi\right[$.'
      - '$\left|z\right|=\sqrt{12+4}=4$, et non $2$.'
      explanation: '$r=\sqrt{\left(2\sqrt{3}\right)^{2}+2^{2}}=\sqrt{12+4}=4$. Puis $\cos(\theta)=-\dfrac{\sqrt{3}}{2}$ et $\sin(\theta)=\dfrac{1}{2}$ : le point est dans le **deuxième quadrant**, donc $\theta=\dfrac{5\pi}{6}$. Le réflexe qui évite l''erreur est de repérer le quadrant avant de conclure.'
    - type: mcq
      level: 2
      prompt: 'Sur la figure, le plan complexe est muni de cinq cercles concentriques de rayons $1$ à $5$. Quelle est l''affixe du point $M$ ?


        {{fig:mathstle-plan-complexe-cercles}}'
      choices:
      - $5\,\mathrm{e}^{-i\frac{\pi}{4}}$
      - $4\,\mathrm{e}^{-i\frac{\pi}{4}}$
      - $5\,\mathrm{e}^{i\frac{\pi}{4}}$
      - $-5\,\mathrm{e}^{-i\frac{\pi}{4}}$
      answer: 0
      feedback:
      - null
      - Il faut compter les cercles jusqu'à $M$ ; le point est sur le **cinquième**.
      - 'Le point est **sous** l''axe réel : son argument est négatif.'
      - Un module est toujours positif, il n'y a jamais de signe moins devant.
      explanation: 'On lit le module sur les cercles ($r=5$) et l''argument sur l''angle avec l''axe réel ($-\dfrac{\pi}{4}$, car $M$ est dans le quatrième quadrant). D''où $z_{M}=5\,\mathrm{e}^{-i\frac{\pi}{4}}$. Sa forme algébrique est $\dfrac{5\sqrt{2}}{2}-\dfrac{5\sqrt{2}}{2}i$.'
    - type: match
      level: 2
      prompt: Associer chaque complexe à sa forme exponentielle.
      pairs:
      - left: $1$
        right: $\mathrm{e}^{i0}$
      - left: $i$
        right: $\mathrm{e}^{i\frac{\pi}{2}}$
      - left: $-1$
        right: $\mathrm{e}^{i\pi}$
      - left: $-i$
        right: $\mathrm{e}^{-i\frac{\pi}{2}}$
      - left: $1+i$
        right: $\sqrt{2}\,\mathrm{e}^{i\frac{\pi}{4}}$
    - type: mcq
      level: 2
      prompt: Que vaut le produit $r\,\mathrm{e}^{i\alpha}\times r'\,\mathrm{e}^{i\beta}$ ?
      choices:
      - $rr'\,\mathrm{e}^{i(\alpha+\beta)}$
      - $rr'\,\mathrm{e}^{i\alpha\beta}$
      - $(r+r')\,\mathrm{e}^{i(\alpha+\beta)}$
      - $rr'\,\mathrm{e}^{i(\alpha-\beta)}$
      answer: 0
      feedback:
      - null
      - Les exposants s'**ajoutent** quand on multiplie des exponentielles.
      - Les modules se multiplient, ils ne s'ajoutent pas.
      - La soustraction des arguments correspond au quotient.
      explanation: '**Les modules se multiplient, les arguments s''ajoutent.** C''est tout l''intérêt de la forme exponentielle : elle transforme les produits de complexes en calculs de niveau seconde.'
    - type: mcq
      level: 2
      prompt: Que vaut le quotient $\dfrac{r\,\mathrm{e}^{i\alpha}}{r'\,\mathrm{e}^{i\beta}}$ (avec $r'\neq0$) ?
      choices:
      - $\dfrac{r}{r'}\,\mathrm{e}^{i(\alpha-\beta)}$
      - $\dfrac{r}{r'}\,\mathrm{e}^{i(\alpha+\beta)}$
      - $\dfrac{r}{r'}\,\mathrm{e}^{i\frac{\alpha}{\beta}}$
      - $rr'\,\mathrm{e}^{i(\alpha-\beta)}$
      answer: 0
      feedback:
      - null
      - L'addition des arguments correspond au produit, pas au quotient.
      - Les arguments se soustraient, ils ne se divisent pas.
      - Les modules se divisent, comme les arguments se soustraient.
      explanation: 'Les modules se divisent, les arguments se soustraient. En particulier $\dfrac{1}{r\,\mathrm{e}^{i\theta}}=\dfrac{1}{r}\mathrm{e}^{-i\theta}$.'
    - type: mcq
      level: 2
      prompt: 'Que donne la formule de Moivre, pour $n$ entier ?'
      choices:
      - $\left(r\,\mathrm{e}^{i\theta}\right)^{n}=r^{n}\,\mathrm{e}^{in\theta}$
      - $\left(r\,\mathrm{e}^{i\theta}\right)^{n}=r\,\mathrm{e}^{in\theta}$
      - $\left(r\,\mathrm{e}^{i\theta}\right)^{n}=r^{n}\,\mathrm{e}^{i\theta}$
      - $\left(r\,\mathrm{e}^{i\theta}\right)^{n}=nr\,\mathrm{e}^{i\theta n}$
      answer: 0
      feedback:
      - null
      - Le module aussi est élevé à la puissance $n$.
      - L'argument aussi est multiplié par $n$.
      - Le module est élevé à la puissance $n$, il n'est pas multiplié par $n$.
      explanation: 'On élève le module à la puissance $n$ et on multiplie l''argument par $n$. Avec $r=1$, on obtient la forme classique $\left(\cos\theta+i\sin\theta\right)^{n}=\cos(n\theta)+i\sin(n\theta)$.'
    - type: input
      level: 3
      prompt: 'Soit $z_{1}=1-i\sqrt{3}$ et $z_{2}=\sqrt{2}\,\mathrm{e}^{i\frac{\pi}{4}}$. Calculer le module de $Z=z_{1}^{3}\times z_{2}^{2}$.'
      answer: '16'
      numeric: true
      tolerance: 0.1
      explanation: '$\left|z_{1}\right|=\sqrt{1+3}=2$ et $\left|z_{2}\right|=\sqrt{2}$, donc $\left|Z\right|=2^{3}\times\left(\sqrt{2}\right)^{2}=8\times2=16$. Les modules se multiplient, y compris pour les puissances.'
    - type: mcq
      level: 3
      prompt: 'Toujours avec $z_{1}=1-i\sqrt{3}$ et $z_{2}=\sqrt{2}\,\mathrm{e}^{i\frac{\pi}{4}}$, quelle est la nature du nombre $Z=z_{1}^{3}\times z_{2}^{2}$ ?'
      choices:
      - Un imaginaire pur, $Z=-16i$
      - Un réel, $Z=16$
      - Un réel, $Z=-16$
      - Un complexe de partie réelle et de partie imaginaire non nulles
      answer: 0
      feedback:
      - null
      - 'Un argument de $0$ donnerait un réel positif ; ici l''argument total vaut $-\dfrac{\pi}{2}$.'
      - 'Un argument de $\pi$ donnerait un réel négatif ; recompte $3\times\left(-\dfrac{\pi}{3}\right)+2\times\dfrac{\pi}{4}$.'
      - 'L''argument total est un multiple de $\dfrac{\pi}{2}$ : le point image est sur un axe.'
      explanation: '$z_{1}=2\,\mathrm{e}^{-i\frac{\pi}{3}}$ car $\cos\theta=\dfrac{1}{2}$ et $\sin\theta=-\dfrac{\sqrt{3}}{2}$. Alors $z_{1}^{3}=8\,\mathrm{e}^{-i\pi}=-8$ et $z_{2}^{2}=2\,\mathrm{e}^{i\frac{\pi}{2}}=2i$, donc $Z=-16i$ : un **imaginaire pur**. On ne calcule jamais $z_{1}^{3}$ sous forme algébrique.'
    - type: mcq
      level: 2
      prompt: Quelle est la forme algébrique de $4\,\mathrm{e}^{i\frac{2\pi}{3}}$ ?
      choices:
      - $-2+2i\sqrt{3}$
      - $2+2i\sqrt{3}$
      - $-2\sqrt{3}+2i$
      - $-2-2i\sqrt{3}$
      answer: 0
      feedback:
      - null
      - '$\cos\left(\dfrac{2\pi}{3}\right)=-\dfrac{1}{2}$ : la partie réelle est négative.'
      - Les valeurs du cosinus et du sinus ont été échangées.
      - '$\sin\left(\dfrac{2\pi}{3}\right)=+\dfrac{\sqrt{3}}{2}$ : la partie imaginaire est positive.'
      explanation: '$4\,\mathrm{e}^{i\frac{2\pi}{3}}=4\left(\cos\dfrac{2\pi}{3}+i\sin\dfrac{2\pi}{3}\right)=4\left(-\dfrac{1}{2}+i\dfrac{\sqrt{3}}{2}\right)=-2+2i\sqrt{3}$.'
    - type: input
      level: 3
      prompt: Donner la partie réelle de $z=6\,\mathrm{e}^{-i\frac{\pi}{3}}$.
      answer: '3'
      numeric: true
      tolerance: 0.01
      explanation: '$z=6\left(\cos\left(-\dfrac{\pi}{3}\right)+i\sin\left(-\dfrac{\pi}{3}\right)\right)=6\left(\dfrac{1}{2}-i\dfrac{\sqrt{3}}{2}\right)=3-3i\sqrt{3}$. La partie réelle vaut donc $3$.'
    - type: mcq
      level: 2
      prompt: 'En électricité, on note $\mathrm{j}$ le nombre imaginaire (pour éviter la confusion avec l''intensité $i$). L''impédance complexe d''une bobine idéale d''inductance $L$ en régime sinusoïdal de pulsation $\omega$ vaut $\underline{Z}=\mathrm{j}L\omega$. Quel est son argument ?'
      choices:
      - $\dfrac{\pi}{2}$
      - $0$
      - $-\dfrac{\pi}{2}$
      - $\pi$
      answer: 0
      feedback:
      - null
      - 'Un argument nul correspond à un réel positif : c''est le cas d''un résistor, pas d''une bobine.'
      - '$-\dfrac{\pi}{2}$ est l''argument de $\dfrac{1}{\mathrm{j}C\omega}$, l''impédance d''un condensateur.'
      - Un argument de $\pi$ correspondrait à un réel négatif.
      explanation: '$\mathrm{j}L\omega=L\omega\,\mathrm{e}^{\mathrm{j}\frac{\pi}{2}}$ avec $L\omega>0$ : l''argument vaut $\dfrac{\pi}{2}$. Physiquement, la tension aux bornes d''une bobine est en **avance** d''un quart de période sur le courant.'
    - type: input
      level: 3
      prompt: 'Un résistor $R=30\ \Omega$ et une bobine telle que $L\omega=40\ \Omega$ sont en série : l''impédance complexe vaut $\underline{Z}=30+40\mathrm{j}$. Calculer son module $\left|\underline{Z}\right|$.'
      answer: '50'
      numeric: true
      tolerance: 0.5
      unit: Ω
      explanation: '$\left|\underline{Z}\right|=\sqrt{30^{2}+40^{2}}=\sqrt{900+1\,600}=\sqrt{2\,500}=50\ \Omega$. C''est le triangle $(3\,;4\,;5)$, très fréquent dans les exercices d''électricité.'
    - type: order
      level: 2
      prompt: Remettre dans l'ordre la méthode pour écrire $z=a+ib$ sous forme exponentielle.
      steps:
      - Vérifier que $z$ est non nul
      - Calculer le module $r=\sqrt{a^{2}+b^{2}}$
      - Placer mentalement le point image pour repérer son quadrant
      - Calculer $\cos(\theta)=\dfrac{a}{r}$ et $\sin(\theta)=\dfrac{b}{r}$
      - Trouver l'angle remarquable $\theta$ qui vérifie **les deux** égalités
      - Écrire $z=r\,\mathrm{e}^{i\theta}$ et vérifier en développant
      explanation: 'L''erreur la plus fréquente est de ne calculer que le cosinus : deux angles opposés ont le même cosinus. Il faut **les deux** conditions, ou bien le quadrant.'
    - type: grid
      level: 3
      prompt: Pour chaque affirmation sur la forme exponentielle, cocher vrai ou faux.
      rows:
      - id: mod
        label: le module $r$ d'un complexe non nul est toujours strictement positif
      - id: conj
        label: $\overline{r\,\mathrm{e}^{i\theta}}=r\,\mathrm{e}^{-i\theta}$
      - id: prod
        label: le module d'un produit est le produit des modules
      - id: som
        label: l'argument d'une somme est la somme des arguments
      - id: uniq
        label: l'argument d'un complexe non nul est un nombre unique
      cols:
      - id: V
        label: Vrai
      - id: F
        label: Faux
      answer:
      - Vmod
      - Vconj
      - Vprod
      - Fsom
      - Funiq
      cellFeedback:
        Fmod: c'est une distance $OM$, nulle seulement si $z=0$
        Fconj: conjuguer revient à changer le signe de l'argument
        Fprod: 'c''est la règle « les modules se multiplient »'
        Vsom: 'rien de tel pour la somme : la forme exponentielle sert au produit, la forme algébrique à la somme'
        Vuniq: 'il est défini **modulo** $2\pi$ : $\dfrac{\pi}{4}$ et $\dfrac{9\pi}{4}$ conviennent aussi bien'
      explanation: 'À retenir : **somme et différence en forme algébrique, produit et quotient en forme exponentielle.** Choisir la bonne écriture, c''est déjà la moitié de l''exercice.'
    - type: guided
      level: 3
      title: L'impédance complexe d'un circuit RL
      prompt: 'Exercice complet : impédance complexe, module et argument, forme exponentielle et interprétation du déphasage.'
      intro: 'Un résistor de résistance $R=30\ \Omega$ et une bobine d''inductance $L=0{,}10$ H sont branchés **en série** sur une source sinusoïdale de pulsation $\omega=400\ \mathrm{rad}\cdot\mathrm{s}^{-1}$. En régime sinusoïdal, on associe au dipôle son **impédance complexe**


        $$\underline{Z}=R+\mathrm{j}L\omega,$$


        où $\mathrm{j}$ désigne le nombre imaginaire. Le module $\left|\underline{Z}\right|$ est l''impédance en ohms, et son argument $\varphi$ est le déphasage de la tension par rapport au courant.'
      steps:
      - kind: input
        prompt: '**Étape 1.** Calculer la réactance $L\omega$, en ohms.'
        answer: '40'
        numeric: true
        tolerance: 0.5
        unit: Ω
        explanation: '$L\omega=0{,}10\times400=40\ \Omega$. Une inductance en henrys multipliée par une pulsation en $\mathrm{rad}\cdot\mathrm{s}^{-1}$ donne bien des ohms.'
      - kind: mcq
        prompt: '**Étape 2.** Quelle est la forme algébrique de $\underline{Z}$ ?'
        choices:
        - $\underline{Z}=30+40\mathrm{j}$
        - $\underline{Z}=40+30\mathrm{j}$
        - $\underline{Z}=30-40\mathrm{j}$
        - $\underline{Z}=70$
        answer:
        - 0
        feedback:
        - null
        - La partie réelle est la résistance, la partie imaginaire la réactance.
        - 'Le signe moins correspondrait à un condensateur : pour une bobine, la réactance est positive.'
        - 'Les impédances complexes s''ajoutent en série, mais $30$ et $40\mathrm{j}$ ne s''additionnent pas comme deux réels.'
        explanation: 'En série les impédances complexes s''ajoutent : $\underline{Z}=\underline{Z_{R}}+\underline{Z_{L}}=30+40\mathrm{j}$.'
      - kind: input
        prompt: '**Étape 3.** Calculer l''impédance $\left|\underline{Z}\right|$ du circuit, en ohms.'
        answer: '50'
        numeric: true
        tolerance: 0.5
        unit: Ω
        explanation: '$\left|\underline{Z}\right|=\sqrt{30^{2}+40^{2}}=\sqrt{2\,500}=50\ \Omega$. Noter que $50\neq30+40$ : les impédances **ne s''ajoutent pas** en valeur, seules les impédances complexes s''ajoutent.'
      - kind: input
        prompt: '**Étape 4.** Calculer le déphasage $\varphi=\arg\left(\underline{Z}\right)$, en degrés, arrondi à $0{,}1$.'
        answer: '53.1'
        numeric: true
        tolerance: 0.3
        unit: °
        explanation: '$\cos(\varphi)=\dfrac{30}{50}=0{,}6$ et $\sin(\varphi)=\dfrac{40}{50}=0{,}8$, donc $\varphi=\arctan\left(\dfrac{40}{30}\right)\approx53{,}1^{\circ}$, soit environ $0{,}927$ rad. L''argument est positif car les deux parties le sont.'
      - kind: mcq
        prompt: '**Étape 5.** Quelle est la forme exponentielle de $\underline{Z}$ ?'
        choices:
        - $\underline{Z}=50\,\mathrm{e}^{0{,}927\mathrm{j}}$
        - $\underline{Z}=50\,\mathrm{e}^{-0{,}927\mathrm{j}}$
        - $\underline{Z}=70\,\mathrm{e}^{0{,}927\mathrm{j}}$
        - $\underline{Z}=50\,\mathrm{e}^{53{,}1\mathrm{j}}$
        answer:
        - 0
        feedback:
        - null
        - L'argument est **positif** ici, car les deux parties de $\underline{Z}$ sont positives.
        - 'Le module vaut $50\ \Omega$ : c''est une racine carrée, pas une somme.'
        - 'L''argument s''écrit en **radians** dans une forme exponentielle : $53{,}1^{\circ}=0{,}927$ rad.'
        explanation: '$\underline{Z}=50\,\mathrm{e}^{0{,}927\mathrm{j}}\ \Omega$. Cette écriture contient toute l''information du dipôle : $50$ donne le rapport des amplitudes, $0{,}927$ rad le décalage temporel entre tension et courant.'
      - kind: input
        prompt: '**Étape 6.** L''intensité efficace vaut $I=2{,}0$ A. Calculer la tension efficace $U=\left|\underline{Z}\right|\times I$ aux bornes du dipôle.'
        answer: '100'
        numeric: true
        tolerance: 1
        unit: V
        explanation: '$U=50\times2{,}0=100$ V. On n''utilise que le **module** pour les valeurs efficaces ; l''argument sert au déphasage.'
      - kind: mcq
        prompt: '**Étape 7.** Comment interpréter le signe de $\varphi$ ?'
        choices:
        - La tension est en avance de $53{,}1^{\circ}$ sur le courant, comportement inductif
        - Le courant est en avance de $53{,}1^{\circ}$ sur la tension, comportement capacitif
        - Tension et courant sont en phase
        - Le signe de $\varphi$ n'a pas de sens physique
        answer:
        - 0
        feedback:
        - null
        - 'C''est le comportement d''un condensateur, pour lequel $\varphi<0$.'
        - 'Ils ne seraient en phase que si $L\omega=0$, c''est-à-dire sans bobine.'
        - 'C''est justement l''intérêt de l''impédance complexe : l''argument porte le déphasage.'
        explanation: '$\varphi=\arg\left(\underline{Z}\right)>0$ signifie que la tension est en avance sur le courant : c''est la signature d''un circuit **inductif**. Le facteur de puissance vaut ici $\cos(\varphi)=0{,}6$.'
      - kind: input
        prompt: '**Étape 8.** On double la pulsation : $\omega=800\ \mathrm{rad}\cdot\mathrm{s}^{-1}$. Calculer la nouvelle impédance $\left|\underline{Z}\right|$, arrondie à $0{,}1$.'
        answer: '85.4'
        numeric: true
        tolerance: 0.3
        unit: Ω
        explanation: 'La réactance devient $L\omega=0{,}10\times800=80\ \Omega$, donc $\left|\underline{Z}\right|=\sqrt{30^{2}+80^{2}}=\sqrt{7\,300}\approx85{,}4\ \Omega$. L''impédance a moins que doublé, car la partie résistive, elle, ne change pas.'
  - id: mathstle-python
    title: Python et méthodes numériques
    icon: 🐍
    description: Méthode des rectangles, méthode d'Euler, dichotomie, lecture et complétion de scripts Python courts.
    prerequisites:
    - mathstle-integrale
    lesson: lessons/maths-tle-python.md
    items:
    # Les scripts des énoncés sont écrits ligne par ligne en code en ligne `…` : le texte riche des
    # exercices ne gère pas les blocs ``` (seules les leçons les acceptent, cf. app/js/render.js).
    # Le rendu HTML d'un <code> en ligne écrase les espaces de début de ligne : l'indentation est donc
    # matérialisée par des points médians, « ···· » = 4 espaces = un niveau, comme dans un éditeur qui
    # affiche les blancs. Les leçons, elles, utilisent de vrais blocs ```python.
    - type: mcq
      level: 1
      prompt: 'Que parcourt la boucle `for i in range(4):` ?'
      choices:
      - les valeurs $0$, $1$, $2$, $3$
      - les valeurs $1$, $2$, $3$, $4$
      - les valeurs $0$, $1$, $2$, $3$, $4$
      - la seule valeur $4$
      answer: 0
      feedback:
      - null
      - 'En Python, la numérotation commence à $0$.'
      - '`range(4)` s''arrête **avant** $4$ : il y a exactement $4$ valeurs.'
      - '`range(4)` produit une suite de $4$ valeurs, pas une seule.'
      explanation: '`range(n)` engendre les entiers de $0$ à $n-1$, soit $n$ valeurs. C''est la source d''erreur numéro un dans les programmes de sommation.'
    - type: mcq
      level: 1
      prompt: En Python, à quoi sert l'indentation (le décalage vers la droite) ?
      choices:
      - Elle délimite les blocs, par exemple le corps d'une boucle ou d'une fonction
      - Elle sert uniquement à rendre le programme plus lisible
      - Elle indique le nombre de tours de la boucle
      - Elle remplace les parenthèses dans les calculs
      answer: 0
      feedback:
      - null
      - 'Elle rend le programme lisible, mais surtout elle est **obligatoire** : elle a un sens.'
      - Le nombre de tours est fixé par `range`, pas par l'indentation.
      - L'indentation n'a rien à voir avec les priorités de calcul.
      explanation: 'Ce qui est indenté sous un `for` est répété ; ce qui est revenu à gauche est exécuté une seule fois, après la boucle. Déplacer un `return` d''un cran change complètement le résultat.'
    - type: mcq
      level: 1
      prompt: Sur quel principe repose la **méthode des rectangles** pour approcher une intégrale ?
      choices:
      - On découpe $\left[a\,;b\right]$ en $n$ morceaux de largeur $\Delta x$ et on somme les aires $f(x_{i})\Delta x$
      - On calcule une primitive de $f$ puis on évalue la différence $F(b)-F(a)$
      - On tire des points au hasard et on compte ceux qui tombent sous la courbe
      - On remplace la courbe par sa tangente au point d'abscisse $a$
      answer: 0
      feedback:
      - null
      - C'est la méthode exacte ; la méthode des rectangles sert justement quand on ne connaît pas de primitive.
      - C'est la méthode de **Monte-Carlo**, une autre situation algorithmique du programme.
      - C'est l'idée de la méthode d'**Euler**, qui approche une solution d'équation différentielle.
      explanation: 'On approche $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$ par $\sum_{i=0}^{n-1}f(x_{i})\,\Delta x$ avec $\Delta x=\dfrac{b-a}{n}$. Plus $n$ est grand, meilleure est l''approximation.


        {{fig:mathstle-rectangles}}'
    - type: mcq
      level: 2
      prompt: |-
        On donne la fonction Python suivante (les points « · » matérialisent les espaces d'indentation).

        `def aire(f, a, b, n):`
        `····pas = (b - a) / n`
        `····s = 0`
        `····for i in range(n):`
        `········s = s + f(a + i * pas)`
        `····return s * pas`

        Que renvoie l'appel `aire(f, a, b, n)` ?
      choices:
      - Une valeur approchée de $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$ par les rectangles à gauche
      - La valeur exacte de $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$
      - La somme des $f(x_{i})$, sans multiplication par la largeur
      - La valeur moyenne de $f$ sur $\left[a\,;b\right]$
      answer: 0
      feedback:
      - null
      - 'C''est une **approximation** : elle ne devient exacte qu''à la limite quand $n$ tend vers $+\infty$.'
      - 'La multiplication par `pas` est bien faite, à la dernière ligne : `return s * pas`.'
      - 'Il faudrait diviser par $b-a$ pour obtenir la valeur moyenne : ce n''est pas le cas ici.'
      explanation: 'Les points utilisés sont $a$, $a+\Delta x$, …, $a+(n-1)\Delta x$ : ce sont les bornes **gauches** des sous-intervalles. La somme accumulée dans `s` est multipliée une seule fois par `pas` à la fin, ce qui revient à factoriser $\Delta x$.'
    - type: input
      level: 2
      prompt: 'Appliquer la méthode des rectangles à gauche à $f(x)=x$ sur $\left[0\,;1\right]$ avec $n=4$. Quelle valeur obtient-on ?'
      answer: '0.375'
      numeric: true
      tolerance: 0.005
      explanation: '$\Delta x=0{,}25$ et les points sont $0$ ; $0{,}25$ ; $0{,}5$ ; $0{,}75$. La somme des images vaut $1{,}5$, donc l''approximation est $1{,}5\times0{,}25=0{,}375$. La valeur exacte est $\displaystyle\int_{0}^{1}x\,\mathrm{d}x=0{,}5$ : les rectangles à gauche **sous-estiment** ici, car $f$ est croissante.'
    - type: mcq
      level: 3
      prompt: |-
        Dans la fonction `aire` précédente, un élève écrit la dernière ligne

        `····return s`

        au lieu de `····return s * pas`. Que renvoie alors la fonction ?
      choices:
      - La somme des $f(x_{i})$, qui n'est pas homogène à une aire
      - La même chose, car `pas` vaut $1$
      - Une erreur, car `s` n'est pas défini
      - L'aire, mais avec le signe opposé
      answer: 0
      feedback:
      - null
      - '`pas` ne vaut $1$ que dans le cas très particulier où $b-a=n$.'
      - '`s` est bien défini : il est initialisé à $0$ puis incrémenté dans la boucle.'
      - Oublier un facteur ne change pas le signe du résultat.
      explanation: 'Oublier `* pas` est l''erreur classique : le programme renvoie $\sum f(x_{i})$ au lieu de $\sum f(x_{i})\,\Delta x$, donc un résultat $n$ fois trop grand quand $b-a=1$. Test de bon sens : sur $\left[0\,;1\right]$ avec $f(x)=x$ et $n=4$, il renverrait $1{,}5$ au lieu de $0{,}375$.'
    - type: mcq
      level: 3
      prompt: 'Pour $f(x)=\mathrm{e}^{-x}$ sur $\left[0\,;1\right]$ avec $n=100$, le programme renvoie $0{,}6353$, alors que la valeur exacte de l''intégrale est $0{,}6321$. Pourquoi cette surestimation ?'
      choices:
      - 'Parce que $f$ est **décroissante** : sur chaque morceau, la borne gauche donne la plus grande valeur de $f$'
      - Parce que $n$ est trop petit pour que la méthode fonctionne
      - Parce que l'ordinateur arrondit à chaque addition
      - Parce que la fonction exponentielle n'admet pas de primitive
      answer: 0
      feedback:
      - null
      - '$n=100$ donne déjà une erreur inférieure à $0{,}004$ : le problème est le **sens** de l''erreur, pas sa taille.'
      - Les arrondis machine sont de l'ordre de $10^{-15}$, bien trop petits pour expliquer un écart de $0{,}003$.
      - '$x\mapsto-\mathrm{e}^{-x}$ est une primitive de $\mathrm{e}^{-x}$ : c''est justement ce qui donne la valeur exacte $1-\mathrm{e}^{-1}$.'
      explanation: 'Chaque rectangle à gauche « dépasse » la courbe quand $f$ décroît, donc la somme majore l''intégrale. Pour une fonction croissante, c''est l''inverse. Doubler $n$ divise l''écart par environ $2$.'
    - type: input
      level: 2
      prompt: Calculer la valeur exacte de $\displaystyle\int_{0}^{1}\mathrm{e}^{-x}\,\mathrm{d}x$, arrondie à $0{,}001$.
      answer: '0.632'
      numeric: true
      tolerance: 0.003
      explanation: 'Une primitive de $x\mapsto\mathrm{e}^{-x}$ est $x\mapsto-\mathrm{e}^{-x}$, donc l''intégrale vaut $\left(-\mathrm{e}^{-1}\right)-\left(-1\right)=1-\mathrm{e}^{-1}\approx0{,}632$. C''est la valeur de référence à laquelle on compare le résultat du programme.'
    - type: mcq
      level: 1
      prompt: 'Sur quelle formule repose la **méthode d''Euler** pour approcher la solution de $y''=f(x,y)$ ?'
      choices:
      - $y_{k+1}=y_{k}+h\times y'_{k}$
      - $y_{k+1}=y_{k}\times h$
      - $y_{k+1}=y_{k}+y'_{k}$
      - $y_{k+1}=\dfrac{y_{k}}{h}$
      answer: 0
      feedback:
      - null
      - 'On **ajoute** un accroissement, on ne multiplie pas la valeur précédente.'
      - 'Il manque le pas $h$ : sans lui, l''accroissement ne dépendrait plus de la finesse du découpage.'
      - 'Le pas $h$ multiplie la dérivée, il ne divise pas la valeur.'
      explanation: 'On remplace la courbe par sa **tangente** sur un petit intervalle de longueur $h$ : $y(x+h)\approx y(x)+h\,y''(x)$. En enchaînant les pas, on construit une ligne brisée qui approche la courbe.


        {{fig:mathstle-euler}}'
    - type: mcq
      level: 2
      prompt: 'Pour l''équation $y''=y$, que devient la relation d''Euler ?'
      choices:
      - $y_{k+1}=(1+h)\,y_{k}$
      - $y_{k+1}=h\,y_{k}$
      - $y_{k+1}=y_{k}+h$
      - $y_{k+1}=\mathrm{e}^{h}y_{k}$
      answer: 0
      feedback:
      - null
      - 'Le terme $y_{k}$ initial ne disparaît pas : on lui **ajoute** $h\,y_{k}$.'
      - 'Ici $y''_{k}=y_{k}$, donc l''accroissement est $h\,y_{k}$ et non $h$.'
      - '$\mathrm{e}^{h}$ est le facteur **exact** ; la méthode d''Euler le remplace par son approximation affine $1+h$.'
      explanation: '$y''=y$ donne $y_{k+1}=y_{k}+h\,y_{k}=(1+h)y_{k}$. La suite obtenue est **géométrique** de raison $1+h$, ce qui permet de calculer directement $y_{n}=(1+h)^{n}y_{0}$.'
    - type: input
      level: 2
      prompt: 'Appliquer la méthode d''Euler à $y''=y$ avec $y(0)=1$, un pas $h=0{,}1$ et $10$ étapes. Quelle valeur obtient-on pour $y(1)$ ? (arrondir à $0{,}001$)'
      answer: '2.594'
      numeric: true
      tolerance: 0.003
      explanation: '$y_{10}=(1+0{,}1)^{10}=1{,}1^{10}\approx2{,}594$, à comparer à la valeur exacte $\mathrm{e}\approx2{,}718$. C''est exactement la situation algorithmique demandée par le programme.'
    - type: input
      level: 3
      prompt: 'Même question avec un pas $h=0{,}01$ et $100$ étapes. (arrondir à $0{,}001$)'
      answer: '2.705'
      numeric: true
      tolerance: 0.003
      explanation: '$y_{100}=1{,}01^{100}\approx2{,}705$. Diviser le pas par $10$ divise l''écart à $\mathrm{e}$ par environ $10$ : il passe de $0{,}125$ à $0{,}013$.'
    - type: mcq
      level: 3
      prompt: 'Pourquoi la méthode d''Euler appliquée à $y''=y$ donne-t-elle toujours une valeur **inférieure** à $\mathrm{e}^{x}$ ?'
      choices:
      - Parce que la courbe de l'exponentielle est au-dessus de chacune de ses tangentes
      - Parce que l'ordinateur arrondit toujours par défaut
      - Parce que le pas $h$ est trop grand
      - Parce que la méthode oublie la condition initiale
      answer: 0
      feedback:
      - null
      - Les arrondis machine sont négligeables devant l'écart observé.
      - 'Réduire $h$ diminue l''écart, mais le résultat reste inférieur : le sens de l''erreur ne change pas.'
      - 'La condition initiale $y_{0}=1$ est bien utilisée : c''est le point de départ.'
      explanation: 'La fonction exponentielle est **convexe** : sa courbe reste au-dessus de ses tangentes. Comme chaque pas d''Euler suit une tangente, la ligne brisée passe systématiquement sous la courbe.'
    - type: mcq
      level: 1
      prompt: En quoi consiste la méthode de **dichotomie** pour approcher une solution de $f(x)=0$ ?
      choices:
      - On part d'un intervalle où $f$ change de signe et on le coupe en deux à chaque étape, en gardant la moitié qui contient la solution
      - On teste toutes les valeurs de l'intervalle avec un pas fixe
      - On calcule la dérivée et on cherche où elle s'annule
      - On tire des points au hasard jusqu'à tomber sur la solution
      answer: 0
      feedback:
      - null
      - 'C''est le **balayage** : plus simple, mais beaucoup plus lent.'
      - Chercher où la dérivée s'annule donne les extremums, pas les racines.
      - Le hasard sert à Monte-Carlo, pas à la recherche d'une solution.
      explanation: 'À chaque étape, l''amplitude de l''intervalle est **divisée par deux** : la précision progresse très vite. Dix étapes divisent l''amplitude par $1\,024$.'
    - type: order
      level: 2
      prompt: Remettre dans l'ordre les étapes d'une itération de dichotomie sur $\left[a\,;b\right]$.
      steps:
      - Vérifier que $f(a)$ et $f(b)$ sont de signes contraires
      - Calculer le milieu $m=\dfrac{a+b}{2}$
      - Calculer $f(m)$
      - Comparer le signe de $f(m)$ à celui de $f(a)$
      - Remplacer $b$ par $m$ si les signes sont contraires, sinon remplacer $a$ par $m$
      - Recommencer tant que l'amplitude $b-a$ dépasse la précision voulue
      explanation: 'Le test initial de changement de signe est indispensable : sans lui, rien ne garantit qu''il existe une solution dans l''intervalle, et l''algorithme renvoie n''importe quoi.'
    - type: mcq
      level: 2
      prompt: |-
        Quelle ligne complète correctement la boucle de dichotomie ci-dessous (les points « · » matérialisent l'indentation) ?

        `while b - a > 0.001:`
        `····m = (a + b) / 2`
        `····if f(a) * f(m) <= 0:`
        `········...`
        `····else:`
        `········a = m`
      choices:
      - '`b = m`'
      - '`a = m`'
      - '`b = a`'
      - '`m = b`'
      answer: 0
      feedback:
      - null
      - 'C''est déjà ce que fait le `else` : les deux branches feraient la même chose et l''intervalle ne rétrécirait pas.'
      - Cette instruction réduirait l'intervalle à un point et fausserait tout.
      - Modifier `m` ne change pas l'intervalle de travail.
      explanation: 'Si `f(a) * f(m) <= 0`, alors $f$ change de signe entre $a$ et $m$ : la solution est dans $\left[a\,;m\right]$, donc la nouvelle borne droite est $m$. Sinon la solution est dans $\left[m\,;b\right]$ et on remplace $a$.'
    - type: input
      level: 3
      prompt: 'On applique la dichotomie sur $\left[1\,;2\right]$. Combien d''étapes faut-il pour que l''amplitude de l''intervalle devienne inférieure à $0{,}01$ ?'
      answer: '7'
      numeric: true
      tolerance: 0
      explanation: 'Après $n$ étapes, l''amplitude vaut $\dfrac{1}{2^{n}}$. Il faut $2^{n}>100$, donc $n=7$ car $2^{6}=64$ et $2^{7}=128$ : l''amplitude vaut alors $\dfrac{1}{128}\approx0{,}0078<0{,}01$.'
    - type: input
      level: 2
      prompt: 'On cherche la solution de $\mathrm{e}^{x}=3$ par dichotomie sur $\left[1\,;2\right]$. Quelle est la valeur exacte de cette solution, arrondie à $0{,}001$ ?'
      answer: '1.099'
      numeric: true
      tolerance: 0.003
      explanation: '$\mathrm{e}^{x}=3$ équivaut à $x=\ln(3)\approx1{,}0986$. Un algorithme n''est utile que quand on ne sait **pas** résoudre à la main : ici il sert surtout à vérifier le programme sur un cas connu.'
    - type: mcq
      level: 2
      prompt: 'Quelle est la différence entre une boucle `for` et une boucle `while` ?'
      choices:
      - '`for` répète un nombre de tours connu à l''avance, `while` répète tant qu''une condition est vraie'
      - Il n'y en a aucune, les deux sont interchangeables
      - '`for` s''utilise pour les nombres, `while` pour les chaînes de caractères'
      - '`while` teste la condition à la fin de chaque tour'
      answer: 0
      feedback:
      - null
      - 'Toute boucle `for` peut s''écrire avec `while`, mais l''inverse est faux : le nombre de tours d''un `while` peut être inconnu.'
      - Le type des données n'a rien à voir avec le choix de la boucle.
      - '`while` teste la condition **avant** chaque tour ; si elle est fausse dès le départ, le corps n''est jamais exécuté.'
      explanation: 'Les rectangles et la méthode d''Euler utilisent un `for` (le nombre de pas est fixé) ; la dichotomie utilise un `while` (on s''arrête quand la précision est atteinte).'
    - type: grid
      level: 3
      prompt: Pour chaque affirmation sur ces programmes, cocher vrai ou faux.
      rows:
      - id: rg
        label: '`range(n)` produit $n$ valeurs'
      - id: acc
        label: un accumulateur doit être initialisé avant la boucle
      - id: ega
        label: '`=` compare deux valeurs en Python'
      - id: dicho
        label: la dichotomie divise l'amplitude par deux à chaque étape
      - id: euler
        label: la méthode d'Euler donne la valeur exacte de la solution
      cols:
      - id: V
        label: Vrai
      - id: F
        label: Faux
      answer:
      - Vrg
      - Vacc
      - Fega
      - Vdicho
      - Feuler
      cellFeedback:
        Frg: 'de $0$ à $n-1$, cela fait bien $n$ valeurs'
        Facc: 'sinon la première instruction `s = s + …` échoue : `s` n''existe pas encore'
        Vega: '`=` **affecte** une valeur ; c''est `==` qui compare'
        Fdicho: c'est la définition même de la méthode
        Veuler: 'c''est une **approximation** par une ligne brisée : elle n''est exacte qu''au point de départ'
      explanation: 'Trois réflexes de relecture : l''initialisation de l''accumulateur, la borne du `range`, et le `*` du pas dans les sommes de rectangles.'
    - type: guided
      level: 3
      title: La méthode d'Euler pour approcher le nombre e
      prompt: 'Exercice complet : compléter un script d''Euler, dérouler les premières étapes, comparer à la solution exacte et évaluer l''erreur.'
      intro: |-
        La **méthode d'Euler** approche la courbe d'une solution d'équation différentielle par une ligne brisée : partant de la condition initiale, on avance à chaque étape le long de la tangente, sur un pas $h$ :

        $$y_{k+1}=y_{k}+h\times y'_{k}.$$

        On l'applique ici à $y'=y$ avec $y(0)=1$ sur $\left[0\,;1\right]$, dont la solution exacte est $y(x)=\mathrm{e}^{x}$. Le script suivant est à compléter (les points « · » matérialisent les espaces d'indentation).

        `def euler(h, n):`
        `····x, y = 0, 1`
        `····for k in range(n):`
        `········y = y + h * ...`
        `········x = x + h`
        `····return y`
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Par quoi remplacer les points de suspension dans `y = y + h * ...` ?'
        choices:
        - '`y`'
        - '`x`'
        - '`h`'
        - '`k`'
        answer:
        - 0
        feedback:
        - null
        - '`x` est l''abscisse courante ; elle n''intervient pas dans $y''=y$.'
