        - 'La consommation d''une seconde donnée varie ; la moyenne ne concerne que l''ensemble des $10$ s.'
        explanation: 'La valeur moyenne est la hauteur du rectangle de largeur $10$ s ayant la même aire que le domaine sous la courbe : $1\,396\times10\approx13\,963$ J.'
      - kind: input
        prompt: '**Étape 8.** Convertir l''énergie $E$ en wattheures. (arrondir à $0{,}01$)'
        answer: '3.88'
        numeric: true
        tolerance: 0.03
        unit: Wh
