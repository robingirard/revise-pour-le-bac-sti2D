      - Un modèle n'est valable que sur le domaine où il a été établi, ici les premières minutes.
      - '$T_{1}$ est définie sur $\left[0\,;+\infty\right[$ tout entier : l''objection serait mathématique, pas physique.'
      - 'La limite du modèle vaut $11{,}5$ °C et non $23$ °C : c''est justement la contradiction.'
      explanation: 'Le modèle décrit le refroidissement dû au glaçon ; une fois celui-ci fondu, la boisson se réchauffe vers la température de la pièce. Savoir dire **jusqu''où** un modèle est valable est un attendu explicite de l''épreuve.'
    - type: mcq
