        - Seul le terme exponentiel tend vers $0$ ; le terme constant subsiste.
        - $800$ est le coefficient du terme qui disparaît, pas la limite.
        explanation: '$\lim\limits_{t\to+\infty}\mathrm{e}^{-0{,}4t}=0$, donc $p(t)\to1\,200$ W : c''est la puissance du régime établi, une fois la pointe de démarrage passée.'
      - kind: mcq
