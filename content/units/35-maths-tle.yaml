  - id: mathstle-equadiff
    title: Équations différentielles
    icon: 📉
    description: 'Résoudre $y''=ay$ et $y''=ay+b$, condition initiale, limite en $+\infty$, et les modèles associés : condensateur, refroidissement, chute avec frottement.'
    prerequisites:
    - mathstle-exp-ln
    lesson: lessons/maths-tle-equadiff.md
    items:
    - type: mcq
      level: 1
      prompt: Qu'est-ce qu'une **équation différentielle** ?
      choices:
      - Une équation dont l'inconnue est une fonction et qui relie cette fonction à ses dérivées
      - Une équation dont l'inconnue est un nombre réel et qui contient une différence
      - Une équation qui relie deux nombres dérivés en un même point
      - Une équation dont les solutions sont toujours des fonctions affines
      answer: 0
      feedback:
      - null
      - Le mot « différentielle » renvoie à la **dérivation**, pas à la soustraction.
      - Une équation différentielle porte sur une fonction tout entière, pas sur un seul point.
      - Les solutions de $y'=ay$ sont des exponentielles, pas des fonctions affines.
      explanation: 'L''inconnue est une **fonction** $y$, et l''équation la relie à sa dérivée $y''$. Les sciences physiques écrivent la même chose $\dfrac{\mathrm{d}v}{\mathrm{d}t}=-6{,}8v+7{,}5$ : la notation change, pas la nature de l''équation.'
    - type: mcq
      level: 1
      prompt: 'Quelles sont les solutions sur $\mathbb{R}$ de l''équation différentielle $y''=ay$, où $a$ est un réel ?'
      choices:
      - les fonctions $x\mapsto k\,\mathrm{e}^{ax}$, avec $k$ réel quelconque
      - les fonctions $x\mapsto k\,\mathrm{e}^{x/a}$, avec $k$ réel quelconque
      - les fonctions $x\mapsto a\,\mathrm{e}^{kx}$, avec $k$ réel quelconque
      - la seule fonction $x\mapsto\mathrm{e}^{ax}$
      answer: 0
      feedback:
      - null
      - 'Le coefficient $a$ multiplie $x$ dans l''exposant : il n''y est pas en dénominateur.'
      - 'Les rôles sont échangés : $a$ vient de l''équation, $k$ est la constante libre.'
      - 'Il y a une **infinité** de solutions : toutes les fonctions $k\,\mathrm{e}^{ax}$ conviennent.'
      explanation: 'C''est le résultat de base du chapitre. On le vérifie en dérivant : $\left(k\,\mathrm{e}^{ax}\right)''=ka\,\mathrm{e}^{ax}=a\times\left(k\,\mathrm{e}^{ax}\right)$. Le cas $k=0$ donne la fonction nulle, qui est bien solution.'
    - type: mcq
      level: 2
      prompt: 'La fonction constante $g$ définie par $g(t)=2$ est-elle solution de $y''=-5y+10$ ?'
      choices:
      - 'Oui : $g''(t)=0$ et $-5\times2+10=0$, les deux membres sont égaux'
      - 'Non : une fonction constante ne peut pas être solution d''une équation différentielle'
      - Oui, mais uniquement à l'instant $t=0$
      - 'Non : il faudrait $g(t)=-2$'
      answer: 0
      feedback:
      - null
      - 'Au contraire : dès que $b\neq0$ il existe une solution constante, c''est le **régime permanent**.'
      - Une solution doit vérifier l'équation pour **tout** $t$, ce qui est le cas ici.
      - '$-5\times(-2)+10=20\neq0$ : la fonction constante $-2$ n''est pas solution.'
      explanation: 'Méthode : on calcule **séparément** les deux membres. Ici $g''(t)=0$ et $-5g(t)+10=0$ : ils coïncident pour tout $t$. La solution constante s''obtient en résolvant $0=ay+b$, soit $y=-\dfrac{b}{a}=\dfrac{10}{5}=2$.'
    - type: input
      level: 2
      prompt: 'Soit $y$ la solution de $y''=0{,}5y$ vérifiant $y(0)=4$. Calculer $y(2)$, arrondi à $0{,}01$.'
      answer: '10.87'
      numeric: true
      tolerance: 0.05
      explanation: 'Les solutions sont $y(x)=k\,\mathrm{e}^{0{,}5x}$ ; la condition $y(0)=k=4$ donne $y(x)=4\,\mathrm{e}^{0{,}5x}$, donc $y(2)=4\,\mathrm{e}\approx4\times2{,}718\approx10{,}87$.'
    - type: mcq
      level: 2
      prompt: 'Quelles sont les solutions de $y''=ay+b$, avec $a\neq0$ ?'
      choices:
      - les fonctions $x\mapsto k\,\mathrm{e}^{ax}-\dfrac{b}{a}$, avec $k$ réel
      - les fonctions $x\mapsto k\,\mathrm{e}^{ax}+\dfrac{b}{a}$, avec $k$ réel
      - les fonctions $x\mapsto k\,\mathrm{e}^{ax}+b$, avec $k$ réel
      - les fonctions $x\mapsto k\,\mathrm{e}^{(a+b)x}$, avec $k$ réel
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : la solution constante vérifie $0=ay+b$, donc $y=-\dfrac{b}{a}$.'
      - Le terme constant n'est pas $b$ mais $-\dfrac{b}{a}$.
      - Le nombre $b$ n'intervient pas dans l'exposant.
      explanation: 'On ajoute à la solution générale de $y''=ay$ la solution **constante** de $y''=ay+b$, qui vérifie $0=ay+b$. D''où $y(x)=k\,\mathrm{e}^{ax}-\dfrac{b}{a}$. En pratique, on cherche toujours la solution constante en premier.'
    - type: mcq
      level: 2
      prompt: 'Quelles sont les solutions de $(E)\ y''=-4y+80$ ?'
      choices:
      - $f(t)=k\,\mathrm{e}^{-4t}+20$
      - $f(t)=k\,\mathrm{e}^{-4t}+80$
      - $f(t)=k\,\mathrm{e}^{4t}+20$
      - $f(t)=k\,\mathrm{e}^{-4t}-20$
      answer: 0
      feedback:
      - null
      - 'Le terme constant est $-\dfrac{b}{a}=-\dfrac{80}{-4}=20$, et non $80$.'
      - 'Le coefficient $a=-4$ est négatif : il se recopie tel quel dans l''exposant.'
      - 'Erreur de signe : $-\dfrac{80}{-4}=+20$.'
      explanation: 'Ici $a=-4$ et $b=80$. La solution constante vérifie $0=-4y+80$, soit $y=20$. Les solutions sont donc $f(t)=k\,\mathrm{e}^{-4t}+20$, $k$ réel.'
    - type: input
      level: 2
      prompt: 'Toujours pour $(E)\ y''=-4y+80$, on cherche la solution $f$ telle que $f(0)=100$. Que vaut la constante $k$ ?'
      answer: '80'
      numeric: true
      tolerance: 0.01
      explanation: '$f(t)=k\,\mathrm{e}^{-4t}+20$ donne $f(0)=k\times1+20=100$, donc $k=80$ et $f(t)=80\,\mathrm{e}^{-4t}+20$.'
    - type: mcq
      level: 2
      prompt: 'Que vaut $\lim\limits_{t\to+\infty}f(t)$ pour $f(t)=80\,\mathrm{e}^{-4t}+20$ ?'
      choices:
      - $20$
      - $100$
      - $0$
      - $+\infty$
      answer: 0
      feedback:
      - null
      - '$100$ est la valeur **initiale** $f(0)$, pas la limite.'
      - Seul le terme exponentiel tend vers $0$ ; le terme constant $20$ subsiste.
      - 'L''exposant est négatif : l''exponentielle décroît vers $0$.'
      explanation: 'Quand $a<0$, $\mathrm{e}^{at}\to0$ et la solution tend vers la valeur constante $-\dfrac{b}{a}$ : c''est le **régime permanent**, lu directement sur l''équation, sans calcul.


        {{fig:mathstle-eqdiff-asymptote}}'
    - type: input
      level: 3
      prompt: 'Soit $(E)\ y''=2y-0{,}5$. On cherche la solution $f$ telle que $f''(0)=-3$ — attention, la condition porte sur la **dérivée**. Que vaut la constante $k$ ?'
      answer: '-1.5'
      numeric: true
      tolerance: 0.01
      explanation: 'Les solutions sont $f(x)=k\,\mathrm{e}^{2x}+0{,}25$ car $-\dfrac{-0{,}5}{2}=0{,}25$. Alors $f''(x)=2k\,\mathrm{e}^{2x}$, donc $f''(0)=2k=-3$ et $k=-1{,}5$. La solution cherchée est $f(x)=-1{,}5\,\mathrm{e}^{2x}+0{,}25$.'
    - type: mcq
      level: 2
      prompt: 'On donne $(E)\ y''+0{,}006y=0{,}069$. Sous la forme $y''=ay+b$, que valent $a$ et $b$ ?'
