      explanation: 'La notation $\dfrac{\mathrm{d}v}{\mathrm{d}t}$ est celle des sciences physiques ; elle nomme la variable et rappelle qu''une dérivée est un rapport de variations. L''inconnue reste la fonction $v$.'
    - type: input
