      - id: lim
        label: si $a<0$, toute solution de $y'=ay+b$ tend vers $-\dfrac{b}{a}$ en $+\infty$
      - id: unique
        label: l'équation $y'=ay$ n'a qu'une seule solution
      - id: croiss
