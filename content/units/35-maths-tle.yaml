        Vunique: 'il y en a une infinité, une par valeur de $k$'
        Vcroiss: 'elle est décroissante si $k>0$ et croissante si $k<0$ : cela dépend de la condition initiale'
      explanation: 'Le signe de $a$ décide de la **convergence** ; le signe de $k$, fixé par la condition initiale, décide du **sens de variation**. Ce sont deux questions différentes.'
