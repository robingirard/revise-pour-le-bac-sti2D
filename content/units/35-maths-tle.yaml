      - 'La condition initiale ne suffit pas : il faut aussi que la fonction soit solution de $(E)$.'
      - Le sens de variation ne prouve pas qu'une fonction est solution.
      - Une intégrale ne teste pas une équation différentielle.
      explanation: '$T_{1}$ a bien la forme voulue, avec $k=11{,}5$, et $T_{1}(0)=11{,}5+11{,}5=23$. L''**unicité** de la solution vérifiant une condition initiale est admise par le programme : c''est elle qui permet de dire « la » solution.'
    - type: input
      level: 3
      prompt: 'Une boisson refroidit selon $T_{1}(t)=11{,}5\,\mathrm{e}^{-0{,}006t}+11{,}5$ ($T$ en °C, $t$ en secondes). Estimer sa température au bout de $3$ heures, arrondie à $0{,}1$.'
      answer: '11.5'
      numeric: true
      tolerance: 0.1
      unit: °C
      explanation: '$3$ h $=10\,800$ s, et $\mathrm{e}^{-0{,}006\times10\,800}=\mathrm{e}^{-64{,}8}$ vaut environ $10^{-29}$ : c''est totalement négligeable. Donc $T_{1}(10\,800)\approx11{,}5$ °C, c''est-à-dire la limite du modèle.'
    - type: mcq
