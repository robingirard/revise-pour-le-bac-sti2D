      - 'Du type $y''=ay+b$, avec $a=-6{,}8$ et $b=7{,}5$'
      - 'Du type $y''=ay$, avec $a=-6{,}8$'
      - 'Du type $y''=ay+b$, avec $a=7{,}5$ et $b=-6{,}8$'
      - Ce n'est pas une équation différentielle, car la variable est nommée $t$
      answer: 0
      feedback:
