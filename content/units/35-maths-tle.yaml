      - 'On **divise** par $RC$, on ne multiplie pas.'
      - Le second membre doit être divisé par $RC$ lui aussi.
      explanation: 'On divise tout par $RC$ : $u''+\dfrac{u}{RC}=\dfrac{E}{RC}$, puis on isole $u''$. La solution constante vaut $-\dfrac{b}{a}=E$ : le condensateur se charge jusqu''à la tension du générateur.'
    - type: input
      level: 2
