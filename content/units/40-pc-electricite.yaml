      prompt: Deux dipôles absorbent la même puissance apparente $S = 1\,000$ V·A sous 230 V. Le premier est purement résistif, le second a $\cos\varphi = 0{,}50$. Que peut-on dire ?
      choices:
      - Ils appellent la même intensité (4,3 A), mais le second ne convertit que 500 W au lieu de 1 000 W
