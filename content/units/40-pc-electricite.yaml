    - type: guided
      level: 3
      title: 'Le chauffe-eau électrique : de la prise à la facture'
      intro: 'Un chauffe-eau est équipé d''une **résistance chauffante** de $R = 24\ \Omega$ branchée sur le réseau français ($U_{\text{eff}} = 230$ V, $f = 50$ Hz, sinusoïdal alternatif). Sa cuve contient $m = 150$ kg d''eau à porter de $\theta_i = 15$ °C à $\theta_f = 65$ °C. Le **rendement** du chauffe-eau (pertes thermiques par la cuve) vaut $\eta = 90$ %. Le kilowattheure est facturé 0,25 €.

        {{fig:pc-chaine-energetique}}'
      steps:
      - kind: input
        prompt: '**Étape 1.** Calculer l''**amplitude** $U_m$ de la tension d''alimentation (3 chiffres significatifs).'
        answer: '325'
        numeric: true
        tolerance: 3
        unit: V
        explanation: La tension est alternative ($U_{\text{moy}} = 0$ V) donc $U_{\text{eff}} = U_m/\sqrt{2}$, d'où $U_m = 230 \times 1{,}414 = 325$ V.
      - kind: mcq
        prompt: '**Étape 2.** Calculer la puissance moyenne $P$ dissipée par effet Joule dans la résistance chauffante.'
        choices:
        - 2,20 kW
        - 4,40 kW
        - 5,52 kW
        - 9,58 kW
        answer:
        - 0
        feedback:
        - null
        - 'Non : tu as utilisé l''amplitude $U_m = 325$ V au lieu de la valeur efficace. En régime variable, l''effet Joule se calcule avec $U_{\text{eff}}$.'
        - 'Non : tu as calculé $U \times R = 230 \times 24$. La bonne formule est $P = U_{\text{eff}}^{2}/R$.'
        - 'Non : 9,58 est la valeur de l''**intensité** en ampères ($230/24$), pas une puissance.'
        explanation: $P = \dfrac{U_{\text{eff}}^{2}}{R} = \dfrac{230^{2}}{24} = \dfrac{52\,900}{24} = 2\,204$ W $\approx 2{,}20$ kW.
      - kind: input
        prompt: '**Étape 3.** Calculer l''intensité efficace $I_{\text{eff}}$ absorbée par la résistance chauffante (2 décimales).'
        answer: '9.58'
        numeric: true
        tolerance: 0.1
        unit: A
        explanation: '$I_{\text{eff}} = U_{\text{eff}}/R = 230/24 = 9{,}58$ A. Vérification : $R \times I_{\text{eff}}^{2} = 24 \times 9{,}58^{2} = 2\,203$ W, cohérent avec l''étape 2.'
      - kind: mcq
        prompt: '**Étape 4.** La résistance chauffante est un dipôle **purement résistif**. Que valent son facteur de puissance $k$ et sa puissance apparente $S$ ?'
        choices:
        - $k = 1$ et $S = 2{,}20$ kV·A
        - $k = 1$ et $S = 2{,}20$ kW
        - $k = 0$ et $S = 0$ V·A
        - $k = 0{,}80$ et $S = 2{,}75$ kV·A
        answer:
        - 0
        feedback:
        - null
        - 'Presque : la valeur est bonne, mais la puissance **apparente** s''exprime en volt-ampère (V·A), pas en watt.'
        - 'Non : $k = 0$ correspond à un dipôle purement capacitif ou inductif, qui ne dissipe rien — or ce radiateur chauffe.'
        - 'Non : $\cos\varphi = 0{,}80$ concerne un dipôle non résistif (moteur, par exemple).'
        explanation: 'Dipôle purement résistif : $\varphi = 0$, donc $k = \cos\varphi = 1$ et $S = U \times I = 230 \times 9{,}58 = 2\,204$ V·A $= P$.'
      - kind: input
        prompt: '**Étape 5.** Énergie thermique **utile** à fournir à l''eau : $Q = m \times c \times \Delta\theta$ avec $c_{\text{eau}} = 4{,}2$ kJ·kg⁻¹·°C⁻¹ (rappel de 1re, chapitre 5). Donner $Q$ en MJ (1 décimale).'
        answer: '31.5'
        numeric: true
        tolerance: 0.3
        unit: MJ
        explanation: '$Q = 150 \times 4\,200 \times (65 - 15) = 150 \times 4\,200 \times 50 = 3{,}15 \times 10^{7}$ J $= 31{,}5$ MJ. Erreur classique : utiliser 65 au lieu de l''**écart** de 50 °C.'
      - kind: input
        prompt: '**Étape 6.** En tenant compte du rendement $\eta = 90$ %, calculer l''énergie électrique $E_{\text{reçue}}$ prélevée sur le réseau, en kWh (2 décimales). Rappel : $1$ kWh $= 3{,}6 \times 10^{6}$ J.'
        answer: '9.72'
        numeric: true
        tolerance: 0.15
        unit: kWh
        explanation: '$\eta = E_{\text{utile}}/E_{\text{reçue}}$ donc $E_{\text{reçue}} = Q/\eta = 31{,}5/0{,}90 = 35{,}0$ MJ ; en kWh : $\dfrac{3{,}50 \times 10^{7}}{3{,}6 \times 10^{6}} = 9{,}72$ kWh. Erreur classique : **multiplier** par 0,90 (on trouverait moins que l''énergie utile, ce qui est impossible).'
      - kind: input
        prompt: '**Étape 7.** Le kilowattheure est facturé 0,25 €. Calculer le coût d''un cycle complet de chauffe, en euros (2 décimales).'
        answer: '2.43'
        numeric: true
        tolerance: 0.05
        unit: €
        explanation: Coût $= 9{,}72 \times 0{,}25 = 2{,}43$ €. Pour information, la durée de chauffe vaut $\Delta t = E_{\text{reçue}}/P = 3{,}50 \times 10^{7}/2\,204 \approx 1{,}59 \times 10^{4}$ s, soit environ 4 h 25 min.
      - kind: mcq
        prompt: '**Étape 8.** L''intensité absorbée vaut $I_{\text{eff}} = 9{,}58$ A, soit 9 580 mA — environ 320 fois le calibre de 30 mA du disjoncteur différentiel. Pourquoi celui-ci ne déclenche-t-il pas ?'
        choices:
        - Parce qu'il ne surveille pas le courant de service, mais uniquement le courant de **fuite** vers la terre
        - Parce que 9,58 A est inférieur à 30 mA
        - Parce que le chauffe-eau n'est pas relié à la terre
        - Parce que le différentiel ne fonctionne qu'en régime continu
        answer:
        - 0
        feedback:
        - null
        - 'Non : 9,58 A $= 9\,580$ mA, soit bien plus que 30 mA.'
        - 'Non, au contraire : la cuve **doit** être reliée à la terre, c''est ce qui permet au différentiel de détecter une fuite.'
        - 'Non : le différentiel protège une installation alimentée en alternatif (230 V ~).'
        explanation: 'Le courant de service (9,58 A) circule entièrement dans le circuit : il entre et ressort, le différentiel ne voit aucun écart. Le différentiel de 30 mA n''ouvre le circuit que si une **fuite** vers la terre dépasse 30 mA — seuil de paralysie respiratoire au-delà de 500 ms. C''est le rôle des disjoncteurs magnéto-thermiques et des fusibles de protéger contre les surintensités.'
