      - 'Non : $k = 0{,}50$ est **moins bon** que $k = 1$.'
      explanation: $S = U \times I$ fixe l'intensité en ligne ; $P = S \times \cos\varphi$ fixe la puissance réellement convertie. Un mauvais facteur de puissance fait circuler du courant (et donc des pertes en ligne) sans produire de puissance active.
