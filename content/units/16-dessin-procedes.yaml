# Dessin technique et procédés — écrit à la 10e session (17 sept. 2026) pour la spécialité ITEC
# du fils de Robin (confirmée le 17 sept.). Voir docs/REPRISE.md.
units:
- id: dessin-procedes
  matiere: ingenierie
  title: Dessin technique et procédés
  description: 'Lire un dessin avant de concevoir : vues, traits, coupes et sections. Puis obtenir la pièce —
    enlever, déformer ou ajouter de la matière, et choisir selon la forme, le matériau et la quantité.'
  skills:
  - id: sc-dessin-technique
    title: Lire un dessin technique
    icon: 📐
    description: Les trois vues et leur disposition, les traits et ce qu'ils disent, les coupes et les sections.
      Savoir lire avant de savoir concevoir.
    prerequisites: []
    lesson: lessons/sc-dessin-technique.md
    items:
    - type: mcq
      level: 1
      prompt: À quoi sert un **dessin de définition** ?
      choices:
      - À décrire complètement **une** pièce, pour qu'un atelier puisse la fabriquer seule
      - À montrer comment les pièces s'assemblent
      - À donner l'aspect du produit fini
      - À lister les composants d'un mécanisme
      answer: 0
      feedback:
      - null
      - C'est le rôle du dessin d'**ensemble**, qui montre les pièces en place les unes par rapport aux autres.
      - C'est une vue de style ou une perspective ; un dessin de définition est normalisé et coté.
      - C'est la **nomenclature**, le tableau qui accompagne le dessin d'ensemble.
      explanation: Un dessin de définition, c'est une pièce et une seule, avec toutes ses formes, ses cotes, ses
        tolérances et son état de surface. L'atelier doit pouvoir la produire sans rien demander à personne.
    - type: mcq
      level: 1
      prompt: Dans la projection **européenne**, où place-t-on la vue de dessus par rapport à la vue de face ?
      choices:
      - En dessous
      - Au-dessus
      - À droite
      - À gauche
      answer: 0
      feedback:
      - null
      - Au-dessus, c'est la disposition **américaine**, qui n'est pas celle utilisée en France.
      - À droite, on place la vue de **gauche** — c'est contre-intuitif, mais c'est la règle européenne.
      - À gauche, on placerait la vue de droite.
      explanation: |-
        En projection européenne, l'objet est « rabattu » derrière le plan : la vue de dessus descend **sous** la vue de face, et la vue de gauche part **à droite**. C'est déroutant au début, et c'est exactement ce que les sujets d'examen testent.

        {{fig:sc-projections}}
    - type: mcq
      level: 1
      prompt: |-
        Sur ce dessin, quelle est la **vue de dessus** ?

        {{fig:sc-projections-muet}}
      choices:
      - Celle du bas, où l'on voit le contour du perçage
      - Celle du haut à gauche, en forme de L
      - Celle du haut à droite, rectangulaire
      - La perspective, en bas à droite
      answer: 0
      feedback:
      - null
      - 'Celle-là montre le profil en L : c''est la vue de **face**, celle d''où part tout le reste.'
      - La vue rectangulaire à droite de la vue de face est la vue de **gauche**, en projection européenne.
      - 'La perspective n''est pas une vue normalisée : elle sert à comprendre, pas à coter.'
      explanation: 'On regarde la pièce du dessus, on rabat cette vue vers le bas : elle montre le contour du
        perçage, qui apparaît comme un cercle. Les traits d''axe repèrent son centre.'
    - type: match
      level: 1
      prompt: Associez chaque type de trait à ce qu'il représente.
      pairs:
      - left: Trait continu fort
        right: Arête ou contour vu
      - left: Trait interrompu court
        right: Arête ou contour caché
      - left: Trait mixte fin
        right: Axe de symétrie ou de révolution
      - left: Trait continu fin
        right: Ligne de cote, hachures
      explanation: 'Le trait porte l''information : son épaisseur et sa forme disent si l''on voit l''arête, si
        elle est derrière la matière, ou si ce n''est pas une arête du tout. Un dessin se lit d''abord par ses
        traits.'
    - type: mcq
      level: 1
      prompt: Que signifie un **trait interrompu** (pointillé court) sur une vue ?
      choices:
      - Une arête cachée par la matière
      - Un axe de révolution
      - Une surface à usiner avec soin
      - Une cote approximative
      answer: 0
      feedback:
      - null
      - L'axe se trace en trait **mixte** fin, qui alterne traits longs et points.
      - L'état de surface se note par un symbole à côté de la cote, jamais par un type de trait.
      - Une cote reste une cote ; sa précision se lit dans sa tolérance.
      explanation: |-
        On voit à travers la pièce : un perçage débouchant, une gorge intérieure, un épaulement derrière. Le trait interrompu dit « c'est là, mais vous ne le verriez pas ».

        {{fig:sc-projections}}
    - type: mcq
      level: 2
      prompt: |-
        Sur ce dessin, pourquoi la vue de gauche porte-t-elle **deux traits interrompus** ?

        {{fig:sc-projections-muet}}
      choices:
      - Ce sont les bords du perçage, invisibles depuis la gauche
      - Ce sont les arêtes de la partie verticale
      - C'est l'axe du perçage
      - Ce sont des lignes de cote
      answer: 0
      feedback:
      - null
      - Les arêtes de la partie verticale sont vues, donc en trait fort.
      - Un axe se trace en trait mixte fin, pas en trait interrompu.
      - Une ligne de cote est un trait continu fin, terminé par des flèches.
      explanation: 'Le perçage est derrière la partie verticale : depuis la gauche, on ne le voit pas, mais il
        est là. On trace ses deux génératrices en trait interrompu, à la hauteur de la semelle.'
    - type: mcq
      level: 2
      prompt: Pourquoi fait-on une **coupe** plutôt que de multiplier les traits interrompus ?
      choices:
      - Parce qu'une pièce creuse devient illisible en traits cachés
      - Parce que la norme interdit les traits interrompus
      - Parce qu'une coupe demande moins de vues
      - Parce qu'une coupe permet de ne pas coter
      answer: 0
      feedback:
      - null
      - Non, ils sont parfaitement normalisés — simplement peu lisibles quand ils s'accumulent.
      - Une coupe **remplace** une vue, elle n'en supprime pas.
      - 'Au contraire : c''est souvent sur la coupe que se placent les cotes intérieures.'
      explanation: Un carter, un moyeu, un corps de vérin sont pleins de formes intérieures. En traits cachés,
        le dessin devient un plat de spaghettis. On coupe la pièce par un plan, on retire la partie avant, et
        tout ce qui était caché devient vu.
    - type: mcq
      level: 2
      prompt: Sur une coupe, que représentent les **hachures** ?
      choices:
      - La matière effectivement traversée par le plan de coupe
      - Les surfaces à usiner
      - Les parties cachées
      - Le volume total de la pièce
      answer: 0
      feedback:
      - null
      - L'usinage se note par un symbole d'état de surface, pas par des hachures.
      - Sur une coupe, ce qui était caché devient **vu** — c'est tout l'intérêt.
      - On ne hachure que ce que le plan traverse, pas ce qui est derrière lui.
      explanation: |-
        On hachure ce que le couteau a coupé, et rien d'autre. Un trou n'est pas de la matière : il n'est **jamais** hachuré. Deux pièces différentes portent des hachures d'inclinaison ou d'écartement différents.

        {{fig:sc-coupe}}
    - type: mcq
      level: 2
      prompt: |-
        Sur cette vue de dessus, que signifient les deux flèches repérées **A** ?

        {{fig:sc-coupe-muet}}
      choices:
      - Le sens dans lequel on regarde la pièce coupée
      - Le sens d'usinage de la pièce
      - Les deux extrémités à coter
      - Le sens de montage
      answer: 0
      feedback:
      - null
      - Un dessin ne décrit pas la gamme d'usinage ; il décrit la pièce finie.
      - Les cotes se portent avec des lignes de cote, pas avec des flèches de coupe.
      - Le sens de montage se lit sur un dessin d'ensemble ou une notice, pas ici.
      explanation: |-
        Le trait mixte fort repère le **plan de coupe**, les deux flèches donnent la **direction d'observation**, et les lettres nomment la coupe. On lit ensuite « coupe A-A » sous la vue obtenue.

        {{fig:sc-coupe}}
    - type: mcq
      level: 2
      prompt: Quelle est la différence entre une **coupe** et une **section** ?
      choices:
      - La section ne montre que la matière coupée ; la coupe montre en plus ce qu'il y a derrière
      - La section se fait sur les pièces cylindriques seulement
      - La coupe n'est pas hachurée, la section si
      - Il n'y en a aucune, ce sont deux mots pour la même chose
      answer: 0
      feedback:
      - null
      - 'Non : les deux s''emploient sur n''importe quelle forme.'
      - Les deux sont hachurées, exactement de la même façon.
      - Elles diffèrent bel et bien, et les sujets d'examen le demandent.
      explanation: 'La **section** est plus économe : elle dessine uniquement la surface coupée, ce qui suffit
        pour montrer la forme d''un arbre, d''une clavette, d''une nervure. La **coupe** ajoute tout ce que l''on
        voit au-delà du plan.'
    - type: grid
      level: 2
      prompt: Sur un dessin technique, cochez la nature de chaque élément.
      rows:
      - id: c
        label: Contour extérieur vu
      - id: p
        label: Perçage caché derrière la matière
      - id: a
        label: Axe d'un alésage
      - id: h
        label: Hachures d'une coupe
      cols:
      - id: F
        label: Trait fort
      - id: f
        label: Trait fin
      answer:
      - Fc
      - fp
      - fa
      - fh
      cellFeedback:
        fc: 'Un contour vu se trace toujours en trait continu **fort** : c''est ce qui structure le dessin.'
        Fp: 'Les arêtes cachées sont en trait interrompu **fin** : elles ne doivent pas dominer le dessin.'
        Fa: Un axe est un trait mixte **fin** — c'est un repère, pas une arête.
        Fh: Des hachures fortes masqueraient les cotes et les formes.
      explanation: 'Un seul trait est fort : le contour vu. Tout le reste — cachés, axes, cotes, hachures — est
        fin. C''est ce contraste qui rend un dessin lisible d''un coup d''œil.'
    - type: order
      level: 2
      prompt: Remettez dans l'ordre la lecture d'un dessin de définition.
      steps:
      - 'Lire le cartouche : nom de la pièce, échelle, matériau, projection'
      - Repérer les vues et leur disposition
      - Identifier les formes principales, vue par vue
      - Faire correspondre les traits cachés d'une vue aux formes des autres
      - Lire les cotes et leurs tolérances
      - Lire les états de surface et les indications particulières
      explanation: 'On commence **toujours** par le cartouche : il donne l''échelle et le mode de projection,
        sans quoi tout le reste peut être mal interprété. La mise en correspondance des vues vient ensuite — c''est
        le cœur de la lecture.'
    - type: mcq
      level: 3
      prompt: Sur une vue, un cercle est tracé en trait fort et porte deux traits mixtes fins perpendiculaires.
        Que peut-on en déduire ?
      choices:
      - 'C''est une forme de révolution vue de face : perçage débouchant ou bossage cylindrique'
      - C'est un chanfrein
      - C'est une surface hachurée
      - C'est une cote de diamètre
      answer: 0
      feedback:
      - null
      - Un chanfrein se voit en biais sur une vue de profil, pas comme un cercle avec ses axes.
      - Des hachures sont des traits parallèles rapprochés, pas deux axes croisés.
      - Une cote de diamètre porte le symbole $\varnothing$ et une ligne de cote.
      explanation: 'Les deux traits mixtes croisés au centre sont la marque d''une forme **de révolution** : leur
        intersection donne l''axe. Reste à regarder une autre vue pour savoir si le cylindre rentre (perçage)
        ou sort (bossage).'
    - type: mcq
      level: 3
      prompt: Deux pièces différentes apparaissent côte à côte sur une même coupe. Comment les distingue-t-on
        ?
      choices:
      - Leurs hachures ont une inclinaison ou un écartement différents
      - L'une est hachurée, l'autre non
      - On les sépare par un trait interrompu
      - On ne les distingue pas, la coupe ne sert pas à cela
      answer: 0
      feedback:
      - null
      - 'Non : toute matière traversée est hachurée, quelle que soit la pièce.'
      - Un trait interrompu désigne une arête cachée, pas une frontière entre pièces.
      - C'est au contraire l'un des grands intérêts d'une coupe d'ensemble.
      explanation: Sur un dessin d'ensemble en coupe, chaque pièce garde la **même** inclinaison de hachures dans
        toutes les vues, et deux pièces voisines en prennent de différentes. C'est ce qui permet de suivre une
        pièce d'un bout à l'autre du mécanisme.
    - type: mcq
      level: 3
      prompt: Une pièce est dessinée à l'échelle $2{:}1$. Une cote porte l'indication $12$. Que mesure la pièce
        réelle ?
      choices:
      - '$12$ mm : une cote donne toujours la dimension réelle'
      - $24$ mm
      - $6$ mm
      - On ne peut pas savoir sans mesurer le dessin
      answer: 0
      feedback:
      - null
      - 'Non : c''est le **dessin** qui mesure $24$ mm sur le papier. La cote, elle, reste celle de la pièce.'
      - $6$ mm serait la lecture si l'échelle était $1{:}2$ — et ce serait de toute façon faux, pour la même raison.
      - 'On ne mesure jamais un dessin : les cotes sont là pour cela.'
      explanation: '**Une cote donne toujours la dimension de la pièce réelle**, quelle que soit l''échelle. L''échelle
        ne concerne que le tracé : à $2{:}1$, on dessine deux fois plus grand pour rendre lisible une petite pièce.
        C''est une erreur classique en devoir.'
    - type: mcq
      level: 1
      prompt: Que trouve-t-on dans le **cartouche** d'un dessin technique ?
      choices:
      - Le nom de la pièce, l'échelle, le matériau et le mode de projection
      - La liste des pièces du mécanisme
      - Les tolérances de toutes les cotes
      - Le nom du client
      answer: 0
      feedback:
      - null
      - C'est la **nomenclature**, un tableau distinct qui accompagne le dessin d'ensemble.
      - Les tolérances se portent à côté de chaque cote ; le cartouche n'en donne au plus qu'une générale.
      - Ce n'est pas une information de définition de la pièce.
      explanation: 'Le cartouche est le premier endroit où regarder : sans l''échelle et le mode de projection,
        on peut lire tout le reste de travers.'
    - type: mcq
      level: 2
      prompt: Sur un dessin d'ensemble, à quoi sert la **nomenclature** ?
      choices:
      - À lister les pièces avec leur repère, leur nombre, leur désignation et leur matière
      - À donner les cotes de chaque pièce
      - À décrire le fonctionnement du mécanisme
      - À indiquer l'ordre de montage
      answer: 0
      feedback:
      - null
      - Les cotes figurent sur les dessins de définition, pas dans la nomenclature.
      - Le fonctionnement se lit sur le dessin et dans un texte de présentation.
      - L'ordre de montage relève d'une gamme d'assemblage, un autre document.
      explanation: Chaque pièce du dessin porte un repère entouré ; la nomenclature dit à quoi ce numéro correspond.
        C'est par là qu'on commence pour comprendre un mécanisme inconnu — exactement ce que demandent les sujets
        d'examen.
    - type: mcq
      level: 3
      prompt: Sur une coupe d'ensemble, certaines pièces ne sont jamais coupées, même quand le plan les traverse.
        Lesquelles ?
      choices:
      - Les vis, arbres, billes, clavettes et goupilles, s'ils sont traversés dans leur longueur
      - Les pièces en plastique
      - Les pièces les plus petites
      - Les pièces mobiles
      answer: 0
      feedback:
      - null
      - La matière n'a rien à voir avec cette convention.
      - 'Ce n''est pas une question de taille : une grande vis n''est pas coupée non plus.'
      - Les pièces mobiles se coupent comme les autres — un piston, par exemple.
      explanation: 'C''est une **convention de représentation** : couper une vis dans sa longueur ne montrerait
        rien d''utile et rendrait le dessin confus. On la dessine donc entière, non hachurée, même au milieu de
        la coupe.'
    - type: guided
      level: 3
      title: Lire l'équerre percée, vue par vue
      intro: |-
        Voici le dessin d'une équerre percée : trois vues en projection européenne, plus une perspective pour aider.

        Les vues ne sont pas nommées : c'est leur **disposition** qui le dit.

        {{fig:sc-projections-muet}}
      steps:
      - kind: mcq
        prompt: '**Étape 1.** En projection européenne, comment sont disposées les vues autour de la vue de face
          ?'
        choices:
        - La vue de dessus en dessous, la vue de gauche à droite
        - La vue de dessus au-dessus, la vue de gauche à gauche
        - La vue de dessus à droite, la vue de gauche en dessous
        - Les vues peuvent être placées librement
        answer:
        - 0
        feedback:
        - null
        - C'est la disposition intuitive — et c'est justement celle de la projection **américaine**, pas de la
          nôtre.
        - 'Non : les vues se placent toujours par rabattement, dans deux directions seulement.'
        - 'Un dessin normalisé ne laisse aucune liberté de placement : c''est ce qui permet de le lire sans légende.'
        explanation: 'On rabat les vues **derrière** le plan : ce qu''on voit du dessus descend, ce qu''on voit
          de la gauche part à droite.'
      - kind: mcq
        prompt: '**Étape 2.** Laquelle des trois vues montre le perçage sous forme de **cercle** ?'
        choices:
        - La vue du bas
        - La vue du haut à gauche
        - La vue du haut à droite
        - Aucune
        answer:
        - 0
        feedback:
        - null
        - 'La vue en L est la vue de face : le perçage y est vu de côté, donc en traits cachés.'
        - 'La vue rectangulaire de droite est la vue de gauche : le perçage y est également caché.'
        - 'Le perçage est vertical : il existe forcément une vue où on le regarde selon son axe.'
        explanation: 'Le perçage est vertical, on le voit donc en vraie grandeur **du dessus** : c''est un cercle,
          avec ses deux traits d''axe.'
      - kind: mcq
        prompt: '**Étape 3.** Sur la vue de face, le perçage apparaît en deux traits interrompus. Pourquoi ?'
        choices:
        - Parce qu'il est à l'intérieur de la matière, donc caché depuis l'avant
        - Parce qu'il n'est pas débouchant
        - Parce qu'il est coté ailleurs
        - Parce que c'est un axe
        answer:
        - 0
        feedback:
        - null
        - 'Débouchant ou non, il serait de toute façon caché vu de face : c''est sa position, pas sa profondeur,
          qui décide.'
        - La cotation n'a aucune influence sur le type de trait.
        - Un axe se trace en trait mixte fin, pas en trait interrompu.
        explanation: 'Vu de face, le perçage est **derrière** la matière de la semelle : ses deux génératrices
          sont donc des arêtes cachées, en trait interrompu fin.'
      - kind: match
        prompt: '**Étape 4.** Associez chaque trait à ce qu''il représente sur ce dessin.'
        pairs:
        - left: Trait continu fort
          right: Contour vu de l'équerre
        - left: Trait interrompu fin
          right: Génératrices du perçage, cachées
        - left: Trait mixte fin
          right: Axes du perçage sur la vue de dessus
        explanation: Trois familles de traits, trois rôles. Un dessin où tout serait de la même épaisseur serait
          illisible.
      - kind: mcq
        prompt: '**Étape 5.** On veut maintenant montrer clairement l''intérieur du perçage, en vraie forme. Que
          fait-on ?'
        choices:
        - Une coupe passant par l'axe du perçage
        - Une quatrième vue
        - Une perspective supplémentaire
        - Une vue de dessous
        answer:
        - 0
        feedback:
        - null
        - Une vue de plus n'ajouterait que des traits cachés supplémentaires.
        - Une perspective aide à comprendre, mais ne se cote pas et n'est pas normalisée.
        - Une vue de dessous montrerait le même cercle que la vue de dessus.
        explanation: |-
          On coupe la pièce par un plan passant par l'axe : ce qui était caché devient vu, et l'on hachure la matière traversée.

          {{fig:sc-coupe}}
      - kind: mcq
        prompt: '**Étape 6.** Sur cette coupe, le perçage doit-il être hachuré ?'
        choices:
        - 'Non : un trou n''est pas de la matière'
        - Oui, comme le reste de la pièce
        - Oui, mais avec des hachures plus serrées
        - Seulement s'il est débouchant
        answer:
        - 0
        feedback:
        - null
        - Hachurer le trou reviendrait à dire que le couteau a coupé de la matière là où il n'y en a pas.
        - Des hachures différentes désignent une **autre pièce**, jamais un vide.
        - Débouchant ou borgne, un trou reste un vide.
        explanation: On hachure exactement ce que le plan de coupe traverse **en matière**. C'est la règle qui
          décide de tout le reste — et la faute la plus fréquente sur une copie.
  - id: sc-procedes
    title: 'Obtenir une pièce : procédés et prototypage'
    icon: 🏭
    description: 'Enlever, ajouter ou déformer la matière : les grandes familles de procédés, ce que chacune sait
      faire, et comment le choix se fait avec la forme, le matériau et la quantité.'
    prerequisites:
    - sc-dessin-technique
    lesson: lessons/sc-procedes.md
    items:
    - type: mcq
      level: 1
      prompt: Les procédés d'obtention des pièces se rangent en trois grandes familles. Lesquelles ?
      choices:
      - Par enlèvement de matière, par déformation, par ajout de matière
      - Par usinage, par perçage, par fraisage
      - Par métal, par plastique, par composite
      - Par prototype, par série, par grande série
      answer: 0
      feedback:
      - null
      - 'Perçage et fraisage sont deux **usinages** : ce sont trois exemples d''une seule famille, pas trois familles.'
      - Ce sont des matériaux, pas des procédés. Un même matériau s'obtient par plusieurs procédés.
      - Ce sont des **quantités**, qui orientent le choix — mais ne classent pas les procédés.
      explanation: Soit on **retire** de la matière d'un brut (usinage), soit on la **déforme** sans en retirer
        (forgeage, emboutissage, pliage), soit on la **dépose** là où il en faut (fonderie, injection, fabrication
        additive).
    - type: match
      level: 1
      prompt: Associez chaque procédé à sa famille.
      pairs:
      - left: Fraisage
        right: Enlèvement de matière
      - left: Emboutissage
        right: Déformation
      - left: Moulage en sable
        right: Ajout de matière
      - left: Impression 3D par dépôt de fil
        right: Ajout de matière
      - left: Pliage de tôle
        right: Déformation
      explanation: 'La question à se poser est simple : est-ce qu''on enlève des copeaux, est-ce qu''on plie sans
        rien enlever, ou est-ce qu''on part de rien et qu''on remplit ?'
    - type: mcq
      level: 1
      prompt: Qu'est-ce que le **tournage** ?
      choices:
      - Un usinage où la pièce tourne et l'outil avance
      - Un usinage où l'outil tourne et la pièce avance
      - Un procédé de déformation à chaud
      - Un moulage par rotation
      answer: 0
      feedback:
      - null
      - 'C''est le **fraisage** : l''outil, la fraise, tourne, et la pièce se déplace sous lui.'
      - Le tournage se fait presque toujours à froid, et rien n'y est déformé — on enlève des copeaux.
