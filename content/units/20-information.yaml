    - type: mcq
      level: 2
      prompt: 'Dans un diagramme d''états-transitions, l''activité écrite après le mot-clé **exit** est exécutée :'
      choices:
      - au moment où la machine sort de l'état
      - au moment où la machine entre dans l'état
      - en permanence tant que la machine reste dans l'état
      - à la fin du programme
      answer: 0
      feedback:
      - null
      - 'Non : c''est le rôle du mot-clé **entry**.'
      - 'Non : c''est le rôle du mot-clé **do**.'
      - 'Non : l''activité est liée à l''état, pas à la fin du programme.'
      explanation: entry = en entrant dans l'état, do = tant qu'on y reste, exit = en en sortant.
      tags:
      - sysml
    - type: mcq
      level: 3
      prompt: Qu'est-ce qui distingue le **diagramme d'activité** du **diagramme d'états-transitions** ?
      choices:
      - Dans le diagramme d'activité, aucun événement n'est associé aux transitions
      - Le diagramme d'activité décrit des états, celui d'états-transitions décrit des actions
      - Le diagramme d'activité n'existe qu'en SysML, l'autre qu'en UML
      - Le diagramme d'activité ne peut pas comporter de branchement conditionnel
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''inverse, le diagramme d''activité décrit des **actions**.'
      - 'Non : les deux diagrammes font partie du langage SysML.'
      - 'Non : un diagramme d''activité comporte des nœuds de décision avec des gardes entre crochets.'
      explanation: Dans un diagramme d'activité, dès qu'une tâche est terminée la suivante commence ; dans un diagramme d'états, c'est un événement qui déclenche la transition.
      tags:
      - sysml
    - type: mcq
      level: 3
      prompt: Une boucle répète l'action « Mesurer la température » tant que la condition « Température ≤ 17 °C ? » est fausse, puis alimente la pompe. Que se passe-t-il quand la température atteint 16 °C ?
      choices:
      - La condition devient vraie, on sort de la boucle et on alimente la pompe
      - La condition devient fausse, on continue de mesurer
      - Le programme s'arrête immédiatement
      - La pompe est alimentée, puis la mesure reprend dans la boucle
      answer: 0
      feedback:
      - null
      - 'Non : 16 °C est bien inférieur ou égal à 17 °C, la condition est donc **vraie**.'
      - 'Non : sortir d''une boucle n''arrête pas le programme ; l''action suivante est exécutée.'
      - 'Non : « Alimenter la pompe » est placé **après** la sortie oui du test, donc hors de la boucle.'
      explanation: Tant que la condition est fausse, on reboucle sur la mesure ; dès qu'elle devient vraie, on quitte la boucle et on exécute l'action suivante.
      tags:
      - algorigramme
    - type: mcq
      level: 3
      prompt: Dans le diagramme d'activité de commande d'une vanne, trois gardes sortent du nœud de décision qui teste deux codeurs de position. Que fait le système si **un seul** des deux codeurs répond ?
      choices:
      - Il transmet l'erreur E1COD puis ne garde que la valeur du codeur actif
      - Il arrête la vanne et met fin au traitement
      - Il fait la moyenne des deux valeurs de position
      - Il transmet l'erreur E2COD puis calcule la position réelle
      answer: 0
      feedback:
      - null
      - 'Non : l''arrêt de la vanne correspond à la garde « aucune réponse des deux codeurs » (erreur E2COD).'
      - 'Non : la moyenne n''est calculée que si les **deux** codeurs répondent.'
      - 'Non : E2COD identifie l''erreur « aucun codeur ne répond », pas celle d''un seul codeur muet.'
      explanation: 'Branche « un des codeurs ne répond pas » : transmission de E1COD à la supervision, puis on ne garde que la valeur du codeur actif avant de calculer la position réelle.'
      tags:
      - sysml
    - type: mcq
      level: 1
      prompt: En langage de type C ou en Python, quel opérateur teste l'**égalité** de deux valeurs ?
      choices:
      - '=='
      - '='
      - '!='
      - '<='
      answer: 0
      feedback:
      - null
      - 'Non : un seul signe = est l''opérateur d''**affectation**, qui range une valeur dans une variable.'
      - 'Non : != teste la **différence** de deux valeurs.'
      - 'Non : <= teste l''infériorité ou l''égalité.'
      explanation: 'Opérateurs de comparaison : ==, !=, <, >, <=, >=. Opérateur d''affectation : =. Écrire = à la place de == est l''erreur la plus fréquente des débutants.'
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: Que donne l'opérateur **modulo**, noté %, appliqué à deux nombres entiers ?
      choices:
      - Le reste de la division entière
      - Le quotient de la division
      - Un pourcentage
      - La partie décimale du résultat
      answer: 0
      feedback:
      - null
      - 'Non : le quotient s''obtient avec l''opérateur de division.'
      - 'Non : le symbole % désigne ici une opération arithmétique, pas une proportion.'
      - 'Non : le modulo travaille sur des entiers et renvoie un entier.'
      explanation: '13 % 2 = 1 : c''est le reste de 13 ÷ 2. C''est exactement l''opération utilisée dans les divisions successives qui convertissent un nombre décimal en binaire.'
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: À quoi sert une **fonction** dans un programme ?
      choices:
      - À regrouper des instructions sous un nom, pour les appeler à la demande
      - À déclarer les variables globales du programme
      - À répéter automatiquement un traitement un nombre fixé de fois
      - À convertir un algorigramme en programme
      answer: 0
      feedback:
      - null
      - 'Non : les variables globales se déclarent en dehors de toute fonction.'
      - 'Non : répéter un traitement, c''est le rôle d''une **boucle**.'
      - 'Non : la traduction de l''algorigramme en programme est le travail du programmeur.'
      explanation: 'Une fonction, c''est un « programme dans le programme ». Son usage comporte deux phases : la **définition** (nom, paramètres, corps, valeur de retour) puis l''**appel**, avec des arguments.'
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: Quelle est la différence entre un **paramètre** et un **argument** de fonction ?
      choices:
      - Le paramètre figure dans la définition, l'argument est la valeur fournie lors de l'appel
      - Le paramètre est la valeur fournie lors de l'appel, l'argument figure dans la définition
      - Le paramètre est local, l'argument est global
      - Il n'y a aucune différence, ce sont deux mots pour la même chose
      answer: 0
      feedback:
      - null
      - 'Non : les deux mots sont inversés.'
      - 'Non : local et global décrivent la **portée** d''une variable, pas ce couple de notions.'
      - 'Non : la distinction est précise : le paramètre est une variable, l''argument une valeur.'
      explanation: 'Dans def nbrCaractere(ch), ch est le **paramètre** ; dans l''appel nbrCaractere(''Ornithorynque''), la chaîne de caractères est l''**argument**.'
      tags:
      - algorithme
    - type: order
      level: 2
      prompt: Remettez dans l'ordre les lignes de la fonction Python qui compte le nombre de caractères d'un mot.
      steps:
      - def nbrCaractere(ch) — en-tête, avec le nom de la fonction et son paramètre
      - i = 0 — initialisation du compteur
      - for j in ch — parcours des caractères du mot
      - i += 1 — incrémentation du compteur à chaque caractère
      - return(i) — valeur retournée par la fonction
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: 'On déclare monTableau = [''bleu'', ''rouge'', ''vert'']. Que vaut l''élément d''indice 1 ?'
      choices:
      - '''rouge'''
      - '''bleu'''
      - '''vert'''
      - Rien, le tableau ne comporte pas d'indice 1
      answer: 0
      feedback:
