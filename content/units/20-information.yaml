      level: 3
      title: 'Les projecteurs de scène : la trame DMX 512'
      prompt: 'Exercice complet : vitesse de transmission, durée d''une trame et valeurs des canaux.'
      intro: 'Dans un théâtre, les projecteurs sont pilotés à distance par le protocole **DMX 512**. Un pupitre unique commande jusqu''à **32 récepteurs** et gère **512 canaux**, chacun recevant une valeur comprise **entre 0 et 255**.


        La liaison est **symétrique** : trois fils (masse, DATA+ et DATA−), le récepteur reconstituant l''information par la différence U(DATA+) − U(DATA−). Chaque canal est transmis avec **1 bit de start, 8 bits de donnée (poids faible en tête) et 2 bits de stop**.


        Le technicien relève à l''oscilloscope une durée de **4 µs** pour un bit, et lit la valeur **128** sur le canal affecté au bleu.

        {{emoji:🎭}}'
      steps:
      - kind: input
        prompt: '**Étape 1.** Calculer la vitesse de transmission de la trame relevée, en bit/s.'
        answer: '250000'
        numeric: true
        tolerance: 1000
        unit: bit/s
        explanation: 'v = 1 ÷ 4 µs = 1 ÷ (4 × 10⁻⁶) = 250 000 bit/s.'
      - kind: mcq
        prompt: '**Étape 2.** Le protocole DMX 512 fixe la vitesse à 250 000 bit/s. Que conclure du relevé ?'
        choices:
        - La vitesse mesurée est conforme au protocole
        - La vitesse mesurée est deux fois trop faible
        - La vitesse mesurée est deux fois trop élevée
        - On ne peut pas conclure sans connaître le nombre de canaux
        answer:
        - 0
        feedback:
        - null
        - 'Non : le calcul donne exactement 250 000 bit/s, ni plus ni moins.'
        - 'Non : la valeur mesurée coïncide avec la valeur imposée.'
        - 'Non : la vitesse se déduit de la seule durée d''un bit ; le nombre de canaux n''intervient pas.'
        explanation: '250 000 bit/s mesurés pour 250 000 bit/s exigés : la liaison est conforme, le défaut éventuel du projecteur est donc à chercher ailleurs.'
      - kind: input
        prompt: '**Étape 3.** Combien de bits chaque canal occupe-t-il sur la liaison ?'
        answer: '11'
        numeric: true
        tolerance: 0
        unit: bits
        explanation: '1 bit de start + 8 bits de donnée + 2 bits de stop = 11 bits par canal, dont 8 seulement sont utiles.'
      - kind: input
        prompt: '**Étape 4.** En déduire la durée d''une trame complète de 512 canaux, en millisecondes (arrondir au dixième).'
        answer: '22.5'
        numeric: true
        tolerance: 0.2
        unit: ms
        explanation: '512 × 11 = 5 632 bits ; t = 5 632 ÷ 250 000 = 0,022 528 s ≈ 22,5 ms. Les 512 canaux sont donc rafraîchis environ 44 fois par seconde, ce que l''œil perçoit comme continu.'
      - kind: mcq
        prompt: '**Étape 5.** Une perturbation de 1 V se superpose au même instant sur DATA+ et sur DATA−. Que devient-elle après la différence effectuée par le récepteur ?'
        choices:
        - Elle disparaît complètement
        - Elle est doublée
        - Elle inverse le signal utile
        - Elle ne change rien tant qu'elle reste inférieure à 5 V
        answer:
        - 0
        feedback:
        - null
        - 'Non : la soustraction de deux perturbations identiques ne peut pas les additionner.'
        - 'Non : le signe du signal utile est fixé par les niveaux logiques, pas par le parasite.'
        - 'Non : la perturbation est éliminée, quelle que soit son amplitude, tant qu''elle affecte les deux fils de la même façon.'
        explanation: '(U₊ + 1) − (U₋ + 1) = U₊ − U₋. C''est tout l''intérêt de la liaison symétrique dans un environnement bruité (gradateurs, moteurs de machinerie).'
      - kind: input
        prompt: '**Étape 6.** Le canal du bleu porte la valeur 128. Quelle intensité, en pourcentage, cela représente-t-il (maximum 255, arrondir à l''unité) ?'
        answer: '50'
        numeric: true
        tolerance: 1
        unit: '%'
        explanation: '128 ÷ 255 = 0,502, soit 50 % : la valeur relevée est bien conforme au bleu à 50 % demandé.'
      - kind: mcq
        prompt: '**Étape 7.** Quelle valeur le pupitre doit-il envoyer sur le canal du rouge pour obtenir un rouge à 20 % ?'
        choices:
        - '51'
        - '20'
        - '128'
        - '204'
        answer:
        - 0
        feedback:
        - null
        - 'Non : 20 est le pourcentage demandé ; la valeur du canal se compte de 0 à 255.'
        - 'Non : 128 correspond à environ 50 %.'
        - 'Non : 204 correspond à 80 % ; tu as pris le complément.'
        explanation: '0,20 × 255 = 51. Chaque canal est une fraction de 255 : 0 pour éteint, 255 pour l''intensité maximale.'
      tags:
      - dmx
      - transmission
