        prompt: '**Étape 6.** En marche avant, le signal de la tête 2 est en retard d''un quart de période. Quel est l''état de la tête 2 au moment d''un **front descendant** de la tête 1 ?'
        choices:
        - Tête 2 = 1, car elle n'est pas encore redescendue
        - Tête 2 = 0, car elle est déjà redescendue
        - Tête 2 est indéterminée, elle change au même instant
        - Cela dépend de la vitesse de rotation
        answer:
        - 0
        feedback:
        - null
        - 'Non : la tête 2 étant **en retard**, son front descendant arrive un quart de période **après** celui de la tête 1.'
        - 'Non : le décalage d''un quart de période garantit justement que les deux fronts ne coïncident jamais.'
        - 'Non : le décalage vaut toujours un quart de période, quelle que soit la vitesse ; c''est ce qui rend la méthode fiable.'
        explanation: 'Le retard d''un quart de période place le front descendant de la tête 2 après celui de la tête 1 : la tête 2 est donc encore à 1. En marche arrière, elle serait déjà à 0.'
      - kind: mcq
        prompt: '**Étape 7.** Dans l''algorithme de détection, une boucle « Répéter … jusqu''à » doit repérer un front descendant de la tête 1. Quelle condition d''arrêt faut-il écrire ?'
        choices:
        - Tête1_précédent = 1 et Tête1_actuel = 0
        - Tête1_précédent = 0 et Tête1_actuel = 1
        - Tête1_précédent = 1 et Tête1_actuel = 1
        - Tête1_précédent = 0 et Tête1_actuel = 0
        answer:
        - 0
        feedback:
        - null
        - 'Non : c''est la définition d''un front **montant**, du niveau bas vers le niveau haut.'
        - 'Non : deux états hauts successifs signifient que rien n''a changé.'
        - 'Non : deux états bas successifs : le signal est stable à 0, il n''y a pas de front.'
        explanation: 'Un front descendant est le passage de l''état haut à l''état bas : l''échantillon précédent vaut 1 et l''échantillon actuel vaut 0. On lit alors la tête 2 pour conclure sur le sens de marche.'
      tags:
      - signaux
      - capteurs
