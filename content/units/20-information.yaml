      title: 'Le robot tondeuse : transmettre le taux de charge de la batterie'
      prompt: 'Exercice complet : code ASCII, parité impaire, composition et durée d''une trame série.'
      intro: 'Un robot tondeuse connecté affiche l''état de sa batterie sur un petit écran. Le microcontrôleur communique avec l''interface utilisateur par une **liaison série UART** dont la configuration est la suivante : **8 bits de donnée**, **1 bit de parité impaire**, **1 bit de stop**, à **19 200 bit/s**.


        Pour un taux de charge de **25 %**, la carte n''envoie pas le nombre 25 : elle envoie les **codes ASCII** des caractères « 2 » puis « 5 ». Dans la table ASCII, les dix chiffres occupent la colonne de poids fort 3.

        {{emoji:🤖}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Quel est le code ASCII, en hexadécimal, du caractère « 2 » ?'
        choices:
        - (32)₁₆
        - (02)₁₆
        - (23)₁₆
        - (20)₁₆
        answer:
        - 0
        feedback:
        - null
        - 'Non : le poids fort des chiffres vaut 3 ; (02)₁₆ est un caractère de commande.'
        - 'Non : les deux symboles sont inversés ; on lit d''abord la colonne (3), puis la ligne (2).'
        - 'Non : (20)₁₆ est le code de l''espace.'
        explanation: 'Colonne 3, ligne 2 : « 2 » = (32)₁₆ = 50₍₁₀₎. De la même façon, « 0 » = (30)₁₆ et « 9 » = (39)₁₆.'
      - kind: input
        prompt: '**Étape 2.** Écrire ce code (32)₁₆ en binaire, sur un octet (avec ou sans espace).'
        answer: '00110010'
        accept:
        - 0011 0010
        - '110010'
        numeric: false
        explanation: 'Par blocs de 4 bits : 3 = 0011 et 2 = 0010, d''où 0011 0010. Vérification : 32 + 16 + 2 = 50.'
      - kind: input
        prompt: '**Étape 3.** Le caractère « 5 » a pour code (35)₁₆. Quelle est sa valeur en décimal ?'
        answer: '53'
        numeric: true
        tolerance: 0
        explanation: '3 × 16 + 5 = 48 + 5 = 53. En binaire : (0011 0101)₂, que l''on retrouve en additionnant 32 + 16 + 4 + 1.'
      - kind: mcq
        prompt: '**Étape 4.** La donnée 0011 0101 est transmise avec une parité **impaire**. Que vaut le bit de parité ?'
        choices:
        - '1'
        - '0'
        - '5'
        - Il n'y en a pas, la parité ne concerne que les caractères de commande
        answer:
        - 0
        feedback:
        - null
        - 'Non : la donnée contient déjà quatre « 1 » ; avec un bit à 0, le total resterait pair.'
        - 'Non : un bit ne peut valoir que 0 ou 1.'
        - 'Non : la parité s''applique à tous les caractères transmis.'
        explanation: '0011 0101 comporte quatre « 1 ». La parité impaire exige un nombre impair de « 1 » dans l''ensemble donnée + parité : le bit de parité vaut donc 1, ce qui porte le total à cinq.'
      - kind: input
        prompt: '**Étape 5.** Combien de bits la trame complète d''un caractère comporte-t-elle (start, donnée, parité, stop) ?'
        answer: '11'
        numeric: true
        tolerance: 0
        unit: bits
        explanation: '1 bit de start + 8 bits de donnée + 1 bit de parité + 1 bit de stop = 11 bits.'
      - kind: input
        prompt: '**Étape 6.** Calculer la durée de cette trame à 19 200 bit/s, en microsecondes (arrondir à l''unité).'
        answer: '573'
        numeric: true
        tolerance: 5
        unit: µs
        explanation: 't = 11 ÷ 19 200 = 5,73 × 10⁻⁴ s ≈ 573 µs.'
      - kind: input
        prompt: '**Étape 7.** En déduire la durée totale d''envoi de la donnée « 25 », en millisecondes (deux décimales).'
        answer: '1.15'
        numeric: true
        tolerance: 0.03
        unit: ms
        explanation: 'Deux caractères, donc deux trames : 2 × 573 = 1 146 µs ≈ 1,15 ms. L''affichage se met à jour bien plus vite que l''œil ne peut le percevoir.'
      tags:
      - transmission
      - ascii
