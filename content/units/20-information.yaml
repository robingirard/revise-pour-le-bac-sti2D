    - type: guided
      level: 3
      title: 'La mini-voiture à suivi de bande : de la table de vérité aux équations'
      prompt: 'Exercice complet : table de vérité de deux capteurs, équations logiques et traduction en langage C.'
      intro: 'Une mini-voiture électrique pour enfants circule dans une galerie marchande. Elle ne doit avancer que sur une **bande de couleur** peinte au sol. Deux **capteurs infrarouges**, Capt_G (gauche) et Capt_D (droit), sont placés sous le pare-chocs avant : chacun délivre 1 lorsqu''il voit la bande et 0 sinon.


        Le cahier des charges est le suivant : si la voiture sort **partiellement** de la route, une alarme sonore est émise (Alarme = 1) ; si elle en sort **totalement**, l''alarme est émise **et** la voiture est arrêtée (Arrêt = 1).

        {{emoji:🚗}}'
      steps:
      - kind: input
        prompt: '**Étape 1.** Combien de lignes comporte la table de vérité de ce système ?'
        answer: '4'
        numeric: true
        tolerance: 0
        unit: lignes
        explanation: 'Deux variables d''entrée, donc 2² = 4 combinaisons : (1, 1), (1, 0), (0, 1) et (0, 0).'
      - kind: grid
        prompt: '**Étape 2.** Cochez, pour chaque combinaison des deux capteurs, les sorties qui valent 1.'
        rows:
        - id: '11'
          label: Capt_G = 1, Capt_D = 1 (voiture sur la bande)
        - id: '10'
          label: Capt_G = 1, Capt_D = 0 (sortie partielle)
        - id: '01'
          label: Capt_G = 0, Capt_D = 1 (sortie partielle)
        - id: '00'
          label: Capt_G = 0, Capt_D = 0 (sortie totale)
        cols:
        - id: A
          label: Arrêt = 1
        - id: L
          label: Alarme = 1
        answer:
        - A00
        - L10
        - L01
        - L00
        labels:
          A11: Arrêt (1, 1)
          A10: Arrêt (1, 0)
          A01: Arrêt (0, 1)
          A00: Arrêt (0, 0)
          L11: Alarme (1, 1)
          L10: Alarme (1, 0)
          L01: Alarme (0, 1)
          L00: Alarme (0, 0)
        cellFeedback:
          A11: la voiture est sur la bande, rien ne se déclenche
          A10: 'sortie partielle : l''alarme sonne, mais la voiture continue'
          A01: 'sortie partielle : l''alarme sonne, mais la voiture continue'
          L11: les deux capteurs voient la bande, l'alarme reste muette
        explanation: 'Une seule ligne provoque l''arrêt, celle où aucun capteur ne voit la bande. L''alarme, elle, sonne dans les trois lignes où au moins un capteur ne voit plus la bande.'
      - kind: mcq
        prompt: '**Étape 3.** Écrire l''équation logique de l''arrêt de la voiture.'
        choices:
        - Arrêt = Capt_G barre · Capt_D barre
        - Arrêt = Capt_G · Capt_D
        - Arrêt = Capt_G + Capt_D
        - Arrêt = Capt_G barre + Capt_D barre
        answer:
        - 0
        feedback:
        - null
        - 'Non : cette expression vaut 1 quand les deux capteurs voient la bande, c''est-à-dire quand tout va bien.'
        - 'Non : ce OU vaut 1 dès qu''un capteur voit la bande : la voiture s''arrêterait presque tout le temps.'
        - 'Non : c''est l''équation de l''**alarme**, qui sonne dès qu''un capteur perd la bande.'
        explanation: 'L''arrêt correspond à la seule ligne (0, 0) : les deux capteurs doivent être à 0 en même temps, d''où le produit des deux compléments.'
      - kind: mcq
        prompt: '**Étape 4.** Écrire l''équation logique du déclenchement de l''alarme.'
        choices:
        - Alarme = Capt_G barre + Capt_D barre
        - Alarme = Capt_G · Capt_D
        - Alarme = Capt_G barre · Capt_D barre
        - Alarme = Capt_G + Capt_D
        answer:
        - 0
        feedback:
        - null
        - 'Non : cette expression est vraie quand tout va bien ; l''alarme sonnerait au mauvais moment.'
        - 'Non : c''est l''équation de l''arrêt ; l''alarme doit aussi sonner en cas de sortie partielle.'
        - 'Non : ce OU vaut 0 pour (0, 0), alors que l''alarme doit sonner en sortie totale.'
        explanation: 'L''alarme est muette dans le seul cas (1, 1) : il suffit qu''un capteur soit à 0 pour qu''elle sonne, d''où la somme des deux compléments (le complément du ET).'
      - kind: mcq
        prompt: '**Étape 5.** Les capteurs relèvent Capt_G = 1 et Capt_D = 0. Quelles sont les commandes envoyées ?'
        choices:
        - Arrêt = 0 et Alarme = 1
        - Arrêt = 1 et Alarme = 1
        - Arrêt = 0 et Alarme = 0
        - Arrêt = 1 et Alarme = 0
        answer:
        - 0
        feedback:
        - null
        - 'Non : la voiture n''est arrêtée que lorsqu''elle sort **totalement**, donc si les deux capteurs sont à 0.'
        - 'Non : un capteur ne voit plus la bande, la voiture sort partiellement : l''alarme doit sonner.'
        - 'Non : cette combinaison n''existe pas dans le cahier des charges ; l''arrêt s''accompagne toujours de l''alarme.'
        explanation: 'Un seul capteur sur la bande, c''est une sortie partielle : alarme sonore, mais la voiture continue d''avancer.'
      - kind: mcq
        prompt: '**Étape 6.** Comment traduit-on l''équation de l''arrêt en langage de type C ?'
        choices:
        - Arret = !CaptG && !CaptD;
        - Arret = CaptG && CaptD;
        - Arret = !CaptG || !CaptD;
        - Arret = CaptG & CaptD;
        answer:
        - 0
        feedback:
        - null
        - 'Non : il manque les deux compléments ; cette ligne teste que les deux capteurs voient la bande.'
        - 'Non : || est le OU booléen ; il faut ici un ET.'
        - 'Non : & est un ET **bit à bit**, utilisé pour les masques ; le ET booléen s''écrit &&.'
        explanation: 'Correspondances : ET = &&, OU = ||, NON = !. L''équation Arrêt = Capt_G barre · Capt_D barre devient donc !CaptG && !CaptD.'
      tags:
      - logique
  - id: info-algo
    title: Algorithmes et diagrammes
    icon: 🧭
    description: Algorithme, variables, structures SI, TANT QUE et POUR, algorigramme et diagrammes SysML (activité, états-transitions, séquence).
    prerequisites:
    - info-logique
    lesson: lessons/info-algo.md
    items:
    - type: mcq
      level: 1
      prompt: Qu'est-ce qu'un **algorithme** ?
      choices:
      - Une suite finie d'instructions élémentaires exécutées dans un ordre déterminé
      - Un programme écrit dans un langage de programmation
      - Un schéma électronique
      - Un diagramme SysML
      answer: 0
      feedback:
      - null
      - 'Non : le **programme** est la traduction de l''algorithme dans un langage compris par la machine.'
      - 'Non : un algorithme décrit un traitement, pas un montage.'
      - 'Non : le diagramme est une représentation possible, pas la définition de l''algorithme.'
      explanation: 'L''algorithme décrit la méthode de résolution, indépendamment du langage : on l''écrit en pseudo-code ou sous forme d''algorigramme.'
      tags:
      - algorithme
    - type: order
      level: 1
      prompt: Remettez dans l'ordre les trois étapes qui mènent d'un problème à son programme.
      steps:
      - 'Analyse : définir le problème'
      - 'Algorithme : définir la méthode amenant à la solution'
      - 'Programme : transcrire dans le langage de programmation'
      tags:
      - algorithme
    - type: mcq
      level: 1
      prompt: Dans un algorigramme, quelle forme normalisée représente un **test** (une condition) ?
      choices:
      - Le losange
      - Le parallélogramme
      - Le rectangle
      - Le rectangle à bouts arrondis
      answer: 0
      feedback:
      - null
      - 'Non : le parallélogramme représente une entrée ou une sortie de données.'
      - 'Non : le rectangle simple représente un traitement.'
      - 'Non : le rectangle à bouts arrondis marque le début ou la fin.'
      explanation: Le losange pose une question à laquelle on répond par oui ou par non ; il a donc deux sorties.
      tags:
      - algorigramme
    - type: match
      level: 2
      prompt: Associez chaque symbole normalisé d'algorigramme à son rôle.
      pairs:
      - left: Rectangle à bouts arrondis
        right: Début ou fin
      - left: Rectangle
        right: Traitement
      - left: Rectangle à double barre verticale
        right: Sous-programme
      - left: Parallélogramme
        right: Entrée ou sortie de données
      - left: Losange
        right: Test ou condition
      tags:
      - algorigramme
    - type: mcq
      level: 1
      prompt: Quelle est la différence entre une **constante** et une **variable** ?
      choices:
      - La constante ne change pas au cours du programme, la variable peut changer
      - La constante est un nombre, la variable est du texte
      - La constante est locale, la variable est globale
      - La constante occupe plus de place en mémoire
      answer: 0
      feedback:
      - null
      - 'Non : le type de la donnée n''a rien à voir avec son caractère constant ou variable.'
      - 'Non : local et global décrivent la **portée**, pas la distinction constante/variable.'
      - 'Non : la place occupée dépend du **type** de la donnée.'
      explanation: 'On déclare une constante par nom = valeur (Pi = 3,1416) et une variable par nom : type. La variable est une boîte dont on peut changer le contenu.'
      tags:
      - algorithme
    - type: mcq
      level: 1
      prompt: Quel type déclare-t-on pour une variable qui ne peut valoir que 0 ou 1 ?
      choices:
      - Le type booléen
      - Le type entier
      - Le type décimal
      - Le type chaîne de caractères
      answer: 0
      feedback:
      - null
      - 'Non : un entier peut prendre bien d''autres valeurs ; on gaspillerait de la mémoire.'
      - 'Non : un décimal sert aux nombres à virgule.'
      - 'Non : une chaîne sert à représenter du texte.'
      explanation: Un booléen est une variable logique codée sur 1 bit, parfois notée *True* / *False* ou *High* / *Low*.
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: 'Une variable déclarée **à l''intérieur** d''une fonction est :'
      choices:
      - une variable locale, utilisable seulement dans cette fonction
      - une variable globale, utilisable partout dans le programme
      - une constante
      - un paramètre de la fonction
      answer: 0
      feedback:
      - null
      - 'Non : les variables globales sont définies en dehors de toute fonction.'
      - 'Non : une constante ne change pas de valeur ; ici rien ne l''interdit.'
      - 'Non : les paramètres figurent dans l''en-tête de la fonction, entre parenthèses.'
      explanation: 'La portée d''une variable désigne les espaces du programme où elle est accessible : locale (dans sa fonction) ou globale (partout).'
      tags:
      - algorithme
    - type: order
      level: 2
      prompt: Remettez dans l'ordre le pseudo-code qui fait clignoter une DEL branchée sur la broche 2.
      steps:
      - Début
      - Allumer la DEL branchée sur la broche 2
      - Attendre 1 seconde
      - Éteindre la DEL
      - Attendre 1 seconde
      - Recommencer
      - Fin
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: À quoi reconnaît-on une **structure alternative** (conditionnelle) ?
      choices:
      - Une condition est testée et offre deux issues qui s'excluent mutuellement
      - Un traitement est répété tant qu'une condition est vraie
      - Les traitements s'enchaînent sans test
      - Un compteur est décrémenté jusqu'à zéro
      answer: 0
      feedback:
      - null
      - 'Non : c''est la structure **répétitive** (TANT QUE).'
      - 'Non : c''est la structure **linéaire**.'
      - 'Non : c''est la boucle avec comptage (POUR).'
      explanation: 'SI condition ALORS traitement 1 SINON traitement 2 FIN SI : sur l''algorigramme, le losange a une sortie oui et une sortie non.'
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: 'Quelle structure correspond au pseudo-code : TANT QUE condition vraie FAIRE traitement FIN TANT QUE ?'
      choices:
      - La structure répétitive (itérative)
      - La structure linéaire
      - La structure alternative
      - La boucle avec comptage
      answer: 0
      feedback:
      - null
      - 'Non : la structure linéaire enchaîne des traitements sans aucun test.'
      - 'Non : la structure alternative utilise SI… ALORS… SINON et offre deux issues exclusives.'
      - 'Non : la boucle avec comptage s''écrit POUR… REPETER… DECREMENTER… FIN POUR.'
      explanation: On teste d'abord la condition ; si elle est vraie, le traitement est exécuté, puis on reboucle sur le test.
      tags:
      - algorithme
    - type: order
      level: 2
      prompt: Remettez dans l'ordre les blocs de l'algorigramme d'une boucle avec comptage (structure POUR).
      steps:
      - 'Initialiser la variable : N = x'
      - 'Tester la condition : N = 0 ?'
      - 'Si non : exécuter le traitement'
      - 'Décrémenter la variable : N = N − 1'
      - Reboucler sur le test
      - 'Si oui : sortir de la boucle'
      tags:
      - algorigramme
    - type: input
      level: 3
      prompt: Dans une boucle avec comptage initialisée par N = 5 et décrémentée d'une unité à chaque passage, combien de fois le traitement est-il exécuté ?
      answer: '5'
      numeric: true
      tolerance: 0
      unit: fois
      explanation: Le traitement est exécuté pour N = 5, 4, 3, 2 et 1 ; la boucle s'arrête dès que N = 0, sans exécuter le traitement une sixième fois.
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: Dans un **diagramme de séquence** (sd), comment appelle-t-on le trait vertical pointillé surmonté d'un rectangle de description ?
      choices:
      - Une ligne de vie
      - Un message réflexif
      - Une transition
      - Un état initial
      answer: 0
      feedback:
      - null
      - 'Non : le message réflexif est une flèche qui part d''une ligne de vie et y revient.'
      - 'Non : la transition appartient aux diagrammes d''activité et d''états.'
      - 'Non : l''état initial est le disque noir des diagrammes d''activité et d''états.'
      explanation: 'Le diagramme de séquence se lit de haut en bas : chaque bloc ou acteur possède une ligne de vie, et les flèches sont les messages échangés.'
      tags:
      - sysml
    - type: match
      level: 2
      prompt: Associez chaque opérateur du diagramme de séquence à sa fonction.
