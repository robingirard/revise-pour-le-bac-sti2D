units:
- id: information
  matiere: ingenierie
  title: Chaîne d'information et numérique
  description: De la grandeur physique au nombre binaire — capteurs, signaux, conversion analogique-numérique, numération, logique et algorithmes.
  skills:
  - id: info-chaine
    title: La chaîne d'information
    icon: 📡
    description: Acquérir, traiter, communiquer ; nature des signaux (logique, analogique, numérique) et types de capteurs.
    prerequisites: []
    lesson: lessons/info-chaine.md
    items:
    - type: mcq
      level: 1
      prompt: 'Quels sont les trois blocs de la **chaîne d''information** ?

        {{emoji:📡}}'
      choices:
      - ACQUÉRIR — TRAITER — COMMUNIQUER
      - ALIMENTER — DISTRIBUER — CONVERTIR
      - CAPTER — CALCULER — AGIR
      - ENTRÉE — PROCESSEUR — SORTIE
      answer: 0
      feedback:
      - null
      - 'Non : ce sont les blocs de la chaîne de **puissance**, pas de la chaîne d''information.'
      - 'Non : ce vocabulaire n''est pas celui du cours, qui impose les verbes ACQUÉRIR, TRAITER, COMMUNIQUER.'
      - 'Non : c''est le vocabulaire général de l''informatique, pas la décomposition fonctionnelle du cours.'
      explanation: 'La chaîne d''information reçoit des grandeurs physiques et des consignes, et délivre des informations (ordres, messages) : ACQUÉRIR (capteurs, clavier), TRAITER (carte Arduino, automate), COMMUNIQUER (voyants, écran, relais, réseau).'
      tags:
      - chaine-information
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **logique** si :'
      choices:
      - la grandeur de l'information ne peut prendre que deux valeurs
      - la grandeur de l'information varie de façon continue dans le temps
      - il est constitué d'une suite de 0 et de 1 représentant des nombres
      - il est périodique
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition d''un signal **analogique**.'
      - 'Non : c''est la définition d''un signal **numérique**, une suite d''informations logiques qui code un nombre.'
      - 'Non : la périodicité ne dit rien sur la nature du signal ; un signal logique peut être périodique ou non.'
      explanation: 'Deux valeurs seulement : tout ou rien (TOR), 0 ou 1, Low ou High, 0 V ou 5 V.'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **analogique** si :'
      choices:
      - il évolue de façon continue dans le temps
      - il ne peut prendre que deux valeurs
      - il prend un nombre fini de valeurs codées en 0 et en 1
      - il est toujours sinusoïdal
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition d''un signal logique (ou binaire).'
      - 'Non : c''est la définition d''un signal numérique.'
      - 'Non : un signal analogique peut être périodique ou non, sinusoïdal ou non.'
      explanation: 'Exemple : la tension aux bornes d''une photorésistance varie continûment avec la luminosité.'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **numérique** si :'
      choices:
      - il prend un nombre fini de valeurs, codées par une suite de 0 et de 1
      - il varie de façon continue dans le temps
      - il ne prend que deux valeurs
      - il est délivré par un capteur analogique
      answer: 0
      feedback:
      - null
      - 'Non : c''est le signal analogique qui varie continûment ; un signal numérique avance par paliers.'
      - 'Non : deux valeurs seulement, c''est un signal **logique** ; un signal numérique est une **suite** de valeurs logiques.'
      - 'Non : un capteur analogique délivre une tension continue ; il faut un CAN pour obtenir un signal numérique.'
      explanation: 'Un signal numérique se compose d''une suite d''informations logiques (0 et 1) qui représentent des nombres : sur 2 bits, 4 valeurs (00, 01, 10, 11).'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Que délivre un capteur **tout ou rien** (TOR) ?
      choices:
      - une information binaire, 0 ou 1
      - une tension proportionnelle à la grandeur mesurée
      - un mot de 8 bits
      - une fréquence
      answer: 0
      feedback:
      - null
      - 'Non : c''est un capteur proportionnel **analogique**.'
      - 'Non : c''est un capteur proportionnel **numérique** (codeur absolu, par exemple).'
      - 'Non : le capteur TOR compare la grandeur d''entrée à un seuil ; il ne mesure rien.'
      explanation: 'Sous le seuil, la sortie vaut 0 ; au-dessus, elle vaut 1. Exemples : détecteur de présence, interrupteur de fin de course.'
      tags:
      - capteurs
    - type: match
      level: 1
      prompt: Associez chaque composant au bloc de la chaîne d'information auquel il appartient.
      pairs:
      - left: Photorésistance
        right: ACQUÉRIR
      - left: Carte Arduino
        right: TRAITER
      - left: Écran d'affichage
        right: COMMUNIQUER
      tags:
      - chaine-information
    - type: match
      level: 2
      prompt: Associez chaque caractéristique d'un capteur à sa définition.
      pairs:
      - left: Étendue de mesure
        right: valeurs extrêmes pouvant être mesurées
      - left: Résolution
        right: plus petite variation mesurable
      - left: Sensibilité
        right: variation de la sortie rapportée à la variation de l'entrée
      - left: Précision
        right: aptitude à donner une mesure proche de la valeur vraie
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Une **photorésistance** est insérée dans un pont diviseur alimenté en 5 V, la tension étant lue sur une broche analogique de la carte. Quelle est la nature du signal envoyé à la carte ?
      choices:
      - Analogique
      - Logique
      - Numérique
      - Aucune, la photorésistance n'est pas un capteur
      answer: 0
      feedback:
      - null
      - 'Non : la tension ne prend pas seulement deux valeurs, elle varie continûment avec la luminosité.'
      - 'Non : le signal ne devient numérique qu''**après** le convertisseur analogique-numérique de la carte.'
      - 'Non : c''est un capteur **passif** (il doit être alimenté), mais c''est bien un capteur.'
      explanation: 'La luminosité fait varier la résistance, donc la tension du pont diviseur : signal analogique, converti ensuite par le CAN de la carte.'
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: 'Un **codeur absolu** délivre, pour chaque position angulaire de son axe, un mot de données lu sur un disque optique. Ce capteur est :'
      choices:
      - un capteur proportionnel numérique
      - un capteur tout ou rien
      - un capteur proportionnel analogique
      - un actionneur
      answer: 0
      feedback:
      - null
      - 'Non : un capteur TOR ne donne qu''un seul bit ; ici chaque position a un **mot** de plusieurs bits.'
      - 'Non : la sortie n''est pas une tension continue mais une suite de 0 et de 1.'
      - 'Non : un actionneur agit sur le système ; un codeur mesure.'
      explanation: 'Le mot binaire lu sur le disque est proportionnel à la position : c''est un capteur proportionnel numérique. Exemple : N = (10100001)₂ = (161)₁₀.'
      tags:
      - capteurs
    - type: grid
      level: 2
      prompt: Parmi ces capteurs, cochez ceux qui délivrent un signal **analogique**.
      rows:
      - id: pres
        label: Détecteur de présence (tout ou rien)
      - id: photo
        label: Photorésistance dans un pont diviseur
      - id: temp
        label: Sonde de température de sortie 0 à 5 V
      - id: cod
        label: Codeur absolu 8 bits
      - id: bp
        label: Bouton poussoir
      cols:
      - id: A
        label: Signal analogique
      answer:
      - Aphoto
      - Atemp
      labels:
        Apres: détecteur de présence
        Aphoto: photorésistance
        Atemp: sonde de température
        Acod: codeur absolu
        Abp: bouton poussoir
      cellFeedback:
        Apres: 'sa sortie ne prend que deux valeurs : signal logique (TOR)'
        Aphoto: 'la tension varie continûment avec la luminosité : signal analogique'
        Atemp: 'la tension varie continûment entre 0 et 5 V : signal analogique'
        Acod: 'il délivre un mot de 8 bits : signal numérique'
        Abp: 'appuyé ou relâché : signal logique'
      explanation: Analogique = variation continue. Le détecteur de présence et le bouton poussoir sont logiques (TOR) ; le codeur absolu est numérique.
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Pourquoi un capteur TOR possède-t-il en pratique **deux** seuils distincts, un seuil haut VT+ et un seuil bas VT− ?
      choices:
      - Pour éviter que la sortie ne devienne instable quand l'entrée est très proche du seuil
      - Pour mesurer deux grandeurs physiques différentes
      - Pour augmenter la précision de la mesure
      - Pour coder la sortie sur 2 bits
      answer: 0
      feedback:
      - null
      - 'Non : les deux seuils portent sur la **même** grandeur d''entrée.'
      - 'Non : un capteur TOR ne mesure pas, il détecte un franchissement.'
      - 'Non : la sortie d''un capteur TOR est binaire, donc sur 1 bit.'
      explanation: 'La sortie passe à 1 quand l''entrée dépasse VT+ et ne retombe à 0 que lorsqu''elle passe sous VT− : ce décalage (hystérésis) empêche la sortie de battre autour du seuil.'
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Qu'est-ce qui caractérise le schéma-bloc d'un **système asservi** (régulateur de vitesse, servomoteur…) ?
      choices:
      - Il comporte une boucle de retour avec un capteur
      - Il ne comporte que des blocs en série
      - Il ne comporte aucun capteur
      - Il ne fonctionne qu'avec des signaux logiques
      answer: 0
      feedback:
      - null
      - 'Non : sans retour d''information, le système ne peut pas comparer ce qu''il fait à ce qu''il doit faire.'
      - 'Non : c''est justement le capteur de la boucle de retour qui mesure la sortie.'
      - 'Non : la nature des signaux ne change rien au principe de l''asservissement.'
      explanation: 'Consigne → comparateur → correcteur → système → sortie, et une boucle de retour passant par le capteur : le système corrige en permanence l''écart détecté.'
      tags:
      - asservissement
    - type: order
      level: 2
      prompt: Dans une serre automatisée, remettez dans l'ordre le trajet de l'information, de la grandeur physique à l'action.
      steps:
      - La luminosité éclaire la photorésistance (grandeur physique)
      - Le pont diviseur délivre une tension analogique (ACQUÉRIR)
      - Le convertisseur analogique-numérique fournit la valeur N (ACQUÉRIR)
      - La carte compare N au seuil programmé (TRAITER)
      - Le transistor de commande alimente le moteur du volet (COMMUNIQUER)
      tags:
      - chaine-information
    - type: input
      level: 3
      prompt: Dans un pont diviseur alimenté sous Ve = 5,0 V, la photorésistance R1 vaut 3,0 kΩ et la résistance fixe R2 vaut 2,0 kΩ. Quelle tension Vs mesure-t-on aux bornes de R1 ?
      answer: '3'
      numeric: true
      tolerance: 0.05
      unit: V
      explanation: 'Vs = R1 × Ve ÷ (R1 + R2) = 3 000 × 5 ÷ 5 000 = 3,0 V. Erreur classique : mettre R2 au numérateur, ce qui donne 2,0 V (la tension aux bornes de R2).'
      tags:
      - capteurs
    - type: mcq
      level: 3
      prompt: Sur un codeur incrémental à deux pistes A et B décalées d'un quart de période, comment détermine-t-on le **sens de rotation** du disque ?
      choices:
      - En regardant, au moment d'un front descendant de la voie A, si la voie B est à 1 ou à 0
      - En comptant le nombre d'impulsions de la voie A par seconde
      - En mesurant la largeur des impulsions de la piste Z
      - En comparant l'amplitude des signaux A et B
      answer: 0
      feedback:
      - null
      - 'Non : compter les impulsions donne l''angle parcouru ou la vitesse, pas le sens.'
      - 'Non : la piste Z donne une impulsion par tour, c''est un repère de position, pas un sens.'
      - 'Non : les deux voies délivrent des signaux logiques de même amplitude ; seul leur décalage dans le temps change.'
      explanation: 'La seconde piste est décalée de 25 % : selon le sens, la voie B vaut 1 ou 0 au moment d''un front descendant de la voie A.'
      tags:
      - capteurs
    - type: mcq
      level: 1
      prompt: 'Qu''est-ce qu''un **train d''impulsions** ?'
      choices:
      - Un signal à deux états stables, dont les changements d'état au cours du temps portent l'information
      - Un signal analogique de forme sinusoïdale
      - Un mot binaire de 8 bits délivré en une seule fois
      - Une tension continue proportionnelle à la grandeur mesurée
      answer: 0
      feedback:
      - null
      - 'Non : un train d''impulsions est un signal **logique**, qui ne prend que deux niveaux.'
      - 'Non : un mot binaire est délivré par un capteur proportionnel numérique, comme un codeur absolu.'
      - 'Non : c''est la sortie d''un capteur proportionnel analogique.'
      explanation: 'Exemple : un codeur incrémental délivre une impulsion à chaque dent qui défile. C''est le **nombre** d''impulsions et leur **cadence** qui renseignent sur la position et la vitesse.'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Une caméra de surveillance transmet ses images au poste de contrôle par une liaison **TCP/IP**. À quel bloc de la chaîne d'information appartient cette liaison ?
      choices:
      - COMMUNIQUER
      - ACQUÉRIR
      - TRAITER
      - À aucun, elle appartient à la chaîne de puissance
      answer: 0
      feedback:
      - null
      - 'Non : ACQUÉRIR regroupe le capteur d''image et les commandes de l''opérateur, pas la liaison de sortie.'
      - 'Non : TRAITER, c''est la carte électronique qui compresse et met en forme les images.'
      - 'Non : la chaîne de puissance transporte de l''énergie ; ici c''est de l''information qui circule.'
      explanation: 'Le bloc COMMUNIQUER regroupe tout ce qui transmet l''information : voyants, écran, relais vers la chaîne de puissance et **interfaces réseau** (TCP/IP, Wi-Fi, bus de terrain).'
      tags:
      - chaine-information
    - type: match
      level: 1
      prompt: Un bus urbain mesure la vitesse de ses roues et l'affiche au poste de conduite. Associez chaque élément au bloc de la chaîne d'information auquel il appartient.
      pairs:
      - left: Capteur inductif placé face à la couronne dentée
        right: ACQUÉRIR
      - left: Calculateur de bord
        right: TRAITER
      - left: Afficheur du poste de conduite
        right: COMMUNIQUER
      tags:
      - chaine-information
    - type: mcq
      level: 2
      prompt: La vitesse du moteur de roue d'un bus est mesurée par un **capteur inductif** qui détecte le passage des dents d'une couronne, sans jamais toucher l'arbre. Quel est l'intérêt principal de cette mesure sans contact ?
      choices:
      - Le capteur ne s'use pas, puisqu'il ne frotte contre aucune pièce
      - Le capteur mesure en même temps la température de l'arbre
      - Le capteur délivre directement une vitesse en tr/min
      - Le capteur n'a pas besoin d'être alimenté
      answer: 0
      feedback:
      - null
      - 'Non : un capteur inductif ne détecte que le passage des dents métalliques.'
      - 'Non : il délivre un train d''impulsions ; c''est le calculateur qui en déduit la vitesse.'
      - 'Non : le capteur est bien raccordé au calculateur par un câble à quatre conducteurs (masse et sorties comprises) ; ce n''est pas là son intérêt.'
      explanation: 'Aucun contact mécanique, donc aucune usure et aucun frottement parasite : c''est l''argument mis en avant par le document technique du capteur.'
      tags:
      - capteurs
    - type: input
      level: 2
      prompt: La couronne dentée du capteur de vitesse d'un bus comporte 90 dents et chaque tête de lecture délivre une impulsion par dent. Combien de périodes du signal compte-t-on pendant un tour complet de l'arbre ?
      answer: '90'
      numeric: true
      tolerance: 0
      unit: périodes
      explanation: 'Une dent = une impulsion = une période du signal. Un tour de l''arbre fait donc défiler 90 dents, soit 90 périodes : la durée d''un tour vaut t = 90 × T.'
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Le capteur de vitesse d'un bus possède **deux têtes de lecture** décalées d'une demi-dent, qui délivrent donc deux signaux décalés d'un quart de période. À quoi sert la seconde tête ?
      choices:
      - À déterminer le sens de rotation de la roue
      - À doubler le nombre d'impulsions par tour
      - À remplacer la première tête en cas de panne
      - À mesurer le diamètre de la couronne dentée
      answer: 0
      feedback:
      - null
      - 'Non : chaque tête délivre 90 impulsions par tour ; le décalage ne change pas la résolution de chaque voie.'
      - 'Non : le document technique n''évoque aucune redondance ; les deux voies sont exploitées ensemble.'
      - 'Non : le capteur ne mesure aucune dimension, il compte des passages de dents.'
      explanation: 'Selon le sens de rotation, le signal de la tête 2 est en avance ou en retard d''un quart de période sur celui de la tête 1 : il suffit de lire l''état de la tête 2 au moment d''un front descendant de la tête 1.'
      tags:
      - capteurs
    - type: guided
      level: 3
      title: 'La caméra dôme du hall : de la scène au poste de surveillance'
      prompt: 'Exercice complet : blocs de la chaîne d''information, rapport de réduction et vérification d''une exigence.'
      intro: 'Le hall d''un palais des sports est surveillé par une **caméra dôme motorisée**, pilotable à distance. Chaque photosite de son capteur d''image délivre une tension proportionnelle à l''éclairement reçu ; la carte électronique numérise, compresse et envoie les images au poste de contrôle par une **liaison TCP/IP**, l''alimentation étant assurée par le câble réseau (**PoE**).


        La motorisation d''orientation horizontale comporte un moteur de 500 tr/min et une transmission poulie-courroie de rapport de réduction R₂ = 0,18. Le démarrage étant progressif, la caméra tourne en réalité à la vitesse moyenne de 430 °·s⁻¹. Le bar et la billetterie sont vus sous un angle de 90°, et le cahier des charges impose un déplacement de l''un à l''autre en **2 s au maximum**.

        {{emoji:📹}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** À quel bloc de la chaîne d''information appartient le capteur d''image de la caméra ?'
        choices:
        - ACQUÉRIR
        - TRAITER
        - COMMUNIQUER
        - À la chaîne de puissance
        answer:
        - 0
        feedback:
        - null
        - 'Non : TRAITER, c''est la carte électronique qui numérise et compresse les images.'
        - 'Non : COMMUNIQUER, c''est la liaison TCP/IP vers le poste de contrôle.'
        - 'Non : la chaîne de puissance alimente les moteurs d''orientation ; le capteur d''image prélève une information.'
        explanation: 'Le capteur d''image transforme une grandeur physique (l''éclairement) en un signal électrique : c''est un capteur, donc le bloc ACQUÉRIR.'
      - kind: mcq
        prompt: '**Étape 2.** Quelle est la nature du signal délivré par un photosite, avant la conversion réalisée par la carte électronique ?'
        choices:
        - Analogique
        - Logique
        - Numérique
        - Périodique
        answer:
        - 0
        feedback:
        - null
        - 'Non : la tension ne prend pas deux valeurs seulement, elle suit continûment l''éclairement.'
        - 'Non : le signal ne devient numérique qu''à la **sortie** du convertisseur analogique-numérique.'
        - 'Non : rien n''impose que l''éclairement se répète à intervalles réguliers.'
        explanation: 'Une tension proportionnelle à l''éclairement varie de façon continue : c''est un signal analogique, qu''un CAN transforme en un nombre pour chaque photosite.'
      - kind: input
        prompt: '**Étape 3.** Calculer la vitesse de rotation en sortie de la motorisation horizontale, en tr/min, sachant que le moteur tourne à 500 tr/min et que le rapport de réduction vaut R₂ = 0,18.'
        answer: '90'
        numeric: true
        tolerance: 0
        unit: tr/min
        explanation: 'N sortie = N moteur × R₂ = 500 × 0,18 = 90 tr/min. Un rapport de réduction inférieur à 1 **diminue** la vitesse.'
      - kind: input
        prompt: '**Étape 4.** Convertir cette vitesse de 90 tr/min en degrés par seconde.'
        answer: '540'
        numeric: true
        tolerance: 1
        unit: °·s⁻¹
        explanation: 'Un tour = 360° et une minute = 60 s : 90 × 360 ÷ 60 = 540 °·s⁻¹.'
      - kind: input
        prompt: '**Étape 5.** En pratique, la caméra tourne à la vitesse moyenne de 430 °·s⁻¹. Calculer le temps mis pour passer de la billetterie au bar, séparés de 90° (deux décimales).'
        answer: '0.21'
        numeric: true
        tolerance: 0.01
        unit: s
        explanation: 't = angle ÷ vitesse = 90 ÷ 430 = 0,209 s ≈ 0,21 s. La vitesse moyenne réelle est inférieure à la vitesse maximale, à cause du démarrage progressif.'
      - kind: mcq
        prompt: '**Étape 6.** Le cahier des charges impose un déplacement du bar à la billetterie en 2 s au maximum. Que peut-on conclure ?'
        choices:
        - L'exigence est respectée, avec une marge d'environ un facteur 10
        - L'exigence n'est pas respectée, car 0,21 s est inférieur à 2 s
        - L'exigence est tout juste respectée, sans marge
        - On ne peut pas conclure sans connaître l'angle de rotation verticale
        answer:
        - 0
        feedback:
        - null
        - 'Non : 2 s est un **maximum** ; être plus rapide est favorable.'
        - 'Non : 0,21 s est près de dix fois plus petit que 2 s, la marge est très confortable.'
        - 'Non : le déplacement du bar à la billetterie est un mouvement **horizontal** de 90° ; la rotation verticale n''intervient pas.'
        explanation: '0,21 s < 2 s : l''exigence est vérifiée, avec un facteur de marge proche de 10.'
      - kind: match
        prompt: '**Étape 7.** Associer chaque exigence du cahier des charges à la caractéristique technique qui y répond.'
        pairs:
        - left: Piloter la caméra à distance
          right: Liaison TCP/IP
        - left: Alimenter la caméra par le câble réseau
          right: PoE
        - left: Balayer tout le hall en horizontal
          right: Rotation horizontale 360° continu
        - left: Distinguer les personnes de loin
          right: Zoom 20 × minimum
      tags:
      - chaine-information
      - capteurs
  - id: info-signaux
    title: Signaux, MLI et conversion
    icon: 📈
    description: Période, fréquence, rapport cyclique et valeur moyenne d'une MLI ; quantum, nombre de bits et résolution d'un CAN.
    prerequisites:
    - info-chaine
    lesson: lessons/info-signaux.md
    items:
    - type: mcq
      level: 1
      prompt: Que représente la **période** T d'un signal périodique ?
      choices:
      - La durée au bout de laquelle le signal se répète, en secondes
      - Le nombre de répétitions par seconde
      - La valeur maximale du signal
      - La durée du niveau haut
      answer: 0
      feedback:
      - null
      - 'Non : c''est la **fréquence**, en hertz.'
      - 'Non : c''est l''amplitude du signal.'
      - 'Non : c''est la durée Th du niveau haut, utilisée pour le rapport cyclique.'
      explanation: La période s'exprime en secondes (s) ; la fréquence en est l'inverse.
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Un signal périodique a une période T = 20 ms. Quelle est sa fréquence ?
      choices:
      - 50 Hz
      - 20 Hz
      - 0,05 Hz
      - 2 000 Hz
      answer: 0
      feedback:
      - null
      - 'Non : tu as recopié la valeur de la période ; la fréquence n''est pas égale à la période.'
      - 'Non : tu as calculé T au lieu de 1 ÷ T, ou tu as oublié de convertir les millisecondes en secondes.'
      - 'Non : erreur de conversion, 20 ms = 0,020 s et non 0,000 5 s.'
