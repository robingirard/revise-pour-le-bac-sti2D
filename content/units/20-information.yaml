      - 'Non : ''bleu'' est l''élément d''indice **0**, le premier du tableau.'
      - 'Non : ''vert'' est l''élément d''indice 2, le dernier du tableau.'
      - 'Non : un tableau de trois éléments possède les indices 0, 1 et 2.'
      explanation: 'Dans la plupart des langages, le premier indice est **0** : monTableau[0] vaut ''bleu'', monTableau[1] vaut ''rouge'', monTableau[2] vaut ''vert''.'
      tags:
      - algorithme
    - type: guided
      level: 3
      title: 'Le distributeur de savon : de l''algorigramme à l''algorithme'
      prompt: 'Exercice complet : symboles normalisés, ordre des blocs et structures d''un algorigramme.'
      intro: 'Le fonctionnement d''un distributeur de savon est géré par un microprocesseur. Un capteur détecte la présence d''une main sous le bec.


        Pour éviter le gaspillage, le cahier des charges impose une **temporisation de 2 secondes** entre la détection de la main et l''émission de la dose de savon. Les blocs disponibles pour construire l''algorigramme sont : Début_Boucle, Lire_Capteur, Présence_Main ?, Temporisation, Émission_Dose et Fin_Boucle.

        {{emoji:🧼}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Quel symbole normalisé représente le bloc « Lire_Capteur » sur l''algorigramme ?'
        choices:
        - Le parallélogramme
        - Le losange
        - Le rectangle
        - Le rectangle à bouts arrondis
        answer:
        - 0
        feedback:
        - null
        - 'Non : le losange pose une question à deux issues ; lire un capteur n''est pas un test.'
        - 'Non : le rectangle représente un traitement interne, comme la temporisation.'
        - 'Non : le rectangle à bouts arrondis marque le début ou la fin de l''algorigramme.'
        explanation: 'Lire un capteur, c''est faire entrer une donnée dans le programme : le symbole des entrées et des sorties est le parallélogramme.'
      - kind: mcq
        prompt: '**Étape 2.** Quel symbole représente le bloc « Présence_Main ? » ?'
        choices:
        - Le losange
        - Le parallélogramme
        - Le rectangle
        - Le rectangle à double barre verticale
        answer:
        - 0
        feedback:
        - null
        - 'Non : le parallélogramme sert aux entrées et sorties de données.'
        - 'Non : le rectangle est un traitement, sans branchement.'
        - 'Non : le rectangle à double barre verticale appelle un sous-programme.'
        explanation: 'Le point d''interrogation signale une question à laquelle on répond par oui ou par non : c''est un test, donc un losange à deux sorties.'
      - kind: order
        prompt: '**Étape 3.** Remettez les huit blocs de l''algorigramme dans l''ordre d''exécution, pour un cycle où la main reste présente.'
        steps:
        - Début_Boucle
        - Lire_Capteur (première lecture)
        - Présence_Main ? (premier test)
        - Temporisation de 2 s
        - Lire_Capteur (seconde lecture)
        - Présence_Main ? (second test)
        - Émission_Dose
        - Fin_Boucle
        explanation: 'Le capteur est lu une première fois ; si une main est détectée, on attend 2 s, puis on relit le capteur et on ne teste à nouveau qu''ensuite. La dose n''est émise qu''après ce second test.'
      - kind: mcq
        prompt: '**Étape 4.** Pourquoi le capteur est-il lu **deux** fois ?'
        choices:
        - Pour n'émettre la dose que si la main est toujours là au bout des 2 secondes
        - Pour doubler la précision de la mesure du capteur
        - Pour détecter deux mains différentes
        - Pour laisser le temps à la pompe de se remplir
        answer:
        - 0
        feedback:
        - null
        - 'Non : lire deux fois un capteur tout ou rien n''améliore en rien sa précision.'
        - 'Non : le capteur ne distingue pas les mains, il détecte une présence.'
        - 'Non : la temporisation est justifiée dans l''énoncé par la lutte contre le gaspillage.'
        explanation: 'Un simple passage devant le capteur ne déclenche rien : la dose n''est délivrée que si la main est **encore** présente après la temporisation, ce qui évite le gaspillage.'
      - kind: mcq
        prompt: '**Étape 5.** Quelle structure algorithmique traduit l''enchaînement « RÉPÉTER … FIN RÉPÉTER » qui encadre tout le traitement ?'
        choices:
        - Une structure répétitive (le distributeur recommence indéfiniment)
        - Une structure alternative
        - Une structure linéaire
        - Une boucle avec comptage
        answer:
        - 0
        feedback:
        - null
        - 'Non : la structure alternative s''écrit SI … ALORS … SINON et offre deux issues exclusives.'
        - 'Non : une structure linéaire enchaîne les traitements sans jamais reboucler.'
        - 'Non : une boucle avec comptage utilise un compteur N décrémenté ; ici, rien ne compte les cycles.'
        explanation: 'Le distributeur reste en service : il reboucle sans fin sur la lecture du capteur. C''est une structure répétitive.'
      - kind: mcq
        prompt: '**Étape 6.** Que se passe-t-il si l''utilisateur retire sa main pendant la temporisation ?'
        choices:
        - Le second test échoue, aucune dose n'est émise et l'algorithme reboucle
        - La dose est émise quand même, puisque la main a été détectée
        - Le programme s'arrête définitivement
        - La temporisation est relancée pour 2 secondes
        answer:
        - 0
        feedback:
        - null
        - 'Non : l''émission de la dose est placée **après** le second test, et non après le premier.'
        - 'Non : sortir d''un test n''arrête pas le programme ; la boucle continue.'
        - 'Non : aucun bloc de l''algorigramme ne relance la temporisation.'
        explanation: 'Le second « Présence_Main ? » répond non : on saute le bloc Émission_Dose et on repart au début de la boucle, prêt pour une nouvelle détection.'
      tags:
      - algorigramme
      - algorithme
  - id: info-transmission
    title: Codage et transmission
    icon: 🔌
    description: Débit binaire, trames série (start, données, parité, stop), liaisons symétriques, protocoles et adressage réseau.
    prerequisites:
    - info-numeration
    lesson: lessons/info-transmission.md
    items:
    - type: mcq
      level: 1
      prompt: Que mesure le **débit binaire** d'une liaison ?
      choices:
      - Le nombre de bits transmis par seconde, en bit/s
      - Le nombre d'octets stockés en mémoire
      - La tension utilisée pour transmettre un 1 logique
      - La longueur maximale du câble
      answer: 0
      feedback:
      - null
      - 'Non : c''est une capacité de stockage, indépendante de la vitesse de transmission.'
      - 'Non : la tension caractérise le **niveau logique**, pas la vitesse.'
      - 'Non : la longueur du câble dépend du type de liaison, pas de son débit.'
      explanation: 'Le débit binaire s''exprime en bit/s (parfois en bauds pour une liaison série simple) : 19 200 bit/s signifie 19 200 bits transmis chaque seconde.'
      tags:
      - transmission
    - type: mcq
      level: 1
      prompt: Qu'est-ce qui distingue une liaison **série** d'une liaison **parallèle** ?
      choices:
      - En série, les bits sont envoyés l'un après l'autre sur un même conducteur
      - En série, tous les bits d'un octet partent en même temps
      - En série, on ne transmet que des nombres, jamais du texte
      - En série, il n'y a pas besoin de masse commune
      answer: 0
      feedback:
      - null
      - 'Non : c''est la liaison **parallèle**, qui utilise autant de fils que de bits.'
      - 'Non : toute donnée, texte compris, est transmise sous forme de bits.'
      - 'Non : une référence de potentiel commune est nécessaire dans les deux cas.'
      explanation: 'La liaison série économise les conducteurs (un seul fil de données par sens) mais impose de repérer le début et la fin de chaque caractère.'
      tags:
      - transmission
    - type: mcq
      level: 1
      prompt: Sur une liaison série asynchrone, à quoi sert le **bit de start** ?
      choices:
      - À signaler le début d'un caractère, en faisant passer la ligne de 1 à 0
      - À indiquer le nombre de bits de la donnée qui suit
      - À vérifier qu'aucune erreur ne s'est produite
      - À séparer deux trames successives
      answer: 0
      feedback:
      - null
      - 'Non : le format (nombre de bits) est fixé une fois pour toutes par la configuration de la liaison.'
      - 'Non : c''est le rôle du bit de **parité**.'
      - 'Non : c''est le rôle du ou des bits de **stop**.'
      explanation: 'La ligne est au repos à l''état 1. Le front descendant du bit de start réveille le récepteur et lui donne le rythme pour lire les bits suivants.'
      tags:
      - transmission
    - type: mcq
      level: 1
      prompt: Dans quel ordre les bits d'une donnée sont-ils émis sur une liaison série asynchrone ?
      choices:
      - Le bit de poids faible (D0) en tête, le bit de poids fort (D7) en dernier
      - Le bit de poids fort en tête, le bit de poids faible en dernier
      - Dans l'ordre des symboles hexadécimaux, de gauche à droite
      - Dans un ordre défini au hasard par l'émetteur
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''inverse ; oublier ce détail conduit à lire les trames à l''envers.'
      - 'Non : la liaison transmet des bits, pas des symboles hexadécimaux.'
      - 'Non : l''ordre est imposé par le protocole, sinon aucune lecture ne serait possible.'
      explanation: 'Poids faible en tête (lsb first). Pour relire un chronogramme, il faut donc **retourner** la suite des bits avant de calculer la valeur.'
      tags:
      - transmission
    - type: mcq
      level: 1
      prompt: À quoi sert le **bit de parité** d'une trame série ?
      choices:
      - À détecter qu'un bit a été altéré pendant la transmission
      - À corriger automatiquement les erreurs de transmission
      - À augmenter le débit de la liaison
      - À indiquer la fin du caractère transmis
      answer: 0
      feedback:
      - null
      - 'Non : un seul bit de parité permet de **détecter** une erreur, pas de la corriger.'
      - 'Non : il ajoute au contraire un bit à transmettre, donc il ralentit un peu la liaison.'
      - 'Non : la fin du caractère est marquée par le ou les bits de stop.'
      explanation: 'Le bit de parité complète la donnée pour que le nombre total de « 1 » soit pair (parité paire) ou impair (parité impaire). Si le compte ne tombe pas juste à l''arrivée, le récepteur sait qu''un bit a été altéré.'
      tags:
      - transmission
    - type: input
      level: 2
      prompt: Une liaison série transmet des caractères avec 1 bit de start, 8 bits de donnée, 1 bit de parité et 1 bit de stop. Combien de bits une trame comporte-t-elle ?
      answer: '11'
      numeric: true
      tolerance: 0
      unit: bits
      explanation: '1 + 8 + 1 + 1 = 11 bits. Seuls 8 bits sur 11 sont utiles : l''encadrement coûte environ 27 % du débit.'
      tags:
      - transmission
    - type: input
      level: 2
      prompt: Une trame de 11 bits est transmise à 19 200 bit/s. Quelle est sa durée, en microsecondes (arrondir à l'unité) ?
      answer: '573'
      numeric: true
      tolerance: 5
      unit: µs
      explanation: 't = nombre de bits ÷ débit = 11 ÷ 19 200 = 5,73 × 10⁻⁴ s ≈ 573 µs.'
      tags:
      - transmission
    - type: mcq
      level: 2
      prompt: La donnée à transmettre vaut 0011 0101 et la liaison utilise une **parité impaire**. Que vaut le bit de parité ?
      choices:
      - '1'
      - '0'
      - Il n'y a pas de bit de parité pour cette donnée
      - Cela dépend du débit de la liaison
      answer: 0
      feedback:
      - null
      - 'Non : la donnée contient déjà quatre « 1 », un nombre pair ; un bit de parité à 0 laisserait le total pair.'
      - 'Non : dès que la liaison est configurée avec parité, le bit est présent pour tous les caractères.'
      - 'Non : le bit de parité ne dépend que du nombre de « 1 » de la donnée.'
      explanation: '0011 0101 contient quatre « 1 ». Pour que le total soit **impair**, le bit de parité doit valoir 1 : le compte passe à cinq.'
      tags:
      - transmission
    - type: mcq
      level: 2
      prompt: La donnée à transmettre vaut 0011 0010 et la liaison utilise une **parité impaire**. Que vaut le bit de parité ?
      choices:
      - '0'
      - '1'
      - '2'
      - On ne peut pas savoir sans connaître le caractère transmis
      answer: 0
      feedback:
      - null
      - 'Non : la donnée contient déjà trois « 1 », un nombre impair ; ajouter un 1 rendrait le total pair.'
      - 'Non : un bit ne peut valoir que 0 ou 1.'
      - 'Non : seul le contenu binaire compte, et il est donné.'
      explanation: '0011 0010 contient trois « 1 », donc déjà un nombre impair : le bit de parité vaut 0. Cette donnée est le code ASCII du caractère « 2 ».'
      tags:
      - transmission
    - type: order
      level: 2
      prompt: Remettez dans l'ordre les éléments d'une trame série asynchrone avec parité.
      steps:
      - Ligne au repos, à l'état 1
      - Bit de start, à l'état 0
      - Les 8 bits de donnée, D0 (poids faible) en tête
      - Le bit de parité
      - Le bit de stop
      - Retour de la ligne au repos
      tags:
      - transmission
    - type: input
      level: 2
      prompt: Un technicien mesure à l'oscilloscope une durée de 4 µs pour un bit d'une trame DMX. Quelle est la vitesse de transmission, en bit/s ?
      answer: '250000'
      numeric: true
      tolerance: 1000
      unit: bit/s
      explanation: 'v = 1 ÷ durée d''un bit = 1 ÷ (4 × 10⁻⁶) = 250 000 bit/s, valeur conforme à celle qu''impose le protocole DMX 512.'
      tags:
      - dmx
    - type: mcq
      level: 2
      prompt: 'Quel est le format de chaque canal transmis par le protocole **DMX 512**, utilisé pour piloter les projecteurs de scène ?'
      choices:
      - 1 bit de start, 8 bits de donnée (poids faible en tête), 2 bits de stop
      - 1 bit de start, 8 bits de donnée (poids fort en tête), 1 bit de stop
      - 2 bits de start, 8 bits de donnée, 1 bit de parité
      - 8 bits de donnée seuls, sans encadrement
      answer: 0
      feedback:
      - null
      - 'Non : le DMX transmet le poids faible en premier et referme chaque canal par **deux** bits de stop.'
      - 'Non : il n''y a qu''un seul bit de start, et le DMX n''utilise pas de bit de parité.'
      - 'Non : la transmission est asynchrone : sans start ni stop, le récepteur ne pourrait pas se synchroniser.'
      explanation: 'Chaque canal occupe donc 1 + 8 + 2 = 11 bits. Le protocole gère 512 canaux, dont la valeur va de 0 à 255, à 250 000 bit/s.'
      tags:
      - dmx
    - type: mcq
      level: 2
      prompt: Combien de canaux le protocole DMX 512 gère-t-il, et combien de récepteurs peut-on piloter simultanément sur une liaison ?
      choices:
      - 512 canaux et 32 récepteurs au maximum
      - 512 canaux et 512 récepteurs
      - 255 canaux et 32 récepteurs
      - 32 canaux et 512 récepteurs
      answer: 0
      feedback:
      - null
      - 'Non : 512 est le nombre de **canaux** ; le nombre de récepteurs est bien plus faible.'
      - 'Non : 255 est la valeur maximale d''un canal, pas le nombre de canaux.'
      - 'Non : les deux nombres sont intervertis.'
      explanation: 'Un seul émetteur (le pupitre) pilote jusqu''à 32 récepteurs, la liaison étant unidirectionnelle ; chacun des 512 canaux reçoit une valeur de 0 à 255.'
      tags:
      - dmx
    - type: input
      level: 2
      prompt: Un canal DMX reçoit la valeur 128, la valeur maximale étant 255. Quelle intensité lumineuse cela représente-t-il, en pourcentage (arrondir à l'unité) ?
      answer: '50'
      numeric: true
      tolerance: 1
      unit: '%'
      explanation: '128 ÷ 255 = 0,502, soit environ 50 %. Inversement, une couleur demandée à 20 % correspond à 0,20 × 255 ≈ 51.'
      tags:
      - dmx
    - type: mcq
      level: 3
      prompt: Une perturbation de 1 V affecte simultanément les deux fils DATA+ et DATA− d'une **liaison symétrique**. Que devient-elle sur le signal différentiel reconstitué par le récepteur ?
      choices:
      - Elle disparaît, car elle est identique sur les deux fils et s'élimine par la différence
      - Elle est doublée et apparaît à 2 V sur le signal reconstitué
      - Elle est divisée par deux
      - Elle décale le signal de 1 V vers le haut en permanence
      answer: 0
      feedback:
      - null
      - 'Non : la soustraction ne peut pas doubler une perturbation commune aux deux fils.'
      - 'Non : elle n''est pas seulement atténuée, elle est supprimée.'
