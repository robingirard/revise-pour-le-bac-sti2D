      - Repérer les variables d'entrée et la variable de sortie
      - Compter le nombre n de variables d'entrée
      - Tracer une table de vérité de 2ⁿ lignes
      - Écrire toutes les combinaisons des entrées, ligne par ligne
      - Remplir la colonne de sortie d'après le cahier des charges
      - En déduire l'équation logique de la sortie
      tags:
      - logique
    - type: mcq
      level: 3
      prompt: Un convecteur doit chauffer **uniquement** si le local est occupé (a = 1) et si la température de consigne n'est pas atteinte (b = 0). Quelle équation logique décrit la sortie S ?
      choices:
      - S = a · b barre
      - S = a · b
      - S = a + b barre
      - S = a barre · b
      answer: 0
      feedback:
      - null
      - 'Non : S = a · b ferait chauffer quand la consigne **est** atteinte.'
      - 'Non : avec un OU, le convecteur chaufferait aussi quand le local est vide.'
      - 'Non : tu as complémenté la mauvaise variable ; c''est b qui doit valoir 0.'
      explanation: 'Les deux conditions doivent être réunies : ET. La seconde est « consigne non atteinte », donc b barre. En C : S = a && !b.'
      tags:
      - logique
    - type: mcq
      level: 3
      prompt: Une table de vérité donne S = 1 pour (a, b) = (0, 1) et (1, 0), et S = 0 pour (0, 0) et (1, 1). Peut-on écrire S = a + b ?
      choices:
      - 'Non : le OU donnerait S = 1 pour (1, 1)'
      - 'Oui : le OU vaut 1 dès qu''une entrée vaut 1'
      - 'Non : il faudrait écrire S = a · b'
      - Oui, à condition d'inverser a
      answer: 0
      feedback:
      - null
      - 'Non : le OU vaut effectivement 1 dès qu''une entrée vaut 1, y compris pour (1, 1) : la table ne correspond donc pas.'
      - 'Non : le ET ne vaudrait 1 que pour (1, 1), c''est encore plus faux.'
      - 'Non : inverser a échangerait deux lignes, sans corriger la ligne (1, 1).'
      explanation: 'Cette fonction vaut 1 quand les entrées sont **différentes** : c''est un OU exclusif, différent du OU du cours (dont la seule ligne à 0 est (0, 0)).'
      tags:
      - logique
    - type: mcq
      level: 3
      prompt: Sur un chronogramme, l'entrée a est au niveau haut de 0 à 4 s, l'entrée b de 2 à 6 s. Pour S = a · b, quand la sortie est-elle au niveau haut ?
      choices:
      - De 2 à 4 s
      - De 0 à 6 s
      - De 0 à 2 s puis de 4 à 6 s
      - Jamais
      answer: 0
      feedback:
      - null
      - 'Non : de 0 à 6 s, c''est la sortie du **OU** (au moins une entrée haute).'
      - 'Non : ce serait l''intervalle où une seule entrée est haute, donc un OU exclusif.'
      - 'Non : les deux entrées sont bien hautes en même temps entre 2 et 4 s.'
      explanation: Le ET est haut seulement lorsque les deux entrées sont hautes simultanément, soit sur l'intersection des deux intervalles.
      tags:
      - logique
    - type: grid
      level: 3
      prompt: Cochez les lignes où la sortie vaut 1 pour l'équation S = a · (b barre + c).
      rows:
      - id: '000'
        label: a = 0, b = 0, c = 0
      - id: '001'
        label: a = 0, b = 0, c = 1
      - id: '010'
        label: a = 0, b = 1, c = 0
      - id: '011'
        label: a = 0, b = 1, c = 1
      - id: '100'
        label: a = 1, b = 0, c = 0
      - id: '101'
        label: a = 1, b = 0, c = 1
      - id: '110'
        label: a = 1, b = 1, c = 0
      - id: '111'
        label: a = 1, b = 1, c = 1
      cols:
      - id: S
        label: S = 1
      answer:
      - S100
      - S101
      - S111
      labels:
        S000: (0, 0, 0)
        S001: (0, 0, 1)
        S010: (0, 1, 0)
        S011: (0, 1, 1)
        S100: (1, 0, 0)
        S101: (1, 0, 1)
        S110: (1, 1, 0)
        S111: (1, 1, 1)
      cellFeedback:
        S000: 'a = 0 : le ET impose S = 0, quelle que soit la parenthèse'
        S001: 'a = 0 : le ET impose S = 0'
        S010: 'a = 0 : le ET impose S = 0'
        S011: 'a = 0 : le ET impose S = 0'
        S110: a = 1 mais b = 1 et c = 0, donc la parenthèse vaut 0 + 0 = 0
      explanation: 'S = 1 exige a = 1 **et** une parenthèse à 1, c''est-à-dire b = 0 ou c = 1 : les lignes (1, 0, 0), (1, 0, 1) et (1, 1, 1).'
      tags:
      - logique
  - id: info-algo
    title: Algorithmes et diagrammes
    icon: 🧭
    description: Algorithme, variables, structures SI, TANT QUE et POUR, algorigramme et diagrammes SysML (activité, états-transitions, séquence).
    prerequisites:
    - info-logique
    lesson: lessons/info-algo.md
    items:
    - type: mcq
      level: 1
      prompt: Qu'est-ce qu'un **algorithme** ?
      choices:
      - Une suite finie d'instructions élémentaires exécutées dans un ordre déterminé
      - Un programme écrit dans un langage de programmation
      - Un schéma électronique
      - Un diagramme SysML
      answer: 0
      feedback:
      - null
      - 'Non : le **programme** est la traduction de l''algorithme dans un langage compris par la machine.'
      - 'Non : un algorithme décrit un traitement, pas un montage.'
      - 'Non : le diagramme est une représentation possible, pas la définition de l''algorithme.'
      explanation: 'L''algorithme décrit la méthode de résolution, indépendamment du langage : on l''écrit en pseudo-code ou sous forme d''algorigramme.'
      tags:
      - algorithme
    - type: order
      level: 1
      prompt: Remettez dans l'ordre les trois étapes qui mènent d'un problème à son programme.
      steps:
      - 'Analyse : définir le problème'
      - 'Algorithme : définir la méthode amenant à la solution'
      - 'Programme : transcrire dans le langage de programmation'
      tags:
      - algorithme
    - type: mcq
      level: 1
      prompt: Dans un algorigramme, quelle forme normalisée représente un **test** (une condition) ?
      choices:
      - Le losange
      - Le parallélogramme
      - Le rectangle
      - Le rectangle à bouts arrondis
      answer: 0
      feedback:
      - null
      - 'Non : le parallélogramme représente une entrée ou une sortie de données.'
      - 'Non : le rectangle simple représente un traitement.'
      - 'Non : le rectangle à bouts arrondis marque le début ou la fin.'
      explanation: Le losange pose une question à laquelle on répond par oui ou par non ; il a donc deux sorties.
      tags:
      - algorigramme
    - type: match
      level: 2
      prompt: Associez chaque symbole normalisé d'algorigramme à son rôle.
      pairs:
      - left: Rectangle à bouts arrondis
        right: Début ou fin
      - left: Rectangle
        right: Traitement
      - left: Rectangle à double barre verticale
        right: Sous-programme
      - left: Parallélogramme
        right: Entrée ou sortie de données
      - left: Losange
        right: Test ou condition
      tags:
      - algorigramme
    - type: mcq
      level: 1
      prompt: Quelle est la différence entre une **constante** et une **variable** ?
      choices:
      - La constante ne change pas au cours du programme, la variable peut changer
      - La constante est un nombre, la variable est du texte
      - La constante est locale, la variable est globale
      - La constante occupe plus de place en mémoire
      answer: 0
      feedback:
      - null
      - 'Non : le type de la donnée n''a rien à voir avec son caractère constant ou variable.'
      - 'Non : local et global décrivent la **portée**, pas la distinction constante/variable.'
      - 'Non : la place occupée dépend du **type** de la donnée.'
      explanation: 'On déclare une constante par nom = valeur (Pi = 3,1416) et une variable par nom : type. La variable est une boîte dont on peut changer le contenu.'
      tags:
      - algorithme
    - type: mcq
      level: 1
      prompt: Quel type déclare-t-on pour une variable qui ne peut valoir que 0 ou 1 ?
      choices:
      - Le type booléen
      - Le type entier
      - Le type décimal
      - Le type chaîne de caractères
      answer: 0
      feedback:
      - null
      - 'Non : un entier peut prendre bien d''autres valeurs ; on gaspillerait de la mémoire.'
      - 'Non : un décimal sert aux nombres à virgule.'
      - 'Non : une chaîne sert à représenter du texte.'
      explanation: Un booléen est une variable logique codée sur 1 bit, parfois notée *True* / *False* ou *High* / *Low*.
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: 'Une variable déclarée **à l''intérieur** d''une fonction est :'
      choices:
      - une variable locale, utilisable seulement dans cette fonction
      - une variable globale, utilisable partout dans le programme
      - une constante
      - un paramètre de la fonction
      answer: 0
      feedback:
      - null
      - 'Non : les variables globales sont définies en dehors de toute fonction.'
      - 'Non : une constante ne change pas de valeur ; ici rien ne l''interdit.'
      - 'Non : les paramètres figurent dans l''en-tête de la fonction, entre parenthèses.'
      explanation: 'La portée d''une variable désigne les espaces du programme où elle est accessible : locale (dans sa fonction) ou globale (partout).'
      tags:
      - algorithme
    - type: order
      level: 2
      prompt: Remettez dans l'ordre le pseudo-code qui fait clignoter une DEL branchée sur la broche 2.
      steps:
      - Début
      - Allumer la DEL branchée sur la broche 2
      - Attendre 1 seconde
      - Éteindre la DEL
      - Attendre 1 seconde
      - Recommencer
      - Fin
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: À quoi reconnaît-on une **structure alternative** (conditionnelle) ?
      choices:
      - Une condition est testée et offre deux issues qui s'excluent mutuellement
      - Un traitement est répété tant qu'une condition est vraie
      - Les traitements s'enchaînent sans test
      - Un compteur est décrémenté jusqu'à zéro
      answer: 0
      feedback:
      - null
      - 'Non : c''est la structure **répétitive** (TANT QUE).'
      - 'Non : c''est la structure **linéaire**.'
      - 'Non : c''est la boucle avec comptage (POUR).'
      explanation: 'SI condition ALORS traitement 1 SINON traitement 2 FIN SI : sur l''algorigramme, le losange a une sortie oui et une sortie non.'
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: 'Quelle structure correspond au pseudo-code : TANT QUE condition vraie FAIRE traitement FIN TANT QUE ?'
      choices:
      - La structure répétitive (itérative)
      - La structure linéaire
      - La structure alternative
      - La boucle avec comptage
      answer: 0
      feedback:
      - null
      - 'Non : la structure linéaire enchaîne des traitements sans aucun test.'
      - 'Non : la structure alternative utilise SI… ALORS… SINON et offre deux issues exclusives.'
      - 'Non : la boucle avec comptage s''écrit POUR… REPETER… DECREMENTER… FIN POUR.'
      explanation: On teste d'abord la condition ; si elle est vraie, le traitement est exécuté, puis on reboucle sur le test.
      tags:
      - algorithme
    - type: order
      level: 2
      prompt: Remettez dans l'ordre les blocs de l'algorigramme d'une boucle avec comptage (structure POUR).
      steps:
      - 'Initialiser la variable : N = x'
      - 'Tester la condition : N = 0 ?'
      - 'Si non : exécuter le traitement'
      - 'Décrémenter la variable : N = N − 1'
      - Reboucler sur le test
      - 'Si oui : sortir de la boucle'
      tags:
      - algorigramme
    - type: input
      level: 3
      prompt: Dans une boucle avec comptage initialisée par N = 5 et décrémentée d'une unité à chaque passage, combien de fois le traitement est-il exécuté ?
      answer: '5'
      numeric: true
      tolerance: 0
      unit: fois
      explanation: Le traitement est exécuté pour N = 5, 4, 3, 2 et 1 ; la boucle s'arrête dès que N = 0, sans exécuter le traitement une sixième fois.
      tags:
      - algorithme
    - type: mcq
      level: 2
      prompt: Dans un **diagramme de séquence** (sd), comment appelle-t-on le trait vertical pointillé surmonté d'un rectangle de description ?
      choices:
      - Une ligne de vie
      - Un message réflexif
      - Une transition
      - Un état initial
      answer: 0
      feedback:
      - null
      - 'Non : le message réflexif est une flèche qui part d''une ligne de vie et y revient.'
      - 'Non : la transition appartient aux diagrammes d''activité et d''états.'
      - 'Non : l''état initial est le disque noir des diagrammes d''activité et d''états.'
      explanation: 'Le diagramme de séquence se lit de haut en bas : chaque bloc ou acteur possède une ligne de vie, et les flèches sont les messages échangés.'
      tags:
      - sysml
    - type: match
      level: 2
      prompt: Associez chaque opérateur du diagramme de séquence à sa fonction.
      pairs:
      - left: alt
        right: séquence conditionnelle (sinon, la seconde alternative)
      - left: loop
        right: séquence répétitive (tant que la condition est vraie)
      - left: par
        right: séquence simultanée (plusieurs actions en même temps)
      tags:
      - sysml
    - type: mcq
      level: 2
      prompt: 'Dans un diagramme d''états-transitions, l''activité écrite après le mot-clé **exit** est exécutée :'
      choices:
      - au moment où la machine sort de l'état
      - au moment où la machine entre dans l'état
      - en permanence tant que la machine reste dans l'état
      - à la fin du programme
      answer: 0
      feedback:
      - null
      - 'Non : c''est le rôle du mot-clé **entry**.'
      - 'Non : c''est le rôle du mot-clé **do**.'
      - 'Non : l''activité est liée à l''état, pas à la fin du programme.'
      explanation: entry = en entrant dans l'état, do = tant qu'on y reste, exit = en en sortant.
      tags:
      - sysml
    - type: mcq
      level: 3
      prompt: Qu'est-ce qui distingue le **diagramme d'activité** du **diagramme d'états-transitions** ?
      choices:
      - Dans le diagramme d'activité, aucun événement n'est associé aux transitions
      - Le diagramme d'activité décrit des états, celui d'états-transitions décrit des actions
      - Le diagramme d'activité n'existe qu'en SysML, l'autre qu'en UML
      - Le diagramme d'activité ne peut pas comporter de branchement conditionnel
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''inverse, le diagramme d''activité décrit des **actions**.'
      - 'Non : les deux diagrammes font partie du langage SysML.'
      - 'Non : un diagramme d''activité comporte des nœuds de décision avec des gardes entre crochets.'
      explanation: Dans un diagramme d'activité, dès qu'une tâche est terminée la suivante commence ; dans un diagramme d'états, c'est un événement qui déclenche la transition.
      tags:
      - sysml
    - type: mcq
      level: 3
      prompt: Une boucle répète l'action « Mesurer la température » tant que la condition « Température ≤ 17 °C ? » est fausse, puis alimente la pompe. Que se passe-t-il quand la température atteint 16 °C ?
      choices:
      - La condition devient vraie, on sort de la boucle et on alimente la pompe
      - La condition devient fausse, on continue de mesurer
      - Le programme s'arrête immédiatement
      - La pompe est alimentée, puis la mesure reprend dans la boucle
      answer: 0
      feedback:
      - null
      - 'Non : 16 °C est bien inférieur ou égal à 17 °C, la condition est donc **vraie**.'
      - 'Non : sortir d''une boucle n''arrête pas le programme ; l''action suivante est exécutée.'
      - 'Non : « Alimenter la pompe » est placé **après** la sortie oui du test, donc hors de la boucle.'
      explanation: Tant que la condition est fausse, on reboucle sur la mesure ; dès qu'elle devient vraie, on quitte la boucle et on exécute l'action suivante.
      tags:
      - algorigramme
    - type: mcq
      level: 3
      prompt: Dans le diagramme d'activité de commande d'une vanne, trois gardes sortent du nœud de décision qui teste deux codeurs de position. Que fait le système si **un seul** des deux codeurs répond ?
      choices:
      - Il transmet l'erreur E1COD puis ne garde que la valeur du codeur actif
      - Il arrête la vanne et met fin au traitement
      - Il fait la moyenne des deux valeurs de position
      - Il transmet l'erreur E2COD puis calcule la position réelle
      answer: 0
      feedback:
      - null
      - 'Non : l''arrêt de la vanne correspond à la garde « aucune réponse des deux codeurs » (erreur E2COD).'
      - 'Non : la moyenne n''est calculée que si les **deux** codeurs répondent.'
      - 'Non : E2COD identifie l''erreur « aucun codeur ne répond », pas celle d''un seul codeur muet.'
      explanation: 'Branche « un des codeurs ne répond pas » : transmission de E1COD à la supervision, puis on ne garde que la valeur du codeur actif avant de calculer la position réelle.'
      tags:
      - sysml
