units:
- id: information
  matiere: ingenierie
  title: Chaîne d'information et numérique
  description: De la grandeur physique au nombre binaire — capteurs, signaux, conversion analogique-numérique, numération, logique et algorithmes.
  skills:
  - id: info-chaine
    title: La chaîne d'information
    icon: 📡
    description: Acquérir, traiter, communiquer ; nature des signaux (logique, analogique, numérique) et types de capteurs.
    prerequisites: []
    lesson: lessons/info-chaine.md
    items:
    - type: mcq
      level: 1
      prompt: 'Quels sont les trois blocs de la **chaîne d''information** ?

        {{emoji:📡}}'
      choices:
      - ACQUÉRIR — TRAITER — COMMUNIQUER
      - ALIMENTER — DISTRIBUER — CONVERTIR
      - CAPTER — CALCULER — AGIR
      - ENTRÉE — PROCESSEUR — SORTIE
      answer: 0
      feedback:
      - null
      - 'Non : ce sont les blocs de la chaîne de **puissance**, pas de la chaîne d''information.'
      - 'Non : ce vocabulaire n''est pas celui du cours, qui impose les verbes ACQUÉRIR, TRAITER, COMMUNIQUER.'
      - 'Non : c''est le vocabulaire général de l''informatique, pas la décomposition fonctionnelle du cours.'
      explanation: 'La chaîne d''information reçoit des grandeurs physiques et des consignes, et délivre des informations (ordres, messages) : ACQUÉRIR (capteurs, clavier), TRAITER (carte Arduino, automate), COMMUNIQUER (voyants, écran, relais, réseau).'
      tags:
      - chaine-information
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **logique** si :'
      choices:
      - la grandeur de l'information ne peut prendre que deux valeurs
      - la grandeur de l'information varie de façon continue dans le temps
      - il est constitué d'une suite de 0 et de 1 représentant des nombres
      - il est périodique
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition d''un signal **analogique**.'
      - 'Non : c''est la définition d''un signal **numérique**, une suite d''informations logiques qui code un nombre.'
      - 'Non : la périodicité ne dit rien sur la nature du signal ; un signal logique peut être périodique ou non.'
      explanation: 'Deux valeurs seulement : tout ou rien (TOR), 0 ou 1, Low ou High, 0 V ou 5 V.'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **analogique** si :'
      choices:
      - il évolue de façon continue dans le temps
      - il ne peut prendre que deux valeurs
      - il prend un nombre fini de valeurs codées en 0 et en 1
      - il est toujours sinusoïdal
      answer: 0
      feedback:
      - null
      - 'Non : c''est la définition d''un signal logique (ou binaire).'
      - 'Non : c''est la définition d''un signal numérique.'
      - 'Non : un signal analogique peut être périodique ou non, sinusoïdal ou non.'
      explanation: 'Exemple : la tension aux bornes d''une photorésistance varie continûment avec la luminosité.'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: 'Un signal est dit **numérique** si :'
      choices:
      - il prend un nombre fini de valeurs, codées par une suite de 0 et de 1
      - il varie de façon continue dans le temps
      - il ne prend que deux valeurs
      - il est délivré par un capteur analogique
      answer: 0
      feedback:
      - null
      - 'Non : c''est le signal analogique qui varie continûment ; un signal numérique avance par paliers.'
      - 'Non : deux valeurs seulement, c''est un signal **logique** ; un signal numérique est une **suite** de valeurs logiques.'
      - 'Non : un capteur analogique délivre une tension continue ; il faut un CAN pour obtenir un signal numérique.'
      explanation: 'Un signal numérique se compose d''une suite d''informations logiques (0 et 1) qui représentent des nombres : sur 2 bits, 4 valeurs (00, 01, 10, 11).'
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Que délivre un capteur **tout ou rien** (TOR) ?
      choices:
      - une information binaire, 0 ou 1
      - une tension proportionnelle à la grandeur mesurée
      - un mot de 8 bits
      - une fréquence
      answer: 0
      feedback:
      - null
      - 'Non : c''est un capteur proportionnel **analogique**.'
      - 'Non : c''est un capteur proportionnel **numérique** (codeur absolu, par exemple).'
      - 'Non : le capteur TOR compare la grandeur d''entrée à un seuil ; il ne mesure rien.'
      explanation: 'Sous le seuil, la sortie vaut 0 ; au-dessus, elle vaut 1. Exemples : détecteur de présence, interrupteur de fin de course.'
      tags:
      - capteurs
    - type: match
      level: 1
      prompt: Associez chaque composant au bloc de la chaîne d'information auquel il appartient.
      pairs:
      - left: Photorésistance
        right: ACQUÉRIR
      - left: Carte Arduino
        right: TRAITER
      - left: Écran d'affichage
        right: COMMUNIQUER
      tags:
      - chaine-information
    - type: match
      level: 2
      prompt: Associez chaque caractéristique d'un capteur à sa définition.
      pairs:
      - left: Étendue de mesure
        right: valeurs extrêmes pouvant être mesurées
      - left: Résolution
        right: plus petite variation mesurable
      - left: Sensibilité
        right: variation de la sortie rapportée à la variation de l'entrée
      - left: Précision
        right: aptitude à donner une mesure proche de la valeur vraie
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Une **photorésistance** est insérée dans un pont diviseur alimenté en 5 V, la tension étant lue sur une broche analogique de la carte. Quelle est la nature du signal envoyé à la carte ?
      choices:
      - Analogique
      - Logique
      - Numérique
      - Aucune, la photorésistance n'est pas un capteur
      answer: 0
      feedback:
      - null
      - 'Non : la tension ne prend pas seulement deux valeurs, elle varie continûment avec la luminosité.'
      - 'Non : le signal ne devient numérique qu''**après** le convertisseur analogique-numérique de la carte.'
      - 'Non : c''est un capteur **passif** (il doit être alimenté), mais c''est bien un capteur.'
      explanation: 'La luminosité fait varier la résistance, donc la tension du pont diviseur : signal analogique, converti ensuite par le CAN de la carte.'
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: 'Un **codeur absolu** délivre, pour chaque position angulaire de son axe, un mot de données lu sur un disque optique. Ce capteur est :'
      choices:
      - un capteur proportionnel numérique
      - un capteur tout ou rien
      - un capteur proportionnel analogique
      - un actionneur
      answer: 0
      feedback:
      - null
      - 'Non : un capteur TOR ne donne qu''un seul bit ; ici chaque position a un **mot** de plusieurs bits.'
      - 'Non : la sortie n''est pas une tension continue mais une suite de 0 et de 1.'
      - 'Non : un actionneur agit sur le système ; un codeur mesure.'
      explanation: 'Le mot binaire lu sur le disque est proportionnel à la position : c''est un capteur proportionnel numérique. Exemple : N = (10100001)₂ = (161)₁₀.'
      tags:
      - capteurs
    - type: grid
      level: 2
      prompt: Parmi ces capteurs, cochez ceux qui délivrent un signal **analogique**.
      rows:
      - id: pres
        label: Détecteur de présence (tout ou rien)
      - id: photo
        label: Photorésistance dans un pont diviseur
      - id: temp
        label: Sonde de température de sortie 0 à 5 V
      - id: cod
        label: Codeur absolu 8 bits
      - id: bp
        label: Bouton poussoir
      cols:
      - id: A
        label: Signal analogique
      answer:
      - Aphoto
      - Atemp
      labels:
        Apres: détecteur de présence
        Aphoto: photorésistance
        Atemp: sonde de température
        Acod: codeur absolu
        Abp: bouton poussoir
      cellFeedback:
        Apres: 'sa sortie ne prend que deux valeurs : signal logique (TOR)'
        Aphoto: 'la tension varie continûment avec la luminosité : signal analogique'
        Atemp: 'la tension varie continûment entre 0 et 5 V : signal analogique'
        Acod: 'il délivre un mot de 8 bits : signal numérique'
        Abp: 'appuyé ou relâché : signal logique'
      explanation: Analogique = variation continue. Le détecteur de présence et le bouton poussoir sont logiques (TOR) ; le codeur absolu est numérique.
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Pourquoi un capteur TOR possède-t-il en pratique **deux** seuils distincts, un seuil haut VT+ et un seuil bas VT− ?
      choices:
      - Pour éviter que la sortie ne devienne instable quand l'entrée est très proche du seuil
      - Pour mesurer deux grandeurs physiques différentes
      - Pour augmenter la précision de la mesure
      - Pour coder la sortie sur 2 bits
      answer: 0
      feedback:
      - null
      - 'Non : les deux seuils portent sur la **même** grandeur d''entrée.'
      - 'Non : un capteur TOR ne mesure pas, il détecte un franchissement.'
      - 'Non : la sortie d''un capteur TOR est binaire, donc sur 1 bit.'
      explanation: 'La sortie passe à 1 quand l''entrée dépasse VT+ et ne retombe à 0 que lorsqu''elle passe sous VT− : ce décalage (hystérésis) empêche la sortie de battre autour du seuil.'
      tags:
      - capteurs
    - type: mcq
      level: 2
      prompt: Qu'est-ce qui caractérise le schéma-bloc d'un **système asservi** (régulateur de vitesse, servomoteur…) ?
      choices:
      - Il comporte une boucle de retour avec un capteur
      - Il ne comporte que des blocs en série
      - Il ne comporte aucun capteur
      - Il ne fonctionne qu'avec des signaux logiques
      answer: 0
      feedback:
      - null
      - 'Non : sans retour d''information, le système ne peut pas comparer ce qu''il fait à ce qu''il doit faire.'
      - 'Non : c''est justement le capteur de la boucle de retour qui mesure la sortie.'
      - 'Non : la nature des signaux ne change rien au principe de l''asservissement.'
      explanation: 'Consigne → comparateur → correcteur → système → sortie, et une boucle de retour passant par le capteur : le système corrige en permanence l''écart détecté.'
      tags:
      - asservissement
    - type: order
      level: 2
      prompt: Dans une serre automatisée, remettez dans l'ordre le trajet de l'information, de la grandeur physique à l'action.
      steps:
      - La luminosité éclaire la photorésistance (grandeur physique)
      - Le pont diviseur délivre une tension analogique (ACQUÉRIR)
      - Le convertisseur analogique-numérique fournit la valeur N (ACQUÉRIR)
      - La carte compare N au seuil programmé (TRAITER)
      - Le transistor de commande alimente le moteur du volet (COMMUNIQUER)
      tags:
      - chaine-information
    - type: input
      level: 3
      prompt: Dans un pont diviseur alimenté sous Ve = 5,0 V, la photorésistance R1 vaut 3,0 kΩ et la résistance fixe R2 vaut 2,0 kΩ. Quelle tension Vs mesure-t-on aux bornes de R1 ?
      answer: '3'
      numeric: true
      tolerance: 0.05
      unit: V
      explanation: 'Vs = R1 × Ve ÷ (R1 + R2) = 3 000 × 5 ÷ 5 000 = 3,0 V. Erreur classique : mettre R2 au numérateur, ce qui donne 2,0 V (la tension aux bornes de R2).'
      tags:
      - capteurs
    - type: mcq
      level: 3
      prompt: Sur un codeur incrémental à deux pistes A et B décalées d'un quart de période, comment détermine-t-on le **sens de rotation** du disque ?
      choices:
      - En regardant, au moment d'un front descendant de la voie A, si la voie B est à 1 ou à 0
      - En comptant le nombre d'impulsions de la voie A par seconde
      - En mesurant la largeur des impulsions de la piste Z
      - En comparant l'amplitude des signaux A et B
      answer: 0
      feedback:
      - null
      - 'Non : compter les impulsions donne l''angle parcouru ou la vitesse, pas le sens.'
      - 'Non : la piste Z donne une impulsion par tour, c''est un repère de position, pas un sens.'
      - 'Non : les deux voies délivrent des signaux logiques de même amplitude ; seul leur décalage dans le temps change.'
      explanation: 'La seconde piste est décalée de 25 % : selon le sens, la voie B vaut 1 ou 0 au moment d''un front descendant de la voie A.'
      tags:
      - capteurs
  - id: info-signaux
    title: Signaux, MLI et conversion
    icon: 📈
    description: Période, fréquence, rapport cyclique et valeur moyenne d'une MLI ; quantum, nombre de bits et résolution d'un CAN.
    prerequisites:
    - info-chaine
    lesson: lessons/info-signaux.md
    items:
    - type: mcq
      level: 1
      prompt: Que représente la **période** T d'un signal périodique ?
      choices:
      - La durée au bout de laquelle le signal se répète, en secondes
      - Le nombre de répétitions par seconde
      - La valeur maximale du signal
      - La durée du niveau haut
      answer: 0
      feedback:
      - null
      - 'Non : c''est la **fréquence**, en hertz.'
      - 'Non : c''est l''amplitude du signal.'
      - 'Non : c''est la durée Th du niveau haut, utilisée pour le rapport cyclique.'
      explanation: La période s'exprime en secondes (s) ; la fréquence en est l'inverse.
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Un signal périodique a une période T = 20 ms. Quelle est sa fréquence ?
      choices:
      - 50 Hz
      - 20 Hz
      - 0,05 Hz
      - 2 000 Hz
      answer: 0
      feedback:
      - null
      - 'Non : tu as recopié la valeur de la période ; la fréquence n''est pas égale à la période.'
      - 'Non : tu as calculé T au lieu de 1 ÷ T, ou tu as oublié de convertir les millisecondes en secondes.'
      - 'Non : erreur de conversion, 20 ms = 0,020 s et non 0,000 5 s.'
      explanation: f = 1 ÷ T = 1 ÷ 0,020 = 50 Hz. Il faut toujours convertir la période en secondes avant de calculer.
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Quelle relation lie la tension efficace à la tension maximale d'une tension alternative sinusoïdale ?
      choices:
      - U eff = U max ÷ √2
      - U eff = U max × √2
      - U eff = U max ÷ 2
      - U eff = 2 × U max
      answer: 0
      feedback:
      - null
      - 'Non : √2 est au dénominateur ; la valeur efficace est toujours **plus petite** que la valeur maximale.'
      - 'Non : on divise par √2 ≈ 1,414, pas par 2.'
      - 'Non : la valeur efficace ne peut pas dépasser la valeur maximale.'
      explanation: La tension efficace est la valeur de la tension continue qui produirait le même effet ; c'est elle que mesure un voltmètre.
      tags:
      - signaux
    - type: mcq
      level: 1
      prompt: Dans un signal **MLI** (modulation par largeur d'impulsion), à quoi correspond le rapport cyclique α ?
      choices:
      - À la durée du niveau haut divisée par la période
      - À la période divisée par la durée du niveau haut
      - À la tension maximale divisée par la tension moyenne
      - À la fréquence du signal
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''inverse ; le rapport cyclique ne peut jamais dépasser 100 %.'
      - 'Non : c''est le rapport de deux durées, pas de deux tensions.'
      - 'Non : la fréquence d''une MLI est fixe ; c''est la largeur des impulsions que l''on fait varier.'
      explanation: 'α = Th ÷ T, sans unité, ou exprimé en pourcents : α = Th ÷ T × 100.'
      tags:
      - mli
    - type: input
      level: 2
      prompt: Un signal MLI a une période T = 2 ms et reste au niveau haut pendant Th = 0,5 ms. Quel est son rapport cyclique, en % ?
      answer: '25'
      numeric: true
      tolerance: 0.5
      unit: '%'
      explanation: α = Th ÷ T × 100 = 0,5 ÷ 2 × 100 = 25 %. Les deux durées doivent être exprimées dans la même unité, ici en millisecondes.
      tags:
      - mli
    - type: input
      level: 2
      prompt: Un moteur à courant continu est piloté en MLI sous U max = 12 V, avec T = 2 ms et Th = 1,4 ms. Quelle est la tension moyenne appliquée au moteur ?
      answer: '8.4'
      numeric: true
      tolerance: 0.1
      unit: V
      explanation: U moyenne = U max × Th ÷ T = 12 × 1,4 ÷ 2 = 12 × 0,70 = 8,4 V. Le rapport cyclique vaut ici 70 %.
      tags:
      - mli
    - type: mcq
      level: 1
      prompt: 'Le **quantum** q d''un convertisseur analogique-numérique est :'
      choices:
      - la variation minimale du signal d'entrée qui fait varier d'une unité la sortie numérique
      - la valeur maximale que peut prendre le signal d'entrée
      - le nombre de bits du convertisseur
      - le temps mis pour effectuer une conversion
      answer: 0
      feedback:
      - null
      - 'Non : c''est l''amplitude (l''étendue) du signal d''entrée, qui figure au numérateur de q.'
      - 'Non : le nombre de bits est n ; il intervient par 2ⁿ au dénominateur.'
      - 'Non : c''est le temps de conversion, une autre caractéristique du convertisseur.'
      explanation: q = amplitude du signal d'entrée ÷ 2ⁿ. Le quantum s'exprime dans l'unité de la grandeur d'entrée (souvent le volt). Plus q est petit, plus le signal numérisé est fidèle.
      tags:
      - can
    - type: mcq
      level: 1
      prompt: Comment appelle-t-on, en anglais, un convertisseur analogique-numérique (CAN) ?
      choices:
      - ADC (*Analog to Digital Converter*)
      - DAC (*Digital to Analog Converter*)
      - PWM (*Pulse Width Modulation*)
      - CAN (*Controller Area Network*)
      answer: 0
      feedback:
      - null
      - 'Non : le DAC est le convertisseur **numérique-analogique**, c''est-à-dire l''opération inverse (attention, certains manuels commettent cette erreur).'
      - 'Non : PWM est le nom anglais de la MLI, une modulation, pas une conversion.'
      - 'Non : CAN est bien le sigle français, mais *Controller Area Network* désigne un bus de communication automobile.'
      explanation: CAN (français) = ADC (anglais). Le convertisseur inverse, du numérique vers l'analogique, est le DAC (CNA en français).
      tags:
      - can
    - type: input
      level: 2
      prompt: Un CAN **8 bits** numérise une tension d'entrée d'amplitude 5 V. Quel est son quantum, exprimé en mV ? (arrondir au centième)
      answer: '19.53'
      numeric: true
      tolerance: 0.1
      unit: mV
      explanation: 'q = amplitude ÷ 2ⁿ = 5 ÷ 2⁸ = 5 ÷ 256 = 0,019 531 25 V ≈ 19,53 mV. Erreur classique : diviser par 8 (le nombre de bits) au lieu de 2⁸.'
      tags:
      - can
    - type: input
      level: 2
      prompt: Un CAN **10 bits** numérise une tension d'entrée d'amplitude 5 V. Quel est son quantum, exprimé en mV ? (arrondir au centième)
      answer: '4.88'
      numeric: true
      tolerance: 0.05
      unit: mV
      explanation: 'q = 5 ÷ 2¹⁰ = 5 ÷ 1 024 = 0,004 882 8 V ≈ 4,88 mV : quatre fois plus fin qu''avec un CAN 8 bits.'
      tags:
      - can
    - type: mcq
      level: 2
      prompt: Combien de valeurs différentes peut-on coder sur **3 bits** ?
      choices:
      - 8 valeurs, de 0 à 7
      - 3 valeurs, de 0 à 2
      - 6 valeurs, de 0 à 5
      - 9 valeurs, de 0 à 8
      answer: 0
      feedback:
      - null
      - 'Non : tu confonds le nombre de bits et le nombre de valeurs.'
      - 'Non : tu as calculé 2 × 3 au lieu de 2³.'
      - 'Non : tu as calculé 3² = 9 au lieu de 2³ = 8 ; et le comptage commence à 0, donc on va de 0 à 7.'
      explanation: 'Sur n bits, on code 2ⁿ valeurs, numérotées de 0 à 2ⁿ − 1 : sur 3 bits, 8 valeurs de 000 à 111.'
      tags:
      - can
    - type: mcq
      level: 2
      prompt: Un CAN 10 bits réalise une conversion **unipolaire**. Quelles valeurs sa sortie numérique peut-elle prendre ?
      choices:
      - de 0 à 1 023
      - de 0 à 1 024
      - de 1 à 1 024
      - de −512 à 511
      answer: 0
      feedback:
      - null
      - 'Non : il y a bien 1 024 valeurs, mais la première est 0, donc la dernière est 2¹⁰ − 1 = 1 023.'
      - 'Non : le comptage commence à 0, pas à 1.'
      - 'Non : c''est l''intervalle d''une conversion **bipolaire**, de −2ⁿ⁻¹ à 2ⁿ⁻¹ − 1.'
      explanation: 'Conversion unipolaire : la sortie va de 0 à 2ⁿ − 1. Piège classique : 2ⁿ est le **nombre** de valeurs, 2ⁿ − 1 la **plus grande** valeur.'
      tags:
      - can
    - type: order
      level: 2
      prompt: Remettez dans l'ordre les étapes de la numérisation d'une grandeur physique.
      steps:
      - Le capteur transforme la grandeur physique en une tension analogique
      - On prélève la valeur de cette tension à intervalles de temps réguliers (échantillonnage)
      - Le convertisseur compare la tension prélevée à des paliers de largeur q
      - Le convertisseur délivre le mot binaire N, codé sur n bits
      - La carte à microcontrôleur traite la valeur N
      tags:
      - can
    - type: input
      level: 3
      prompt: Deux signaux de même période T = 20 ms sont décalés de Δt = 2 ms. Quel est leur déphasage, en degrés ?
      answer: '36'
      numeric: true
      tolerance: 0.5
      unit: °
      explanation: 'φ = Δt × 360 ÷ T = 2 × 360 ÷ 20 = 36°. En radians : φ = 2 × 2π ÷ 20 ≈ 0,63 rad. Une période entière correspond à un tour, soit 360°.'
      tags:
      - signaux
    - type: mcq
      level: 3
      prompt: On numérise la même tension analogique 0 à 5 V avec un CAN 8 bits, puis avec un CAN 10 bits. Que peut-on affirmer ?
      choices:
      - Le CAN 10 bits a un quantum plus petit, donc un signal numérisé plus fidèle
      - Le CAN 10 bits a un quantum plus grand, donc un signal numérisé plus fidèle
      - Les deux CAN ont le même quantum, seule la vitesse change
      - Le CAN 8 bits est plus fidèle car il occupe moins de mémoire
      answer: 0
      feedback:
      - null
      - 'Non : le raisonnement sur la fidélité est bon, mais q = amplitude ÷ 2ⁿ **diminue** quand n augmente.'
      - 'Non : le quantum dépend du nombre de bits : 5 ÷ 256 ≈ 19,53 mV contre 5 ÷ 1 024 ≈ 4,88 mV.'
      - 'Non : l''occupation mémoire n''a aucun rapport avec la fidélité de la numérisation.'
      explanation: q (8 bits) ≈ 19,53 mV ; q (10 bits) ≈ 4,88 mV, soit 4 fois moins (2¹⁰⁻⁸ = 4). Plus le quantum est petit, plus le signal numérisé est fidèle.
      tags:
      - can
    - type: input
      level: 3
      prompt: Un codeur absolu doit distinguer au moins 360 positions angulaires (une par degré). Combien de bits, au minimum, son mot de données doit-il comporter ?
      answer: '9'
      numeric: true
      tolerance: 0
      unit: bits
      explanation: 'Sur n bits, on code 2ⁿ positions : 2⁸ = 256 < 360, donc 8 bits ne suffisent pas ; 2⁹ = 512 ≥ 360. Il faut 9 bits.'
      tags:
      - can
    - type: guided
      level: 3
      title: 'Serre automatisée : de la luminosité à la commande du volet'
      intro: 'Une serre pédagogique est équipée d''une **photorésistance** montée en pont diviseur (résistance fixe R2 = 2,0 kΩ, alimentation Ve = 5,0 V), d''une **carte à microcontrôleur** dont le CAN est un **convertisseur 10 bits** de plage d''entrée 0 à 5 V, et d''un **moteur à courant continu 12 V** qui entraîne un volet d''ombrage, piloté en MLI.


        Au moment de la mesure, la photorésistance vaut R1 = 3,0 kΩ.

        {{emoji:🌱}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Quelle est la nature du signal délivré par la photorésistance à l''entrée du CAN ?'
        choices:
        - Analogique
        - Logique
        - Numérique
        - Périodique
        answer:
        - 0
