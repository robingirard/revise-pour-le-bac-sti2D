# Unités et conversions — écrit à la 9e session (17 sept. 2026) à partir des fiches de
# révision distribuées en classe (voir docs/notes/fiches-classe.md). Les valeurs des fiches
# sont conservées : ce sont des documents du professeur, et le fils doit pouvoir s'y retrouver.
units:
- id: conversions
  matiere: ingenierie
  title: Unités et conversions
  description: 'L''outil de base de toutes les matières : préfixes et puissances de 10, surfaces, volumes et capacités,
    temps et vitesses, unités composées. Ce que le calcul ne pardonne pas.'
  skills:
  - id: conv-prefixes
    title: Préfixes, puissances de 10 et unités électriques
    icon: 🔢
    description: 'Nano, micro, milli, kilo, méga, giga : lire un préfixe, changer d''unité, écrire en puissance
      de 10, et appliquer la loi d''Ohm sans se tromper d''unité.'
    prerequisites: []
    lesson: lessons/conv-prefixes.md
    items:
    - type: mcq
      level: 1
      prompt: 'Le préfixe **milli** (symbole m) multiplie l''unité par :'
      choices:
      - $10^{-3}$
      - $10^{-6}$
      - $10^{-2}$
      - $10^{3}$
      answer: 0
      feedback:
      - null
      - 'Non : $10^{-6}$, c''est **micro** ($\mu$). Milli est mille fois plus grand.'
      - 'Non : $10^{-2}$, c''est **centi** (comme dans centimètre). Milli divise par mille, pas par cent.'
      - 'Non : $10^{3}$, c''est **kilo**. Milli **divise** par mille, il ne multiplie pas.'
      explanation: $1$ mA $=10^{-3}$ A $=0{,}001$ A. Le préfixe milli divise l'unité par mille.
    - type: mcq
      level: 1
      prompt: Quel symbole note le préfixe **micro** ?
      choices:
      - $\mu$
      - m
      - M
      - mc
      answer: 0
      feedback:
      - null
      - 'Non : « m » minuscule, c''est **milli** ($10^{-3}$). Micro est mille fois plus petit.'
      - 'Non : « M » majuscule, c''est **méga** ($10^{6}$) — l''exact opposé.'
      - 'Non : cette notation n''existe pas dans le Système international.'
      explanation: 'Micro s''écrit avec la lettre grecque mu, $\mu$ : $1\ \mu$A $=10^{-6}$ A. Attention à la casse
        — « m » et « M » sont deux préfixes différents.'
    - type: match
      level: 1
      prompt: Associez chaque préfixe à la puissance de 10 qu'il représente.
      pairs:
      - left: nano (n)
        right: $10^{-9}$
      - left: micro ($\mu$)
        right: $10^{-6}$
      - left: milli (m)
        right: $10^{-3}$
      - left: kilo (k)
        right: $10^{3}$
      - left: méga (M)
        right: $10^{6}$
      - left: giga (G)
        right: $10^{9}$
      explanation: 'Les préfixes usuels avancent de trois en trois : $10^{-9}$, $10^{-6}$, $10^{-3}$, puis $10^{3}$,
        $10^{6}$, $10^{9}$.'
    - type: input
      level: 1
      prompt: Un courant vaut $1$ mA. Combien cela fait-il d'**ampères** ?
      answer: 0,001
      numeric: true
      tolerance: 1.0e-09
      unit: A
      explanation: $1$ mA $=1\times10^{-3}$ A $=0{,}001$ A.
    - type: input
      level: 1
      prompt: Une résistance porte l'indication $2{,}2\ \mathrm{k\Omega}$. Combien vaut-elle en **ohms** ?
      answer: '2200'
      numeric: true
      tolerance: 0.5
      unit: Ω
      explanation: $2{,}2\ \mathrm{k\Omega}=2{,}2\times10^{3}\ \Omega=2\,200\ \Omega$.
    - type: mcq
      level: 1
      prompt: 'Une centrale délivre $1$ MW. Cela représente :'
      choices:
      - $10^{6}$ W
      - $10^{3}$ W
      - $10^{9}$ W
      - $10^{-6}$ W
      answer: 0
      feedback:
      - null
      - 'Non : $10^{3}$ W, c''est $1$ **k**W. Le méga est mille fois plus grand que le kilo.'
      - 'Non : $10^{9}$ W, c''est $1$ **G**W. On dépasse d''un cran.'
      - 'Non : le M majuscule agrandit l''unité ; c''est le $\mu$ qui la rapetisse.'
      explanation: $1$ MW $=10^{6}$ W $=1\,000\,000$ W, soit mille kilowatts.
    - type: input
      level: 1
      prompt: Un capteur consomme $0{,}035$ A. Combien cela fait-il de **milliampères** ?
      answer: '35'
      numeric: true
      tolerance: 0.01
      unit: mA
      explanation: 'Passer des ampères aux milliampères, c''est **multiplier par mille** : $0{,}035\times1\,000=35$
        mA.'
    - type: mcq
      level: 2
      prompt: |-
        Sur cet escalier des préfixes, combien de **milliwatts** y a-t-il dans $1$ kilowatt ?

        {{fig:conv-escalier-prefixes-muet}}
      choices:
      - $10^{6}$ mW
      - $10^{3}$ mW
      - $10^{-6}$ mW
      - $10^{9}$ mW
      answer: 0
      feedback:
      - null
      - 'Non : $10^{3}$ ne fait qu''une marche. De kilo à milli il y en a **deux**, et chacune vaut mille.'
      - 'Non : le milliwatt est plus **petit** que le kilowatt, il en faut donc beaucoup — le résultat est plus
        grand que 1.'
      - 'Non : $10^{9}$ ferait trois marches, ce serait le passage du giga au milli.'
      explanation: 'De kilo à l''unité : $\times10^{3}$. De l''unité à milli : encore $\times10^{3}$. Au total
        $10^{3}\times10^{3}=10^{6}$ : $1$ kW $=1\,000\,000$ mW.'
    - type: input
      level: 2
      prompt: Un courant de fuite vaut $12\ \mu$A. Combien cela fait-il de **milliampères** ?
      answer: 0,012
      numeric: true
      tolerance: 1.0e-09
      unit: mA
      explanation: 'Micro et milli sont séparés d''une marche : $12\ \mu$A $=12\times10^{-3}$ mA $=0{,}012$ mA.'
    - type: input
      level: 2
      prompt: Un voltmètre affiche $500$ mV. Combien cela fait-il de **volts** ?
      answer: 0,5
      numeric: true
      tolerance: 1.0e-09
      unit: V
      explanation: $500$ mV $=500\times10^{-3}$ V $=0{,}5$ V. Un demi-volt.
    - type: input
      level: 2
      prompt: Une résistance vaut $47\,000\ \Omega$. Combien cela fait-il de **kilohms** ?
      answer: '47'
      numeric: true
      tolerance: 0.01
      unit: kΩ
      explanation: 'On divise par mille : $47\,000\ \Omega=47\ \mathrm{k\Omega}$. C''est la valeur qu''on lit
        sur les anneaux de couleur d''une résistance courante.'
    - type: mcq
      level: 2
      prompt: Quelle est l'**écriture scientifique** du nombre $0{,}000\,12$ ?
      choices:
      - $1{,}2\times10^{-4}$
      - $12\times10^{-5}$
      - $1{,}2\times10^{-3}$
      - $0{,}12\times10^{-3}$
      answer: 0
      feedback:
      - null
      - 'La valeur est juste, mais ce n''est pas l''écriture **scientifique** : la mantisse doit être comprise
        entre $1$ et $10$, or ici elle vaut $12$.'
      - 'Non : $1{,}2\times10^{-3}=0{,}001\,2$, dix fois trop grand. Comptez les rangs après la virgule.'
      - 'La valeur est juste, mais la mantisse $0{,}12$ est plus petite que $1$ : ce n''est pas l''écriture scientifique.'
      explanation: 'En écriture scientifique, un seul chiffre non nul avant la virgule : $0{,}000\,12=1{,}2\times10^{-4}$.'
    - type: input
      level: 2
      prompt: Écrivez $92{,}2\times10^{3}$ **sans puissance de 10** (écriture décimale).
      answer: '92200'
      numeric: true
      tolerance: 0.5
      explanation: '$\times10^{3}$ décale la virgule de trois rangs vers la droite : $92{,}2\to922\to9\,220\to92\,200$.'
    - type: grid
      level: 2
      prompt: Pour chaque égalité, cochez si elle est **juste** ou **fausse**.
      rows:
      - id: a
        label: $1\ \mathrm{k\Omega}=1\,000\ \Omega$
      - id: b
        label: $1\ \mu\mathrm{F}=10^{-3}$ F
      - id: c
        label: $1$ GW $=1\,000$ MW
      - id: d
        label: $1$ mA $=10^{-3}$ A
      - id: e
        label: $1$ nm $=10^{-6}$ m
      cols:
      - id: J
        label: Juste
      - id: F
        label: Fausse
      answer:
      - Ja
      - Fb
      - Jc
      - Jd
      - Fe
      cellFeedback:
        Fa: '$1\ \mathrm{k\Omega}$ vaut bien $1\,000\ \Omega$ : kilo multiplie par mille.'
        Jb: $1\ \mu$F $=10^{-6}$ F. C'est $1$ **m**F qui vaut $10^{-3}$ F.
        Fc: 'Giga et méga sont séparés de $10^{3}$ : $1$ GW $=1\,000$ MW, l''égalité est juste.'
        Fd: C'est la définition même du préfixe milli.
        Je: $1$ nm $=10^{-9}$ m. $10^{-6}$ m, c'est le **micro**mètre.
      explanation: 'Les deux pièges sont les préfixes voisins : $\mu$ ($10^{-6}$) contre m ($10^{-3}$), et n ($10^{-9}$)
        contre $\mu$ ($10^{-6}$).'
    - type: order
      level: 2
      prompt: Rangez ces cinq intensités de la **plus petite à la plus grande**.
      steps:
      - $12\ \mu$A
      - $0{,}35$ mA
      - $10$ mA
      - $0{,}5$ A
      - $2$ kA
      explanation: 'Tout ramener à la même unité, l''ampère : $12\times10^{-6}$ ; $3{,}5\times10^{-4}$ ; $10^{-2}$
        ; $0{,}5$ ; $2\,000$. Comparer des nombres sans les ramener à la même unité est la première source d''erreur.'
    - type: input
      level: 3
      prompt: |-
        Ce dipôle a une résistance $R=100\ \Omega$ et il est traversé par un courant $I=10$ mA. Quelle est la tension $U$ à ses bornes, en **volts** ?

        {{fig:conv-loi-ohm-muet}}
      answer: '1'
      numeric: true
      tolerance: 0.01
      unit: V
      explanation: |-
        On convertit d'abord : $I=10$ mA $=0{,}010$ A. Puis $U=R\times I=100\times0{,}010=1$ V.

        {{fig:conv-loi-ohm}}
    - type: input
      level: 3
      prompt: |-
        Sous une tension $U=12$ V, ce dipôle n'est traversé que par $I=12\ \mu$A. Quelle est sa résistance, en **mégohms** ?

        {{fig:conv-loi-ohm-muet}}
      answer: '1'
      numeric: true
      tolerance: 0.01
      unit: MΩ
      explanation: '$I=12\ \mu$A $=12\times10^{-6}$ A. Alors $R=\dfrac{U}{I}=\dfrac{12}{12\times10^{-6}}=10^{6}\
        \Omega=1\ \mathrm{M\Omega}$. Un courant très faible sous une tension ordinaire, c''est une très grande
        résistance : l''ordre de grandeur confirme le calcul.'
    - type: input
      level: 3
      prompt: |-
        Ce dipôle de résistance $R=10\ \mathrm{k\Omega}$ est soumis à une tension $U=500$ mV. Quelle est l'intensité qui le traverse, en **microampères** ?

        {{fig:conv-loi-ohm-muet}}
      answer: '50'
      numeric: true
      tolerance: 0.5
      unit: µA
      explanation: '$U=0{,}5$ V et $R=10\,000\ \Omega$, donc $I=\dfrac{0{,}5}{10\,000}=5\times10^{-5}$ A. Reste
        à l''exprimer en microampères : $5\times10^{-5}$ A $=50\times10^{-6}$ A $=50\ \mu$A.'
    - type: input
      level: 3
      prompt: |-
        Ce dipôle de résistance $R=12\ \mathrm{k\Omega}$ est soumis à une tension $U=10$ V. Quelle est l'intensité qui le traverse, en **milliampères** (deux décimales) ?

        {{fig:conv-loi-ohm-muet}}
      answer: 0,83
      numeric: true
      tolerance: 0.02
      unit: mA
      explanation: '$I=\dfrac{10}{12\,000}=8{,}33\times10^{-4}$ A. En milliampères : $8{,}33\times10^{-4}$ A $=0{,}833$
        mA $\approx0{,}83$ mA.'
    - type: mcq
      level: 3
      prompt: Un élève calcule la tension aux bornes d'une résistance de $100\ \Omega$ parcourue par $10$ mA et
        trouve $U=100\times10=1\,000$ V. Où est son erreur ?
      choices:
      - Il a gardé l'intensité en milliampères ; la loi d'Ohm demande des ampères
      - Il a confondu la multiplication et la division
      - Il a oublié de convertir la résistance en kilohms
      - Il a inversé $U$ et $I$ dans la formule
      answer: 0
      feedback:
      - null
      - 'Non : l''opération est la bonne, $U=R\times I$. C''est la valeur entrée dans le calcul qui n''est pas
        dans la bonne unité.'
      - 'Non : la résistance est déjà en ohms, qui est l''unité attendue. C''est l''autre grandeur qui pose problème.'
      - 'Non : la formule est bien écrite, $U=R\times I$ ; le résultat est faux d''un facteur mille, ce qui désigne
        un préfixe oublié.'
      explanation: $U=R\,I$ ne vaut que si $U$ est en volts, $R$ en ohms et $I$ en **ampères**. Avec $I=0{,}010$
        A on obtient $1$ V — mille fois moins. Un résultat faux d'un facteur $1\,000$ trahit presque toujours
        un préfixe oublié.
    - type: input
      level: 3
      prompt: Une LED est alimentée sous $5$ V à travers une résistance de série de $220\ \Omega$. En négligeant
        la tension aux bornes de la LED, quelle intensité traverse le circuit, en **milliampères** (une décimale)
        ?
      answer: 22,7
      numeric: true
      tolerance: 0.3
      unit: mA
      explanation: '$I=\dfrac{U}{R}=\dfrac{5}{220}=0{,}0227$ A $=22{,}7$ mA. Une LED ordinaire supporte $20$ mA
        : la valeur trouvée est du bon ordre de grandeur, ce qui est justement l''intérêt de convertir en milliampères
        plutôt que de rester en ampères.'
    - type: guided
      level: 3
      title: Quatre dipôles, quatre conversions avant le calcul
      intro: |-
        Les quatre questions suivantes portent toutes sur le même montage : un dipôle de résistance $R$, traversé par un courant $I$, aux bornes duquel on mesure une tension $U$.

        À chaque fois, **une des trois grandeurs manque** et les deux autres ne sont pas dans les unités du Système international. La conversion se fait donc **avant** le calcul, jamais après.

        {{fig:conv-loi-ohm-muet}}
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Dans quelles unités les trois grandeurs doivent-elles être exprimées pour appliquer
          la relation qui les lie ?'
        choices:
        - $U$ en volts, $R$ en ohms, $I$ en ampères
        - $U$ en volts, $R$ en kilohms, $I$ en milliampères
        - $U$ en millivolts, $R$ en ohms, $I$ en ampères
        - Peu importe, la relation est vraie dans toutes les unités
        answer:
        - 0
        feedback:
        - null
        - 'Cette combinaison donne par hasard un résultat juste ($\mathrm{k\Omega}\times$ mA $=$ V), mais ce n''est
          pas la règle : dès qu''on change un seul préfixe, elle tombe.'
        - 'Non : la tension doit être en volts, l''unité du Système international.'
        - 'Non : une relation entre grandeurs physiques n''est vraie qu''avec les unités de base ; sinon il faut
          suivre les facteurs de conversion à la main.'
        explanation: 'Les unités du Système international : volt, ohm, ampère. On y ramène tout, on calcule, et
          on reconvertit le résultat si l''énoncé demande une autre unité.'
      - kind: input
        prompt: '**Étape 2.** $R=100\ \Omega$ et $I=10$ mA. Calculez $U$, en **volts**.'
        answer: '1'
        numeric: true
        tolerance: 0.01
        unit: V
        explanation: $I=0{,}010$ A, donc $U=100\times0{,}010=1$ V.
      - kind: input
        prompt: '**Étape 3.** $U=12$ V et $I=12\ \mu$A. Calculez $R$, en **mégohms**.'
        answer: '1'
        numeric: true
        tolerance: 0.01
        unit: MΩ
        explanation: $I=12\times10^{-6}$ A, donc $R=\dfrac{12}{12\times10^{-6}}=10^{6}\ \Omega=1\ \mathrm{M\Omega}$.
      - kind: input
        prompt: '**Étape 4.** $U=500$ mV et $R=10\ \mathrm{k\Omega}$. Calculez $I$, en **microampères**.'
        answer: '50'
        numeric: true
        tolerance: 0.5
        unit: µA
        explanation: $U=0{,}5$ V, $R=10\,000\ \Omega$, donc $I=5\times10^{-5}$ A $=50\ \mu$A.
      - kind: input
        prompt: '**Étape 5.** $U=10$ V et $R=12\ \mathrm{k\Omega}$. Calculez $I$, en **milliampères** (deux décimales).'
        answer: 0,83
        numeric: true
        tolerance: 0.02
        unit: mA
        explanation: |-
          $I=\dfrac{10}{12\,000}=8{,}33\times10^{-4}$ A $=0{,}83$ mA.

          {{fig:conv-loi-ohm}}
      - kind: order
        prompt: '**Étape 6.** Remettez dans l''ordre la méthode à suivre à chaque fois.'
        steps:
        - Repérer la grandeur cherchée et les deux grandeurs données
        - Convertir les deux données dans les unités du Système international
        - Écrire la relation sous la forme qui isole la grandeur cherchée
        - Faire le calcul numérique
        - Reconvertir le résultat dans l'unité demandée par l'énoncé
        - Vérifier l'ordre de grandeur du résultat
        explanation: 'La conversion vient **avant** le calcul, et la vérification de l''ordre de grandeur **après**
          : un facteur mille de trop se voit immédiatement.'
  - id: conv-surfaces
    title: Longueurs et surfaces
    icon: 📐
    description: 'Le tableau des surfaces et son facteur mille fois moins évident qu''il n''y paraît : d''une
      unité à la suivante on multiplie par cent, pas par dix.'
    prerequisites:
    - conv-prefixes
    lesson: lessons/conv-surfaces.md
    items:
    - type: mcq
      level: 1
      prompt: Combien de mètres carrés y a-t-il dans $1\ \mathrm{dam^2}$ ?
      choices:
      - $100\ \mathrm{m^2}$
      - $10\ \mathrm{m^2}$
      - $1\,000\ \mathrm{m^2}$
      - $0{,}01\ \mathrm{m^2}$
      answer: 0
      feedback:
      - null
      - 'Attention : $10$ est le facteur des **longueurs** ($1$ dam $=10$ m). Une surface met en jeu deux longueurs.'
      - 'Non : $1\,000$ est le facteur des **volumes**, où trois longueurs se multiplient.'
      - 'Non : le décamètre carré est plus **grand** que le mètre carré, il en contient donc plusieurs.'
      explanation: $1\ \mathrm{dam^2}=10\ \mathrm{m}\times10\ \mathrm{m}=100\ \mathrm{m^2}$. Chaque changement
        d'unité de surface vaut $10^{2}$, parce que le facteur $10$ des longueurs y intervient **deux fois**.
    - type: mcq
      level: 1
      prompt: Pourquoi passe-t-on d'une unité de surface à la suivante en multipliant par $100$, et non par $10$
        ?
      choices:
      - 'Parce qu''une surface est le produit de deux longueurs : le facteur $10$ y intervient deux fois'
      - Parce que les surfaces se mesurent toujours en centaines d'unités
      - C'est une convention du Système international, sans justification
      - Parce que le tableau des surfaces a deux fois plus de colonnes
      answer: 0
      feedback:
      - null
      - 'Non : rien n''oblige une surface à valoir des centaines d''unités. Le facteur vient du calcul lui-même.'
      - 'Non : ce n''est pas une convention, c''est une conséquence. Un carré de $1$ dam de côté mesure bien $10\
        \mathrm{m}\times10\ \mathrm{m}$.'
      - Le tableau **a** deux colonnes par unité, mais c'est la conséquence du facteur $100$, pas sa cause.
      explanation: '$1\ \mathrm{km^2}=(1\,000\ \mathrm{m})^2=1\,000\times1\,000=10^{6}\ \mathrm{m^2}$ : le facteur
        des longueurs est **élevé au carré**. C''est pour cela que le tableau des surfaces réserve **deux** cases
        par unité.'
    - type: input
      level: 1
      prompt: Combien de mètres carrés y a-t-il dans $1\ \mathrm{km^2}$ ?
      answer: '1000000'
      numeric: true
      tolerance: 0.5
      unit: m²
      explanation: $1\ \mathrm{km^2}=(10^{3}\ \mathrm{m})^{2}=10^{6}\ \mathrm{m^2}=1\,000\,000\ \mathrm{m^2}$.
    - type: input
      level: 1
      prompt: Convertissez $263{,}2\ \mathrm{dm^2}$ en **mètres carrés**.
      answer: 2,632
      numeric: true
      tolerance: 1.0e-06
      unit: m²
      explanation: 'On remonte d''une unité, donc on divise par $100$ : $263{,}2\div100=2{,}632\ \mathrm{m^2}$.'
    - type: input
      level: 1
      prompt: Convertissez $0{,}29\ \mathrm{dm^2}$ en **centimètres carrés**.
      answer: '29'
      numeric: true
      tolerance: 1.0e-06
      unit: cm²
      explanation: |-
        On descend d'une unité, donc on multiplie par $100$ : $0{,}29\times100=29\ \mathrm{cm^2}$.

        {{fig:conv-tableau-surfaces}}
    - type: match
      level: 1
      prompt: Associez chaque unité de surface à sa valeur en mètres carrés.
      pairs:
      - left: $1\ \mathrm{km^2}$
        right: $10^{6}\ \mathrm{m^2}$
      - left: $1\ \mathrm{hm^2}$
        right: $10^{4}\ \mathrm{m^2}$
      - left: $1\ \mathrm{dam^2}$
        right: $10^{2}\ \mathrm{m^2}$
      - left: $1\ \mathrm{dm^2}$
        right: $10^{-2}\ \mathrm{m^2}$
      - left: $1\ \mathrm{cm^2}$
        right: $10^{-4}\ \mathrm{m^2}$
      - left: $1\ \mathrm{mm^2}$
        right: $10^{-6}\ \mathrm{m^2}$
      explanation: 'Les exposants vont de deux en deux : $10^{6}$, $10^{4}$, $10^{2}$, $10^{0}$, $10^{-2}$, $10^{-4}$,
        $10^{-6}$. Le tableau des longueurs, lui, avance de un en un.'
    - type: mcq
      level: 1
      prompt: |-
        Dans un tableau de conversion des surfaces, combien de cases réserve-t-on à chaque unité ?

        {{fig:conv-tableau-surfaces-muet}}
      choices:
      - Deux cases
      - Une case
      - Trois cases
      - Autant que de chiffres du nombre
      answer: 0
      feedback:
      - null
      - C'est le tableau des **longueurs** qui a une case par unité. Pour les surfaces, le facteur $100$ en demande
        davantage.
      - Trois cases par unité, c'est le tableau des **volumes** (facteur $1\,000$).
      - 'Non : le nombre de cases dépend de l''unité, pas du nombre écrit.'
      explanation: Facteur $100=10^{2}$ d'une unité à la suivante, donc **deux** chiffres par unité. Pour les
        volumes ($10^{3}$) ce sera trois, pour les longueurs ($10^{1}$) une seule.
    - type: input
      level: 2
      prompt: Convertissez $290{,}02\ \mathrm{m^2}$ en **centimètres carrés**.
      answer: '2900200'
      numeric: true
      tolerance: 0.5
      unit: cm²
      explanation: 'Du mètre carré au centimètre carré il y a deux unités, donc $\times100\times100=\times10^{4}$
        : $290{,}02\times10\,000=2\,900\,200\ \mathrm{cm^2}$.'
    - type: input
      level: 2
      prompt: Convertissez $0{,}002\ \mathrm{m^2}$ en **millimètres carrés**.
