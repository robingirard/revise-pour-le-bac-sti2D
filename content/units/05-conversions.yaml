      tolerance: 0.005
      unit: ℓ
      explanation: $V=339{,}3\ \mathrm{cm^3}$. Or $1\,000\ \mathrm{cm^3}=1\ \mathrm{dm^3}=1\ \ell$, donc $V=0{,}339\
        \ell$ — un tiers de litre, ce qui est bien l'ordre de grandeur d'une canette.
    - type: input
      level: 3
      prompt: Convertissez $74{,}2\ \mathrm{cm^3}$ en **mètres cubes**.
      answer: 0,0000742
      numeric: true
      tolerance: 1.0e-12
      unit: m³
      explanation: 'Deux unités vers le haut : $\div10^{6}$. Donc $74{,}2\div10^{6}=7{,}42\times10^{-5}=0{,}000\,074\,2\
        \mathrm{m^3}$. Devant un résultat aussi petit, l''écriture scientifique est plus sûre que les zéros après
        la virgule.'
    - type: input
      level: 3
      prompt: Une citerne parallélépipédique mesure $2$ m de long, $1{,}5$ m de large et $1{,}2$ m de haut. Quelle
        est sa contenance, en **litres** ?
      answer: '3600'
      numeric: true
      tolerance: 1
      unit: ℓ
      explanation: '$V=2\times1{,}5\times1{,}2=3{,}6\ \mathrm{m^3}$, et $1\ \mathrm{m^3}=1\,000\ \ell$ : $3\,600\
        \ell$.'
    - type: order
      level: 3
      prompt: Pour convertir $0{,}0025\ \mathrm{hm^3}$ en litres, remettez la méthode dans l'ordre.
      steps:
      - 'Aller d''abord à une unité de volume franche : $\mathrm{hm^3}\to\mathrm{m^3}$, soit $\times10^{6}$'
      - 'Écrire le résultat intermédiaire : $2\,500\ \mathrm{m^3}$'
      - 'Utiliser le pont entre volume et capacité : $1\ \mathrm{m^3}=1\,000\ \ell$'
      - 'Multiplier : $2\,500\times1\,000$'
      - 'Écrire le résultat : $2\,500\,000\ \ell$'
      explanation: On reste dans le tableau des volumes tant qu'on peut, et on n'utilise le pont vers les litres
        qu'une seule fois, au bon endroit. Mélanger les deux à chaque étape est le meilleur moyen de perdre un
        facteur $1\,000$.
    - type: mcq
      level: 3
      prompt: 'Un élève écrit : « une piscine de $50\ \mathrm{m^3}$ contient $50\,000\ \mathrm{cm^3}$ d''eau ».
        Que faut-il corriger ?'
      choices:
      - $50\ \mathrm{m^3}=50\,000\ \mathrm{dm^3}$, soit $50\,000$ litres — les centimètres cubes seraient mille
        fois plus nombreux
      - Rien, le calcul est juste
      - $50\ \mathrm{m^3}=5\,000\ \mathrm{cm^3}$, il a multiplié une fois de trop
      - $50\ \mathrm{m^3}=500\ \mathrm{cm^3}$, le mètre cube est plus petit
      answer: 0
      feedback:
      - null
      - 'Non : $50\,000\ \mathrm{cm^3}$, ce serait $50$ litres — le volume d''une glacière, pas d''une piscine.
        L''ordre de grandeur suffit à repérer l''erreur.'
      - 'Non : le mètre cube est plus **grand** que le centimètre cube, donc le nombre de centimètres cubes doit
        être bien plus grand, pas plus petit.'
      - 'Non : le mètre cube est l''unité la plus grande des trois citées.'
      explanation: 'Le nombre $50\,000$ est juste, c''est l''unité qui ne l''est pas : $50\ \mathrm{m^3}=50\,000\
        \mathrm{dm^3}=50\,000\ \ell=5\times10^{7}\ \mathrm{cm^3}$. Vérifier l''ordre de grandeur — une piscine,
        ce sont des dizaines de milliers de litres — attrape ce genre d''erreur sans refaire le calcul.'
    - type: guided
      level: 3
      title: La cuve de récupération d'eau de pluie
      intro: |-
        Une maison a un toit de $60\ \mathrm{m^2}$ en projection au sol. L'eau de pluie y est collectée et envoyée dans une **cuve de $5\ \mathrm{m^3}$**.

        Un épisode pluvieux dépose une hauteur d'eau de **$25$ mm** sur le toit (c'est ainsi que la météo mesure la pluie : une hauteur, pas un volume).

        On néglige les pertes : toute l'eau tombée sur le toit arrive dans la cuve.
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Comment obtient-on le volume d''eau tombé sur le toit ?'
        choices:
        - En multipliant la surface du toit par la hauteur d'eau, les deux étant dans des unités compatibles
        - En multipliant la surface du toit par $25$
        - En divisant la surface du toit par la hauteur d'eau
        - En additionnant la surface du toit et la hauteur d'eau
        answer:
        - 0
        feedback:
        - null
        - 'Le produit est le bon, mais $25$ est en **millimètres** alors que la surface est en mètres carrés :
          le résultat ne serait ni en $\mathrm{m^3}$ ni en rien de connu.'
        - 'Non : une surface divisée par une longueur donne une longueur, pas un volume.'
        - 'Non : on n''additionne jamais deux grandeurs de natures différentes — une surface et une longueur ne
          sont pas comparables.'
        explanation: 'Un volume est le produit d''une surface par une hauteur : $V=S\times h$. Encore faut-il
          que les deux soient dans des unités qui vont ensemble — $\mathrm{m^2}$ avec m, ou $\mathrm{cm^2}$ avec
          cm.'
      - kind: input
        prompt: '**Étape 2.** Convertissez la hauteur d''eau en **mètres**.'
        answer: 0,025
        numeric: true
        tolerance: 1.0e-09
        unit: m
        explanation: '$25$ mm $=25\times10^{-3}$ m $=0{,}025$ m. Une longueur : le facteur est $1\,000$, pas $10^{6}$.'
      - kind: input
        prompt: '**Étape 3.** Quel volume d''eau tombe sur le toit, en **mètres cubes** ?'
        answer: 1,5
        numeric: true
        tolerance: 0.01
        unit: m³
        explanation: $V=60\times0{,}025=1{,}5\ \mathrm{m^3}$.
      - kind: input
        prompt: '**Étape 4.** Exprimez ce volume en **litres**.'
        answer: '1500'
        numeric: true
        tolerance: 1
        unit: ℓ
        explanation: '$1{,}5\ \mathrm{m^3}\times1\,000=1\,500\ \ell$. Soit $25$ mm de pluie sur $60\ \mathrm{m^2}$
          : une baignoire et demie.'
      - kind: input
        prompt: '**Étape 5.** Quelle part de la cuve cet épisode remplit-il, en **pourcentage** (à l''unité) ?'
        answer: '30'
        numeric: true
        tolerance: 1
        unit: '%'
        explanation: La cuve fait $5\ \mathrm{m^3}=5\,000\ \ell$. Le rapport $\dfrac{1\,500}{5\,000}=0{,}30$,
          soit $30\ \%$. Les deux volumes devaient être dans la **même** unité avant d'être divisés.
      - kind: input
        prompt: '**Étape 6.** Combien d''épisodes identiques faut-il pour remplir complètement la cuve ?'
        answer: '4'
        numeric: true
        tolerance: 0.01
        explanation: '$5\,000\div1\,500=3{,}33$ : trois épisodes ne suffisent pas, il en faut un **quatrième**.
          Un résultat décimal ne s''arrondit pas toujours au plus proche — ici il faut arrondir **au-dessus**,
          parce qu''un épisode partiel ne remplit pas la cuve.'
  - id: conv-temps-vitesses
    title: Temps et vitesses
    icon: ⏱️
    description: Les heures, minutes et secondes qui ne comptent pas par dix, l'écriture décimale d'une durée,
      et le passage des m/s aux km/h dans les deux sens.
    prerequisites:
    - conv-prefixes
    lesson: lessons/conv-temps-vitesses.md
    items:
    - type: mcq
      level: 1
      prompt: Combien de secondes y a-t-il dans une heure ?
      choices:
      - $3\,600$ s
      - $600$ s
      - $1\,000$ s
      - $360$ s
      answer: 0
      feedback:
      - null
      - 'Non : $600$ s, ce sont $10$ minutes. Il y a $60$ minutes dans une heure, et $60$ secondes dans chacune.'
      - 'Non : le temps est la seule grandeur du programme qui ne compte **pas** par puissances de dix.'
      - 'Non : $360$ s, ce sont $6$ minutes. Attention au zéro : $60\times60=3\,600$.'
      explanation: '$1$ h $=60$ min $=60\times60=3\,600$ s. Ce $3\,600$ revient partout : dans les durées, mais
        aussi dans le kilowattheure ($1$ Wh $=3\,600$ J) et dans le facteur $3{,}6$ des vitesses.'
    - type: input
      level: 1
      prompt: Convertissez $3$ minutes en **secondes**.
      answer: '180'
      numeric: true
      tolerance: 0.5
      unit: s
      explanation: $3\times60=180$ s.
    - type: input
      level: 1
      prompt: Convertissez $5$ heures en **minutes**.
      answer: '300'
      numeric: true
      tolerance: 0.5
      unit: min
      explanation: $5\times60=300$ min.
    - type: input
      level: 1
      prompt: Convertissez $360$ minutes en **heures**.
      answer: '6'
      numeric: true
      tolerance: 0.01
      unit: h
      explanation: $360\div60=6$ h. On divise pour aller vers l'unité la plus grande.
    - type: match
      level: 1
      prompt: Associez chaque durée à son écriture **décimale** en heures.
      pairs:
      - left: $1$ h $30$ min
        right: $1{,}5$ h
      - left: $1$ h $15$ min
        right: $1{,}25$ h
      - left: $1$ h $45$ min
        right: $1{,}75$ h
      - left: $1$ h $06$ min
        right: $1{,}1$ h
      - left: $1$ h $20$ min
        right: $1{,}\overline{33}$ h
      explanation: 'L''écriture décimale s''obtient en divisant les minutes par $60$ : $30\div60=0{,}5$ ; $15\div60=0{,}25$
        ; $45\div60=0{,}75$ ; $6\div60=0{,}1$ ; $20\div60=0{,}333\ldots$ Une durée en écriture décimale ne se
        lit donc **jamais** directement sur une montre.'
    - type: mcq
      level: 1
      prompt: |-
        D'après ce schéma, par combien faut-il multiplier une vitesse en m/s pour l'obtenir en km/h ?

        {{fig:conv-vitesses-passage-muet}}
      choices:
      - $3{,}6$
      - $60$
      - $1\,000$
      - $0{,}36$
      answer: 0
      feedback:
      - null
      - 'Non : $60$ est le facteur qui mène des m/s aux m/**min**. Pour les km/h il faut aussi convertir la longueur.'
      - 'Non : $1\,000$ ne convertit que la longueur (m $\to$ km) ; il faut **diviser** en plus par cette valeur,
        pas multiplier.'
      - 'Non : une vitesse en km/h est un **plus grand** nombre que la même vitesse en m/s (une heure contient
        beaucoup de secondes).'
      explanation: |-
        $1$ m/s $=\dfrac{0{,}001\ \mathrm{km}}{\frac{1}{3\,600}\ \mathrm{h}}=\dfrac{3\,600}{1\,000}=3{,}6$ km/h. Le facteur $3{,}6$ n'est rien d'autre que $3\,600\div1\,000$ : la durée et la longueur converties d'un coup.

        {{fig:conv-vitesses-passage}}
    - type: input
      level: 1
      prompt: Un piéton marche à $3$ m/s. Quelle est sa vitesse en **mètres par minute** ?
      answer: '180'
      numeric: true
      tolerance: 0.5
      unit: m/min
      explanation: 'En une minute il y a $60$ secondes, donc il parcourt $60$ fois plus : $3\times60=180$ m/min.'
    - type: input
      level: 2
      prompt: Convertissez $2$ h $30$ min en **minutes**.
      answer: '150'
      numeric: true
      tolerance: 0.5
      unit: min
      explanation: '$2\times60=120$, plus $30$ : $150$ min. On convertit la partie en heures, puis on **ajoute**
        les minutes déjà là.'
    - type: input
      level: 2
      prompt: Convertissez $7$ min $25$ s en **secondes**.
      answer: '445'
      numeric: true
      tolerance: 0.5
      unit: s
      explanation: '$7\times60=420$, plus $25$ : $445$ s.'
    - type: input
      level: 2
      prompt: $152$ s valent $2$ minutes et un certain nombre de secondes. Combien de **secondes** restent-il
        ?
      answer: '32'
      numeric: true
      tolerance: 0.5
      unit: s
      explanation: '$152=2\times60+32$. C''est une division euclidienne : le **quotient** donne les minutes, le
        **reste** donne les secondes. Écrire $152$ s $=2{,}53$ min serait juste aussi, mais ce n''est pas la même
        chose que $2$ min $53$ s.'
    - type: input
      level: 2
      prompt: Convertissez $5$ h $20$ min en **secondes**.
      answer: '19200'
      numeric: true
      tolerance: 1
      unit: s
      explanation: $5$ h $20$ min $=320$ min, et $320\times60=19\,200$ s. Passer par les minutes évite de multiplier
        deux fois de suite sans se relire.
    - type: input
      level: 2
      prompt: Convertissez $5\,100$ s en **minutes**.
      answer: '85'
      numeric: true
      tolerance: 0.5
      unit: min
      explanation: $5\,100\div60=85$ min, soit $1$ h $25$ min.
    - type: grid
      level: 2
      prompt: Pour chaque égalité de durées, cochez si elle est **juste** ou **fausse**.
      rows:
      - id: a
        label: $1{,}5$ h $=1$ h $30$ min
      - id: b
        label: $2{,}5$ min $=2$ min $50$ s
      - id: c
        label: $90$ min $=1{,}5$ h
      - id: d
        label: $1$ h $=100$ min
      - id: e
        label: $0{,}25$ h $=15$ min
      cols:
      - id: J
        label: Juste
      - id: F
        label: Fausse
      answer:
      - Ja
      - Fb
      - Jc
      - Fd
      - Je
      cellFeedback:
        Fa: '$0{,}5$ h $=0{,}5\times60=30$ min : l''égalité est juste.'
        Jb: $0{,}5$ min $=30$ s, pas $50$ s. $2{,}5$ min $=2$ min $30$ s.
        Fc: '$90\div60=1{,}5$ : l''égalité est juste.'
        Jd: Une heure vaut $60$ minutes. Le temps ne compte pas par centaines.
        Fe: '$0{,}25\times60=15$ min : l''égalité est juste.'
      explanation: 'Les deux fausses viennent du même réflexe : traiter la partie décimale comme si elle comptait
        en base dix. Une durée décimale se convertit **toujours** en multipliant par $60$.'
    - type: mcq
      level: 2
      prompt: Un chronomètre affiche $1{,}5$ h. Que faut-il lire ?
      choices:
      - $1$ h $30$ min
      - $1$ h $50$ min
      - $1$ h $5$ min
      - $1$ h $15$ min
      answer: 0
      feedback:
      - null
      - 'C''est l''erreur classique : lire le « 5 » comme des minutes. Mais $0{,}5$ h est une **demi**-heure,
        soit $30$ min.'
      - 'Non : $1$ h $5$ min s''écrirait $1{,}08$ h en décimal ($5\div60=0{,}083$).'
      - 'Non : $1$ h $15$ min vaut $1{,}25$ h.'
      explanation: '$0{,}5$ h $=0{,}5\times60=30$ min. La règle : **partie décimale $\times\,60$** donne les minutes.
        C''est aussi ce que fait une calculatrice quand elle rend $1{,}5$ au lieu de $1$ h $30$.'
    - type: input
      level: 2
      prompt: Un robot se déplace à $2{,}5$ m/s. Quelle est sa vitesse en **kilomètres par heure** ?
      answer: '9'
      numeric: true
      tolerance: 0.05
      unit: km/h
      explanation: $2{,}5\times3{,}6=9$ km/h. Un peu plus qu'un homme qui marche.
    - type: input
      level: 3
      prompt: Une voiture roule à $54$ km/h. Quelle est sa vitesse en **mètres par seconde** ?
      answer: '15'
      numeric: true
      tolerance: 0.05
      unit: m/s
      explanation: '$54\div3{,}6=15$ m/s. Dans ce sens on **divise** : le nombre doit diminuer, puisque la seconde
        est bien plus courte que l''heure.'
    - type: input
      level: 3
      prompt: Un avion de ligne vole à $70$ m/s. Quelle est sa vitesse en **kilomètres par minute** ?
      answer: 4,2
      numeric: true
      tolerance: 0.02
      unit: km/min
      explanation: 'En une minute : $70\times60=4\,200$ m, soit $4{,}2$ km. On convertit la durée, puis la longueur
        — l''ordre n''a pas d''importance, mais faire les deux, si.'
    - type: input
      level: 3
      prompt: Un tapis roulant avance à $300$ m/min. Quelle est sa vitesse en **kilomètres par heure** ?
      answer: '18'
      numeric: true
      tolerance: 0.1
      unit: km/h
      explanation: 'En une heure : $300\times60=18\,000$ m, soit $18$ km. Donc $18$ km/h. (On peut aussi passer
        par les m/s : $300\div60=5$ m/s, puis $5\times3{,}6=18$ km/h.)'
    - type: input
      level: 3
      prompt: Un chariot se déplace à $32{,}4$ km/h. Quelle est sa vitesse en **mètres par minute** ?
      answer: '540'
      numeric: true
      tolerance: 1
      unit: m/min
      explanation: '$32{,}4$ km/h $=32\,400$ m/h, et une heure contient $60$ minutes : $32\,400\div60=540$ m/min.
        (Par les m/s : $32{,}4\div3{,}6=9$ m/s, puis $\times60=540$ m/min.)'
    - type: input
      level: 3
      prompt: Convertissez $1$ h $24$ min $35$ s en **secondes**.
      answer: '5075'
      numeric: true
      tolerance: 1
      unit: s
      explanation: '$1$ h $=3\,600$ s ; $24$ min $=1\,440$ s ; reste $35$ s. Total : $3\,600+1\,440+35=5\,075$
        s. On convertit chaque morceau dans la plus petite unité, puis on additionne.'
    - type: order
      level: 3
      prompt: Rangez ces cinq vitesses de la **plus lente à la plus rapide**.
      steps:
      - $0{,}9$ km/h
      - $1$ m/s
      - $120$ m/min
      - $18$ km/h
      - $0{,}1$ km/s
      explanation: 'Tout en m/s : $0{,}25$ ; $1$ ; $2$ ; $5$ ; $100$. Comparer des vitesses écrites dans cinq
        unités différentes n''a aucun sens tant qu''on ne les a pas ramenées à la même — c''est exactement pour
        cela qu''on convertit.'
    - type: guided
      level: 3
      title: 'Le semi-marathon : de la seconde à la vitesse moyenne'
      intro: |-
        Un coureur boucle un semi-marathon, soit **$21{,}1$ km**, en **$6\,348$ secondes**.

        Le chronomètre officiel affiche un temps en heures, minutes et secondes ; la montre du coureur, elle, affiche une vitesse. Passer de l'un à l'autre, c'est le sujet de cet exercice.
      steps:
      - kind: input
        prompt: '**Étape 1.** Combien de **minutes entières** y a-t-il dans $6\,348$ s ?'
        answer: '105'
        numeric: true
        tolerance: 0.5
        unit: min
        explanation: '$6\,348\div60=105{,}8$ : il y a $105$ minutes entières. On garde le **quotient entier**,
          pas le résultat décimal.'
      - kind: input
        prompt: '**Étape 2.** Combien de **secondes** restent-il au-delà de ces minutes entières ?'
        answer: '48'
        numeric: true
        tolerance: 0.5
        unit: s
        explanation: $105\times60=6\,300$, et $6\,348-6\,300=48$ s. On aurait aussi pu écrire $0{,}8\times60=48$.
      - kind: mcq
        prompt: '**Étape 3.** Quel temps le chronomètre officiel affiche-t-il ?'
        choices:
        - $1$ h $45$ min $48$ s
        - $1$ h $05$ min $48$ s
        - $105$ h $48$ min
        - $1$ h $58$ min $48$ s
        answer:
        - 0
        feedback:
        - null
        - 'Non : $105$ minutes, c''est **une** heure ($60$ min) plus $45$ minutes, et non plus $5$.'
        - 'Non : les $105$ sont des minutes, pas des heures.'
        - 'Non : $105-60=45$, et non $58$.'
        explanation: '$105$ min $=1$ h $45$ min, d''où $1$ h $45$ min $48$ s. Chaque conversion de durée est une
          division euclidienne par $60$ : d''abord les secondes en minutes, puis les minutes en heures.'
      - kind: input
        prompt: '**Étape 4.** Quelle est la vitesse moyenne du coureur, en **mètres par seconde** (deux décimales)
          ?'
        answer: 3,32
        numeric: true
        tolerance: 0.03
        unit: m/s
        explanation: 'Distance et durée dans les unités du Système international : $21{,}1$ km $=21\,100$ m, durée
          $=6\,348$ s. Donc $v=\dfrac{21\,100}{6\,348}=3{,}32$ m/s.'
      - kind: input
        prompt: '**Étape 5.** Quelle est cette vitesse en **kilomètres par heure** (une décimale) ?'
        answer: '12'
        numeric: true
        tolerance: 0.2
        unit: km/h
        explanation: '$3{,}32\times3{,}6=11{,}97\approx12{,}0$ km/h. On peut vérifier autrement : $6\,348$ s $=1{,}763$
          h, et $21{,}1\div1{,}763=11{,}97$ km/h. Deux chemins, un seul résultat — c''est la meilleure vérification
          qui soit.'
      - kind: mcq
        prompt: '**Étape 6.** Un camarade calcule $21{,}1\div1{,}45=14{,}6$ km/h en prenant « $1$ h $45$ » pour
          $1{,}45$ h. Que dire de son résultat ?'
        choices:
        - 'Il est faux : $1$ h $45$ min vaut $1{,}75$ h, pas $1{,}45$ h'
        - Il est juste, les deux écritures sont équivalentes
        - Il est faux parce qu'il a oublié les $48$ secondes
        - Il est faux parce qu'il fallait multiplier au lieu de diviser
        answer:
        - 0
        feedback:
        - null
        - 'Non : $1{,}45$ h se lit « une heure et $0{,}45$ heure », soit $1$ h $27$ min. Ce n''est pas $1$ h $45$
          min.'
        - Les $48$ s ne changent le résultat que d'un centième ; l'erreur ici est bien plus grosse — il manque
          presque vingt minutes.
        - 'Non : une vitesse est bien une distance **divisée** par une durée.'
        explanation: 'Recopier « $1$ h $45$ » en « $1{,}45$ » est l''erreur la plus fréquente sur les durées.
          Il faut convertir : $45\div60=0{,}75$, donc $1$ h $45$ min $=1{,}75$ h, et $21{,}1\div1{,}75=12{,}1$
          km/h — cohérent avec l''étape 5.'
  - id: conv-grandeurs-composees
    title: Débits, masses volumiques et problèmes
    icon: 🚜
    description: Les unités qui en contiennent d'autres — m³/s, kg/m³, kWh, N/mm² — et les problèmes où la conversion
      n'est pas la question posée, mais la condition pour y répondre.
    prerequisites:
    - conv-volumes
    - conv-temps-vitesses
    lesson: lessons/conv-grandeurs-composees.md
    items:
    - type: mcq
      level: 1
      prompt: Qu'est-ce qu'un **débit volumique** ?
      choices:
      - Un volume écoulé par unité de temps, en $\mathrm{m^3/s}$
      - Un volume, en $\mathrm{m^3}$
      - Une vitesse d'écoulement, en m/s
      - Une masse écoulée par unité de temps, en kg/s
      answer: 0
      feedback:
      - null
      - 'Non : un débit n''est pas un volume, c''est un volume **par seconde**. Un même volume peut s''écouler
        vite ou lentement.'
