        - Environ $2{,}3\ \%$
        - Environ $77\ \%$
        - Environ $45\ \%$
        answer:
        - 0
        feedback:
        - null
        - 'Attention à la conversion : si les deux aires ne sont pas dans la **même** unité, le rapport est faux
          d''un facteur $10$ ou $100$.'
        - $77\ \%$, c'est la part qui part en **chute**, pas celle qui est utilisée.
        - 'Non : recalculez le rapport $\dfrac{2\,714}{12\,000}$, les deux aires étant bien en centimètres carrés.'
        explanation: $\dfrac{2\,714}{12\,000}=0{,}226$, soit $22{,}6\ \%$. Un rapport de deux surfaces n'a de
          sens que si elles sont exprimées dans la **même** unité — et le résultat, lui, n'a pas d'unité.
  - id: conv-volumes
    title: Volumes et capacités
    icon: 🧊
    description: Le facteur mille des volumes, le pont entre le décimètre cube et le litre, et le volume d'un
      cylindre qu'il faut savoir convertir après l'avoir calculé.
    prerequisites:
    - conv-prefixes
    lesson: lessons/conv-volumes.md
    items:
    - type: mcq
      level: 1
      prompt: |-
        Ce cube a $1$ m de côté. Combien de décimètres cubes contient-il ?

        {{fig:conv-cube-metre-muet}}
      choices:
      - $1\,000\ \mathrm{dm^3}$
      - $100\ \mathrm{dm^3}$
      - $10\ \mathrm{dm^3}$
      - $10\,000\ \mathrm{dm^3}$
      answer: 0
      feedback:
      - null
      - 'Attention : $100$ est le facteur des **surfaces**. Ici trois longueurs se multiplient, pas deux.'
      - 'Non : $10$ est le facteur des **longueurs**. Comptez les cubes sur les trois directions du dessin.'
      - 'Non : le dessin montre $10$ cubes par arête, donc $10\times10\times10$, et non $10^{4}$.'
      explanation: |-
        $1$ m $=10$ dm, donc $1\ \mathrm{m^3}=10\ \mathrm{dm}\times10\ \mathrm{dm}\times10\ \mathrm{dm}=1\,000\ \mathrm{dm^3}$.

        {{fig:conv-cube-metre}}
    - type: mcq
      level: 1
      prompt: Pourquoi passe-t-on d'une unité de volume à la suivante en multipliant par $1\,000$ ?
      choices:
      - 'Parce qu''un volume est le produit de **trois** longueurs : le facteur $10$ y intervient trois fois'
      - Parce que le litre vaut mille millilitres
      - Parce que les préfixes du Système international vont de mille en mille
      - Parce qu'un volume se mesure toujours en milliers d'unités
      answer: 0
      feedback:
      - null
      - C'est vrai, mais c'est une **conséquence** du facteur $1\,000$, pas sa cause. La cause est géométrique.
      - 'Les préfixes vont bien de mille en mille, mais c''est sans rapport : les unités de volume, elles, ne
        portent pas de préfixe supplémentaire.'
      - 'Non : un volume peut valoir n''importe quel nombre. Le facteur vient de la géométrie, pas de la taille
        de l''objet.'
      explanation: '$1\ \mathrm{dam^3}=(10\ \mathrm{m})^{3}=10\times10\times10=1\,000\ \mathrm{m^3}$ : le facteur
        $10$ est **élevé au cube**. D''où **trois** chiffres par unité dans le tableau des volumes.'
    - type: input
      level: 1
      prompt: À combien de décimètres cubes correspond $1$ litre ?
      answer: '1'
      numeric: true
      tolerance: 1.0e-06
      unit: dm³
      explanation: '$1\ \ell=1\ \mathrm{dm^3}$, par définition. C''est le pont entre les volumes et les capacités
        : tout le reste en découle ($1$ mL $=1\ \mathrm{cm^3}$, $1\ \mathrm{m^3}=1\,000\ \ell$).'
