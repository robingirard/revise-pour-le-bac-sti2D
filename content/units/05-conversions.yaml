      level: 3
      title: La tôle et les six disques découpés
      intro: |-
        Dans une tôle rectangulaire de $1{,}5$ m sur $0{,}8$ m, on découpe **six disques** identiques de rayon $R=12$ cm.

        On veut savoir quelle part de la tôle part en chute. Chaque question demande une unité différente : c'est voulu, on ne convertit pas « pour faire joli », on convertit pour pouvoir **comparer** ou **additionner**.
