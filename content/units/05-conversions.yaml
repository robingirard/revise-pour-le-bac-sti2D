        tolerance: 2
        unit: dm²
        explanation: '$12\,000-2\,714{,}3=9\,285{,}7\ \mathrm{cm^2}$. Une unité plus haut, donc $\div100$ : $92{,}86\approx93\
          \mathrm{dm^2}$.'
      - kind: mcq
        prompt: '**Étape 6.** Quelle part de la tôle est réellement utilisée ?'
