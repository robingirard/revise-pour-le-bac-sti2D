# Mathématiques 1re STI2D — primitives, trigonométrie, produit scalaire, nombres complexes.
# Source : docs/notes/maths-1re-cours.md (livre « Objectif Bac » 1re/Tle STI2D, p. 95-109).
# Les coquilles du manuel signalées dans la note (signes du tableau de variations du cosinus
# p. 101, condition « n ≠ 1 » p. 96, membre central de (u+v)·(u−v) p. 105) sont corrigées ici.
units:
- id: maths-1re
  matiere: maths
  title: 'Mathématiques : analyse et géométrie'
  description: Primitives, cercle trigonométrique, fonctions sinusoïdales, produit scalaire et nombres complexes — les outils mathématiques de la 1re STI2D.
  skills:
  - id: maths-primitives
    title: Primitives
    icon: 🧮
    description: Définition, tableau des primitives usuelles, fonctions composées et condition initiale.
    prerequisites: []
    lesson: lessons/maths-primitives.md
    items:
    - type: mcq
      level: 1
      prompt: 'Soit $f$ et $F$ deux fonctions définies sur un intervalle $I$ de $\mathbb{R}$. On dit que $F$ est une **primitive** de $f$ sur $I$ lorsque :'
      choices:
      - $F$ est dérivable sur $I$ et $F'=f$ sur $I$
      - $f$ est dérivable sur $I$ et $f'=F$ sur $I$
      - $F$ et $f$ ont la même dérivée sur $I$
      - $F=f$ sur $I$
      answer: 0
      feedback:
      - null
      - 'C''est l''inverse : c''est la primitive $F$ que l''on dérive pour retrouver $f$.'
      - 'Deux fonctions de même dérivée ne diffèrent que d''une constante : ce n''est pas le lien entre $f$ et $F$.'
      - 'Primitiver change la fonction (sauf pour la fonction nulle) : on cherche $F$ telle que $F''=f$.'
      explanation: 'p. 95 : $F$ est une primitive de $f$ sur $I$ si $F$ est dérivable sur $I$ et $F''=f$ sur $I$. Primitiver, c''est « remonter » la dérivation.'
    - type: mcq
      level: 1
      prompt: Quelle est la forme des primitives de la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=x^{2}$ ?
      choices:
      - $F(x)=\dfrac{x^{3}}{3}+k$
      - $F(x)=2x+k$
      - $F(x)=\dfrac{x^{3}}{2}+k$
      - $F(x)=3x^{3}+k$
      answer: 0
      feedback:
      - null
      - 'C''est la dérivée de $f$, pas une primitive : on cherche $F$ telle que $F''=f$.'
      - 'Le dénominateur est le **nouvel** exposant : $\dfrac{x^{n+1}}{n+1}$ donne ici $\dfrac{x^{3}}{3}$.'
      - On divise par le nouvel exposant, on ne multiplie pas par lui.
      explanation: 'Tableau p. 95 : la fonction carré $f(x)=x^{2}$ a pour primitives $F(x)=\dfrac{x^{3}}{3}+k$, avec $k\in\mathbb{R}$.'
    - type: mcq
      level: 1
      prompt: Quelle est la forme des primitives de la fonction identité $f(x)=x$ sur $\mathbb{R}$ ?
      choices:
      - $F(x)=\dfrac{x^{2}}{2}+k$
      - $F(x)=1+k$
      - $F(x)=x^{2}+k$
      - $F(x)=\dfrac{x^{2}}{3}+k$
      answer: 0
      feedback:
      - null
      - 'C''est la dérivée de $f$ : $f''(x)=1$.'
      - 'On a oublié de diviser par le nouvel exposant $2$ : $(x^{2})''=2x$, pas $x$.'
      - Le dénominateur est le nouvel exposant, ici $n+1=2$, pas $3$.
      explanation: 'Tableau p. 95, ligne « Fonction identité » : $f(x)=x$ a pour primitives $F(x)=\dfrac{x^{2}}{2}+k$.'
    - type: mcq
      level: 1
      prompt: 'Deux primitives d''une même fonction sur un intervalle $I$ diffèrent :'
      choices:
      - d'une constante
      - d'une fonction affine
      - d'un facteur multiplicatif
      - 'de rien du tout : la primitive est unique'
      answer: 0
      feedback:
      - null
      - 'Non : leur différence a une dérivée nulle, c''est donc une constante, pas une fonction affine quelconque.'
      - L'écart entre deux primitives est additif, pas multiplicatif.
      - Il existe une infinité de primitives, toutes de la forme $F+k$.
      explanation: 'p. 95 : $G$ est une primitive de $f$ sur $I$ si et seulement s''il existe un réel $k$ tel que $F=G+k$.'
    - type: mcq
      level: 2
      prompt: Quelle est la forme des primitives de $f(x)=ax+b$ (avec $a\neq 0$) ?
      choices:
      - $F(x)=\dfrac{ax^{2}}{2}+bx+k$
      - $F(x)=\dfrac{ax^{2}}{2}+\dfrac{bx^{2}}{2}+k$
      - $F(x)=a+bx+k$
      - $F(x)=\dfrac{(ax+b)^{2}}{2}+k$
      answer: 0
      feedback:
      - null
      - La constante $b$ a pour primitive $bx$, pas $\dfrac{bx^{2}}{2}$.
      - C'est la dérivée $f'(x)=a$ à laquelle on a ajouté $bx$.
      - 'Cette expression a pour dérivée $a(ax+b)$ : il manque le facteur $\dfrac{1}{a}$.'
      explanation: 'Tableau p. 95, ligne « Fonction affine » : $F(x)=\dfrac{ax^{2}}{2}+bx+k$.'
    - type: mcq
      level: 2
      prompt: Quelle est la forme des primitives de $f(x)=4x^{3}-3x^{2}+2$ sur $\mathbb{R}$ ?
      choices:
      - $F(x)=x^{4}-x^{3}+2x+k$
      - $F(x)=x^{4}-x^{3}+2+k$
      - $F(x)=\dfrac{x^{4}}{4}-\dfrac{x^{3}}{3}+2x+k$
      - $F(x)=12x^{2}-6x+k$
      answer: 0
      feedback:
      - null
      - 'Le terme constant $2$ a pour primitive $2x$ : on ne le recopie pas tel quel.'
      - 'On a oublié les coefficients : la primitive de $4x^{3}$ est $4\times\dfrac{x^{4}}{4}=x^{4}$.'
      - C'est la dérivée de $f$, pas une primitive.
      explanation: 'Tableau p. 95 (polynôme de degré 3) : $\dfrac{4x^{4}}{4}-\dfrac{3x^{3}}{3}+2x+k=x^{4}-x^{3}+2x+k$. On vérifie en dérivant.'
    - type: mcq
      level: 2
      prompt: Si $F$ est une primitive de $f$, quelles sont les primitives de $x\mapsto f(ax+b)$ (avec $a\neq0$) ?
      choices:
      - $x\mapsto \dfrac{F(ax+b)}{a}+k$
      - $x\mapsto F(ax+b)+k$
      - $x\mapsto a\,F(ax+b)+k$
      - $x\mapsto \dfrac{F(ax+b)}{ax+b}+k$
      answer: 0
      feedback:
      - null
      - 'En dérivant $F(ax+b)$ on obtient $a\,f(ax+b)$ : il faut donc diviser par $a$.'
      - 'On multiplierait alors l''erreur par $a$ : la dérivée vaudrait $a^{2}f(ax+b)$.'
      - On divise par le coefficient $a$, pas par l'expression $ax+b$.
      explanation: 'p. 95 : la fonction $x\mapsto f(ax+b)$ admet pour primitives les fonctions $x\mapsto\dfrac{F(ax+b)}{a}+k$.'
    - type: mcq
      level: 3
      prompt: 'Une primitive sur $\mathbb{R}$ de $x\mapsto (2x+1)^{4}$ est :'
      choices:
      - $x\mapsto \dfrac{(2x+1)^{5}}{10}$
      - $x\mapsto \dfrac{(2x+1)^{5}}{5}$
      - $x\mapsto 8(2x+1)^{3}$
      - $x\mapsto \dfrac{(2x+1)^{5}}{2}$
      answer: 0
      feedback:
      - null
      - 'On a oublié de diviser par $a=2$ : la dérivée de $\dfrac{(2x+1)^{5}}{5}$ vaut $2(2x+1)^{4}$.'
      - C'est la dérivée de $(2x+1)^{4}$, pas une primitive.
      - On divise à la fois par le nouvel exposant $5$ et par $a=2$, soit par $10$.
      explanation: 'Une primitive de $x\mapsto x^{4}$ est $F(x)=\dfrac{x^{5}}{5}$ ; avec la règle $f(ax+b)$ (p. 95) et $a=2$ : $\dfrac{F(2x+1)}{2}=\dfrac{(2x+1)^{5}}{10}$. Vérification : $\left(\dfrac{(2x+1)^{5}}{10}\right)''=\dfrac{5\times2\times(2x+1)^{4}}{10}=(2x+1)^{4}$.'
    - type: mcq
      level: 2
      prompt: 'Une primitive sur $\mathbb{R}$ de $x\mapsto \dfrac{2x}{x^{2}+1}$ est :'
      choices:
      - $x\mapsto \ln(x^{2}+1)$
      - $x\mapsto \dfrac{x^{2}}{x^{2}+1}$
      - $x\mapsto \dfrac{1}{x^{2}+1}$
      - $x\mapsto 2\ln(x^{2}+1)$
      answer: 0
      feedback:
      - null
      - On ne primitive pas un quotient en primitivant séparément le numérateur et le dénominateur.
      - 'Ce n''est pas une primitive : sa dérivée fait apparaître un dénominateur au carré.'
      - 'Le facteur $2$ est déjà contenu dans $f''(x)=2x$ : il ne faut pas le rajouter.'
      explanation: 'p. 96 : si $f$ est dérivable et strictement positive, $\dfrac{f''}{f}$ a pour primitives $x\mapsto\ln\big(f(x)\big)+k$. Ici $f(x)=x^{2}+1>0$ et $f''(x)=2x$.'
    - type: mcq
      level: 2
      prompt: 'Une primitive sur $\mathbb{R}$ de $x\mapsto 2x\,\mathrm{e}^{x^{2}}$ est :'
      choices:
      - $x\mapsto \mathrm{e}^{x^{2}}$
      - $x\mapsto x^{2}\mathrm{e}^{x^{2}}$
      - $x\mapsto \dfrac{\mathrm{e}^{x^{2}}}{2x}$
      - $x\mapsto 2x\,\mathrm{e}^{x^{2}}$
      answer: 0
      feedback:
      - null
      - On ne primitive pas un produit en primitivant chaque facteur.
      - 'On ne divise pas par la dérivée intérieure : la règle est $f''\mathrm{e}^{f}\longrightarrow\mathrm{e}^{f}$.'
      - C'est la fonction de départ elle-même, pas sa primitive.
      explanation: 'p. 96 : $f''\mathrm{e}^{f}$ a pour primitives $x\mapsto\mathrm{e}^{f(x)}+k$, avec ici $f(x)=x^{2}$ et $f''(x)=2x$.'
    - type: mcq
      level: 2
      prompt: Pour quelles valeurs de l'entier relatif $n$ la fonction $f'\times f^{\,n}$ admet-elle pour primitives les fonctions $x\mapsto\dfrac{\big(f(x)\big)^{\,n+1}}{n+1}+k$ ?
      choices:
      - pour tout $n\neq -1$
      - pour tout $n\neq 1$
      - pour tout $n\neq 0$
      - pour les entiers naturels $n$ seulement
      answer: 0
      feedback:
      - null
      - 'Pour $n=1$ la formule marche très bien : $f''\times f$ a pour primitives $\dfrac{f^{2}}{2}+k$. C''est $n=-1$ qui est interdit.'
      - Pour $n=0$ la formule donne $x\mapsto f(x)+k$, ce qui est correct.
      - La formule vaut aussi pour les entiers négatifs, à la seule exception de $n=-1$.
      explanation: 'Le dénominateur $n+1$ doit être non nul, donc $n\neq-1$. Le cas $n=-1$ correspond justement à $\dfrac{f''}{f}$, traité par la règle du logarithme. **Attention** : le manuel imprime p. 96 « différent de 1 » ; c''est une coquille.'
    - type: mcq
      level: 3
      prompt: Soit $f$ une fonction dérivable et **strictement négative** sur un intervalle $I$. Quelles sont les primitives de $\dfrac{f'}{f}$ sur $I$ ?
      choices:
      - $x\mapsto \ln\big(-f(x)\big)+k$
      - $x\mapsto \ln\big(f(x)\big)+k$
      - $x\mapsto -\ln\big(f(x)\big)+k$
      - $x\mapsto -\ln\big(-f(x)\big)+k$
      answer: 0
      feedback:
      - null
      - 'La fonction $\ln$ n''est définie que sur $\left]0\,;+\infty\right[$ : si $f<0$, $\ln\big(f(x)\big)$ n''existe pas.'
      - Le signe moins se place **à l'intérieur** du logarithme, pour en rendre l'argument positif.
      - 'Il y a un signe moins de trop : en dérivant $-\ln(-f)$ on obtient $-\dfrac{f''}{f}$.'
      explanation: 'p. 96 : si $f>0$, les primitives de $\dfrac{f''}{f}$ sont $x\mapsto\ln\big(f(x)\big)+k$ ; si $f<0$, ce sont $x\mapsto\ln\big(-f(x)\big)+k$. Vérification : $\big(\ln(-f)\big)''=\dfrac{-f''}{-f}=\dfrac{f''}{f}$.'
    - type: mcq
      level: 3
      prompt: 'Sur $\left]0\,;+\infty\right[$, une primitive de $x\mapsto\dfrac{1}{x^{2}}$ est :'
      choices:
      - $x\mapsto -\dfrac{1}{x}$
      - $x\mapsto \dfrac{1}{x}$
      - $x\mapsto \ln(x^{2})$
      - $x\mapsto -\dfrac{2}{x^{3}}$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $\left(\dfrac{1}{x}\right)''=-\dfrac{1}{x^{2}}$, il faut donc prendre l''opposé.'
      - La règle du logarithme concerne $\dfrac{f'}{f}$ ; ici le numérateur n'est pas la dérivée de $x^{2}$, qui vaut $2x$.
      - C'est la dérivée de $\dfrac{1}{x^{2}}$, pas une primitive.
      explanation: '$\dfrac{1}{x^{2}}=x^{-2}$ : avec $n=-2\neq-1$, une primitive est $\dfrac{x^{-1}}{-1}=-\dfrac{1}{x}$. Vérification : $\left(-\dfrac{1}{x}\right)''=\dfrac{1}{x^{2}}$. Cette fonction ne figure pas dans le tableau p. 95, qui ne contient que des polynômes.'
    - type: input
      level: 2
      prompt: Soit $f(x)=3x^{2}+4x-5$ et $F$ la primitive de $f$ sur $\mathbb{R}$ telle que $F(0)=2$. Calculer $F(1)$.
      answer: '0'
      numeric: true
      tolerance: 0.01
      explanation: $F(x)=x^{3}+2x^{2}-5x+k$ ; la condition $F(0)=k=2$ donne $F(x)=x^{3}+2x^{2}-5x+2$, d'où $F(1)=1+2-5+2=0$.
    - type: input
      level: 3
      prompt: Soit $f(x)=6x^{2}-4x+1$ et $F$ la primitive de $f$ sur $\mathbb{R}$ telle que $F(0)=0$. Calculer $F(2)$.
      answer: '10'
      numeric: true
      tolerance: 0.01
      explanation: $F(x)=2x^{3}-2x^{2}+x+k$ ; $F(0)=k=0$, donc $F(2)=2\times8-2\times4+2=16-8+2=10$.
    - type: order
      level: 2
      prompt: Remettre dans l'ordre la méthode pour déterminer **la** primitive $F$ de $f$ vérifiant une condition initiale $F(x_0)=y_0$.
      steps:
      - Reconnaître la forme de $f$ (tableau des primitives usuelles ou règle de composition)
      - 'Écrire la forme générale des primitives : $F(x)=\dots+k$'
      - Remplacer $x$ par $x_0$ dans cette expression
      - Résoudre l'équation $F(x_0)=y_0$, d'inconnue $k$
      - Écrire $F$ en remplaçant $k$ par la valeur trouvée
      - 'Vérifier en dérivant : on doit retrouver $f$'
      explanation: 'La condition initiale fixe la constante $k$ : parmi l''infinité de primitives (qui diffèrent d''une constante, p. 95), une seule passe par le point $(x_0\,;y_0)$.'
  - id: maths-cercle-trigo
    title: Le cercle trigonométrique
    icon: ⭕
    description: Radians, angles orientés, cosinus et sinus, valeurs remarquables et angles associés.
    prerequisites: []
    lesson: lessons/maths-cercle-trigo.md
    items:
    - type: mcq
      level: 1
      prompt: 'La mesure en radians de l''angle orienté $\left(\overrightarrow{OI},\overrightarrow{OM}\right)$ est :


        {{fig:maths-cercle-trigo}}'
      choices:
      - la mesure algébrique de l'arc allant de $I$ à $M$ sur le cercle trigonométrique
      - la longueur du segment $[IM]$
      - toujours un nombre positif
      - la même chose que la mesure en degrés
      answer: 0
      feedback:
      - null
      - C'est la longueur de l'**arc**, mesurée le long du cercle, et non celle de la corde.
      - 'Non : la mesure d''un angle **orienté** est signée, positive dans le sens direct et négative dans le sens indirect.'
      - 'Non : ce sont deux unités différentes ; $180^{\circ}$ correspond à $\pi$ rad.'
      explanation: 'p. 97-98 : le cercle trigonométrique a pour rayon $1$. La mesure en radians d''un angle orienté est la mesure algébrique de l''arc correspondant, comptée positivement dans le sens direct (sens inverse des aiguilles d''une montre).'
    - type: mcq
      level: 1
      prompt: À combien de radians correspond un angle de $135^{\circ}$ ?
      choices:
      - $\dfrac{3\pi}{4}$
      - $\dfrac{5\pi}{6}$
      - $\dfrac{2\pi}{3}$
      - $\dfrac{4\pi}{3}$
      answer: 0
      feedback:
      - null
      - $\dfrac{5\pi}{6}$ correspond à $150^{\circ}$.
      - $\dfrac{2\pi}{3}$ correspond à $120^{\circ}$.
      - '$\dfrac{4\pi}{3}$ vaut $240^{\circ}$ : numérateur et dénominateur ont été inversés.'
      explanation: 'Tableau de conversion p. 98 : $135^{\circ}\leftrightarrow\dfrac{3\pi}{4}$ rad. On peut aussi passer par la proportionnalité : $\dfrac{135}{180}\pi=\dfrac{3\pi}{4}$.'
    - type: input
      level: 1
      prompt: Convertir $60^{\circ}$ en radians (donner la valeur décimale arrondie à $0{,}01$).
      answer: '1.05'
      numeric: true
      tolerance: 0.02
      unit: rad
      explanation: 'Tableau p. 98 : $60^{\circ}=\dfrac{\pi}{3}$ rad $\approx1{,}047$ rad.'
    - type: mcq
      level: 1
      prompt: Que vaut $\sin\left(\dfrac{\pi}{6}\right)$ ?
      choices:
      - $\dfrac{1}{2}$
      - $\dfrac{\sqrt{3}}{2}$
      - $\dfrac{\sqrt{2}}{2}$
      - $0$
      answer: 0
      feedback:
      - null
      - 'C''est $\cos\left(\dfrac{\pi}{6}\right)$ : confusion classique entre la ligne du cosinus et celle du sinus.'
      - C'est la valeur commune de $\cos$ et de $\sin$ en $\dfrac{\pi}{4}$.
      - Le sinus ne s'annule qu'en $0$ et en $\pi$ parmi les valeurs remarquables.
      explanation: 'Tableau des valeurs remarquables p. 99 : $\sin\left(\dfrac{\pi}{6}\right)=\dfrac{1}{2}$ et $\cos\left(\dfrac{\pi}{6}\right)=\dfrac{\sqrt{3}}{2}$.'
    - type: mcq
      level: 1
      prompt: Que vaut $\cos\left(\dfrac{\pi}{4}\right)$ ?
      choices:
      - $\dfrac{\sqrt{2}}{2}$
      - $\dfrac{1}{2}$
      - $\dfrac{\sqrt{3}}{2}$
      - $1$
      answer: 0
      feedback:
      - null
      - C'est $\cos\left(\dfrac{\pi}{3}\right)$.
      - C'est $\cos\left(\dfrac{\pi}{6}\right)$.
      - C'est $\cos(0)$.
      explanation: 'Tableau p. 99 : en $\dfrac{\pi}{4}$, cosinus et sinus valent tous deux $\dfrac{\sqrt{2}}{2}\approx0{,}707$ (le point du cercle est sur la première bissectrice).'
    - type: mcq
      level: 1
      prompt: 'Soit $x$ un réel et $M$ le point du cercle trigonométrique associé à $x$. Quelles sont les coordonnées de $M$ dans le repère $(O,I,J)$ ?


        {{fig:maths-cos-sin-cercle}}'
      choices:
      - $\big(\cos(x)\,;\sin(x)\big)$
      - $\big(\sin(x)\,;\cos(x)\big)$
      - $\big(x\,;\cos(x)\big)$
      - $\big(\cos(x)\,;-\sin(x)\big)$
      answer: 0
      feedback:
      - null
      - 'Inversion : le **cosinus** est l''abscisse (horizontale), le **sinus** l''ordonnée (verticale).'
      - 'L''abscisse de $M$ n''est pas $x$ : $x$ est la mesure de l''angle, pas une coordonnée.'
      - 'Aucun signe moins n''apparaît : l''ordonnée de $M$ est exactement $\sin(x)$.'
      explanation: 'p. 98 : $\cos(x)$ est l''abscisse et $\sin(x)$ l''ordonnée du point $M$ associé à $x$ sur le cercle trigonométrique.'
    - type: mcq
      level: 1
      prompt: Quelle égalité est vraie pour tout réel $x$ ?
      choices:
      - $\cos^{2}(x)+\sin^{2}(x)=1$
      - $\cos(x)+\sin(x)=1$
      - $\cos^{2}(x)-\sin^{2}(x)=1$
      - $\cos^{2}(x)+\sin^{2}(x)=0$
      answer: 0
      feedback:
      - null
      - 'Contre-exemple : pour $x=\dfrac{\pi}{4}$, $\cos(x)+\sin(x)=\sqrt{2}\neq1$. Ce sont les **carrés** qui s''ajoutent.'
      - 'Erreur de signe : $\cos^{2}(x)-\sin^{2}(x)$ vaut $\cos(2x)$, qui n''est pas constant.'
      - 'La somme vaut $1$, pas $0$ : c''est le carré du rayon du cercle trigonométrique.'
      explanation: 'Relation fondamentale p. 99 : $\cos^{2}(x)+\sin^{2}(x)=1$. C''est le théorème de Pythagore appliqué au point $M\big(\cos(x)\,;\sin(x)\big)$, situé sur un cercle de rayon $1$.'
    - type: mcq
      level: 2
      prompt: Que vaut $\cos\left(\dfrac{2\pi}{3}\right)$ ?
      choices:
      - $-\dfrac{1}{2}$
      - $\dfrac{1}{2}$
      - $-\dfrac{\sqrt{3}}{2}$
      - $\dfrac{\sqrt{3}}{2}$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $\dfrac{2\pi}{3}$ est dans le deuxième quadrant, où l''abscisse (le cosinus) est négative.'
      - 'Confusion sin/cos **et** erreur de signe : $\sin\left(\dfrac{2\pi}{3}\right)=+\dfrac{\sqrt{3}}{2}$.'
      - 'Confusion sin/cos : $\dfrac{\sqrt{3}}{2}$ est la valeur de $\sin\left(\dfrac{2\pi}{3}\right)$.'
      explanation: $\dfrac{2\pi}{3}=\pi-\dfrac{\pi}{3}$, donc d'après les angles associés (p. 99) $\cos\left(\pi-\dfrac{\pi}{3}\right)=-\cos\left(\dfrac{\pi}{3}\right)=-\dfrac{1}{2}$.
    - type: mcq
      level: 2
      prompt: 'Pour tout réel $x$, $\cos\left(\dfrac{\pi}{2}+x\right)$ est égal à :'
      choices:
      - $-\sin(x)$
      - $\sin(x)$
      - $\cos(x)$
      - $-\cos(x)$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $\sin(x)$ est la valeur de $\cos\left(\dfrac{\pi}{2}-x\right)$.'
      - 'Confusion sin/cos : ajouter $\dfrac{\pi}{2}$ échange les deux fonctions.'
      - $-\cos(x)$ correspond à $\cos(\pi+x)$ ou à $\cos(\pi-x)$.
      explanation: 'Angles associés p. 99 : $\cos\left(\dfrac{\pi}{2}+x\right)=-\sin(x)$ et $\sin\left(\dfrac{\pi}{2}+x\right)=\cos(x)$.'
    - type: mcq
      level: 2
      prompt: 'Pour tout réel $x$, $\sin(\pi-x)$ est égal à :


        {{fig:maths-angles-associes}}'
      choices:
      - $\sin(x)$
      - $-\sin(x)$
      - $\cos(x)$
      - $-\cos(x)$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : c''est $\sin(\pi+x)$ qui vaut $-\sin(x)$.'
      - 'Confusion sin/cos : c''est $\sin\left(\dfrac{\pi}{2}-x\right)$ qui vaut $\cos(x)$.'
      - $-\cos(x)$ est la valeur de $\cos(\pi-x)$, pas de $\sin(\pi-x)$.
      explanation: 'Angles associés p. 99 : $\sin(\pi-x)=\sin(x)$ et $\cos(\pi-x)=-\cos(x)$. Les points associés à $x$ et à $\pi-x$ sont symétriques par rapport à l''axe des ordonnées : même ordonnée, abscisses opposées.'
    - type: mcq
      level: 2
      prompt: Quelle est la mesure principale de l'angle orienté de mesure $\dfrac{7\pi}{3}$ ?
      choices:
      - $\dfrac{\pi}{3}$
      - $\dfrac{7\pi}{3}$
      - $-\dfrac{\pi}{3}$
      - $\dfrac{4\pi}{3}$
      answer: 0
      feedback:
      - null
      - $\dfrac{7\pi}{3}\approx7{,}33$ n'appartient pas à $\left]-\pi\,;\pi\right]$.
      - 'Erreur de signe : on retranche $2\pi=\dfrac{6\pi}{3}$, ce qui donne $+\dfrac{\pi}{3}$.'
      - On a retranché $\pi$ au lieu de $2\pi$, et $\dfrac{4\pi}{3}>\pi$.
      explanation: 'p. 98 : la mesure principale appartient à $\left]-\pi\,;\pi\right]$. Ici $\dfrac{7\pi}{3}-2\pi=\dfrac{7\pi-6\pi}{3}=\dfrac{\pi}{3}$.'
    - type: mcq
      level: 2
      prompt: Quelle est la mesure principale de l'angle orienté de mesure $\dfrac{5\pi}{4}$ ?
      choices:
      - $-\dfrac{3\pi}{4}$
      - $\dfrac{5\pi}{4}$
      - $\dfrac{3\pi}{4}$
      - $-\dfrac{\pi}{4}$
      answer: 0
      feedback:
      - null
      - $\dfrac{5\pi}{4}\approx3{,}93$ n'appartient pas à $\left]-\pi\,;\pi\right]$.
      - 'Erreur de signe : $\dfrac{5\pi}{4}-2\pi$ est négatif.'
      - On retranche $2\pi=\dfrac{8\pi}{4}$, pas $\dfrac{6\pi}{4}$.
      explanation: $\dfrac{5\pi}{4}-2\pi=\dfrac{5\pi-8\pi}{4}=-\dfrac{3\pi}{4}$, qui appartient bien à $\left]-\pi\,;\pi\right]$.
    - type: mcq
      level: 2
      prompt: Quelles sont les coordonnées du point $M$ du cercle trigonométrique associé au réel $-\dfrac{\pi}{3}$ ?
      choices:
      - $\left(\dfrac{1}{2}\,;-\dfrac{\sqrt{3}}{2}\right)$
      - $\left(\dfrac{1}{2}\,;\dfrac{\sqrt{3}}{2}\right)$
      - $\left(-\dfrac{1}{2}\,;-\dfrac{\sqrt{3}}{2}\right)$
      - $\left(-\dfrac{\sqrt{3}}{2}\,;\dfrac{1}{2}\right)$
      answer: 0
      feedback:
      - null
      - 'C''est le point associé à $+\dfrac{\pi}{3}$ : le sinus est **impair**, donc $\sin\left(-\dfrac{\pi}{3}\right)=-\dfrac{\sqrt{3}}{2}$.'
      - 'Le cosinus est **pair** : $\cos\left(-\dfrac{\pi}{3}\right)=\cos\left(\dfrac{\pi}{3}\right)=+\dfrac{1}{2}$.'
      - 'Confusion sin/cos : l''abscisse vaut $\cos\left(-\dfrac{\pi}{3}\right)=\dfrac{1}{2}$.'
      explanation: 'Angles associés p. 99 : $\cos(-x)=\cos(x)$ et $\sin(-x)=-\sin(x)$. Donc $M\left(\dfrac{1}{2}\,;-\dfrac{\sqrt{3}}{2}\right)$ : c''est le symétrique par rapport à l''axe des abscisses du point associé à $\dfrac{\pi}{3}$.'
    - type: input
      level: 2
      prompt: Un réel $x$ vérifie $\cos(x)=0{,}6$ et $\sin(x)>0$. Calculer $\sin(x)$.
      answer: '0.8'
      numeric: true
      tolerance: 0.01
      explanation: 'Relation fondamentale p. 99 : $\sin^{2}(x)=1-\cos^{2}(x)=1-0{,}36=0{,}64$, donc $\sin(x)=\pm0{,}8$. Comme $\sin(x)>0$, on retient $\sin(x)=0{,}8$.'
    - type: order
      level: 2
      prompt: Ranger ces valeurs remarquables du cosinus dans l'ordre **croissant**.
      steps:
      - $\cos\left(\dfrac{\pi}{2}\right)=0$
      - $\cos\left(\dfrac{\pi}{3}\right)=\dfrac{1}{2}$
      - $\cos\left(\dfrac{\pi}{4}\right)=\dfrac{\sqrt{2}}{2}$
      - $\cos\left(\dfrac{\pi}{6}\right)=\dfrac{\sqrt{3}}{2}$
      - $\cos(0)=1$
      explanation: 'Sur $\left[0\,;\dfrac{\pi}{2}\right]$ le cosinus est décroissant : plus l''angle est grand, plus l''abscisse du point du cercle est petite. Numériquement : $0<0{,}5<0{,}707<0{,}866<1$ (tableau p. 99).'
    - type: match
      level: 1
      prompt: Associer chaque angle en degrés à sa mesure en radians.
      pairs:
      - left: $30^{\circ}$
        right: $\dfrac{\pi}{6}$
      - left: $45^{\circ}$
        right: $\dfrac{\pi}{4}$
      - left: $90^{\circ}$
        right: $\dfrac{\pi}{2}$
      - left: $120^{\circ}$
        right: $\dfrac{2\pi}{3}$
      - left: $150^{\circ}$
        right: $\dfrac{5\pi}{6}$
    - type: match
      level: 2
      prompt: Associer chaque angle à la valeur de son sinus.
      pairs:
      - left: $\sin(0)$
        right: $0$
      - left: $\sin\left(\dfrac{\pi}{6}\right)$
        right: $\dfrac{1}{2}$
      - left: $\sin\left(\dfrac{\pi}{4}\right)$
        right: $\dfrac{\sqrt{2}}{2}$
      - left: $\sin\left(\dfrac{\pi}{3}\right)$
        right: $\dfrac{\sqrt{3}}{2}$
      - left: $\sin\left(\dfrac{\pi}{2}\right)$
        right: $1$
  - id: maths-fonctions-trigo
    title: Fonctions trigonométriques
    icon: 〰️
    description: 'Cosinus et sinus : période, parité, dérivées et courbes ; signaux sinusoïdaux (amplitude, période, fréquence, phase).'
    prerequisites:
    - maths-cercle-trigo
    lesson: lessons/maths-fonctions-trigo.md
    items:
    - type: mcq
      level: 1
      prompt: Quelle est la dérivée de la fonction cosinus sur $\mathbb{R}$ ?
      choices:
      - $\cos'(x)=-\sin(x)$
      - $\cos'(x)=\sin(x)$
      - $\cos'(x)=-\cos(x)$
      - $\cos'(x)=\dfrac{1}{\sin(x)}$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : c''est la dérivée du **sinus** qui vaut $\cos$, sans signe ; celle du cosinus porte le signe $-$.'
      - 'Dériver le cosinus change de fonction : on obtient un sinus.'
      - Aucune formule du cours ne fait apparaître d'inverse.
      explanation: 'p. 101 : pour tout $x\in\mathbb{R}$, $\cos''(x)=-\sin(x)$.'
    - type: mcq
      level: 1
      prompt: Quelle est la dérivée de la fonction sinus sur $\mathbb{R}$ ?
      choices:
      - $\sin'(x)=\cos(x)$
      - $\sin'(x)=-\cos(x)$
      - $\sin'(x)=\sin(x)$
      - $\sin'(x)=-\sin(x)$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : le signe $-$ apparaît en dérivant le **cosinus**, pas le sinus.'
      - Seule l'exponentielle est sa propre dérivée.
      - 'Erreur de signe et de fonction : $\sin''=\cos$.'
      explanation: 'p. 102 : pour tout $x\in\mathbb{R}$, $\sin''(x)=\cos(x)$. Moyen mnémotechnique : en dérivant on passe de $\cos$ à $-\sin$, puis de $\sin$ à $\cos$.'
    - type: mcq
      level: 1
      prompt: 'Les fonctions cosinus et sinus sont périodiques, de période :'
      choices:
      - $2\pi$
      - $\pi$
      - $\dfrac{\pi}{2}$
      - $1$
      answer: 0
      feedback:
      - null
      - '$\pi$ est un demi-tour : $\cos(\pi+x)=-\cos(x)$, ce n''est pas la même valeur.'
      - '$\dfrac{\pi}{2}$ est un quart de tour : il échange cosinus et sinus.'
      - La période est la longueur d'un tour de cercle trigonométrique, soit $2\pi$.
      explanation: 'p. 101-102 : les fonctions cosinus et sinus sont $2\pi$-périodiques, car un tour complet du cercle trigonométrique ramène au même point.'
    - type: mcq
      level: 1
      prompt: 'Dans l''écriture $u(t)=A\cos(\omega t+\varphi)$ (avec $A>0$), que représente $A$ ?


        {{fig:maths-sinusoide}}'
      choices:
      - 'l''amplitude : le maximum de $u$ vaut $A$ et son minimum $-A$'
      - la période de $u$
      - la phase à l'origine
      - la pulsation
      answer: 0
      feedback:
      - null
      - 'La période est $T=\dfrac{2\pi}{\omega}$ : elle se lit sur l''axe des temps, pas sur l''axe des ordonnées.'
      - La phase à l'origine est $\varphi$.
      - La pulsation est $\omega$ ; $\omega t+\varphi$ est la phase instantanée.
      explanation: 'p. 102 : $A$ est l''**amplitude** ($-A$ minimum, $A$ maximum), $\omega$ la **pulsation**, $\varphi$ la **phase à l''origine** et $\omega t+\varphi$ la **phase instantanée**.'
    - type: mcq
      level: 1
      prompt: Quelle est la période $T$ de la fonction sinusoïdale $t\mapsto A\cos(\omega t+\varphi)$ ?
      choices:
      - $T=\dfrac{2\pi}{\omega}$
      - $T=\dfrac{\omega}{2\pi}$
      - $T=2\pi\omega$
      - $T=\dfrac{2\pi}{\varphi}$
      answer: 0
      feedback:
      - null
      - C'est la **fréquence** $f=\dfrac{\omega}{2\pi}$, l'inverse de la période.
      - 'Plus la pulsation est grande, plus la période est **courte** : $\omega$ est au dénominateur.'
      - La phase à l'origine $\varphi$ décale la courbe mais ne change pas la période.
      explanation: 'p. 102 : $T=\dfrac{2\pi}{\omega}$ et $f=\dfrac{1}{T}=\dfrac{\omega}{2\pi}$.'
    - type: mcq
      level: 2
      prompt: 'Concernant la parité des fonctions circulaires :'
      choices:
      - le cosinus est pair et le sinus est impair
      - le cosinus est impair et le sinus est pair
      - les deux sont paires
      - les deux sont impaires
      answer: 0
      feedback:
      - null
      - 'C''est l''inverse : $\cos(-x)=\cos(x)$ (paire) et $\sin(-x)=-\sin(x)$ (impaire).'
      - 'La courbe du sinus est symétrique par rapport à l''origine : le sinus est impair.'
      - 'La courbe du cosinus est symétrique par rapport à l''axe des ordonnées : le cosinus est pair.'
      explanation: 'p. 101-102 : le cosinus est pair (courbe symétrique par rapport à l''axe des ordonnées), le sinus est impair (courbe symétrique par rapport à l''origine).'
    - type: mcq
      level: 2
      prompt: 'La courbe représentative de la fonction sinus est symétrique par rapport :


        {{fig:maths-courbe-cos-sin}}'
      choices:
      - à l'origine du repère
      - à l'axe des ordonnées
      - à l'axe des abscisses
      - à la droite d'équation $y=x$
      answer: 0
      feedback:
      - null
      - C'est la symétrie de la courbe du **cosinus**, qui traduit sa parité.
      - Une courbe symétrique par rapport à l'axe des abscisses ne serait pas la courbe d'une fonction.
      - Cette symétrie n'a rien à voir avec la parité.
      explanation: 'p. 102 : la fonction sinus étant impaire, sa courbe est symétrique par rapport à l''origine du repère ; celle du cosinus, fonction paire, est symétrique par rapport à l''axe des ordonnées (p. 101).'
    - type: mcq
      level: 2
      prompt: 'Une primitive de la fonction sinus sur $\mathbb{R}$ est :'
      choices:
      - $x\mapsto -\cos(x)$
      - $x\mapsto \cos(x)$
      - $x\mapsto -\sin(x)$
      - $x\mapsto \dfrac{\sin^{2}(x)}{2}$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $\cos''=-\sin$, il faut donc prendre l''opposé.'
      - C'est l'opposée de la fonction elle-même, pas une primitive.
      - Cette expression est une primitive de $x\mapsto\sin(x)\cos(x)$, pas de $\sin$.
      explanation: 'p. 102 : une primitive de la fonction cosinus est la fonction sinus, et une primitive de la fonction sinus est l''**opposée** de la fonction cosinus.'
    - type: mcq
      level: 2
      prompt: Sur l'intervalle $[-\pi\,;0]$, quel est le signe de $\cos'(x)=-\sin(x)$, et comment varie la fonction cosinus ?
      choices:
      - '$-\sin(x)\geqslant0$ : le cosinus est croissant, de $-1$ à $1$'
      - '$-\sin(x)\leqslant0$ : le cosinus est décroissant, de $1$ à $-1$'
      - '$-\sin(x)\geqslant0$ : le cosinus est décroissant'
      - '$-\sin(x)\leqslant0$ : le cosinus est croissant'
      answer: 0
      feedback:
      - null
      - 'Sur $[-\pi\,;0]$ on a $\sin(x)\leqslant0$, donc $-\sin(x)\geqslant0$ : la dérivée est **positive**. C''est sur $[0\,;\pi]$ que le cosinus décroît.'
      - Une dérivée positive donne une fonction **croissante**.
      - Une dérivée négative donnerait une fonction décroissante ; ici la dérivée est positive.
      explanation: 'Sur $[-\pi\,;0]$, $\sin(x)\leqslant0$ donc $\cos''(x)=-\sin(x)\geqslant0$ : le cosinus croît de $\cos(-\pi)=-1$ à $\cos(0)=1$ ; puis, sur $[0\,;\pi]$, il décroît de $1$ à $-1$. **Attention** : le tableau imprimé p. 101 porte une ligne de signes fautive ($-$ puis $+$) qui contredit sa propre ligne de variations.'
    - type: mcq
      level: 2
      prompt: Quelle relation lie la pulsation $\omega$ et la fréquence $f$ d'un signal sinusoïdal ?
      choices:
      - $\omega=2\pi f$
      - $\omega=\dfrac{f}{2\pi}$
      - $\omega=\dfrac{2\pi}{f}$
      - $\omega=\pi f$
      answer: 0
      feedback:
      - null
      - 'C''est l''inverse : $f=\dfrac{\omega}{2\pi}$, donc $\omega=2\pi f$.'
      - 'C''est la formule de la **période** en fonction de la pulsation : $T=\dfrac{2\pi}{\omega}$.'
      - Le facteur correspond à un tour complet, soit $2\pi$ et non $\pi$.
      explanation: 'p. 102 : $T=\dfrac{2\pi}{\omega}$ et $f=\dfrac{1}{T}=\dfrac{\omega}{2\pi}$, d''où $\omega=2\pi f$. La fréquence et la pulsation sont proportionnelles.'
    - type: mcq
      level: 2
      prompt: Quelle est la dérivée de la fonction $x\mapsto\sin(3x)$ ?
      choices:
      - $x\mapsto 3\cos(3x)$
      - $x\mapsto \cos(3x)$
      - $x\mapsto -3\cos(3x)$
      - $x\mapsto 3\sin(3x)$
      answer: 0
      feedback:
      - null
      - On a oublié de multiplier par la dérivée intérieure $f'(x)=3$.
      - 'Erreur de signe : le signe $-$ apparaît en dérivant un cosinus, pas un sinus.'
      - Dériver un sinus donne un cosinus.
      explanation: 'p. 102 : $(\sin\circ f)''=f''\times(\cos\circ f)$. Avec $f(x)=3x$ et $f''(x)=3$, on obtient $3\cos(3x)$.'
    - type: input
      level: 2
      prompt: Quelle est la période de la fonction $t\mapsto 5\sin(4t+1)$ ? (arrondir à $0{,}01$)
      answer: '1.57'
      numeric: true
      tolerance: 0.02
      explanation: 'p. 102 : $T=\dfrac{2\pi}{\omega}$ avec $\omega=4$, donc $T=\dfrac{2\pi}{4}=\dfrac{\pi}{2}\approx1{,}57$. L''amplitude $5$ et la phase $1$ n''interviennent pas.'
    - type: input
      level: 2
      prompt: Un courant s'écrit $i(t)=3\cos(200\pi t)$, avec $t$ en secondes. Calculer sa fréquence.
      answer: '100'
      numeric: true
      tolerance: 0.5
      unit: Hz
      explanation: 'p. 102 : $T=\dfrac{2\pi}{200\pi}=0{,}01$ s, donc $f=\dfrac{1}{T}=100$ Hz (ou directement $f=\dfrac{\omega}{2\pi}=\dfrac{200\pi}{2\pi}=100$ Hz).'
    - type: input
      level: 2
      prompt: Un signal sinusoïdal a pour fréquence $f=50$ Hz. Calculer sa pulsation $\omega$ (arrondir à l'unité).
      answer: '314'
      numeric: true
      tolerance: 1
      unit: rad/s
      explanation: $\omega=2\pi f=2\pi\times50=100\pi\approx314$ rad$\cdot$s$^{-1}$ (p. 102).
    - type: mcq
      level: 3
      prompt: 'Quelle est la dérivée de $f_c : t\mapsto A\cos(\omega t+\varphi)$ ?'
      choices:
      - $f_c'(t)=-A\,\omega\,\sin(\omega t+\varphi)$
      - $f_c'(t)=-A\,\sin(\omega t+\varphi)$
      - $f_c'(t)=A\,\omega\,\sin(\omega t+\varphi)$
      - $f_c'(t)=-\dfrac{A}{\omega}\sin(\omega t+\varphi)$
      answer: 0
      feedback:
      - null
      - On a oublié de multiplier par la dérivée intérieure $\omega$.
      - 'Erreur de signe : la dérivée du cosinus vaut $-\sin$.'
      - On **multiplie** par $\omega$ pour dériver ; on divise par $\omega$ pour primitiver.
      explanation: 'p. 102 : $f_c''(t)=-A\,\omega\,\sin(\omega t+\varphi)$ et $f_s''(t)=A\,\omega\,\cos(\omega t+\varphi)$.'
    - type: mcq
      level: 3
      prompt: 'Quelle est une primitive de $f_s : t\mapsto A\sin(\omega t+\varphi)$ ?'
      choices:
      - $F_s(t)=-\dfrac{A}{\omega}\cos(\omega t+\varphi)$
      - $F_s(t)=\dfrac{A}{\omega}\cos(\omega t+\varphi)$
      - $F_s(t)=-A\,\omega\,\cos(\omega t+\varphi)$
      - $F_s(t)=\dfrac{A}{\omega}\sin(\omega t+\varphi)$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : primitiver un sinus fait apparaître $-\cos$.'
      - On **divise** par $\omega$ pour primitiver ; on multiplie par $\omega$ pour dériver.
      - C'est la primitive de $f_c$ (le cosinus), pas celle du sinus.
      explanation: 'p. 102 : $F_c(t)=\dfrac{A}{\omega}\sin(\omega t+\varphi)$ et $F_s(t)=-\dfrac{A}{\omega}\cos(\omega t+\varphi)$.'
    - type: order
      level: 2
      prompt: Remettre dans l'ordre les étapes de l'étude d'un signal sinusoïdal $u(t)=A\cos(\omega t+\varphi)$.
      steps:
      - Identifier l'amplitude $A$, la pulsation $\omega$ et la phase à l'origine $\varphi$
      - Calculer la période $T=\dfrac{2\pi}{\omega}$
      - Calculer la fréquence $f=\dfrac{1}{T}=\dfrac{\omega}{2\pi}$
      - Calculer la valeur à l'origine $u(0)=A\cos(\varphi)$
      - 'Dériver : $u''(t)=-A\,\omega\,\sin(\omega t+\varphi)$'
      - 'Primitiver : $U(t)=\dfrac{A}{\omega}\sin(\omega t+\varphi)+k$'
      explanation: 'Enchaînement des définitions et formules de la p. 102 : vocabulaire, période et fréquence, valeur initiale, dérivée, primitives.'
    - type: guided
      level: 3
      title: Une tension sinusoïdale du réseau
      intro: 'Une tension est modélisée, pour $t\geqslant0$ ($t$ en secondes), par


        $$u(t)=12\cos\left(100\pi t+\frac{\pi}{3}\right)\qquad(u\text{ en volts}).$$


        On étudie ce signal avec les outils des chapitres 1 (primitives), 2 (cercle trigonométrique) et 3 (fonctions trigonométriques).


        {{fig:maths-sinusoide}}'
      steps:
      - kind: mcq
        prompt: '**Étape 1.** Identifier l''amplitude $A$, la pulsation $\omega$ et la phase à l''origine $\varphi$.'
        choices:
        - $A=12$ V, $\omega=100\pi$ rad$\cdot$s$^{-1}$, $\varphi=\dfrac{\pi}{3}$ rad
        - $A=12$ V, $\omega=\dfrac{\pi}{3}$ rad$\cdot$s$^{-1}$, $\varphi=100\pi$ rad
        - $A=100\pi$ V, $\omega=12$ rad$\cdot$s$^{-1}$, $\varphi=\dfrac{\pi}{3}$ rad
        - $A=12$ V, $\omega=100$ rad$\cdot$s$^{-1}$, $\varphi=\dfrac{\pi}{3}$ rad
        answer:
        - 0
        feedback:
        - null
        - 'Inversion : la pulsation est le facteur **placé devant** $t$, tandis que la phase à l''origine est le terme constant.'
        - L'amplitude est le facteur placé **devant le cosinus**.
        - La pulsation est $100\pi$ (avec le facteur $\pi$), pas $100$.
        explanation: 'Par identification avec $A\cos(\omega t+\varphi)$ : $A=12$ V, $\omega=100\pi$ rad$\cdot$s$^{-1}$, $\varphi=\dfrac{\pi}{3}$ rad. Le minimum de $u$ vaut $-12$ V et son maximum $12$ V (p. 102).'
      - kind: input
        prompt: '**Étape 2.** Calculer la période $T$ du signal, en **millisecondes**.'
        answer: '20'
        numeric: true
        tolerance: 0.5
        unit: ms
        explanation: $T=\dfrac{2\pi}{\omega}=\dfrac{2\pi}{100\pi}=0{,}02$ s, soit $20$ ms.
      - kind: input
        prompt: '**Étape 3.** En déduire la fréquence $f$ du signal.'
        answer: '50'
        numeric: true
        tolerance: 0.5
        unit: Hz
        explanation: '$f=\dfrac{1}{T}=\dfrac{1}{0{,}02}=50$ Hz : c''est bien la fréquence du réseau électrique français.'
      - kind: input
        prompt: '**Étape 4.** Calculer la tension à l''instant initial, $u(0)$.'
        answer: '6'
        numeric: true
        tolerance: 0.05
        unit: V
        explanation: $u(0)=12\cos\left(\dfrac{\pi}{3}\right)=12\times\dfrac{1}{2}=6$ V (valeurs remarquables p. 99).
      - kind: input
        prompt: '**Étape 5.** Déterminer le plus petit instant $t_1>0$ pour lequel $u(t_1)=0$. Donner le résultat en **millisecondes**, arrondi à $0{,}01$.'
        answer: '1.67'
        numeric: true
        tolerance: 0.05
        unit: ms
        explanation: '$u(t)=0$ équivaut à $\cos\left(100\pi t+\dfrac{\pi}{3}\right)=0$, c''est-à-dire $100\pi t+\dfrac{\pi}{3}=\dfrac{\pi}{2}+k\pi$ avec $k\in\mathbb{Z}$. Le plus petit $t>0$ correspond à $k=0$ : $100\pi t_1=\dfrac{\pi}{2}-\dfrac{\pi}{3}=\dfrac{\pi}{6}$, donc $t_1=\dfrac{1}{600}\approx1{,}67\times10^{-3}$ s $\approx1{,}67$ ms.'
      - kind: mcq
        prompt: '**Étape 6.** Quelle est l''expression de la fonction dérivée $u''$ ?'
        choices:
        - $u'(t)=-1200\pi\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)$
        - $u'(t)=-12\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)$
        - $u'(t)=1200\pi\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)$
        - $u'(t)=-\dfrac{12}{100\pi}\sin\left(100\pi t+\dfrac{\pi}{3}\right)$
        answer:
        - 0
        feedback:
        - null
        - On a oublié de multiplier par la dérivée intérieure $\omega=100\pi$.
        - 'Erreur de signe : la dérivée du cosinus vaut $-\sin$.'
        - On **multiplie** par $\omega$ pour dériver ; diviser par $\omega$ donnerait une primitive.
        explanation: 'p. 102 : $u''(t)=-A\,\omega\,\sin(\omega t+\varphi)=-12\times100\pi\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)=-1200\pi\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)$. En particulier $u''(0)=-1200\pi\times\dfrac{\sqrt{3}}{2}=-600\sqrt{3}\,\pi\approx-3{,}26\times10^{3}$ V$\cdot$s$^{-1}$.'
      - kind: mcq
        prompt: '**Étape 7.** Déterminer la primitive $U$ de $u$ sur $[0\,;+\infty[$ telle que $U(0)=0$.'
        choices:
        - $U(t)=\dfrac{3}{25\pi}\sin\left(100\pi t+\dfrac{\pi}{3}\right)-\dfrac{3\sqrt{3}}{50\pi}$
        - $U(t)=\dfrac{3}{25\pi}\sin\left(100\pi t+\dfrac{\pi}{3}\right)$
        - $U(t)=-\dfrac{3}{25\pi}\cos\left(100\pi t+\dfrac{\pi}{3}\right)-\dfrac{3}{50\pi}$
        - $U(t)=1200\pi\,\sin\left(100\pi t+\dfrac{\pi}{3}\right)-600\pi\sqrt{3}$
        answer:
        - 0
        feedback:
        - null
        - 'Il manque la constante : cette fonction vérifie $U(0)=\dfrac{3\sqrt{3}}{50\pi}\neq0$.'
        - 'Confusion sin/cos : une primitive de $A\cos(\omega t+\varphi)$ est $\dfrac{A}{\omega}\sin(\omega t+\varphi)$, pas un cosinus.'
        - On **divise** par $\omega$ pour primitiver, on ne multiplie pas.
        explanation: 'p. 102 : $U(t)=\dfrac{A}{\omega}\sin(\omega t+\varphi)+k=\dfrac{12}{100\pi}\sin\left(100\pi t+\dfrac{\pi}{3}\right)+k=\dfrac{3}{25\pi}\sin\left(100\pi t+\dfrac{\pi}{3}\right)+k$, avec $\dfrac{3}{25\pi}\approx0{,}0382$. La condition $U(0)=\dfrac{3}{25\pi}\times\dfrac{\sqrt{3}}{2}+k=0$ donne $k=-\dfrac{3\sqrt{3}}{50\pi}\approx-0{,}0331$.'
      - kind: mcq
        prompt: '**Étape 8.** Que vaut la valeur moyenne $\dfrac{1}{T}\big(U(T)-U(0)\big)$ de la tension sur une période ?'
        choices:
        - $0$ V, car $U(T)=U(0)$
        - $6$ V, car c'est la valeur de $u(0)$
        - $12$ V, car c'est l'amplitude
        - $-12$ V, car la tension est négative en moyenne
        answer:
        - 0
        feedback:
        - null
        - $u(0)$ est la valeur **initiale** du signal, pas sa valeur moyenne.
        - L'amplitude est le maximum atteint, pas la moyenne.
        - 'Le signal est symétrique : il passe autant de temps au-dessus qu''en dessous de $0$.'
        explanation: '$100\pi T+\dfrac{\pi}{3}=2\pi+\dfrac{\pi}{3}$ et, d''après les angles associés (p. 99), $\sin\left(2\pi+\dfrac{\pi}{3}\right)=\sin\left(\dfrac{\pi}{3}\right)$ : donc $U(T)=U(0)$ et la valeur moyenne est nulle. C''est le cas de toute tension sinusoïdale sans composante continue.'
  - id: maths-produit-scalaire
    title: Produit scalaire
    icon: 📐
    description: Définitions géométrique, algébrique et analytique ; propriétés, orthogonalité, norme et théorème d'Al-Kashi.
    prerequisites: []
    lesson: lessons/maths-produit-scalaire.md
    items:
    - type: mcq
      level: 1
      prompt: 'Soit $\vec{u}$ et $\vec{v}$ deux vecteurs non nuls du plan formant un angle de mesure $\theta$. La définition **géométrique** du produit scalaire est :


        {{fig:maths-produit-scalaire-angle}}'
      choices:
      - $\vec{u}\cdot\vec{v}=\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|\times\cos(\theta)$
      - $\vec{u}\cdot\vec{v}=\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|\times\sin(\theta)$
      - $\vec{u}\cdot\vec{v}=\left\|\vec{u}\right\|+\left\|\vec{v}\right\|$
      - $\vec{u}\cdot\vec{v}=\dfrac{\left\|\vec{u}\right\|}{\left\|\vec{v}\right\|}\cos(\theta)$
      answer: 0
      feedback:
      - null
      - 'Confusion sin/cos : le produit scalaire fait intervenir le **cosinus** de l''angle. Avec un sinus, deux vecteurs orthogonaux auraient un produit maximal, ce qui est faux.'
      - Le produit scalaire est un produit, pas une somme ; il peut d'ailleurs être négatif.
      - Les deux normes se **multiplient**, elles ne se divisent pas.
      explanation: 'p. 104 : $\vec{u}\cdot\vec{v}=\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|\times\cos(\theta)$. Si $\vec{u}$ ou $\vec{v}$ est nul, $\vec{u}\cdot\vec{v}=0$. Le résultat est un **nombre**, pas un vecteur.'
    - type: mcq
      level: 1
      prompt: 'Dans un repère orthonormé, $\vec{u}$ a pour coordonnées $\begin{pmatrix}x\\y\end{pmatrix}$ et $\vec{v}$ pour coordonnées $\begin{pmatrix}x''\\y''\end{pmatrix}$. Alors $\vec{u}\cdot\vec{v}$ vaut :'
      choices:
      - $xx'+yy'$
      - $xx'-yy'$
      - $xy'+x'y$
      - $\sqrt{xx'+yy'}$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : les deux produits s''**ajoutent**.'
      - On multiplie les abscisses entre elles et les ordonnées entre elles, pas en croix.
      - 'Il n''y a pas de racine carrée : la racine apparaît dans la **norme** $\left\|\vec{u}\right\|=\sqrt{x^{2}+y^{2}}$.'
      explanation: 'Définition analytique p. 105 : $\vec{u}\cdot\vec{v}=xx''+yy''$, valable uniquement dans un repère **orthonormé**.'
    - type: input
      level: 1
      prompt: Dans un repère orthonormé, $\vec{u}$ a pour coordonnées $(3\,;-2)$ et $\vec{v}$ pour coordonnées $(4\,;5)$. Calculer $\vec{u}\cdot\vec{v}$.
      answer: '2'
      numeric: true
      tolerance: 0.01
      explanation: 'Définition analytique p. 105 : $\vec{u}\cdot\vec{v}=xx''+yy''=3\times4+(-2)\times5=12-10=2$.'
    - type: input
      level: 1
      prompt: Dans un repère orthonormé, calculer la norme du vecteur $\vec{u}(3\,;-4)$.
      answer: '5'
      numeric: true
      tolerance: 0.01
      explanation: 'p. 105 : $\left\|\vec{u}\right\|=\sqrt{\vec{u}\cdot\vec{u}}=\sqrt{x^{2}+y^{2}}=\sqrt{9+16}=\sqrt{25}=5$.'
    - type: mcq
      level: 1
      prompt: 'Deux vecteurs non nuls $\vec{u}$ et $\vec{v}$ sont orthogonaux si et seulement si :'
      choices:
      - $\vec{u}\cdot\vec{v}=0$
      - $\vec{u}\cdot\vec{v}=1$
      - $\left\|\vec{u}\right\|=\left\|\vec{v}\right\|$
      - $\vec{u}\cdot\vec{v}=\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|$
      answer: 0
      feedback:
      - null
      - 'Le produit scalaire doit être **nul** : $\cos\left(\dfrac{\pi}{2}\right)=0$.'
      - 'Deux vecteurs de même norme ne sont pas forcément orthogonaux : ils peuvent même être égaux.'
      - 'C''est le cas $\cos(\theta)=1$, donc $\theta=0$ : les vecteurs sont alors colinéaires de même sens.'
      explanation: 'p. 105 : $\vec{u}$ et $\vec{v}$ sont orthogonaux $\iff\vec{u}\cdot\vec{v}=0$.'
    - type: input
      level: 2
      prompt: Deux vecteurs $\vec{u}$ et $\vec{v}$ ont pour normes $\left\|\vec{u}\right\|=4$ et $\left\|\vec{v}\right\|=3$, et forment un angle de $60^{\circ}$. Calculer $\vec{u}\cdot\vec{v}$.
      answer: '6'
      numeric: true
      tolerance: 0.05
      explanation: 'Définition géométrique p. 104 : $\vec{u}\cdot\vec{v}=4\times3\times\cos\left(\dfrac{\pi}{3}\right)=12\times0{,}5=6$.'
    - type: mcq
      level: 2
      prompt: Deux vecteurs $\vec{u}$ et $\vec{v}$ ont pour normes $2$ et $5$ et forment un angle de $120^{\circ}$. Que vaut $\vec{u}\cdot\vec{v}$ ?
      choices:
      - $-5$
      - $5$
      - $10$
      - $-10$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $\cos(120^{\circ})=\cos\left(\dfrac{2\pi}{3}\right)=-\dfrac{1}{2}$, le produit scalaire est **négatif** pour un angle obtus.'
      - 'C''est le produit des normes : on a oublié de multiplier par $\cos(120^{\circ})$.'
      - On a bien le signe, mais pas le facteur $\cos(120^{\circ})=-\dfrac{1}{2}$.
      explanation: $\vec{u}\cdot\vec{v}=2\times5\times\cos\left(\dfrac{2\pi}{3}\right)=10\times\left(-\dfrac{1}{2}\right)=-5$. Un angle obtus donne toujours un produit scalaire négatif.
    - type: mcq
      level: 2
      prompt: Quelle égalité est correcte ?
      choices:
      - $\left\|\vec{u}+\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}+2\,\vec{u}\cdot\vec{v}+\left\|\vec{v}\right\|^{2}$
      - $\left\|\vec{u}+\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}+\left\|\vec{v}\right\|^{2}$
      - $\left\|\vec{u}+\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}-2\,\vec{u}\cdot\vec{v}+\left\|\vec{v}\right\|^{2}$
      - $\left\|\vec{u}+\vec{v}\right\|^{2}=\left(\left\|\vec{u}\right\|+\left\|\vec{v}\right\|\right)^{2}$
      answer: 0
      feedback:
      - null
      - 'Ce n''est vrai que si $\vec{u}\cdot\vec{v}=0$, c''est-à-dire si les vecteurs sont orthogonaux : c''est le théorème de Pythagore.'
      - 'Erreur de signe : le double produit est $+2\,\vec{u}\cdot\vec{v}$ pour $\vec{u}+\vec{v}$ et $-2\,\vec{u}\cdot\vec{v}$ pour $\vec{u}-\vec{v}$.'
      - La norme d'une somme n'est pas la somme des normes (inégalité triangulaire).
      explanation: 'Relations entre produit scalaire et norme, p. 105 : $\left\|\vec{u}\pm\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}\pm2\,\vec{u}\cdot\vec{v}+\left\|\vec{v}\right\|^{2}$.'
    - type: mcq
      level: 2
      prompt: 'Pour tous vecteurs $\vec{u}$ et $\vec{v}$, le produit $(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})$ est égal à :'
      choices:
      - $\left\|\vec{u}\right\|^{2}-\left\|\vec{v}\right\|^{2}$
      - $\left\|\vec{u}+\vec{v}\right\|^{2}$
      - $\left\|\vec{u}\right\|^{2}+\left\|\vec{v}\right\|^{2}$
      - $\left\|\vec{u}-\vec{v}\right\|^{2}$
      answer: 0
      feedback:
      - null
      - 'Non : $\left\|\vec{u}+\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}+2\,\vec{u}\cdot\vec{v}+\left\|\vec{v}\right\|^{2}$, ce qui est différent en général. (Le manuel p. 105 insère par erreur ce membre au milieu de l''égalité : c''est une coquille.)'
      - 'Erreur de signe : on obtient une **différence** de carrés, comme dans l''identité $(a+b)(a-b)=a^{2}-b^{2}$.'
      - '$\left\|\vec{u}-\vec{v}\right\|^{2}=\left\|\vec{u}\right\|^{2}-2\,\vec{u}\cdot\vec{v}+\left\|\vec{v}\right\|^{2}$ : encore autre chose.'
      explanation: 'En développant par bilinéarité : $(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})=\vec{u}\cdot\vec{u}-\vec{u}\cdot\vec{v}+\vec{v}\cdot\vec{u}-\vec{v}\cdot\vec{v}=\left\|\vec{u}\right\|^{2}-\left\|\vec{v}\right\|^{2}$, les deux termes du milieu se compensant par symétrie.'
    - type: mcq
      level: 2
      prompt: Soit $\vec{u}$, $\vec{v}$, $\vec{w}$ trois vecteurs et $k$ un réel. Laquelle de ces propriétés est **fausse** ?
      choices:
      - $\vec{u}\cdot\vec{v}=-\,\vec{v}\cdot\vec{u}$
      - $(\vec{u}+k\vec{v})\cdot\vec{w}=\vec{u}\cdot\vec{w}+k(\vec{v}\cdot\vec{w})$
      - $\vec{u}\cdot(\vec{v}+k\vec{w})=\vec{u}\cdot\vec{v}+k(\vec{u}\cdot\vec{w})$
      - $\vec{u}\cdot\vec{u}=\left\|\vec{u}\right\|^{2}$
      answer: 0
      feedback:
      - null
      - 'Cette propriété est vraie : c''est la linéarité à gauche (p. 105).'
      - 'Cette propriété est vraie : c''est la linéarité à droite (p. 105).'
      - 'Cette propriété est vraie : elle découle de $\left\|\vec{u}\right\|=\sqrt{\vec{u}\cdot\vec{u}}$ (p. 105).'
      explanation: 'Le produit scalaire est **symétrique** : $\vec{u}\cdot\vec{v}=\vec{v}\cdot\vec{u}$ (p. 105), et non antisymétrique. Les trois autres propriétés (bilinéarité et carré scalaire) sont exactes.'
    - type: mcq
      level: 2
      prompt: Dans un repère orthonormé, $\vec{u}$ a pour coordonnées $(2\,;3)$ et $\vec{v}$ pour coordonnées $(-3\,;2)$. Que peut-on en conclure ?
      choices:
      - $\vec{u}$ et $\vec{v}$ sont orthogonaux
      - $\vec{u}$ et $\vec{v}$ sont colinéaires
      - $\vec{u}$ et $\vec{v}$ forment un angle aigu
      - $\vec{u}$ et $\vec{v}$ forment un angle obtus
      answer: 0
      feedback:
      - null
      - Deux vecteurs colinéaires auraient un produit scalaire égal à $\pm\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|$, donc non nul ici.
      - Un angle aigu donnerait un produit scalaire strictement **positif**.
      - Un angle obtus donnerait un produit scalaire strictement **négatif**.
      explanation: '$\vec{u}\cdot\vec{v}=2\times(-3)+3\times2=-6+6=0$ : le produit scalaire est nul, donc $\vec{u}\perp\vec{v}$ (p. 105).'
    - type: input
      level: 2
      prompt: On donne $\left\|\vec{u}\right\|=3$, $\left\|\vec{v}\right\|=4$ et $\left\|\vec{u}+\vec{v}\right\|=6$. Calculer $\vec{u}\cdot\vec{v}$.
      answer: '5.5'
      numeric: true
      tolerance: 0.05
      explanation: 'p. 105 : $\vec{u}\cdot\vec{v}=\dfrac{1}{2}\left(\left\|\vec{u}+\vec{v}\right\|^{2}-\left\|\vec{u}\right\|^{2}-\left\|\vec{v}\right\|^{2}\right)=\dfrac{36-9-16}{2}=\dfrac{11}{2}=5{,}5$.'
    - type: mcq
      level: 2
      prompt: 'Théorème d''Al-Kashi dans le triangle $ABC$, avec $a=BC$, $b=AC$ et $c=AB$ :


        {{fig:maths-al-kashi}}'
      choices:
      - $a^{2}=b^{2}+c^{2}-2bc\cos(\hat{A})$
      - $a^{2}=b^{2}+c^{2}+2bc\cos(\hat{A})$
      - $a^{2}=b^{2}+c^{2}-2bc\sin(\hat{A})$
      - $a^{2}=b^{2}+c^{2}-2bc\cos(\hat{B})$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : avec un $+$, le cas $\hat{A}=\dfrac{\pi}{2}$ ne redonnerait pas le théorème de Pythagore.'
      - 'Confusion sin/cos : la formule fait intervenir le cosinus.'
      - L'angle utilisé est celui **opposé** au côté $a$, c'est-à-dire $\hat{A}$.
      explanation: 'p. 105 : $a^{2}=b^{2}+c^{2}-2bc\cos(\hat{A})$. C''est le théorème de Pythagore généralisé : si $\hat{A}=\dfrac{\pi}{2}$, alors $\cos(\hat{A})=0$ et l''on retrouve $a^{2}=b^{2}+c^{2}$.'
    - type: input
      level: 3
      prompt: Dans le triangle $ABC$, $AC=5$, $AB=7$ et $\hat{A}=60^{\circ}$. Calculer $BC$ (arrondir à $0{,}01$).
      answer: '6.24'
      numeric: true
      tolerance: 0.05
      explanation: 'Al-Kashi p. 105 : $BC^{2}=b^{2}+c^{2}-2bc\cos(\hat{A})=25+49-2\times5\times7\times0{,}5=74-35=39$, donc $BC=\sqrt{39}\approx6{,}24$.'
    - type: mcq
      level: 3
      prompt: 'Sur la figure, $\overrightarrow{CD}$ est la projection orthogonale de $\vec{u}=\overrightarrow{AB}$ sur la droite $\mathcal{D}$ dirigée par $\vec{v}$. Que vaut $\vec{u}\cdot\vec{v}$ lorsque $\overrightarrow{CD}$ et $\vec{v}$ sont de **sens contraire** ?


        {{fig:maths-projection-orthogonale}}'
      choices:
      - $-CD\times\left\|\vec{v}\right\|$
      - $CD\times\left\|\vec{v}\right\|$
      - $0$
      - $CD\times AB$
      answer: 0
      feedback:
      - null
      - Le produit est positif seulement lorsque $\overrightarrow{CD}$ et $\vec{v}$ sont de **même** sens.
      - Le produit scalaire n'est nul que si la projection est réduite à un point, c'est-à-dire si $\vec{u}\perp\vec{v}$.
      - C'est la norme $\left\|\vec{v}\right\|$ qui intervient, pas la longueur $AB$.
      explanation: 'Définition algébrique p. 104-105 : $\vec{u}\cdot\vec{v}=CD\times\left\|\vec{v}\right\|$ si $\overrightarrow{CD}$ et $\vec{v}$ sont de même sens, et $-CD\times\left\|\vec{v}\right\|$ s''ils sont de sens contraire. On retrouve ainsi le signe de $\cos(\theta)$ de la définition géométrique, puisque $CD=\left\|\vec{u}\right\|\times\left|\cos(\theta)\right|$.'
    - type: match
      level: 2
      prompt: Associer chaque situation à la valeur du produit scalaire $\vec{u}\cdot\vec{v}$ ($\vec{u}$ et $\vec{v}$ non nuls).
      pairs:
      - left: $\vec{u}$ et $\vec{v}$ orthogonaux
        right: $0$
      - left: $\vec{u}$ et $\vec{v}$ colinéaires de même sens
        right: $\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|$
      - left: $\vec{u}$ et $\vec{v}$ colinéaires de sens contraire
        right: $-\left\|\vec{u}\right\|\times\left\|\vec{v}\right\|$
      - left: $\vec{v}=\vec{u}$
        right: $\left\|\vec{u}\right\|^{2}$
  - id: maths-complexes
    title: Nombres complexes
    icon: 🌀
    description: Forme algébrique, conjugué, module, argument, formes trigonométrique et exponentielle, opérations.
    prerequisites:
    - maths-cercle-trigo
    lesson: lessons/maths-complexes.md
    items:
    - type: mcq
      level: 1
      prompt: Que vaut $i^{2}$ ?
      choices:
      - $-1$
      - $1$
      - $i$
      - $0$
      answer: 0
      feedback:
      - null
      - $i^{2}=-1$ ; c'est $i^{4}=(i^{2})^{2}=(-1)^{2}$ qui vaut $1$.
      - '$i^{2}$ n''est pas $i$ : c''est le réel $-1$.'
      - $i$ n'est pas nul, donc son carré non plus.
      explanation: 'p. 107 : on introduit le nombre imaginaire $i$ dont le carré vaut $-1$. C''est cette règle qui, avec les règles de calcul habituelles, permet de multiplier les nombres complexes.'
    - type: mcq
      level: 1
      prompt: Soit $z=-2+5i$. Quelles sont sa partie réelle et sa partie imaginaire ?
      choices:
      - $\mathrm{Re}(z)=-2$ et $\mathrm{Im}(z)=5$
      - $\mathrm{Re}(z)=-2$ et $\mathrm{Im}(z)=5i$
      - $\mathrm{Re}(z)=5$ et $\mathrm{Im}(z)=-2$
      - $\mathrm{Re}(z)=2$ et $\mathrm{Im}(z)=5$
      answer: 0
      feedback:
      - null
      - 'La partie imaginaire est un **réel** : c''est le nombre $b$ dans $z=a+bi$, sans le $i$.'
      - 'On ne permute pas : $\mathrm{Re}(z)$ est le terme sans $i$.'
      - 'Le signe compte : ici $a=-2$.'
      explanation: 'p. 107 : si $z=a+bi$ avec $a$ et $b$ réels, alors $\mathrm{Re}(z)=a$ et $\mathrm{Im}(z)=b$. Les deux sont des nombres **réels**.'
    - type: mcq
      level: 1
      prompt: Quel est le conjugué de $z=3+4i$ ?
      choices:
      - $3-4i$
      - $-3+4i$
      - $-3-4i$
      - $4+3i$
      answer: 0
      feedback:
      - null
      - On change le signe de la partie **imaginaire**, pas celui de la partie réelle.
      - C'est l'opposé $-z$, pas le conjugué $\overline{z}$.
      - On n'échange pas partie réelle et partie imaginaire.
      explanation: 'p. 107 : si $z=a+bi$, alors $\overline{z}=a-bi$. Dans le plan complexe, le point d''affixe $\overline{z}$ est le symétrique de celui d''affixe $z$ par rapport à l''axe réel.'
    - type: input
      level: 1
      prompt: Calculer le module de $z=3+4i$.
      answer: '5'
      numeric: true
      tolerance: 0.01
      explanation: 'p. 107 : $|z|=\sqrt{a^{2}+b^{2}}=\sqrt{9+16}=\sqrt{25}=5$. C''est la distance $OM$ entre l''origine et le point d''affixe $z$.'
    - type: mcq
      level: 1
      prompt: Calculer $(2+i)+(3-4i)$.
      choices:
      - $5-3i$
      - $5+3i$
      - $5-4i$
      - $6-3i$
      answer: 0
      feedback:
      - null
      - 'Erreur de signe : $1+(-4)=-3$, la partie imaginaire est négative.'
      - 'On a oublié la partie imaginaire de $2+i$, qui vaut $1$ : $1+(-4)=-3$.'
      - 'Les parties réelles s''additionnent : $2+3=5$, pas $6$.'
      explanation: 'p. 107 : $(a+bi)+(a''+b''i)=(a+a'')+(b+b'')i$. Ici $(2+3)+(1-4)i=5-3i$.'
    - type: mcq
      level: 2
      prompt: Calculer $(2+3i)(1-i)$ et donner le résultat sous forme algébrique.
      choices:
      - $5+i$
      - $2-3i$
      - $-1+i$
      - $5-i$
      answer: 0
      feedback:
      - null
      - On ne multiplie pas les parties réelles entre elles et les parties imaginaires entre elles.
      - 'On a oublié que $i^{2}=-1$ : le terme $-3i^{2}$ vaut $+3$, et non $-3$.'
      - 'Erreur de signe sur la partie imaginaire : $-2i+3i=+i$.'
      explanation: 'p. 107 : $(a+bi)(a''+b''i)=(aa''-bb'')+(a''b+ab'')i$. Avec $a=2$, $b=3$, $a''=1$, $b''=-1$ : partie réelle $2\times1-3\times(-1)=5$, partie imaginaire $1\times3+2\times(-1)=1$. Donc $(2+3i)(1-i)=5+i$.'
    - type: input
      level: 2
      prompt: Calculer $(3+2i)(3-2i)$.
      answer: '13'
      numeric: true
      tolerance: 0.01
      explanation: 'Identité remarquable p. 107 : $(a+bi)(a-bi)=a^{2}+b^{2}=9+4=13$. Le produit d''un complexe par son conjugué est toujours un **réel positif**, égal à $|z|^{2}$.'
    - type: mcq
      level: 2
      prompt: Écrire $\dfrac{1}{1+i}$ sous forme algébrique.
      choices:
      - $\dfrac{1}{2}-\dfrac{1}{2}i$
      - $\dfrac{1}{2}+\dfrac{1}{2}i$
      - $1-i$
      - $\dfrac{1-i}{1+i}$
      answer: 0
      feedback:
      - null
      - 'En multipliant par le conjugué $1-i$, le numérateur devient $1-i$ : la partie imaginaire est **négative**.'
      - On a oublié de diviser par $(1+i)(1-i)=1^{2}+1^{2}=2$.
      - 'Ce n''est pas une forme algébrique $a+bi$ : il reste un dénominateur complexe.'
      explanation: 'p. 108 : $\dfrac{1}{z''}=\dfrac{\overline{z''}}{z''\overline{z''}}$. Ici $\dfrac{1}{1+i}=\dfrac{1-i}{(1+i)(1-i)}=\dfrac{1-i}{2}=\dfrac{1}{2}-\dfrac{1}{2}i$.'
    - type: mcq
      level: 2
      prompt: Quelles sont les solutions de l'équation $z^{2}=-9$ dans $\mathbb{C}$ ?
      choices:
      - $3i$ et $-3i$
      - $3$ et $-3$
      - $9i$ et $-9i$
      - aucune solution
      answer: 0
      feedback:
      - null
      - 'Ce sont les solutions de $z^{2}=9$ : ici $a=-9<0$, les solutions sont des imaginaires purs.'
      - On prend la racine carrée de $9$, qui vaut $3$ et non $9$.
      - Dans $\mathbb{C}$, l'équation $z^{2}=a$ a toujours des solutions.
      explanation: 'p. 108 : si $a<0$, les solutions de $z^{2}=a$ sont $i\sqrt{-a}$ et $-i\sqrt{-a}$. Ici $i\sqrt{9}=3i$ et $-3i$. Vérification : $(3i)^{2}=9i^{2}=-9$.'
    - type: input
      level: 2
      prompt: Calculer le module de $z=1-i$ (arrondir à $0{,}01$).
      answer: '1.41'
      numeric: true
      tolerance: 0.02
      explanation: 'p. 107 : $|z|=\sqrt{1^{2}+(-1)^{2}}=\sqrt{2}\approx1{,}41$.'
    - type: mcq
      level: 2
      prompt: L'écriture $z=r\big(\cos(\theta)+i\sin(\theta)\big)$ d'un complexe non nul est sa forme trigonométrique. Que représentent $r$ et $\theta$ ?
      choices:
      - $r=|z|$ et $\theta=\arg(z)$ à $2\pi$ près
      - $r=\mathrm{Re}(z)$ et $\theta=\mathrm{Im}(z)$
      - $r=|z|^{2}$ et $\theta=\arg(z)$
      - $r$ et $\theta$ sont les coordonnées du point d'affixe $z$
      answer: 0
      feedback:
      - null
      - 'Les parties réelle et imaginaire sont $a=r\cos(\theta)$ et $b=r\sin(\theta)$ : ce ne sont pas $r$ et $\theta$.'
      - $r$ est le module lui-même, pas son carré ; on a $r=\sqrt{a^{2}+b^{2}}$.
      - Les coordonnées du point sont $(a\,;b)$ ; $r$ et $\theta$ en sont la distance à l'origine et l'angle.
      explanation: 'p. 108 : tout complexe non nul s''écrit $z=r\big(\cos(\theta)+i\sin(\theta)\big)$ avec $r=|z|$ et $\theta=\arg(z)\ [2\pi]$, l''argument étant une mesure de l''angle orienté $\left(\overrightarrow{OI},\overrightarrow{OM}\right)$.'
    - type: mcq
      level: 2
      prompt: 'Quel est un argument du nombre complexe $z=-2$ ?


        {{fig:maths-plan-complexe}}'
      choices:
      - $\pi$
      - $0$
      - $-\dfrac{\pi}{2}$
      - $\dfrac{\pi}{2}$
      answer: 0
